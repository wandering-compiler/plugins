name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every directory with a plugin.yaml is a plugin; nothing to keep in sync.
  plugins:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          list="$(ls -d */plugin.yaml | cut -d/ -f1 | jq -R . | jq -cs .)"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "plugins: $list"

  plugin:
    needs: plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: ${{ matrix.plugin }}/src/go.sum
      - name: gofmt
        run: make fmt PLUGIN=${{ matrix.plugin }}
      - name: vet
        run: make vet PLUGIN=${{ matrix.plugin }}
      - name: test
        working-directory: ${{ matrix.plugin }}/src
        run: |
          go test -count=1 -coverprofile=cover.out ./... | tee test.out
          {
            echo "### ${{ matrix.plugin }} — coverage"
            echo
            echo '| package | coverage |'
            echo '|---|---|'
            grep -E '^ok .*coverage:' test.out | grep -v '/gen/' \
              | awk '{for(i=1;i<=NF;i++) if($i=="coverage:") c=$(i+1); print "| `" $2 "` | " c " |"}'
            echo
            echo "**total:** $(go tool cover -func=cover.out | grep -v '/gen/' | tail -1 | awk '{print $NF}')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: committed pb matches its proto
        run: make check-gen-pb PLUGIN=${{ matrix.plugin }}
      - name: the release form renders
        run: make check-render PLUGIN=${{ matrix.plugin }}

  # Names this public repository must not carry. The list is a secret: a fork's
  # pull request does not receive it, so there the check reports itself skipped.
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: check names
        env:
          W17_DENIED_NAMES: ${{ secrets.W17_DENIED_NAMES }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
        run: |
          flags=-require
          [ "$FROM_FORK" = "true" ] && flags=
          make check-names CHECKNAMES_FLAGS="$flags"

  # The one check branch protection requires: it is green only when every job
  # above is, whatever the plugin list grows to.
  ci-ok:
    if: always()
    needs: [plugin, names]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.plugin.result }}" = success ] && [ "${{ needs.names.result }}" = success ] \
            || { echo "plugin=${{ needs.plugin.result }} names=${{ needs.names.result }}"; exit 1; }
