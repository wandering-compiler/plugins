name: Release

# A plugin is released when a release pull request (make release-pr) merges:
# after CI passes on that commit of main, every plugin whose manifest version
# the commit changed is signed and tagged by tools/release.sh, exactly as a
# maintainer would run it by hand. The tag sits on the commit itself; the
# signature travels in the tag's message.
#
# Secrets live in the `release` environment, which only main may use, so a
# workflow edited on any other branch never sees them:
#   W17_SIGN_TOKEN     a console token whose account may sign plugin releases
#   RELEASE_TAG_TOKEN  a token allowed to create */v* tags (the ruleset lets
#                      only repository admins create them)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases one plugin at its manifest's version from main as it is: a retry
  # after a failed run, or a release whose CI run was not a push.
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin to release, at the version its plugin.yaml names
        required: true

permissions:
  contents: read
  checks: read

# One release at a time, never cancelled: a cancelled run could leave a tag
# pushed and the next one refusing it.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # Pushes the tag; the default token cannot create */v* tags.
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Which plugins
        id: which
        env:
          INPUT_PLUGIN: ${{ inputs.plugin }}
        run: |
          if [ -n "$INPUT_PLUGIN" ]; then
            list="$INPUT_PLUGIN"
          else
            # The plugins whose version line this commit changed. A merge
            # commit is compared with the main it merged into (its first
            # parent), so the whole pull request counts.
            list=""
            for m in */plugin.yaml; do
              if git diff HEAD^1 HEAD -- "$m" | grep -Eq '^[-+]version:'; then
                list="$list ${m%/plugin.yaml}"
              fi
            done
          fi
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "to release: ${list:-none}"

      - uses: actions/setup-go@v5
        if: steps.which.outputs.list != ''
        with:
          go-version: '1.26.x'

      - name: Sign and tag
        if: steps.which.outputs.list != ''
        env:
          LIST: ${{ steps.which.outputs.list }}
          W17_TOKEN: ${{ secrets.W17_SIGN_TOKEN }}
          W17_CONSOLE_ADDR: grpcs://api.w17.app:50051
          GH_TOKEN: ${{ github.token }}
          # CI passed on this commit (that is what started this run, and the
          # script checks ci-ok again through the API); it is not re-run.
          SKIP_CHECK: "1"
        run: |
          # The pinned w17ctl signs too: one binary for every release.
          W17CTL="$(tools/w17ctl.sh)"
          export W17CTL
          for p in $LIST; do
            v="$(sed -n 's/^version:[[:space:]]*//p' "$p/plugin.yaml" | head -1 | tr -d "\"' ")"
            tools/release.sh "$p@v$v"
          done
