name: marketing
version: 0.1.0-rc.4
# 1.13: request_consumers and subscriptions; 1.17: a sandbox's build:.
requires_w17: ">=1.17"

# Explicit Go module anchor — staging text-rewrites this prefix in
# src/handlers/ + src/lib/ + plugin.go to the per-activation paths.
go_module: github.com/wandering-compiler/plugins/marketing

description: "The request stream into a marketing tool: every signed-in request of a marketing surface becomes an event on the user's contact, contacts follow the auth plugin's accounts, consent and erasure. Brevo first."
license: "Apache-2.0"

# The accounts, consent and erasure come from auth's events; the publisher
# has to be activated beside this plugin, in the same domain.
requires_plugins:
  - name: auth

env:
  - name: brevo_api_key
    type: string
    secret: true
    description: "Brevo API key (the `api-key` header). Required with the brevo feature."
  - name: brevo_webhook_token
    type: string
    secret: true
    description: "The token Brevo's marketing webhook is created with, in its X-Brevo-Webhook-Token header (the webhook's `headers`). The webhook (feature brevo_webhook) refuses every call without it, and every call while it is unset. A long random string."
  - name: brevo_base_url
    type: string
    default: "https://api.brevo.com/v3"
    description: "Root of the Brevo API — a stub's address in a test suite. Never set in production."
  - name: brevo_rps
    type: int
    default: "8"
    description: "Requests per second this activation sends to Brevo. Brevo allows 10 per second per account (20 on Professional), shared with every other use of the same account."
  - name: brevo_consent_attribute
    type: string
    default: "W17_MARKETING_CONSENT"
    description: "The contact attribute the user's marketing consent is written to (true / false; absent when unknown). Brevo's automations filter on it; this plugin sends events whatever it says."
  - name: send
    type: string
    default: "mutations"
    description: "Which recorded requests become events: mutations (default), queries, all, or off. A method reads when it is served as GET or belongs to a Query service; everything else is a mutation."
  - name: include
    type: string
    description: "Comma-separated methods sent whatever `send` says (`/<package>.<Service>/<Method>`, as a record names them). A name the stream does not record is refused at boot."
  - name: exclude
    type: string
    description: "Comma-separated methods never sent; wins over send and include. A name the stream does not record is refused at boot."

features:
  - name: brevo
    default: false
    description: "The Brevo integration: the gateway's marketing records become Brevo events on the user's contact (POST /v3/events/batch), contacts are created and updated from auth's UserCreated / UserUpdated (POST /v3/contacts) with the consent attribute from MarketingConsentChanged, and deleted on UserDeleted (DELETE /v3/contacts/{id}?identifierType=ext_id). Campaigns reach a contact (emailBlacklisted false) only once the user's newest consent is a yes, and never again after the person unsubscribed in Brevo (read from Brevo before subscribing) until a later consent; every other write blacklists or leaves the field alone. Adds the SentEvent table, which keeps a redelivered record from becoming a second event, the Contact table, which keeps each user's last known consent, address and what the plugin last wrote, and the Reconciliation table, which runs the one-time pass that blacklists the contacts created before the plugin wrote emailBlacklisted."
    go_files:
      - handlers/brevo.go
      - handlers/brevo_events.go
      - handlers/brevo_contacts.go
      - handlers/brevo_reconcile.go
  - name: brevo_webhook
    default: false
    requires: [brevo]
    description: "Brevo's marketing webhook back into the project: an unsubscribe in Brevo (the `unsubscribed` event) is recorded on the plugin's Contact and handed to the project's consent_withdrawn hook, whose method records it as the user's withdrawal in auth (AuthService.WithdrawMarketingConsent). Adds MarketingService.IngestBrevo, served on the REST surface at POST /marketing/webhooks/brevo without a bearer and refused without brevo_webhook_token."
    go_files:
      - handlers/brevo_webhook.go

# The gateway's marketing records, in Brevo as events.
request_consumers:
  - name: brevo
    purpose: marketing
    feature: brevo
    description: "Every marketing record of a signed-in user (per send / include / exclude) to Brevo, as an event on the contact keyed by the user's id (ext_id): the method as the event name, its status, duration, surface, route, UTM tags and referrer as properties. The request's own fields are not sent."

# auth's events, for the contacts. UserUpdated and UserDeleted are auth's
# user_admin events, MarketingConsentChanged its marketing_consent one: an
# auth activation without them simply sends none.
subscriptions:
  - plugin: auth
    event: UserCreated
    as: AuthUserCreated
    feature: brevo
  - plugin: auth
    event: UserUpdated
    as: AuthUserUpdated
    feature: brevo
    optional: true
  - plugin: auth
    event: UserDeleted
    as: AuthUserDeleted
    feature: brevo
    optional: true
  - plugin: auth
    event: MarketingConsentChanged
    as: AuthMarketingConsentChanged
    feature: brevo
    optional: true

# The project's side of an unsubscribe in Brevo (feature brevo_webhook).
hooks:
  - name: consent_withdrawn
    request: ConsentWithdrawnReq
    response: ConsentWithdrawnResp
    required: true
    feature: brevo_webhook
    description: "Records that the user withdrew their marketing consent in Brevo (they unsubscribed there): a business method of the domain taking ConsentWithdrawnReq that calls auth's AuthService.WithdrawMarketingConsent for user_id. Plugins do not call each other, so the project binds the two. Its error fails the webhook delivery, which Brevo sends again."

presets:
  rest:
    # The webhook's token rides this header into gRPC metadata.
    forward_headers:
      - { name: X-Brevo-Webhook-Token, feature: brevo_webhook }
    groups:
      # Brevo's webhook has no bearer: its authenticity is the token it was
      # created with. failed_only: a delivery answered 2xx spends no
      # per-address budget, so a burst from Brevo is not answered 429.
      - prefix: /marketing/webhooks
        description: "Inbound marketing-tool webhooks (token-verified, unauthenticated)."
        endpoints:
          - { ref: MarketingService.IngestBrevo, method: POST, path: /brevo, exclude_auth: true, public_limit: failed_only, raw_body_field: raw_payload, feature: brevo_webhook }

sandboxes:
  # A dev-only stand-in for the Brevo API: it answers the plugin's calls
  # and keeps what they said (emailBlacklisted included) (GET /_stub/contacts/{ext_id}, /_stub/events), so
  # a project's suite reads back what would have reached Brevo. Point the
  # activation at it: <DOMAIN>_MARKETING_BREVO_BASE_URL=http://brevostub:8080/v3
  # and _BREVO_API_KEY=stub-key. No registry publishes the image: the release
  # ships its source, and `build:` makes the project's compose.w17.yaml build
  # it from the vendored plugin (`w17ctl stack build`, `stack up --build`, or
  # the first `stack up` that finds no image). From a clone of this repository:
  #   docker build -t ${W17_WORKSPACE:-w17}-w17-brevostub:dev marketing/sandboxes/brevostub
  - name: brevostub
    description: "Fake Brevo API (dev-only) for the brevo feature"
    feature: brevo
    image: ${W17_WORKSPACE:-w17}-w17-brevostub:dev
    # Plugin-relative; the Dockerfile is the context's own.
    build:
      context: sandboxes/brevostub
    env:
      - name: PORT
        value: "8080"
        description: "Container listen port; siblings dial http://brevostub:8080."
      - name: API_KEY
        value: "stub-key"
        description: "The api-key every /v3 call must carry."
