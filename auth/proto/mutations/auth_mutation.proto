          "UPDATE @module.OAuthClient SET client_name = :client_name, client_uri = :client_uri, "
          "logo_uri = :logo_uri, redirect_uris = :redirect_uris, metadata_fetched_at = NOW() "
          "WHERE id = :id RETURNING id"
