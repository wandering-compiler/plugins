  rpc RevokeOAuthCodeSession(RevokeOAuthCodeSessionReq) returns (RevokeOAuthCodeSessionResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoke_reason = 14 "
