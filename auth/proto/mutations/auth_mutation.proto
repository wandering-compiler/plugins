      }
    };
  }

  // GrantTeamRole — see its request message. Locks the role (as
  // AssignRoleToUser does, so a DeleteRole runs before or after it) and the
  // live team of the organization.
  rpc GrantTeamRole(GrantTeamRoleReq) returns (GrantTeamRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "role"
        dql:  "UPDATE @module.Role SET id = id WHERE id = :role_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "ROLE_NOT_FOUND"
          message:    "That role does not exist, or it was deleted."
        }
      }
      ops: {
        name: "team"
        dql:  "UPDATE @module.Team SET id = id WHERE id = :team_id AND org_id = :org_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "TEAM_NOT_FOUND"
          message:    "That team does not exist, or it was deleted."
        }
      }
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.TeamRole SET "
          "team_id = :team.id, "
          "role_id = :role.id, "
          "org_id = :org_id, "
          "granted_by = :granted_by "
          "RETURNING id AS team_role_id"
      }
    };
  }

