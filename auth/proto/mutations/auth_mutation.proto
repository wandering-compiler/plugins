        dql:
          "UPDATE @module.OAuthAuthorization SET code_consumed_at = NOW() "
          "WHERE code_hash = :code_hash AND code_consumed_at IS NULL AND code_expires_at > NOW() AND decision = 1 "
          "RETURNING id, client_row_id, kind, redirect_uri, code_challenge, scope, resource, user_id, org_id, "
