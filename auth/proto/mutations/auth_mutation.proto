syntax = "proto3";

// Auth plugin — AuthMutation write primitives.
//
// Each method is one atomic DB write. AuthService (plugin
// handler, see business/auth_service.proto) composes them
// into SignUp / SignIn flows, owning the password-hashing
// step before persistence. Multi-op turnkey SignUp DQL was
// removed when password hashing moved into the plugin —
// hand-written handler orchestration is the contract now.

package w17.contrib.auth;

import "google/protobuf/timestamp.proto";
import "@self/types/models.proto";
import "@self/events/auth_events.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/event.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

// CreateBotUserReq — provision a MACHINE account.
//
// Its own mutation rather than a flag on CreateUser, because the two have
// different required inputs and different safety properties.
//
// A bot has no password, and the column stores the UNUSABLE sentinel `!`
// rather than an empty string. Empty is not available: `password_hash` carries
// a blank CHECK, so an empty write is refused outright (CreateBot would
// return "password_hash value violates constraint").
//
// `!` is the Django convention and it is unusable by CONSTRUCTION, not by
// policy: the verifier reads the leading PHC prefix to pick an algorithm, and
// a value that names none falls to the default branch and returns false for
// every input. So even with the sign-in refusal removed, no password verifies
// against a bot.
message CreateBotUserReq {
  option (w17.contrib.plugin_feature) = "service_account";
  // An address, like any other account. Bots are ordinary users with a flag,
  // so they carry the same identity column and the same uniqueness — which is
  // what lets one answer for what a machine did.
  string email = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  // tenant_id — the tenant the machine account belongs to, required by
  // `tenant_scope` (the column is NOT NULL). It is the tenant the minting
  // operator is acting in, read off their authenticated scope by
  // handlers/service_account_tenant.go — never taken from the wire, or an
  // operator could provision a bot into a tenant they are not in.
  //
  // Gated the way CreateUserReq.tenant_id is, and staged by a file that
  // exists only when BOTH features are on (`go_files_combined`): the field
  // is tenant_scope's and the rpc is service_account's.
  string tenant_id = 2 [
    (w17.field) = { type: UUID },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
}
message CreateBotUserResp {
  option (w17.contrib.plugin_feature) = "service_account";
  User user = 1;
}

message CreateUserReq {
  string email         = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  // Already-hashed password — the plugin's AuthService.SignUp
  // handler computes the hash via passwordhash.Settings.Hash()
  // before calling CreateUser. Storage stores the value
  // verbatim into User.password_hash. PASSWORD type marker is
  // kept for migrator semantics (TEXT column emit, refuses
  // PK + unique).
  string password_hash = 2 [(w17.field) = { type: PASSWORD }];
  // tenant_id — the owning tenant, required by `tenant_scope` (the
  // column it writes is NOT NULL). handlers/tenant.go resolves it from
  // the request's slug or forwarded Host; it is never client-set.
  //
  // Field-gated in step with the column and with the SET assignment
  // that writes it, so an activation without the feature has none of
  // the three. This is what retired CreateUserWithTenant: the twin
  // rpcs existed only because the feature filter could not splice a
  // column into a fixed INSERT.
  string tenant_id     = 3 [
    (w17.field) = { type: UUID },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
}
message CreateUserResp { User user = 1; }

// expires_at is set by the trusted service-tier caller (issueSession in
// handlers/auth_service.go computes NOW + session_token_ttl_seconds);
// IssueToken is a storage-tier mutation, not gateway-exposed, so no
// external client can dictate it. Unset (NULL) = never-expiring token.
message IssueTokenReq {
  string user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  // device_id — the Device the token is bound to (RegisterDevice's row for
  // the request's key thumbprint). REQUIRED: a session is never minted
  // unbound, and the request validation refuses one without it. The column
  // stays nullable for rows minted before device binding.
  string device_id = 3 [(w17.field) = { type: UUID }];
  // sha256(token), hex: the handler mints the token, stores only this, and
  // returns the token to the caller itself (it is never read back).
  string token_hash = 4 [(w17.field) = { type: CHAR, max_len: 64 }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the bound device, TokenIssued's device_id — the value
  // Authenticate later answers as AuthResp.device_id for this token.
  string thumbprint = 5;
  // A public-computer session (UserToken.public_computer).
  bool public_computer = 6;
  // The Device row of the browser session that approved a CLI login
  // (UserToken.approved_by_device_id); empty (NULL) for every other mint.
  string approved_by_device_id = 7 [(w17.field) = { type: UUID, null: true }];
}
message IssueTokenResp { UserToken token = 1; }

// token_hash finds the row; legacy_token only a legacy one (see
// GetUserByTokenReq).
message RevokeTokenReq  { string legacy_token = 1; string token_hash = 2; }

// UpgradeTokenHash moves a legacy row — found by its token in the clear —
// to the hash, and clears the clear copy. Run by the lookup that found it;
// a no-op on a row already moved.
message UpgradeTokenHashReq {
  string legacy_token = 1;
  string token_hash   = 2 [(w17.field) = { type: CHAR, max_len: 64 }];
}
message UpgradeTokenHashResp {}

// TouchTokenLastUsed stamps last_used_at on a token Authenticate just
// accepted, unless it was stamped after :cutoff. See the rpc.
message TouchTokenLastUsedReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string                    token_id = 1 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp cutoff   = 2 [(w17.field) = { type: DATETIME }];
  // The stamp, from the same clock as cutoff (see the rpc).
  google.protobuf.Timestamp used_at  = 3 [(w17.field) = { type: DATETIME }];
}
message TouchTokenLastUsedResp {
  option (w17.contrib.plugin_feature) = "api_token";
}
// SetBotAllowedCidrs writes a machine account's allowlist (canonical, see
// User.allowed_cidrs). NotFound for an account that is not a bot.
message SetBotAllowedCidrsReq {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string user_id       = 1 [(w17.field) = { type: UUID }];
  string allowed_cidrs = 2 [(w17.field) = { type: CHAR, max_len: 2048, blank: true }];
  // event-only (no w17.field: not persisted, not validated): the operator
  // and their device's key thumbprint, BotAllowlistChanged's changed_by and
  // device_id.
  string changed_by = 3;
  string thumbprint = 4;
}
message SetBotAllowedCidrsResp {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string id            = 1;
  string allowed_cidrs = 2;
}
// RecordBotTokenUse stamps one (token, address, surface, method) as used.
message RecordBotTokenUseReq {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string token_id = 1 [(w17.field) = { type: UUID }];
  string user_id  = 2 [(w17.field) = { type: UUID }];
  string address  = 3 [(w17.field) = { type: CHAR, max_len: 45, blank: true }];
  string surface  = 4 [(w17.field) = { type: CHAR, max_len: 16, blank: true }];
  string method   = 5 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  google.protobuf.Timestamp used_at = 6 [(w17.field) = { type: DATETIME }];
}
message RecordBotTokenUseResp {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
}

// RevokeToken returns the revoked row's identifiers for the
// caller's response. Consumers that don't need the IDs ignore the
// response (or pin a `_ = resp` discard). (TokenRevoked is emitted
// by RevokeSessionToken, the live logout path, not here.)
message RevokeTokenResp {
  string token_id = 1;
  string user_id  = 2;
}

// RevokeSessionToken backs the base-tier AuthService.Logout (gated
// authenticate_turnkey, no `devices` feature needed). Revoke-by-id,
// ownership guarded (id AND user_id) so a caller can only revoke their
// OWN token. token_id is always the caller's resolved SESSION token (the
// handler reads it from the auth envelope; an API-token bearer is
// refused), so an API token can't be hit. Idempotent — a token already
// revoked matches no row (NotFound), which Logout reads as done. (token_type
// is NOT in the DQL — see the rpc comment: that column is api_token-gated.)
message RevokeSessionTokenReq {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
  string    token_id   = 1 [(w17.field) = { type: UUID }];
  string    user_id    = 2 [(w17.field) = { type: UUID }];
  TokenType token_type = 3;
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device that caused it, the event's device_id.
  string    thumbprint = 4;
}
message RevokeSessionTokenResp {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
  string token_id = 1;
  string user_id  = 2;
}

// ── api_token mutation request/response messages ────────────
//
// Token-management writes for API/MCP tokens. The business
// AuthService handlers (CreateApiToken / RevokeApiToken) compose
// them after resolving the caller from the bearer-session scope.
// token_type is a handler-stamped param (never client-set) so the
// fixed INSERT/UPDATE DQL doesn't need an enum literal.

message IssueApiTokenReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1 [(w17.field) = { type: UUID }];
  string    name       = 2 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  TokenType token_type = 3;
  // Absent = NULL = never expires; the business handler decides, from the
  // caller's request and the deployment's default.
  google.protobuf.Timestamp expires_at = 4 [(w17.field) = { type: DATETIME }];
  // sha256(token), hex — see IssueTokenReq.token_hash.
  string    token_hash = 5 [(w17.field) = { type: CHAR, max_len: 64 }];
  // device_id — the Device the token is bound to: the (owner, thumbprint)
  // row of the public key the request named (RegisterDevice). Empty (NULL)
  // ONLY for a machine account's bearer token (bearer, device/bot-bearer):
  // issueApiTokenTx refuses to mint a person's or a keyed token without one.
  string    device_id  = 6 [(w17.field) = { type: UUID, null: true }];
  // The ROOT approver of the token (UserToken.approved_by_device_id): the
  // Device row of the creating caller's device, or — when the caller is a
  // session that was itself approved by another device (a CLI session) —
  // that session's approver. Empty (NULL) when the request was bound to none.
  string    approved_by_device_id = 7 [(w17.field) = { type: UUID, null: true }];
  // event-only (no w17.field: not persisted, not validated), for
  // ApiTokenCreated: the creating device's key thumbprint (device_id), the
  // program key's thumbprint, and the creating account.
  string    thumbprint     = 8;
  string    key_thumbprint = 9;
  string    created_by     = 10;
  // bearer — a machine account's bearer token (UserToken.bearer,
  // device/bot-bearer), bound to no device. Field-gated in step with the
  // column and with the SET assignment that writes it, as
  // CreateUserReq.tenant_id is: only service_account.go sets it, and one
  // INSERT keeps ApiTokenCreated's one emit site.
  bool      bearer         = 11 [(w17.contrib.plugin_feature_field) = "service_account"];
}
message IssueApiTokenResp {
  option (w17.contrib.plugin_feature) = "api_token";
  UserToken token = 1;
}

message AddTokenPermissionReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id      = 1 [(w17.field) = { type: UUID }];
  int32  permission_id = 2;
}
message AddTokenPermissionResp {
  option (w17.contrib.plugin_feature) = "api_token";
  TokenPermission token_permission = 1;
}

// MarkApiTokenRevoked — the storage half of AuthService.RevokeApiToken
// (named Mark… because the service method owns the RevokeApiToken name).
message MarkApiTokenRevokedReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    token_id   = 1 [(w17.field) = { type: UUID }];
  string    user_id    = 2 [(w17.field) = { type: UUID }];
  TokenType token_type = 3;
}
message MarkApiTokenRevokedResp {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id = 1;
}

// ── oauth mutation request/response messages ────────────────
// CreateOAuthIdentity links a (just-created or matched) User to an
// external IdP subject. User creation reuses CreateUser. Gated `oauth`.
message CreateOAuthIdentityReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string user_id     = 1 [(w17.field) = { type: UUID }];
  string provider_id = 2 [(w17.field) = { type: UUID }];
  string external_id = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
  string email       = 4 [(w17.field) = { type: EMAIL, max_len: 320, blank: true }];
}
message CreateOAuthIdentityResp {
  option (w17.contrib.plugin_feature) = "oauth";
  OAuthIdentity identity = 1;
}

// ── two_factor mutation request/response messages ───────────
//
// TOTP enrollment lifecycle + MFA challenge create/consume. All
// gated `two_factor`. The TOTP `seed` is CRYPTED_SECRET: the generated
// storage layer encrypts it on the way in, the handler hands it plaintext.

message CreateTotpSecretReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
  reserved 2; // `secret`, the secretbox blob — see UserTotpSecret
  string seed    = 3 [(w17.field) = { type: CRYPTED_SECRET }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device that caused it, the event's device_id.
  string thumbprint = 4;
}
message CreateTotpSecretResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  UserTotpSecret secret = 1;
}

message ConfirmTotpSecretReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device that caused it, the event's device_id.
  string thumbprint = 2;
}
message ConfirmTotpSecretResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}

// UpsertOAuthProviderReq creates or rewrites one OAuth provider, found by
// name: what the project's own code calls to configure a provider from its
// deployment's environment (a client id and secret kept with the other
// secrets), so changing a secret is a deploy and needs no admin. The secret
// is stored encrypted with the project's field key; the plaintext legacy
// column is cleared.
//
// A rewrite replaces every field below with the request's value: a blank
// optional field is written blank (the handler's defaults apply again), and
// `enabled` left unset writes false, which turns the provider off. A change
// made on the admin page is overwritten by the next call. A new secret takes
// effect on the next sign-in; one already at the provider fails its callback
// and starts again. The row keeps the tenant it was created with, and names
// are unique across tenants, so a call naming another tenant's provider
// rewrites that provider: the name is the caller's to own, and this is a
// storage method for the project's own trusted code, not for a tenant's
// input.
message UpsertOAuthProviderReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string name          = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string display_name  = 2 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string client_id     = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
  string secret        = 4 [(w17.field) = { type: CRYPTED_SECRET }];
  string authorize_url = 5 [(w17.field) = { type: URL }];
  string token_url     = 6 [(w17.field) = { type: URL }];
  string userinfo_url  = 7 [(w17.field) = { type: URL, blank: true }];
  string scopes        = 8 [(w17.field) = { type: CHAR, max_len: 512, blank: true }];
  string subject_path  = 9 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string email_path    = 10 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  bool   enabled       = 11;
  // The owning tenant under `tenant_scope`, written when the provider is
  // created. A provider's name is unique across tenants.
  string tenant_id     = 12 [
    (w17.field) = { type: UUID },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
}
message UpsertOAuthProviderResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string id = 1;
}

// MoveOAuthProviderSecretReq moves a provider's legacy plaintext
// client_secret into the encrypted `secret` — only while the legacy column
// still holds `legacy`, so a value an operator wrote in between is not lost.
message MoveOAuthProviderSecretReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string id     = 1 [(w17.field) = { type: UUID }];
  string secret = 2 [(w17.field) = { type: CRYPTED_SECRET }];
  string legacy = 3 [(w17.field) = { type: SECRET }];
}
message MoveOAuthProviderSecretResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string id = 1;
}

// ClearOAuthProviderLegacySecretReq empties the legacy plaintext column of a
// provider whose encrypted `secret` is already set.
message ClearOAuthProviderLegacySecretReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string id = 1 [(w17.field) = { type: UUID }];
}
message ClearOAuthProviderLegacySecretResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string id = 1;
}

// MoveTotpSeedReq moves a legacy seed (UserTotpSecret.secret, decrypted by
// the handler with two_factor_secret_key) into the encrypted `seed`.
//
// Keyed by the enrolment row's id, not by user_id: a re-enrolment between
// the read and the move creates a NEW row, and the old seed must not land in it.
message MoveTotpSeedReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string seed    = 2 [(w17.field) = { type: CRYPTED_SECRET }];
  string id      = 3 [(w17.field) = { type: UUID }];
}
message MoveTotpSeedResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}

// ClaimTotpStepReq takes the time step a TOTP code matched, only if it is
// later than every step this authenticator accepted before.
message ClaimTotpStepReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id   = 1 [(w17.field) = { type: UUID }];
  int64  step = 2;
}
message ClaimTotpStepResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1; // empty = not claimed: the step was already used (a replay)
}

// RecordStepUpAttemptReq claims one guess of the step-up budget. Zero
// attempts back = not claimed: the step-up is locked (or the row is gone).
message RecordStepUpAttemptReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1 [(w17.field) = { type: UUID }];
}
message RecordStepUpAttemptResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  int64 attempts = 1;
}

message LockStepUpReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp until = 2 [(w17.field) = { type: DATETIME }];
}
message LockStepUpResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1;
}

message ResetStepUpReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1 [(w17.field) = { type: UUID }];
}
message ResetStepUpResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1;
}

message CreateRecoveryCodeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string code_hash = 2 [(w17.field) = { type: CHAR, max_len: 64 }];
}
message CreateRecoveryCodeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id = 1;
}

// RevokeRecoveryCodes ends the user's unused codes (revoked_at), when the set
// is replaced or the authenticator disabled. Was DeleteRecoveryCodes.
message RevokeRecoveryCodesReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message RevokeRecoveryCodesResp {
  option (w17.contrib.plugin_feature) = "two_factor";
}

message ConsumeRecoveryCodeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string code_hash = 2 [(w17.field) = { type: CHAR, max_len: 64 }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device that caused it, the event's device_id.
  string thumbprint = 3;
}
message ConsumeRecoveryCodeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string id      = 1; // empty = no such unused code
  string user_id = 2;
}

// RevokeTotpSecret ends the user's live authenticator (revoked_at, seed
// cleared). Was DeleteTotpSecret.
message RevokeTotpSecretReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device that caused it, the event's device_id.
  string thumbprint = 2;
}
message RevokeTotpSecretResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}

// CreateMfaChallengeReq carries the persisted columns (user_id, code_hash)
// PLUS event-only fields the handler computes for MfaChallengeRequested:
// totp_enrolled (the keystone signal), email (delivery hint), code (the
// plaintext fallback code — present only in plugin-generates mode, NEVER
// persisted), expires_at (created_at + TTL, for the subscriber). The
// event-only fields carry no (w17.field) so they're not columns/params —
// the INSERT binds only :user_id + :code_hash; the eventbus emit maps the
// rest from $request.
message CreateMfaChallengeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string code_hash = 2 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  // event-only (no w17.field → not persisted, not validated):
  bool                      totp_enrolled = 3;
  string                    email         = 4;
  string                    code          = 5;
  google.protobuf.Timestamp expires_at    = 6;
  // The key that signed the sign-in raising the challenge; VerifyMfa must
  // be signed by the same one.
  string thumbprint = 7 [(w17.field) = { type: CHAR, max_len: 43 }];
  // The sign-in asked for a public-computer session; VerifyMfa honours it.
  bool public_computer = 8;
}
message CreateMfaChallengeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  MfaChallenge challenge = 1;
}

// SupersedePendingMfaChallengesReq — the user whose still-pending
// challenges the issuer retires before minting a new one, so at most ONE
// code is live at a time. The response is deliberately EMPTY: see the RPC.
message SupersedePendingMfaChallengesReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message SupersedePendingMfaChallengesResp {
  option (w17.contrib.plugin_feature) = "two_factor";
}

message ConsumeMfaChallengeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1 [(w17.field) = { type: UUID }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint VerifyMfa was signed with — the challenged one, which it has
  // checked — MfaVerified's device_id.
  string thumbprint = 2;
}
message ConsumeMfaChallengeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1;
  string user_id      = 2;
}

// RecordMfaAttemptReq/Resp — atomically bump a challenge's failed-attempt
// counter (brute-force lockout). Resp.attempts is the NEW count so the handler
// can log/observe it; the lockout itself is enforced by VerifyMfa's
// pre-check on the loaded challenge.attempts.
message RecordMfaAttemptReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1 [(w17.field) = { type: UUID }];
}
message RecordMfaAttemptResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  int64 attempts = 1;
}

// ── sign_up_confirmation request/response messages ───────────
//
// CreatePendingSignUp stores the HASHES (password, code) and the expiry; the
// plaintext code is event-only (no w17.field) so it rides the
// SignUpConfirmationRequested emit without becoming a column.
message CreatePendingSignUpReq {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  string email         = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  string password_hash = 2 [(w17.field) = { type: PASSWORD }];
  string code_hash     = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
  google.protobuf.Timestamp expires_at = 4 [(w17.field) = { type: DATETIME }];
  // event-only (no w17.field → not persisted, not validated):
  string code = 5;
  string tenant_id = 6 [
    (w17.field) = { type: UUID, null: true },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
}
message CreatePendingSignUpResp {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  PendingSignUp pending = 1;
}

// RecordPendingSignUpAttempt claims one guess and hands back what checking it
// needs, in ONE statement: attempts is the NEW count (0 = no live row — wrong
// id, expired, or already confirmed), code_hash the hash to check against.
message RecordPendingSignUpAttemptReq {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  string pending_id = 1 [(w17.field) = { type: UUID }];
}
message RecordPendingSignUpAttemptResp {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  int64  attempts  = 1;
  string code_hash = 2;
  string email     = 3;
}

// ClaimPendingSignUp spends the registration: one UPDATE … RETURNING guarded on
// `claimed_at IS NULL` is the single-use guard, so two confirmations racing on
// one row get one account. The row stays, with claimed_at.
message ClaimPendingSignUpReq {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  string pending_id = 1 [(w17.field) = { type: UUID }];
}
message ClaimPendingSignUpResp {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  string email         = 1;
  string password_hash = 2;
  string tenant_id     = 3 [(w17.contrib.plugin_feature_field) = "tenant_scope"];
}

// SupersedePendingSignUpsForEmail ends the other open registrations of an
// address once one of them became the account (superseded_at). Was
// DeletePendingSignUpsForEmail; the per-address purge of expired rows
// (PurgeExpiredPendingSignUps) is gone — an expired row stays, refused by its
// expires_at.
message SupersedePendingSignUpsForEmailReq {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  string email = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message SupersedePendingSignUpsForEmailResp {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
}

// ErasePendingSignUpAddress is sign_up_confirmation's eraser (user_admin's
// EraseUsers): the pending registrations of the erased address are ended and
// lose the address and their hashes. They used to be deleted when one of them
// was confirmed; they stay now, so an erasure has to reach them.
message ErasePendingSignUpAddressReq {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
  // The address being erased (as stored: normalized).
  string email       = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  // What the rows carry instead — the account's erasure placeholder.
  string placeholder = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message ErasePendingSignUpAddressResp {
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";
}

// ── password_reset request/response messages ────────────────
//
// CreatePasswordResetToken stores ONLY the token hash + expiry; the
// plaintext token + email are event-only (no w17.field) so they ride the
// PasswordResetRequested emit without becoming columns. ConsumePasswordReset
// flips consumed_at single-use AND enforces expiry atomically in the WHERE.
message CreatePasswordResetTokenReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string user_id    = 1 [(w17.field) = { type: UUID }];
  string token_hash = 2 [(w17.field) = { type: CHAR, max_len: 128, unique: true }];
  google.protobuf.Timestamp expires_at = 3 [(w17.field) = { type: DATETIME }];
  // event-only (no w17.field → not persisted, not validated):
  string email = 4;
  string token = 5;
}
message CreatePasswordResetTokenResp {
  option (w17.contrib.plugin_feature) = "password_reset";
  PasswordResetToken token = 1;
}

message SpendPasswordResetTokensReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message SpendPasswordResetTokensResp {
  option (w17.contrib.plugin_feature) = "password_reset";
}

message ConsumePasswordResetTokenReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string token_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message ConsumePasswordResetTokenResp {
  option (w17.contrib.plugin_feature) = "password_reset";
  string user_id = 1; // empty when no live token matched (invalid / expired / used)
}

// UpdateUserPassword — set a user's password_hash (the reset apply). Gated
// `password_reset` (the only writer of an existing user's password).
// UNGATED, deliberately. It was tagged `password_reset`, which made the
// only way to write a password_hash a member of the FORGOTTEN-password
// flow — so `password_change`, whose whole point is to need no mail
// channel, could not reach it without dragging one in. The primitive
// itself is feature-neutral: every activation has User.password_hash,
// because SignIn reads it.
message UpdateUserPasswordReq {
  string user_id       = 1 [(w17.field) = { type: UUID }];
  string password_hash = 2 [(w17.field) = { type: PASSWORD }];
}
message UpdateUserPasswordResp {
  string user_id = 1;
}

message UpdateUserPasswordIfUnchangedReq {
  option (w17.contrib.plugin_feature) = "password_change";
  string user_id       = 1 [(w17.field) = { type: UUID }];
  string password_hash = 2 [(w17.field) = { type: PASSWORD }];
  // The hash the caller's proof was checked against. The write applies only
  // while the stored value is still this one.
  string current_hash  = 3 [(w17.field) = { type: PASSWORD }];
}
message UpdateUserPasswordIfUnchangedResp {
  option (w17.contrib.plugin_feature) = "password_change";
  string user_id = 1;
}

// The user's own marketing consent: set, stamped and announced in one
// statement. Gated marketing_consent.
message SetUserMarketingConsentReq {
  option (w17.contrib.plugin_feature) = "marketing_consent";
  string user_id = 1 [(w17.field) = { type: UUID }];
  bool   consent = 2;
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the device the decision was made from,
  // MarketingConsentChanged's device_id.
  string thumbprint = 3;
}
message SetUserMarketingConsentResp {
  option (w17.contrib.plugin_feature) = "marketing_consent";
  string                    user_id    = 1;
  bool                      consent    = 2;
  google.protobuf.Timestamp decided_at = 3;
}

// RevokeOtherSessionTokens ends every SESSION of a user but the one named:
// a password change signs the person out everywhere else, because whoever
// held the old password may hold a session too. API tokens are kept — they
// are credentials the person minted on purpose, for CI and scripts. Gated
// `password_change`.
// MarkSessionSteppedUp — the caller's own, live session token, stamped with
// the moment its password was confirmed. Gated `step_up`.
message MarkSessionSteppedUpReq {
  option (w17.contrib.plugin_feature) = "step_up";
  string token_id = 1 [(w17.field) = { type: UUID }];
  string user_id  = 2 [(w17.field) = { type: UUID }];
}
message MarkSessionSteppedUpResp {
  option (w17.contrib.plugin_feature) = "step_up";
  string id = 1;
  google.protobuf.Timestamp stepped_up_at = 2;
}
message RecordPasswordStepUpAttemptReq {
  option (w17.contrib.plugin_feature) = "step_up";
  string token_id = 1 [(w17.field) = { type: UUID }];
  string user_id  = 2 [(w17.field) = { type: UUID }];
}
message RecordPasswordStepUpAttemptResp {
  option (w17.contrib.plugin_feature) = "step_up";
  int64 attempts = 1;
}
message LockPasswordStepUpReq {
  option (w17.contrib.plugin_feature) = "step_up";
  string token_id = 1 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp until = 2;
}
message LockPasswordStepUpResp {
  option (w17.contrib.plugin_feature) = "step_up";
  string id = 1;
}

// SetStepUpCodeReq — the session a mailed step-up code is for, the code's
// hash, and the moment before which the previous code must have been sent for
// a new one to go out (at most one a minute per session).
message SetStepUpCodeReq {
  option (w17.contrib.plugin_feature) = "step_up_code";
  string token_id  = 1 [(w17.field) = { type: UUID }];
  string user_id   = 2 [(w17.field) = { type: UUID }];
  string code_hash = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
  google.protobuf.Timestamp resend_before = 4;
  // event-only (no w17.field → not persisted, not validated):
  string                    email      = 5;
  string                    code       = 6;
  google.protobuf.Timestamp expires_at = 7;
  string                    thumbprint = 8;
}
message SetStepUpCodeResp {
  option (w17.contrib.plugin_feature) = "step_up_code";
  string token_id = 1;
  string user_id  = 2;
  google.protobuf.Timestamp sent_at = 3;
}
// ConsumeStepUpCodeReq — the session and the hash of the code its holder
// proved; the stamp lands only while that code is still the live one.
message ConsumeStepUpCodeReq {
  option (w17.contrib.plugin_feature) = "step_up_code";
  string token_id  = 1 [(w17.field) = { type: UUID }];
  string user_id   = 2 [(w17.field) = { type: UUID }];
  string code_hash = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message ConsumeStepUpCodeResp {
  option (w17.contrib.plugin_feature) = "step_up_code";
  string id = 1;
  google.protobuf.Timestamp stepped_up_at = 2;
}

message RevokeOtherSessionTokensReq {
  option (w17.contrib.plugin_feature) = "password_change";
  string    user_id       = 1 [(w17.field) = { type: UUID }];
  // The caller's own session, kept. The nil UUID keeps none (a caller on an
  // API token has no session to keep).
  string    keep_token_id = 2 [(w17.field) = { type: UUID }];

  // token_type was a parameter; the statement names the session realm
  // itself, behind ?feature(api_token), because the column exists only
  // with that feature.
  reserved 3;
  reserved "token_type";
}
message RevokeOtherSessionTokensResp {
  option (w17.contrib.plugin_feature) = "password_change";
}

// RevokeTokensForReset — revoke ALL of a user's tokens after a password
// reset (a reset implies the old credential may be compromised, so every
// session AND API token is ended — the conservative default). Gated
// `password_reset` so it exists independently of the `devices` feature's
// RevokeAllUserTokens.
message RevokeTokensForResetReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message RevokeTokensForResetResp {
  option (w17.contrib.plugin_feature) = "password_reset";
}

// ── email_verification request/response messages ────────────
message CreateEmailVerificationTokenReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id    = 1 [(w17.field) = { type: UUID }];
  string token_hash = 2 [(w17.field) = { type: CHAR, max_len: 128, unique: true }];
  google.protobuf.Timestamp expires_at = 3 [(w17.field) = { type: DATETIME }];
  // event-only:
  string email = 4;
  string token = 5;
}
message CreateEmailVerificationTokenResp {
  option (w17.contrib.plugin_feature) = "email_verification";
  EmailVerificationToken token = 1;
}

message ConsumeEmailVerificationTokenReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string token_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message ConsumeEmailVerificationTokenResp {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id = 1; // empty when no live token matched
}

// MarkEmailVerified — stamp User.email_verified_at = NOW(). Gated
// `email_verification`.
message MarkEmailDerivedFromInviteReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message MarkEmailDerivedFromInviteResp {
  option (w17.contrib.plugin_feature) = "email_verification";
  // Empty when nothing moved, which is the ORDINARY case rather than a failure:
  // the address was already self-confirmed, or already derived. The caller does
  // not branch on it.
  string user_id = 1;
}

message MarkEmailVerifiedReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message MarkEmailVerifiedResp {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id = 1;
}

// ── device identity mutation request/response messages ───────
//
// RegisterDevice / TrustDevice are base tier (every mint binds a device);
// the revoke primitives below them are the `devices` management surface.

message RegisterDeviceReq {
  string user_id    = 1 [(w17.field) = { type: UUID }];
  // The key thumbprint the gateway verified (x-w17-dpop-jkt).
  string thumbprint = 2 [(w17.field) = { type: CHAR, max_len: 43 }];
  string label      = 3 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  string ip         = 4 [(w17.field) = { type: CHAR, max_len: 45, blank: true }];
  // A program's key (Device.api_key): written only when the row is created.
  bool   api_key    = 5;
}
message RegisterDeviceResp {
  Device device = 1;
}

// ── sign-in guess budget (base tier) ───────────────────────────
//
// SignIn's per-account and per-device budgets (sign-in/failure-budget).
// :now and :cutoff (now minus the window) both come from the caller's
// clock, as TouchTokenLastUsed's do: the DQL has no interval arithmetic.

message CountSignInAttemptReq {
  string user_id = 1 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp now    = 2;
  google.protobuf.Timestamp cutoff = 3;
}
message CountSignInAttemptResp {
  int64 attempts = 1;
}
message CountDeviceSignInAttemptReq {
  string user_id    = 1 [(w17.field) = { type: UUID }];
  string thumbprint = 2 [(w17.field) = { type: CHAR, max_len: 43 }];
  google.protobuf.Timestamp now    = 3;
  google.protobuf.Timestamp cutoff = 4;
}
message CountDeviceSignInAttemptResp {
  int64 attempts = 1;
}
message ResetSignInAttemptsReq {
  string user_id    = 1 [(w17.field) = { type: UUID }];
  string thumbprint = 2 [(w17.field) = { type: CHAR, max_len: 43 }];
}
message ResetSignInAttemptsResp {}

// ── sign-in history (base tier) ────────────────────────────────

// RecordSignInEventReq — one SignInEvent row. Every field is what the mint
// path knows when the attempt ends; an empty nullable one is written NULL.
message RecordSignInEventReq {
  // The account the attempt reached; empty (NULL) when it reached none.
  string user_id    = 1 [(w17.field) = { type: UUID, null: true }];
  // The address the attempt named, normalised; may be blank, and need not be
  // a valid address (it is what was typed).
  string address    = 2 [(w17.field) = { type: CHAR, max_len: 320, blank: true }];
  // The Device row; empty (NULL) when the attempt registered none.
  string device_id  = 3 [(w17.field) = { type: UUID, null: true }];
  // The proof's key thumbprint; empty (NULL) without a proof.
  string thumbprint = 4 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  string ip         = 5 [(w17.field) = { type: CHAR, max_len: 45, blank: true }];
  string user_agent = 6 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  SignInMethod  method  = 7 [(w17.field) = { type: ENUM }];
  SignInOutcome outcome = 8 [(w17.field) = { type: ENUM }];
  // The attempt asked for a public-computer session.
  bool public_computer = 9;
}
message RecordSignInEventResp {
  string id = 1;
}

// EraseSignInEventsReq — the erasure's share of the sign-in history
// (user_admin): the account's rows, and the rows that reached no account but
// named its address, take the placeholder address and lose their client
// address and user agent.
message EraseSignInEventsReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id     = 1 [(w17.field) = { type: UUID }];
  // The address being erased, normalised (what SignIn would have recorded).
  string email       = 2 [(w17.field) = { type: CHAR, max_len: 320, blank: true }];
  // What the rows carry instead — the account's erasure placeholder.
  string placeholder = 3 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message EraseSignInEventsResp {
  option (w17.contrib.plugin_feature) = "user_admin";
}

message TrustDeviceReq {
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string device_id = 2 [(w17.field) = { type: UUID }];
  // 3 = trust_token_hash: holding the device key is the proof now.
  reserved 3;
  // The trust is written only while the account's device trust has not been
  // revoked AFTER this instant (User.device_trust_revoked_at): for a SignIn
  // renewing trust, the revocation stamp it read while resolving the device
  // (after the password check); for VerifyMfa, the creation of the challenge
  // it answered (also after SignIn's password check). The epoch when the
  // account was never revoked. A password change or a disable that commits
  // after that instant then wins, instead of being overwritten by a
  // trusted_at stamped after it; one committing between the password check
  // and that instant is not caught (SPEC, device gap).
  google.protobuf.Timestamp not_revoked_after = 4 [(w17.field) = { type: DATETIME }];
}
message TrustDeviceResp {
  string device_id = 1;
}

// RevokeDeviceTokensReq / MarkDeviceRevokedReq — base tier: both the
// `devices` self-service calls and the `user_admin` Devices page revoke a
// device with them, and an rpc carries one gate.
message RevokeDeviceTokensReq {
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string device_id = 2 [(w17.field) = { type: UUID }];
  // Who revoked: the device's owner for the self-service calls, the operator
  // for the admin Devices page.
  string revoked_by = 3 [(w17.field) = { type: UUID }];
  // The one token the "approved" op keeps: the caller's own session for
  // RevokeOtherDevices ("everywhere but here" — the caller may be a CLI
  // session the revoked device approved); the nil UUID (keeps none) for
  // every other caller.
  string keep_token_id = 4 [(w17.field) = { type: UUID }];
}
message RevokeDeviceTokensResp {
}

// RevokeApprovedApiTokens — the owner's API tokens one device created
// (UserToken.approved_by_device_id). Run beside RevokeDeviceTokens when ONE
// device is revoked explicitly (the owner's RevokeDevice, the admin Devices
// revoke); see the rpc. token_type is handler-stamped (API).
message RevokeApprovedApiTokensReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1 [(w17.field) = { type: UUID }];
  string    device_id  = 2 [(w17.field) = { type: UUID }];
  string    revoked_by = 3 [(w17.field) = { type: UUID }];
  TokenType token_type = 4;
}
message RevokeApprovedApiTokensResp {
  option (w17.contrib.plugin_feature) = "api_token";
}

message MarkDeviceRevokedReq {
  string user_id   = 1 [(w17.field) = { type: UUID }];
  string device_id = 2 [(w17.field) = { type: UUID }];
}
message MarkDeviceRevokedResp {
  string device_id = 1;
}

// RevokeUndevicedSessionsReq — the user's SESSIONS that no device holds,
// except keep_token_id (the caller's own, for "log out the others"; the nil
// UUID keeps none).
message RevokeUndevicedSessionsReq {
  option (w17.contrib.plugin_feature) = "devices";
  string user_id       = 1 [(w17.field) = { type: UUID }];
  string keep_token_id = 2 [(w17.field) = { type: UUID }];
}
message RevokeUndevicedSessionsResp {
  option (w17.contrib.plugin_feature) = "devices";
}

message RevokeAllUserTokensReq {
  option (w17.contrib.plugin_feature) = "devices";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message RevokeAllUserTokensResp {
  option (w17.contrib.plugin_feature) = "devices";
}

// ── RBAC mutation request/response messages ─────────────────
//
// All tagged `rbac` because their fields reference RBAC tables
// (Role / Permission / UserRole / RolePermission) which drop
// when the feature is disabled. The whole Req/Resp set drops
// together with the mutations that use them.

message CreateRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string name        = 1 [(w17.field) = { type: SLUG, max_len: 100 }];
  string description = 2 [(w17.field) = { type: TEXT, max_len: 500, blank: true }];
}
message CreateRoleResp {
  option (w17.contrib.plugin_feature) = "rbac";
  Role role = 1;
}

message DeleteRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id = 1;
}
message DeleteRoleResp {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id = 1;
}

// UpdateRole — edit a role's human-facing copy (name + description).
// Deliberately NOT the privilege flags: all_permissions /
// assign_first_user / assign_default decide who gets a WILDCARD grant
// and who gets it automatically, so flipping them from an admin form
// is a privilege-escalation path. Those stay declarative, seeded from
// `(w17.acl_roles)`. Gated rbac.
message UpdateRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id     = 1 [(w17.field) = { type: UUID }];
  string name        = 2 [(w17.field) = { type: SLUG, max_len: 100 }];
  string description = 3 [(w17.field) = { type: TEXT, max_len: 500, blank: true }];
}
message UpdateRoleResp {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id = 1;
}

// ClaimRoleForOrg — make a role CreateRole just inserted one organization's
// custom role (AuthService.CreateOrgRole, in the same transaction).
message ClaimRoleForOrgReq {
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id      = 1 [(w17.field) = { type: UUID }];
  string org_id       = 2 [(w17.field) = { type: UUID }];
  string display_name = 3 [(w17.field) = { type: CHAR, max_len: 100 }];
}
message ClaimRoleForOrgResp {
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id = 1;
}

// UpdateOrgRoleLabel — rename a custom role or change its description, only
// in the organization that owns it (AuthService.UpdateOrgRole).
message UpdateOrgRoleLabelReq {
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id      = 1 [(w17.field) = { type: UUID }];
  string org_id       = 2 [(w17.field) = { type: UUID }];
  string display_name = 3 [(w17.field) = { type: CHAR, max_len: 100 }];
  string description  = 4 [(w17.field) = { type: TEXT, max_len: 500, blank: true }];
}
message UpdateOrgRoleLabelResp {
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id = 1;
}

// --- user_admin feature: turnkey admin user management ---
// Erasing an account (GDPR) is three steps, run by AuthService.EraseUsers in
// this order (one transaction with a coordinator; without one, a retry
// completes a failed erasure): BeginUserErasure ends the account's access —
// disabled, password unusable, every token and device revoked — and leaves its
// address alone; the per-feature erasers blank or spend the feature-owned
// rows; EraseUser replaces the address and stamps erased_at. Nothing is
// deleted. Access ends FIRST so that an erasure stopped part-way never leaves
// a usable account with half of its data gone.
message BeginUserErasureReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1 [(w17.field) = { type: UUID }];
  // The operator who erased it, stamped as revoked_by on every token it ends.
  string revoked_by = 2 [(w17.field) = { type: UUID }];
}
message BeginUserErasureResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
}
// DisableUsers / EnableUsers are the Users page's bulk `actions` — the
// AdminAction wire contract requires a `repeated string ids` request.
message EraseUserReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1 [(w17.field) = { type: UUID }];
  // The placeholder that replaces the address: `erased-<user_id>@erased.invalid`,
  // composed by the handler. Unique because the id is, non-routable (.invalid,
  // RFC 2606), and it frees the old address for a new sign-up.
  string email = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
  // 3 = revoked_by: the tokens are revoked by BeginUserErasure now.
  reserved 3;
  reserved "revoked_by";
}
message EraseUserResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
}

// UpdateUser — edit an account's identity fields. Today that is the
// email only; password_hash is deliberately absent (UpdateUserPassword
// owns that write, gated `password_reset`, so credential material never
// rides an admin form), and disabled_at belongs to the Disable/Enable
// bulk actions. Refuses on a duplicate email — the unique violation
// surfaces as AlreadyExists via the storage DB-error classification, same
// as CreateUser. Gated user_admin.
message UpdateUserReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string email   = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message UpdateUserResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
  string email   = 2;
}

// ── erasure: the feature-owned halves of AuthService.EraseUsers ──
//
// Each is gated by the feature that owns its table, so an activation without
// that feature has neither the table nor the statement. AuthService.EraseUsers
// runs the ones its activation has, in the same transaction as EraseUser.
// None deletes a row: personal columns are blanked or replaced, and anything
// still usable is marked spent.

// EraseOAuthData — the account's OAuth identities and login codes.
message EraseOAuthDataReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message EraseOAuthDataResp {
  option (w17.contrib.plugin_feature) = "oauth";
}

// EraseTwoFactorData — the account's authenticator, recovery codes and
// pending challenges.
message EraseTwoFactorDataReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message EraseTwoFactorDataResp {
  option (w17.contrib.plugin_feature) = "two_factor";
}

// SpendEmailVerificationTokens — mark every live verification link of an
// account used (the PasswordResetToken twin, SpendPasswordResetTokens).
message SpendEmailVerificationTokensReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message SpendEmailVerificationTokensResp {
  option (w17.contrib.plugin_feature) = "email_verification";
}

// EraseOrgInviteAddress — replace an erased address on the invitations sent
// to it with the account's placeholder.
message EraseOrgInviteAddressReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  // The address being erased (as stored: normalized).
  string email = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  // 2 = placeholder: the address is cleared (NULL), not re-addressed.
  reserved 2;
  reserved "placeholder";
}
message EraseOrgInviteAddressResp {
  option (w17.contrib.plugin_feature) = "org_invite";
}

message DisableUsersReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated string ids = 1;
}
// Disable/EnableUsers are fire-and-forget bulk toggles: the admin SPA
// renders only success/failure for an action (the result body is not
// displayed in v1), so the response is intentionally empty. A
// `RETURNING id`-into-`repeated` response would need a `pq.Array` scan of a
// scalar RETURNING column (wrong shape).
message DisableUsersResp {
  option (w17.contrib.plugin_feature) = "user_admin";
}
message EnableUsersReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated string ids = 1;
}
message EnableUsersResp {
  option (w17.contrib.plugin_feature) = "user_admin";
}

message AssignRoleToUserReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
  string role_id = 2;
  // org_id — WHICH organization this grant applies in. Empty means
  // realm-wide (`UserRole.org_id` NULL), which stays a legitimate,
  // load-bearing state under `org_membership`: staff / admin roles are
  // exactly the grants that must count in every org.
  //
  // Field-gated in step with the column it writes, so an activation
  // without `org_membership` has neither.
  // `null: true` — empty means realm-wide, which is a legitimate value
  // and must not be rejected as a missing one.
  string org_id = 3 [
    (w17.field) = { type: UUID, null: true },
    (w17.contrib.plugin_feature_field) = "org_membership"
  ];
}
message AssignRoleToUserResp {
  option (w17.contrib.plugin_feature) = "rbac";
  UserRole user_role = 1;
}

message RevokeRoleFromUserReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
  string role_id = 2;
  // org_id — WHICH grant to revoke. Empty targets the realm-wide one.
  // See AssignRoleToUserReq.org_id.
  //
  // Without it a revoke matched on (user_id, role_id) alone, and the
  // partial uniques deliberately allow one row PER ORG for that pair —
  // so revoking a role in one company deleted it in all of them.
  // `null: true` — empty means realm-wide, which is a legitimate value
  // and must not be rejected as a missing one.
  string org_id = 3 [
    (w17.field) = { type: UUID, null: true },
    (w17.contrib.plugin_feature_field) = "org_membership"
  ];
  // revoked_by — the account revoking, stamped on the grant. Empty = nobody
  // named (NULL).
  string revoked_by = 4 [(w17.field) = { type: UUID, null: true }];
}
message RevokeRoleFromUserResp {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
  string role_id = 2;
  // Which org's grant was revoked — empty for the realm-wide one.
  // Gated in step with the column and with the event field the emit
  // binds it into.
  string org_id  = 3 [
    (w17.field) = { type: UUID, null: true },
    (w17.contrib.plugin_feature_field) = "org_membership"
  ];
}

// AddPermissionToRole / RemovePermissionFromRole operate on the
// RolePermission link tuple. `permission_id` is an int32 from
// the activating domain's generated AclPermission enum (in
// `w17.lock.acl.proto`); the catalog lives in the proto, not in
// a DB table.
message AddPermissionToRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id       = 1;
  int32  permission_id = 2;
  // added_by — the account adding it, logged in RolePermissionChange. Empty =
  // nobody named (NULL).
  string added_by      = 3 [(w17.field) = { type: UUID, null: true }];
}
message AddPermissionToRoleResp {
  option (w17.contrib.plugin_feature) = "rbac";
  RolePermission role_permission = 1;
}

message RemovePermissionFromRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id       = 1;
  int32  permission_id = 2;
  // removed_by — the account removing it, stamped on the row and logged in
  // RolePermissionChange. Empty = nobody named (NULL).
  string removed_by    = 3 [(w17.field) = { type: UUID, null: true }];
}
message RemovePermissionFromRoleResp {
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id       = 1;
  int32  permission_id = 2;
}

// ── cli_login mutation request/response messages ────────────
//
// Single-use PKCE authorization-code writes for the first-party CLI
// login flow. The business CliAuthorize / CliToken handlers compose
// them; only the code's hash is ever stored.

message RegisterAuthClientReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string client_id    = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string name         = 2 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string redirect_uri = 3 [(w17.field) = { type: URL, max_len: 2048 }];
  // client_secret — already HASHED by the handler. The storage tier stores
  // what it is handed; the plaintext exists only in the handler and in the
  // one response that carries it back to the operator.
  string client_secret = 4 [(w17.field) = { type: PASSWORD }];
}
message RegisterAuthClientResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  AuthClient client = 1;
}

message RotateAuthClientSecretReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id            = 1 [(w17.field) = { type: UUID }];
  // The new secret's argon2id hash (the handler hashes; the plaintext is
  // returned to the operator once and never stored).
  string client_secret = 2 [(w17.field) = { type: PASSWORD }];
}
message RotateAuthClientSecretResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id = 1;
}

message SetAuthClientEnabledReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id      = 1 [(w17.field) = { type: UUID }];
  bool   enabled = 2;
}
message SetAuthClientEnabledResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id = 1;
}

message RevokeAuthClientReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id = 1 [(w17.field) = { type: UUID }];
}
message RevokeAuthClientResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id = 1;
}

message ClaimBootstrapAdminReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string slot    = 1 [(w17.field) = { type: SLUG, max_len: 32 }];
  string user_id = 2 [(w17.field) = { type: UUID }];
}
message ClaimBootstrapAdminResp {
  option (w17.contrib.plugin_feature) = "rbac";
  // 1 when this call took the slot, 0 when another sign-up holds it.
  // `optional` so the 0 reaches the caller instead of reading as absent.
  optional int32 written = 1;
}

message CreateOAuthLoginCodeReq {
  option (w17.contrib.plugin_feature) = "oauth";
  // Unset for a code whose account OAuthExchange will create.
  optional string user_id = 1 [(w17.field) = { type: UUID, null: true }];
  string code_hash      = 2 [(w17.field) = { type: CHAR, max_len: 64 }];
  string code_challenge = 3 [(w17.field) = { type: CHAR, max_len: 64 }];
  google.protobuf.Timestamp expires_at = 4 [(w17.field) = { type: DATETIME }];
  optional string provider_id = 5 [(w17.field) = { type: UUID, null: true }];
  string external_id    = 6 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  string email          = 7 [(w17.field) = { type: CHAR, max_len: 320, blank: true }];
  bool   email_verified = 8;
}
message CreateOAuthLoginCodeResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string id = 1;
}
message ConsumeOAuthLoginCodeReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string code_hash = 1 [(w17.field) = { type: CHAR, max_len: 64 }];
}
message ConsumeOAuthLoginCodeResp {
  option (w17.contrib.plugin_feature) = "oauth";
  // Empty when no unconsumed, unexpired code matched.
  optional string user_id = 1;
  string code_challenge = 2;
  optional string provider_id = 3;
  string external_id    = 4;
  string email          = 5;
  bool   email_verified = 6;
}

message CreateCliAuthCodeReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string user_id        = 1 [(w17.field) = { type: UUID }];
  string code_hash      = 2 [(w17.field) = { type: CHAR, max_len: 128 }];
  string code_challenge = 3 [(w17.field) = { type: CHAR, max_len: 128 }];
  // The target this code is for — stored so the exchange can require the
  // same one (RFC 6749 §4.1.3). Blank for a code minted before that binding
  // existed; CliToken treats a blank as "nothing to compare".
  string redirect_uri   = 5 [(w17.field) = { type: URL, max_len: 2048, blank: true }];
  // The registered client this code belongs to, so the token endpoint can
  // demand ITS secret. Blank for loopback, which has no registration.
  string client_id      = 6 [(w17.field) = { type: SLUG, max_len: 64, blank: true }];
  google.protobuf.Timestamp expires_at = 4 [(w17.field) = { type: DATETIME }];
  // The approving session's own expiry, read by CliAuthorize from the
  // caller's UserToken row (GetLiveSessionExpiry). Absent = that session
  // never expires. See CliAuthCode.session_expires_at.
  google.protobuf.Timestamp session_expires_at = 7 [(w17.field) = { type: DATETIME, null: true }];
  // The Device row the approving session is bound to (read with its expiry).
  // See CliAuthCode.approved_by_device_id. Empty (NULL) when it has none.
  string approved_by_device_id = 8 [(w17.field) = { type: UUID, null: true }];
}
message CreateCliAuthCodeResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  CliAuthCode code = 1;
}

message ConsumeCliAuthCodeReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string code_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message ConsumeCliAuthCodeResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  // The approving user + the bound PKCE challenge for the handler to verify
  // the verifier against. Empty user_id = no live code matched (unknown /
  // expired / already-consumed).
  string user_id        = 1;
  string code_challenge = 2;
  // The redirect this code was issued for. The exchange compares it against
  // the one the caller presents — blank means a code from before that binding
  // existed, and there is nothing to compare.
  string redirect_uri   = 3;
  // The registered client the code belongs to. NON-BLANK means the exchange
  // must present that client's secret; blank is a loopback code, where there
  // is no client to authenticate and PKCE is the binding.
  string client_id      = 4;
  // The approving session's expiry: CliToken mints no later than this.
  // NULL (unset) = that session never expires, or the code predates the
  // column — the normal session TTL applies. Declared so a SQL NULL scans.
  google.protobuf.Timestamp session_expires_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  // The approving session's device; CliToken records it on the CLI session.
  // NULL (empty) when it had none. Declared so a SQL NULL scans.
  string approved_by_device_id = 6 [(w17.field) = { type: UUID, null: true }];
}

// ── org_membership mutation request/response messages ───────
//
// Write primitives for the multi-org model: create an Organization
// and link a User to one via OrgMembership. The symmetric counterpart
// to CreateUser — a project composes them (create org → add the
// creator as owner) in its own handler/subscriber, atomically via
// distx exactly like SignUp composes CreateUser + IssueToken. There is
// no plugin-provided turnkey business RPC and no create/invite REST
// preset: org administration is the consuming project's web/admin
// surface (auth-cli-login-and-orgs.md §"No org administration in
// w17ctl"), not something the plugin bakes in. All gated
// `org_membership`.
message CreateOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string slug = 1 [(w17.field) = { type: SLUG, max_len: 64, unique: true }];
  string name = 2 [(w17.field) = { type: CHAR, max_len: 128 }];
  // kind groups the org for a CLI picker: "private" (personal) or
  // "company". Free-form (mirrors the Organization.kind column).
  string kind = 3 [(w17.field) = { type: CHAR, max_len: 32, blank: true }];
}
message CreateOrganizationResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  Organization organization = 1;
}

message AddOrgMembershipReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string org_id  = 2 [(w17.field) = { type: UUID }];
  // role: owner | admin | member. Free-form CHAR — project policy owns
  // the vocabulary; the plugin passes it through (mirrors OrgMembership.role).
  string role    = 3 [(w17.field) = { type: CHAR, max_len: 100 }];
  // kind — the kind of membership (membership_kinds); '' = none.
  string kind = 4 [
    (w17.field) = { type: CHAR, max_len: 32, blank: true },
    (w17.contrib.plugin_feature_field) = "membership_kinds"
  ];
}
message AddOrgMembershipResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  OrgMembership membership = 1;
}

// Org admin removals — back the Organizations page's `delete` and
// AuthService.RemoveOrgMembership (the OrgMemberships page's `delete`). Both
// are state changes: nothing is deleted. Requests key on a bare `id` field so
// the admin detail id-stamp resolves against it regardless of the model name;
// the responses echo the domain id for the emitted event payload. Gated
// org_membership.
message DeleteOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
}
message DeleteOrganizationResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1;
}

// MarkOrgMembershipRemoved — was DeleteOrgMembership.
message MarkOrgMembershipRemovedReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
  // removed_by — the account removing the member, stamped on the membership
  // and on the grants revoked with it. Empty = nobody named (NULL).
  string removed_by = 2 [(w17.field) = { type: UUID, null: true }];
}
message MarkOrgMembershipRemovedResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  string membership_id = 1;
}

// UpdateOrganization — edit an org's descriptive fields. `slug` is
// included because it is the org's human handle and orgs are
// operator-provisioned; it stays unique-checked at the DB level.
// Gated org_membership.
message UpdateOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id   = 1 [(w17.field) = { type: UUID }];
  string slug = 2 [(w17.field) = { type: SLUG, max_len: 64 }];
  string name = 3 [(w17.field) = { type: CHAR, max_len: 128 }];
  string kind = 4 [(w17.field) = { type: CHAR, max_len: 32, blank: true }];
}
message UpdateOrganizationResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1;
}

// UpdateOrgMembership — change a member's role within an org. Only
// the role is mutable: moving a membership to a different user or org is
// a delete + re-add, not an edit (the unique (user_id, org_id) index
// makes an in-place move a silent constraint trap). Gated
// org_membership.
//
// Takes the role by ID, the one AuthService.UpdateOrgMembershipRole held to
// the role ceiling. By name, the role checked and the role granted were two
// lookups apart: a rename of two roles in between would grant the other one.
// The membership's label is written from that role's current name.
message UpdateOrgMembershipReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id      = 1 [(w17.field) = { type: UUID }];
  reserved 2;
  reserved "role";
  string role_id = 3 [(w17.field) = { type: UUID }];
  // changed_by — the account changing the role, stamped as revoked_by on the
  // grants the change replaces. Empty = nobody named (NULL).
  string changed_by = 4 [(w17.field) = { type: UUID, null: true }];
}
message UpdateOrgMembershipResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  string membership_id = 1;
}

// RevokeUserToken — an operator revokes one token (the admin Sessions page's
// `revoke` action, through AuthService.RevokeSessions, which stamps the
// operator as revoked_by). Gated user_admin.
message RevokeUserTokenReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id = 1 [(w17.field) = { type: UUID }];
  string revoked_by = 2 [(w17.field) = { type: UUID }];
  // event-only (no w17.field: not persisted, not validated): the key
  // thumbprint of the operator's device, UserTokenRevoked's device_id.
  string thumbprint = 3;
}
message RevokeUserTokenResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  string token_id = 1;
}

// AuthMutation — write primitives. Each method emits exactly
// one event (event_emit annotations land in a follow-up commit
// alongside the events/ catalogue).
// ── org_invite messages ─────────────────────────────────────

message CreateOrgInviteReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string org_id     = 1 [(w17.field) = { type: UUID }];
  // `null: true` because an OPEN invitation names no address — whoever holds the
  // link picks their own. Same shape and same reason as `IssueTokenReq.device_id`:
  // without it the generated request validation makes the field REQUIRED, and the
  // first open invite fails with REQUIRED_VIOLATION.
  string email      = 2 [(w17.field) = { type: EMAIL, max_len: 320, null: true }];
  string role       = 3 [(w17.field) = { type: SLUG, max_len: 100 }];
  string invited_by = 4 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp expires_at = 5 [(w17.field) = { type: DATETIME }];
  // sha256 hex of the link's token. The plaintext never arrives here — the
  // handler mints it, hashes it, and hands the plaintext back to the inviter once.
  string token_hash = 6 [(w17.field) = { type: CHAR, max_len: 128 }];
  // Opaque, consumer-owned — see OrgInvite.metadata. Stored as given and never read
  // by this plugin.
  string metadata   = 7 [(w17.field) = { type: JSON, blank: true }];
  // See OrgInvite.role_snapshot.
  string role_snapshot = 8 [(w17.field) = { type: TEXT, blank: true }];
  // kind — the kind of membership accepting creates (membership_kinds).
  string kind = 9 [
    (w17.field) = { type: CHAR, max_len: 32, blank: true },
    (w17.contrib.plugin_feature_field) = "membership_kinds"
  ];
}
message CreateOrgInviteResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  OrgInvite invite = 1;
}

// CloseExpiredOrgInvite — was ClearExpiredOrgInvite.
message CloseExpiredOrgInviteReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string org_id = 1 [(w17.field) = { type: UUID }];
  string email  = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message CloseExpiredOrgInviteResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  string id = 1;
}

// BindOpenOrgInviteReq — registration through an OPEN invitation's link binds
// the invitation to the registering address. The link was read-only at
// registration, so one open link registered any number of accounts until
// somebody accepted it — under `invite_only` a way to create accounts. Bound,
// it lets in that address only; acceptance by that account is unchanged.
message BindOpenOrgInviteReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string token_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
  string email      = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message BindOpenOrgInviteResp {
  option (w17.contrib.plugin_feature) = "org_invite";
}

message ConsumeOrgInviteByTokenReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  // sha256 hex of the token the link carried. The plaintext never reaches the
  // database, the same way it never does for a password reset.
  string token_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
  // event-only (no w17.field → not persisted, not validated): the account
  // accepting, which OrgInviteAccepted names and the row does not hold.
  string user_id = 2;
}
message ConsumeOrgInviteByTokenResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  // The invitation spent — OrgInviteAccepted names it.
  string invite_id = 6;
  // Populated on a successful claim. Nothing matched — expired, already spent, or
  // never there — arrives as NOT_FOUND, because the statement carries RETURNING and
  // the generated write reports zero rows as an error. One answer for all three
  // causes, so somebody trying tokens learns nothing from the difference.
  string org_id = 1;
  string role   = 2;
  // NULL/empty = the invitation was OPEN. This is the fact the acceptance cannot
  // ask for afterwards, and the only one that licenses a derived email proof.
  string email  = 3;
  // Handed back out of the SAME statement that spends the invitation, which is the
  // half a side table joined on the e-mail cannot give: the consumer's pairing and
  // the acceptance either both happen or neither does.
  string metadata = 4;
  // What the inviter was checked against — accept refuses a role that has
  // moved past it. See OrgInvite.role_snapshot.
  string role_snapshot = 5;
  // The kind of membership the invitation creates (membership_kinds).
  string kind = 7 [(w17.contrib.plugin_feature_field) = "membership_kinds"];
}

// CloseOrgInvitesOfOrg — the invitations of an organization being deleted
// (AuthService.RemoveOrganization).
message CloseOrgInvitesOfOrgReq {
  option (w17.contrib.plugin_feature) = "org_invite";
