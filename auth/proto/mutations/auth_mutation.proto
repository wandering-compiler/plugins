service AuthMutation {
  // CreateUser — INSERT User. The `password_hash` request
  // field carries the already-encoded hash — the plugin's
  // AuthService.SignUp handler computes it via
  // passwordhash.Settings.Hash() before calling. Refuses on
  // duplicate email (unique violation surfaces as
  // AlreadyExists via the storage DB-error classification).
  //
  // ONE create for every activation. `tenant_scope` adds a NOT NULL
  // `User.tenant_id`, and the gated SET assignment below writes it, so
  // the feature no longer has to REPLACE this method.
  //
  // It used to. The feature filter could not splice a column into a
  // fixed INSERT, so `tenant_scope` gated this rpc OUT
  // (`plugin_feature_rpc_unless`) and a twin — CreateUserWithTenant —
  // took over. That duplication cost an event: an event has exactly one
  // emit site, the baseline owned it, and the baseline was the one being
  // filtered away, so with `tenant_scope` on `UserCreated` had NO
  // emitter and every subscriber to auth.user.created silently never
  // fired.
  // CreateBot — insert a machine account. kind = BOT (1), no password.
  rpc CreateBotUser(CreateBotUserReq) returns (CreateBotUserResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.User SET "
          "email = :email, "
          "password_hash = \'!\', "
          "kind = 1, "
          "?feature(tenant_scope) tenant_id = :tenant_id "
          "RETURNING id AS user.id, "
          "          email AS user.email, "
          "          created_at AS user.created_at"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  rpc CreateUser(CreateUserReq) returns (CreateUserResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.User SET "
          "email = :email, "
          "password_hash = :password_hash, "
          "?feature(tenant_scope) tenant_id = :tenant_id "
          "RETURNING id AS user.id, "
          "          email AS user.email, "
          "          password_hash AS user.password_hash, "
          "          created_at AS user.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "UserCreated"
      payload: {
        fields: [
          { key: "user_id",    value: "$response.user.id" },
          { key: "email",      value: "$response.user.email" },
          { key: "created_at", value: "$response.user.created_at" }
        ]
      }
    };
  }


  // IssueToken — INSERT UserToken. The handler mints the token and
  // passes only its sha256 (token_hash); the token itself is never
  // stored.
  //
  // One statement. It used to sweep the user's expired sessions first, in
  // the same transaction; that sweep is gone because nothing in the auth
  // tables is deleted: an expired token is history like a revoked one, and
  // every lookup refuses it by its expires_at.
  rpc IssueToken(IssueTokenReq) returns (IssueTokenResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.UserToken SET "
          "user_id = :user_id, "
          "token_hash = :token_hash, "
          "expires_at = :expires_at, "
          "device_id = :device_id, "
          "public_computer = :public_computer, "
          "approved_by_device_id = :approved_by_device_id "
          "RETURNING id AS token.id, "
          "          user_id AS token.user_id, "
          "          device_id AS token.device_id, "
          "          public_computer AS token.public_computer, "
          "          approved_by_device_id AS token.approved_by_device_id, "
          "          created_at AS token.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "TokenIssued"
      payload: {
        fields: [
          { key: "token_id",  value: "$response.token.id" },
          { key: "user_id",   value: "$response.token.user_id" },
          { key: "issued_at", value: "$response.token.created_at" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // RevokeToken — revoke the token presented (by its hash, or the legacy
  // clear token): stamps revoked_at with reason TOKEN_REVOKED, revoked_by
  // NULL (project code, no actor). The row stays. Guarded on
  // `revoked_at IS NULL`, so a token already revoked keeps its first
  // revocation and matches no row (NotFound — the caller's "already done").
  //
  // Token rotation is not a single-RPC primitive — consumer
  // composes it as GetUserByToken → RevokeToken → IssueToken
  // (3 calls, ~3 lines). DQL doesn't pass results between
  // query/mutation ops in the same RPC, so atomic rotation
  // can't be expressed in the current DSL; the time gap
  // between old-invalid and new-issued is irrelevant for
  // bearer-token semantics.
  // Does NOT emit TokenRevoked: the eventbus allows one emit site per
  // event, and RevokeSessionToken (the live, handler-driven logout path)
  // owns it. RevokeToken is an uncalled low-level primitive — emitting
  // here would be dead (never fires) and, in its documented rotation use,
  // a misleading "revoked" signal for what is really a rotation. The
  // RETURNING ids stay for the caller's response.
  rpc RevokeToken(RevokeTokenReq) returns (RevokeTokenResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoke_reason = 10 "
          "WHERE (token_hash = :token_hash OR token = :legacy_token) AND revoked_at IS NULL "
          "RETURNING id AS token_id, user_id"
      }
    };
  }

  // UpgradeTokenHash — moves a legacy UserToken row (token in the clear,
  // minted before the hash) to token_hash and clears the clear copy. The
  // lookups find a legacy row by its token and report an empty
  // stored_token_hash; the caller then runs this. Guarded on token_hash IS
  // NULL, so a second run, or a race with another request presenting the
  // same token, changes nothing.
  rpc UpgradeTokenHash(UpgradeTokenHashReq) returns (UpgradeTokenHashResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:  "UPDATE @module.UserToken SET token_hash = :token_hash, token = NULL WHERE token = :legacy_token AND token_hash IS NULL"
      }
    };
  }

  // TouchTokenLastUsed — record that a token was just presented, at most
  // once a minute per token. The window is enforced HERE, in the WHERE: a
  // burst of concurrent requests on one token all pass the handler's
  // pre-check (it reads last_used_at off the lookup), and only the first
  // UPDATE to commit still matches — the rest match nothing and write
  // nothing. The stamp (:used_at) and :cutoff (used_at minus the window)
  // both come from the caller's clock: the DQL has no interval arithmetic,
  // and comparing an app-clock cutoff against a database-NOW() stamp would
  // let app/DB skew shrink the window to nothing (every request writing).
  // One clock keeps the window a minute; instances that disagree shift it
  // by their skew at most. No RETURNING: a throttled touch matches
  // no row, and that is no failure. Gated api_token (last_used_at is its
  // column).
  rpc TouchTokenLastUsed(TouchTokenLastUsedReq) returns (TouchTokenLastUsedResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET last_used_at = :used_at "
          "WHERE id = :token_id AND (last_used_at IS NULL OR last_used_at < :cutoff)"
      }
    };
  }

  // SetBotAllowedCidrs — see the request. Gated bot_token_guard.
  rpc SetBotAllowedCidrs(SetBotAllowedCidrsReq) returns (SetBotAllowedCidrsResp) {
    option (w17.contrib.plugin_feature_rpc) = "bot_token_guard";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET allowed_cidrs = :allowed_cidrs "
          "WHERE id = :user_id AND kind = 1 "
          "RETURNING id, allowed_cidrs"
      }
    };
    option (w17.event_emit) = {
      event: "BotAllowlistChanged"
      payload: {
        fields: [
          { key: "user_id",       value: "$response.id" },
          { key: "allowed_cidrs", value: "$response.allowed_cidrs" },
          { key: "changed_by",    value: "$request.changed_by" },
          { key: "device_id",     value: "$request.thumbprint" }
        ]
      }
    };
  }

  // RecordBotTokenUse — the use summary's upsert: a new combination is a
  // new row, a known one moves its last_used_at. Throttled by the caller
  // (once a minute per combination and process). Gated bot_token_guard.
  rpc RecordBotTokenUse(RecordBotTokenUseReq) returns (RecordBotTokenUseResp) {
    option (w17.contrib.plugin_feature_rpc) = "bot_token_guard";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.BotTokenUse SET "
          "token_id = :token_id, user_id = :user_id, address = :address, surface = :surface, method = :method, "
          "first_used_at = :used_at, last_used_at = :used_at "
          "ON CONFLICT (token_id, address, surface, method) DO UPDATE SET last_used_at = :used_at"
      }
    };
  }

  // RevokeSessionToken — base-tier logout primitive (gated
  // authenticate_turnkey). Revoke-by-id, OWNERSHIP guarded (id AND
  // user_id) so a caller revokes only their own token; the holder is the
  // actor (revoked_by = user_id), the reason LOGOUT. The row stays. This
  // is the SOLE TokenRevoked emit site (the live logout path) so cache-
  // invalidation subscribers react on logout; RevokeToken does not emit.
  // Idempotent: an already revoked token matches no row (`revoked_at IS
  // NULL`), keeps its first revocation and emits nothing.
  //
  // The DQL deliberately does NOT filter on token_type — that
  // column is gated by the `api_token` feature, so referencing it here (a
  // base-tier authenticate_turnkey mutation) breaks typecheck on the
  // default config where api_token is off and the column doesn't exist.
  // The type guard is unnecessary anyway: the Logout handler sources
  // token_id from the resolved session_token_id in the auth envelope
  // (callerSessionTokenID), which is populated ONLY for SESSION bearers
  // (an API-token bearer yields "" → idempotent no-op), so token_id is
  // always a session token. The retained req.token_type field is unused by
  // the DQL (kept for wire stability + the handler's explicit intent).
  rpc RevokeSessionToken(RevokeSessionTokenReq) returns (RevokeSessionTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "authenticate_turnkey";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :user_id, revoke_reason = 1 "
          "WHERE id = :token_id AND user_id = :user_id AND revoked_at IS NULL "
          "RETURNING id AS token_id, user_id"
      }
    };
    option (w17.event_emit) = {
      event: "TokenRevoked"
      payload: {
        fields: [
          { key: "token_id", value: "$response.token_id" },
          { key: "user_id",  value: "$response.user_id" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // api_token mutations — issue / revoke API tokens + their
  // permission subset rows. Composed by the AuthService handlers
  // (apitoken.go) behind the bearer-session scope.
  // ────────────────────────────────────────────────────────────

  // IssueApiToken — INSERT an API UserToken (token_type stamped by
  // the handler) with an optional label, bound to the Device of the key the
  // request named (device_id) and recording the creator's device
  // (approved_by_device_id). A machine account's bearer token
  // (device/bot-bearer) is the one row with no device and bearer TRUE,
  // written under service_account only. The handler mints the token and passes only its
  // sha256. Gated api_token.
  rpc IssueApiToken(IssueApiTokenReq) returns (IssueApiTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.UserToken SET "
          "user_id = :user_id, "
          "token_hash = :token_hash, "
          "token_type = :token_type, "
          "name = :name, "
          "expires_at = :expires_at, "
          "device_id = :device_id, "
          "approved_by_device_id = :approved_by_device_id, "
          "?feature(service_account) bearer = :bearer "
          "RETURNING id AS token.id, "
          "          user_id AS token.user_id, "
          "          token_type AS token.token_type, "
          "          name AS token.name, "
          "          created_at AS token.created_at, "
          "          expires_at AS token.expires_at, "
          "          device_id AS token.device_id, "
          "          approved_by_device_id AS token.approved_by_device_id"
      }
    };
    option (w17.event_emit) = {
      event: "ApiTokenCreated"
      payload: {
        fields: [
          { key: "token_id",       value: "$response.token.id" },
          { key: "user_id",        value: "$response.token.user_id" },
          { key: "created_at",     value: "$response.token.created_at" },
          { key: "name",           value: "$response.token.name" },
          { key: "key_thumbprint", value: "$request.key_thumbprint" },
          { key: "created_by",     value: "$request.created_by" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // AddTokenPermission — INSERT a TokenPermission subset row.
  // Composite-unique (token_id, permission_id). Gated api_token.
  rpc AddTokenPermission(AddTokenPermissionReq) returns (AddTokenPermissionResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.TokenPermission SET "
          "token_id = :token_id, "
          "permission_id = :permission_id "
          "RETURNING id AS token_permission.id, "
          "          token_id AS token_permission.token_id, "
          "          permission_id AS token_permission.permission_id, "
          "          created_at AS token_permission.created_at"
      }
    };
  }

  // MarkApiTokenRevoked — revoke the caller's own API token (ownership +
  // realm guarded: id AND user_id AND token_type all match, so a
  // bearer can't revoke another user's token or a session token via
  // this path). The owner is the actor, the reason API_TOKEN_REVOKED;
  // the row stays, and so do its TokenPermission subset rows — the token
  // they narrow is refused anyway, and they record what it could do.
  // Idempotent: an already revoked token matches no row. Gated api_token.
  rpc MarkApiTokenRevoked(MarkApiTokenRevokedReq) returns (MarkApiTokenRevokedResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :user_id, revoke_reason = 2 "
          "WHERE id = :token_id AND user_id = :user_id AND token_type = :token_type AND revoked_at IS NULL "
          "RETURNING id AS token_id"
      }
    };
  }

  // RevokeApprovedApiTokens — revoke (reason DEVICE_REVOKED, the caller as
  // revoked_by) the owner's live API tokens the device CREATED
  // (approved_by_device_id). A stolen browser session can create an API token
  // bound to the thief's own key; revoking that device explicitly must end
  // it, as it ends the CLI sessions the device approved. Called only when ONE
  // device is revoked on purpose (RevokeDevice, the admin RevokeDevices) —
  // never by RevokeOtherDevices / RevokeAllDevices, which spare API tokens
  // (devices/revoke-all-spares-api-tokens). Owner-guarded like
  // RevokeDeviceTokens, first revocation stands, no RETURNING. Gated
  // api_token.
  rpc RevokeApprovedApiTokens(RevokeApprovedApiTokensReq) returns (RevokeApprovedApiTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :revoked_by, revoke_reason = 5 "
          "WHERE user_id = :user_id AND approved_by_device_id = :device_id AND token_type = :token_type AND revoked_at IS NULL"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // oauth mutation — link a User to an external IdP subject.
  // ────────────────────────────────────────────────────────────

  // CreateOAuthIdentity — INSERT the User↔subject link on first OAuth
  // sign-in. Composite-unique (provider_id, external_id). Gated oauth.
  rpc CreateOAuthIdentity(CreateOAuthIdentityReq) returns (CreateOAuthIdentityResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.OAuthIdentity SET "
          "user_id = :user_id, "
          "provider_id = :provider_id, "
          "external_id = :external_id, "
          "email = :email "
          "RETURNING id AS identity.id, "
          "          user_id AS identity.user_id, "
          "          provider_id AS identity.provider_id, "
          "          external_id AS identity.external_id, "
          "          email AS identity.email, "
          "          created_at AS identity.created_at"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // two_factor mutations — TOTP enrollment lifecycle + MFA
  // challenge create/consume. All gated `two_factor`.
  // ────────────────────────────────────────────────────────────

  // CreateTotpSecret — INSERT a TOTP secret (confirmed_at NULL until the
  // first code verifies). One live secret per user (unique (user_id,
  // ended_key), ended_key '' on the live row) → re-enroll refuses with
  // AlreadyExists (the handler revokes the old one first to rotate). Emits
  // TotpEnrolled.
  rpc CreateTotpSecret(CreateTotpSecretReq) returns (CreateTotpSecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.UserTotpSecret SET "
          "user_id = :user_id, "
          "seed = :seed "
          "RETURNING id AS secret.id, "
          "          user_id AS secret.user_id, "
          "          confirmed_at AS secret.confirmed_at, "
          "          created_at AS secret.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "TotpEnrolled"
      payload: {
        fields: [
          { key: "user_id",     value: "$response.secret.user_id" },
          { key: "enrolled_at", value: "$response.secret.created_at" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // ConfirmTotpSecret — mark the user's TOTP confirmed (the first code
  // verified). Now the user "has an authenticator". Emits TotpConfirmed.
  rpc ConfirmTotpSecret(ConfirmTotpSecretReq) returns (ConfirmTotpSecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "confirmed_at = NOW() "
          "WHERE user_id = :user_id AND revoked_at IS NULL "
          "RETURNING user_id"
      }
    };
    option (w17.event_emit) = {
      event: "TotpConfirmed"
      payload: {
        fields: [
          { key: "user_id",   value: "$response.user_id" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // UpsertOAuthProvider — create or rewrite the provider named `name`,
  // with its secret encrypted (see UpsertOAuthProviderReq). Idempotent: the
  // same request twice leaves one row with the same settings. No event:
  // provider configuration is an operator's, not a user's, change.
  rpc UpsertOAuthProvider(UpsertOAuthProviderReq) returns (UpsertOAuthProviderResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.OAuthProvider SET "
          "name = :name, "
          "display_name = :display_name, "
          "client_id = :client_id, "
          "secret = :secret, "
          "client_secret = NULL, "
          "authorize_url = :authorize_url, "
          "token_url = :token_url, "
          "userinfo_url = :userinfo_url, "
          "scopes = :scopes, "
          "subject_path = :subject_path, "
          "email_path = :email_path, "
          "enabled = :enabled, "
          "?feature(tenant_scope) tenant_id = :tenant_id "
          "ON CONFLICT (name) DO UPDATE SET "
          "display_name = :display_name, "
          "client_id = :client_id, "
          "secret = :secret, "
          "client_secret = NULL, "
          "authorize_url = :authorize_url, "
          "token_url = :token_url, "
          "userinfo_url = :userinfo_url, "
          "scopes = :scopes, "
          "subject_path = :subject_path, "
          "email_path = :email_path, "
          "enabled = :enabled "
          "RETURNING id"
      }
    };
  }

  // MoveOAuthProviderSecret — store a legacy plaintext client_secret in
  // `secret` and clear it. No event: the provider's configuration is the same.
  rpc MoveOAuthProviderSecret(MoveOAuthProviderSecretReq) returns (MoveOAuthProviderSecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OAuthProvider SET "
          "secret = :secret, "
          "client_secret = NULL "
          "WHERE id = :id AND client_secret = :legacy "
          "RETURNING id"
      }
    };
  }

  // ClearOAuthProviderLegacySecret — drop the plaintext copy of a provider
  // whose encrypted `secret` is set (a fixture re-seeds the legacy column).
  rpc ClearOAuthProviderLegacySecret(ClearOAuthProviderLegacySecretReq) returns (ClearOAuthProviderLegacySecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OAuthProvider SET "
          "client_secret = NULL "
          "WHERE id = :id "
          "RETURNING id"
      }
    };
  }

  // MoveTotpSeed — store a legacy seed in `seed` and clear `secret`, so the
  // old key is needed for this row exactly once. No event: nothing about the
  // user's authenticator changed.
  rpc MoveTotpSeed(MoveTotpSeedReq) returns (MoveTotpSeedResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "seed = :seed, "
          "secret = NULL "
          "WHERE id = :id AND user_id = :user_id AND revoked_at IS NULL "
          "RETURNING user_id"
      }
    };
  }

  // ClaimTotpStep — the replay guard. One conditional UPDATE, so of two
  // requests presenting the same code only one gets a row back.
  rpc ClaimTotpStep(ClaimTotpStepReq) returns (ClaimTotpStepResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "last_step = :step "
          "WHERE id = :id AND last_step < :step AND revoked_at IS NULL "
          "RETURNING id"
      }
    };
  }

  // RecordStepUpAttempt — count a step-up guess, refusing (no row back)
  // while the step-up is locked. One statement, so concurrent guesses get
  // distinct counts and a lock is never raced past.
  rpc RecordStepUpAttempt(RecordStepUpAttemptReq) returns (RecordStepUpAttemptResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "stepup_attempts = stepup_attempts + 1 "
          "WHERE id = :id AND (stepup_locked_until IS NULL OR stepup_locked_until < NOW()) AND revoked_at IS NULL "
          "RETURNING stepup_attempts AS attempts"
      }
    };
  }
  rpc LockStepUp(LockStepUpReq) returns (LockStepUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "stepup_attempts = 0, "
          "stepup_locked_until = :until "
          "WHERE id = :id "
          "RETURNING id"
      }
    };
  }
  rpc ResetStepUp(ResetStepUpReq) returns (ResetStepUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET "
          "stepup_attempts = 0 "
          "WHERE id = :id "
          "RETURNING id"
      }
    };
  }

  // CreateRecoveryCode / RevokeRecoveryCodes — the handler replaces a user's
  // set (revoke the unused codes, then ten inserts) inside one transaction.
  rpc CreateRecoveryCode(CreateRecoveryCodeReq) returns (CreateRecoveryCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.UserRecoveryCode SET "
          "user_id = :user_id, "
          "code_hash = :code_hash "
          "RETURNING id"
      }
    };
  }
  // RevokeRecoveryCodes — a used code keeps its used_at; every unused one
  // gets revoked_at and verifies nothing from then on. No RETURNING: a user
  // with no codes is not an error.
  rpc RevokeRecoveryCodes(RevokeRecoveryCodesReq) returns (RevokeRecoveryCodesResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserRecoveryCode SET revoked_at = NOW() "
          "WHERE user_id = :user_id AND used_at IS NULL AND revoked_at IS NULL"
      }
    };
  }

  // ConsumeRecoveryCode — spend one code, atomically single-use. Emits
  // RecoveryCodeUsed so a consumer can tell the person (a code they did not
  // use being spent means someone has their password AND their codes).
  rpc ConsumeRecoveryCode(ConsumeRecoveryCodeReq) returns (ConsumeRecoveryCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserRecoveryCode SET "
          "used_at = NOW() "
          "WHERE user_id = :user_id AND code_hash = :code_hash AND used_at IS NULL AND revoked_at IS NULL "
          "RETURNING id, user_id"
      }
    };
    option (w17.event_emit) = {
      event: "RecoveryCodeUsed"
      payload: {
        fields: [
          { key: "user_id",   value: "$response.user_id" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // RevokeTotpSecret — disable the built-in authenticator, or end it before
  // a new enrolment replaces it. The row stays: revoked_at is stamped, the
  // seed and the legacy secret are cleared (a revoked authenticator's seed is
  // not kept at rest), and ended_key takes the row's id so the user can enrol
  // again. Guarded on `revoked_at IS NULL`: with no live authenticator it
  // matches nothing (NotFound, which the handler reads as done). Emits
  // TotpDisabled.
  rpc RevokeTotpSecret(RevokeTotpSecretReq) returns (RevokeTotpSecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserTotpSecret SET revoked_at = NOW(), ended_key = id, seed = NULL, secret = NULL "
          "WHERE user_id = :user_id AND revoked_at IS NULL "
          "RETURNING user_id"
      }
    };
    option (w17.event_emit) = {
      event: "TotpDisabled"
      payload: {
        fields: [
          { key: "user_id",   value: "$response.user_id" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // CreateMfaChallenge — INSERT a pending challenge (code_hash empty for
  // the TOTP path; set for the event/fallback path). The INSERT binds
  // only :user_id + :code_hash; the request's event-only fields
  // (totp_enrolled / email / code / expires_at) feed the emit. Emits
  // MfaChallengeRequested on EVERY challenge — the keystone hook a hand-
  // written subscriber reads (totp_enrolled true → stay passive; false →
  // deliver `code` over SMS/e-mail).
  rpc CreateMfaChallenge(CreateMfaChallengeReq) returns (CreateMfaChallengeResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.MfaChallenge SET "
          "user_id = :user_id, "
          "code_hash = :code_hash, "
          "thumbprint = :thumbprint, "
          "public_computer = :public_computer "
          "RETURNING id AS challenge.id, "
          "          user_id AS challenge.user_id, "
          "          code_hash AS challenge.code_hash, "
          "          consumed_at AS challenge.consumed_at, "
          "          created_at AS challenge.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "MfaChallengeRequested"
      payload: {
        fields: [
          { key: "user_id",       value: "$response.challenge.user_id" },
          { key: "challenge_id",  value: "$response.challenge.id" },
          { key: "totp_enrolled", value: "$request.totp_enrolled" },
          { key: "email",         value: "$request.email" },
          { key: "code",          value: "$request.code" },
          { key: "expires_at",    value: "$request.expires_at" },
          { key: "device_id",     value: "$request.thumbprint" }
        ]
      }
    };
  }

  // ── sign_up_confirmation ─────────────────────────────────────
  //
  // CreatePendingSignUp parks a registration and emits the code for delivery.
  rpc CreatePendingSignUp(CreatePendingSignUpReq) returns (CreatePendingSignUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_confirmation";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.PendingSignUp SET "
          "email = :email, "
          "password_hash = :password_hash, "
          "code_hash = :code_hash, "
          "expires_at = :expires_at, "
          "?feature(tenant_scope) tenant_id = :tenant_id "
          "RETURNING id AS pending.id, "
          "          email AS pending.email, "
          "          expires_at AS pending.expires_at, "
          "          created_at AS pending.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "SignUpConfirmationRequested"
      payload: {
        fields: [
          { key: "pending_id", value: "$response.pending.id" },
          { key: "email",      value: "$request.email" },
          { key: "code",       value: "$request.code" },
          { key: "expires_at", value: "$request.expires_at" }
        ]
      }
    };
  }

  // RecordPendingSignUpAttempt — claim one guess; see its request message.
  // `expires_at > NOW()` in the WHERE, so an expired row answers like a
  // missing one and nothing has to sweep the table, and a claimed or
  // superseded row answers the same way.
  rpc RecordPendingSignUpAttempt(RecordPendingSignUpAttemptReq) returns (RecordPendingSignUpAttemptResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_confirmation";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PendingSignUp SET "
          "attempts = attempts + 1 "
          "WHERE id = :pending_id AND claimed_at IS NULL AND superseded_at IS NULL AND expires_at > NOW() "
          "RETURNING attempts AS attempts, code_hash AS code_hash, email AS email"
      }
    };
  }

  // ClaimPendingSignUp — spend the registration: one guarded UPDATE, so of
  // two confirmations racing on one row exactly one gets it back (the other
  // matches nothing: NotFound). The row stays, with claimed_at.
  rpc ClaimPendingSignUp(ClaimPendingSignUpReq) returns (ClaimPendingSignUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_confirmation";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PendingSignUp SET claimed_at = NOW() "
          "WHERE id = :pending_id AND claimed_at IS NULL AND superseded_at IS NULL AND expires_at > NOW() "
          "RETURNING email AS email, password_hash AS password_hash, "
          "?feature(tenant_scope) tenant_id AS tenant_id"
      }
    };
  }

  // SupersedePendingSignUpsForEmail — end the address's other open
  // registrations once one became the account. The claimed row is excluded by
  // its claimed_at. No RETURNING: none left is not an error.
  rpc SupersedePendingSignUpsForEmail(SupersedePendingSignUpsForEmailReq) returns (SupersedePendingSignUpsForEmailResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_confirmation";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PendingSignUp SET superseded_at = NOW() "
          "WHERE email = :email AND claimed_at IS NULL AND superseded_at IS NULL"
      }
    };
  }

  // ErasePendingSignUpAddress — the erasure of an address's pending
  // registrations: an open one is ended first (superseded_at), then every
  // one of them takes the placeholder address and the unusable `!` for both
  // hashes (no password or code verifies against it). The rows stay. No
  // RETURNING: an address with no registrations is not an error.
  rpc ErasePendingSignUpAddress(ErasePendingSignUpAddressReq) returns (ErasePendingSignUpAddressResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_confirmation";
    option (w17.db.method) = {
      ops: {
        name: "open"
        dql:
          "UPDATE @module.PendingSignUp SET superseded_at = NOW() "
          "WHERE email = :email AND claimed_at IS NULL AND superseded_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PendingSignUp SET email = :placeholder, password_hash = \'!\', code_hash = \'!\' "
          "WHERE email = :email"
      }
    };
  }

  // ConsumeMfaChallenge — mark a challenge used (single-use guard:
  // consumed_at IS NULL). RETURNING user_id is the proof of an actual
  // consume (empty → already used / not found). Emits MfaVerified.
  rpc ConsumeMfaChallenge(ConsumeMfaChallengeReq) returns (ConsumeMfaChallengeResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.MfaChallenge SET "
          "consumed_at = NOW() "
          "WHERE id = :challenge_id AND consumed_at IS NULL "
          "RETURNING id AS challenge_id, user_id"
      }
    };
    option (w17.event_emit) = {
      event: "MfaVerified"
      payload: {
        fields: [
          { key: "challenge_id", value: "$response.challenge_id" },
          { key: "user_id",      value: "$response.user_id" },
          { key: "device_id",    value: "$request.thumbprint" }
        ]
      }
    };
  }

  // RecordMfaAttempt — atomically increment the challenge's failed-attempt
  // counter (brute-force lockout). Guarded `consumed_at IS NULL` so a consumed
  // challenge isn't bumped; RETURNING the new count. No event (internal
  // brute-force guard, not a user-visible lifecycle step).
  rpc RecordMfaAttempt(RecordMfaAttemptReq) returns (RecordMfaAttemptResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.MfaChallenge SET "
          "attempts = attempts + 1 "
          "WHERE id = :challenge_id AND consumed_at IS NULL "
          "RETURNING attempts AS attempts"
      }
    };
  }

  // SupersedePendingMfaChallenges — retire every still-pending challenge
  // of a user, so issuing a new one leaves exactly one live code. Without
  // it, N sign-ins leave N codes alive, each with its own attempt budget,
  // and the budget on any one of them bounds nothing.
  //
  // NO RETURNING, deliberately. Zero rows is the ORDINARY case — a first
  // sign-in has nothing to supersede — and a mutation carrying RETURNING
  // reports zero rows as a NotFound error, which would turn the common
  // path into a failure. Nothing reads the count, so nothing is lost.
  //
  // No event: this is issuance hygiene, not a user-visible lifecycle step
  // (same reasoning as RecordMfaAttempt). A subscriber that wants "your
  // older code stopped working" derives it from MfaChallengeRequested.
  rpc SupersedePendingMfaChallenges(SupersedePendingMfaChallengesReq) returns (SupersedePendingMfaChallengesResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.MfaChallenge SET "
          "consumed_at = NOW() "
          "WHERE user_id = :user_id AND consumed_at IS NULL"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // device identity mutations — the device every mint binds to
  // (base) + the revoke primitives the device-mgmt RPCs compose
  // (RevokeDeviceTokens / MarkDeviceRevoked base, shared by `devices`
  // and the `user_admin` Devices page; the rest gated `devices`).
  // ────────────────────────────────────────────────────────────


  // RegisterDevice — find or create the (user, thumbprint) Device in ONE
  // statement, and say what it is: a mint binds its token to the returned
  // id, refuses a row with revoked_at set (DEVICE_REVOKED, for good), and
  // reads trusted_at for the new-device second factor. On a conflict the
  // row's last_seen_at / label / ip are refreshed — on a revoked row too, on
  // purpose: a refused attempt from a revoked device is still recorded as
  // seen (it never clears revoked_at). No create-then-re-read race: the
  // unique (user_id, thumbprint) index decides. :thumbprint is never NULL
  // (the request requires it), so a legacy row (NULL thumbprint) is never
  // the conflict target. api_key is written on the INSERT only: whether a key
  // is a program's (Device.api_key) is decided by the request that first
  // named it, and the caller refuses a row of the other kind.
  // CountSignInAttempt — count one SignIn password attempt against the
  // account, BEFORE its password is checked: one statement, so concurrent
  // guesses get distinct counts and none shares a budget. A window older
  // than :cutoff starts over at 1. SET is in this order on purpose: a
  // dialect that reads columns as already updated (MySQL) must see the old
  // window when it decides the count.
  rpc CountSignInAttempt(CountSignInAttemptReq) returns (CountSignInAttemptResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "sign_in_failures = CASE WHEN sign_in_window_at IS NULL OR sign_in_window_at < :cutoff "
          "THEN 1 ELSE sign_in_failures + 1 END, "
          "sign_in_window_at = CASE WHEN sign_in_window_at IS NULL OR sign_in_window_at < :cutoff "
          "THEN :now ELSE sign_in_window_at END "
          "WHERE id = :user_id "
          "RETURNING sign_in_failures AS attempts"
      }
    };
  }
  // CountDeviceSignInAttempt — the same, against the account's live
  // signed-in device of this key. No row = the key never signed in to the
  // account (or its device is revoked, or a program's), and the caller
  // refuses.
  rpc CountDeviceSignInAttempt(CountDeviceSignInAttemptReq) returns (CountDeviceSignInAttemptResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Device SET "
          "sign_in_failures = CASE WHEN sign_in_window_at IS NULL OR sign_in_window_at < :cutoff "
          "THEN 1 ELSE sign_in_failures + 1 END, "
          "sign_in_window_at = CASE WHEN sign_in_window_at IS NULL OR sign_in_window_at < :cutoff "
          "THEN :now ELSE sign_in_window_at END "
          "WHERE user_id = :user_id AND thumbprint = :thumbprint "
          "AND revoked_at IS NULL AND api_key = FALSE "
          "RETURNING sign_in_failures AS attempts"
      }
    };
  }
  // ResetSignInAttempts — a correct password: the account's budget and
  // the signing device's start over. No RETURNING: a device that signs in
  // for the first time has no row yet, and that is no failure.
  rpc ResetSignInAttempts(ResetSignInAttemptsReq) returns (ResetSignInAttemptsResp) {
    option (w17.db.method) = {
      ops: {
        name: "account"
        dql: "UPDATE @module.User SET sign_in_failures = 0, sign_in_window_at = NULL WHERE id = :user_id"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Device SET sign_in_failures = 0, sign_in_window_at = NULL "
          "WHERE user_id = :user_id AND thumbprint = :thumbprint"
      }
    };
  }

  rpc RegisterDevice(RegisterDeviceReq) returns (RegisterDeviceResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.Device SET "
          "user_id = :user_id, "
          "thumbprint = :thumbprint, "
          "label = :label, "
          "ip = :ip, "
          "api_key = :api_key "
          "ON CONFLICT (user_id, thumbprint) DO UPDATE SET "
          "last_seen_at = NOW(), "
          "label = :label, "
          "ip = :ip "
          "RETURNING id AS device.id, "
          "          user_id AS device.user_id, "
          "          thumbprint AS device.thumbprint, "
          "          label AS device.label, "
          "          ip AS device.ip, "
          "          trusted_at AS device.trusted_at, "
          "          last_seen_at AS device.last_seen_at, "
          "          created_at AS device.created_at, "
          "          revoked_at AS device.revoked_at, "
          "          api_key AS device.api_key"
      }
    };
  }

  // RecordSignInEvent — append one row to the sign-in history. The only
  // statement that writes SignInEvent but the erasure's (EraseSignInEvents):
  // the table is append-only. A successful mint calls it inside the
  // transaction that issues the session; a refusal calls it on its own.
  rpc RecordSignInEvent(RecordSignInEventReq) returns (RecordSignInEventResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.SignInEvent SET "
          "user_id = :user_id, "
          "address = :address, "
          "device_id = :device_id, "
          "thumbprint = :thumbprint, "
          "ip = :ip, "
          "user_agent = :user_agent, "
          "method = :method, "
          "outcome = :outcome, "
          "public_computer = :public_computer "
          "RETURNING id AS id"
      }
    };
  }

  // EraseSignInEvents — an erasure's share of the sign-in history: every row
  // of the account, and every row that reached no account but named the
  // erased address, take the placeholder address; their client address and
  // user agent are blanked. The rows stay (method, outcome, time, device key
  // and the account link are not personal data). The ONE update of the
  // append-only table. No RETURNING: an account without history is not an
  // error. Gated user_admin.
  rpc EraseSignInEvents(EraseSignInEventsReq) returns (EraseSignInEventsResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.SignInEvent SET address = :placeholder, ip = \'\', user_agent = \'\' "
          "WHERE user_id = :user_id OR (user_id IS NULL AND address = :email)"
      }
    };
  }

  // TrustDevice — mark the device trusted + refresh last_seen. Called when
  // a sign-in that passed the second factor (VerifyMfa), or renewed trust
  // the device already had (SignIn), completes; the trusted_at it stamps is
  // the signal `two_factor` new-device mode reads to skip the challenge.
  // Matches no row for a revoked device, or when the account's device trust
  // was revoked after :not_revoked_after (see the request): the sign-in
  // then gets its session but no trust.
  rpc TrustDevice(TrustDeviceReq) returns (TrustDeviceResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Device SET "
          "trusted_at = NOW(), "
          "last_seen_at = NOW() "
          "WHERE id = :device_id AND user_id = :user_id AND revoked_at IS NULL "
          "AND NOT EXISTS (SELECT u.id FROM @module.User u "
          "WHERE u.id = :user_id AND u.device_trust_revoked_at > :not_revoked_after) "
          "RETURNING id AS device_id"
      }
    };
  }

  // RevokeDeviceTokens — revoke every token a device holds (the "log out
  // this device" primitive), reason DEVICE_REVOKED, :revoked_by as the actor
  // (the owner for the devices calls, the operator for the admin Devices
  // page). Ownership-guarded by user_id so a caller can't end another user's
  // sessions. Base tier, like MarkDeviceRevoked: `devices` and `user_admin`
  // both compose them. Idempotent. RevokeUndevicedSessions — revoke the user's
  // session tokens that carry no device: rows minted before device binding,
  // which Authenticate already refuses (unbound), so this records their end
  // rather than causes it (reason UNBOUND_SESSION). Tokens bound to a legacy
  // (keyless) Device row are not matched here and are refused at
  // authentication the same way. API tokens are spared — they are not
  // sessions, and are revoked only through RevokeApiToken. Both are guarded
  // on `revoked_at IS NULL` (the first revocation stands) and carry no
  // RETURNING: revoking nothing is no failure.
  rpc RevokeUndevicedSessions(RevokeUndevicedSessionsReq) returns (RevokeUndevicedSessionsResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :user_id, revoke_reason = 6 "
          "WHERE user_id = :user_id AND device_id IS NULL AND id <> :keep_token_id AND revoked_at IS NULL "
          "AND ?feature(api_token) token_type = 1"
      }
    };
  }

  //
  // The "approved" op ends, in the same statement set, the CLI sessions the
  // device APPROVED (cli_login: UserToken.approved_by_device_id) — bound to
  // the CLI's own key, so the first op does not match them. Without it, a
  // stolen browser session could approve the thief's own CLI key, and
  // revoking the stolen device would leave that CLI session alive for its
  // whole lifetime. The access tokens of the OAuth grants it approved
  // (oauth_server, type MCP) end with it the same way, and their grants end at
  // the next refresh (the approver is checked there). Not API tokens: an API
  // token records the device that
  // created it in the same column, and the API tokens a device created are
  // ended only when that ONE device is revoked on purpose
  // (RevokeApprovedApiTokens, beside this) — RevokeOtherDevices and
  // RevokeAllDevices spare API tokens (devices/revoke-all-spares-api-tokens). Same reason, same actor, same ownership predicate; it
  // spares :keep_token_id, the caller's own session when RevokeOtherDevices
  // comes from a CLI session the revoked browser approved.
  //
  // Ending the approving browser SESSION (Logout, the admin Sessions revoke)
  // does not end the CLI sessions it approved, on purpose: a CLI session is
  // ended by revoking the approving DEVICE or by revoking the CLI session
  // itself.
  rpc RevokeDeviceTokens(RevokeDeviceTokensReq) returns (RevokeDeviceTokensResp) {
    option (w17.db.method) = {
      ops: {
        name: "approved"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :revoked_by, revoke_reason = 5 "
          "WHERE user_id = :user_id AND approved_by_device_id = :device_id AND id <> :keep_token_id AND revoked_at IS NULL "
          "AND ?feature(api_token) token_type IN (1, 3)"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :revoked_by, revoke_reason = 5 "
          "WHERE user_id = :user_id AND device_id = :device_id AND revoked_at IS NULL"
      }
    };
  }

  // MarkDeviceRevoked — revoke the (user, device) pair for good: every
  // token bound to it is refused from now on (Authenticate reads revoked_at
  // through the token's binding), and a sign-in with the same key is
  // refused with DEVICE_REVOKED. Never a DELETE: a deleted row would let the
  // same key register again as a fresh device. Ownership-guarded (id AND
  // user_id); guarded on revoked_at IS NULL so the first revocation's time
  // stands. Zero rows (already revoked, or not the caller's) → NotFound,
  // which the handler treats as done.
  rpc MarkDeviceRevoked(MarkDeviceRevokedReq) returns (MarkDeviceRevokedResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Device SET revoked_at = NOW() "
          "WHERE id = :device_id AND user_id = :user_id AND revoked_at IS NULL "
          "RETURNING id AS device_id"
      }
    };
  }

  // RevokeAllUserTokens — revoke every token the user holds, sessions and
  // API tokens alike ("log out everywhere", incl. the caller), the user as
  // the actor, reason ALL_TOKENS_REVOKED. A low-level primitive for project
  // code: the plugin's own RevokeAllDevices revokes per device instead, so
  // API tokens survive it. Idempotent; no RETURNING.
  rpc RevokeAllUserTokens(RevokeAllUserTokensReq) returns (RevokeAllUserTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :user_id, revoke_reason = 11 "
          "WHERE user_id = :user_id AND revoked_at IS NULL"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // RBAC mutations — Role / Permission / RolePermission /
  // UserRole CRUD. The project's admin UI calls these
  // directly; auth backend code reads via AuthQuery.GetUserPermissions.
  // ────────────────────────────────────────────────────────────

  // CreateRole — INSERT Role. Refuses duplicate name (unique
  // violation → AlreadyExists via the storage DB-error classification).
  rpc CreateRole(CreateRoleReq) returns (CreateRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.Role SET "
          "name = :name, "
          "description = :description "
          "RETURNING id AS role.id, "
          "          name AS role.name, "
          "          description AS role.description, "
          "          created_at AS role.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "RoleCreated"
      payload: {
        fields: [
          { key: "role_id",    value: "$response.role.id" },
          { key: "name",       value: "$response.role.name" },
          { key: "created_at", value: "$response.role.created_at" }
        ]
      }
    };
  }

  // UpdateRole — the admin Roles page detail `update`. Copy only
  // (name + description); the privilege flags stay declarative, seeded
  // from `(w17.acl_roles)`, so an admin form can't widen a grant.
  // Gated rbac.
  rpc UpdateRole(UpdateRoleReq) returns (UpdateRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Role SET "
          "name = :name, "
          "description = :description "
          "WHERE id = :role_id AND deleted_at IS NULL "
          "RETURNING id AS role_id"
      }
    };
    option (w17.event_emit) = {
      event: "RoleUpdated"
      payload: {
        fields: [
          { key: "role_id", value: "$response.role_id" }
        ]
      }
    };
  }

  // ClaimRoleForOrg — see its request message. Only a role nobody has claimed
  // and the seed does not own (org_id and preset_key both NULL): a preset or
  // another organization's role matches nothing (NotFound).
  rpc ClaimRoleForOrg(ClaimRoleForOrgReq) returns (ClaimRoleForOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_roles";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Role SET "
          "org_id = :org_id, "
          "org_scoped = TRUE, "
          "display_name = :display_name "
          "WHERE id = :role_id AND org_id IS NULL AND preset_key IS NULL AND deleted_at IS NULL "
          "RETURNING id AS role_id"
      }
    };
  }

  // UpdateOrgRoleLabel — see its request message. A role of another
  // organization, or a shared one, matches nothing (NotFound).
  rpc UpdateOrgRoleLabel(UpdateOrgRoleLabelReq) returns (UpdateOrgRoleLabelResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_roles";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Role SET "
          "display_name = :display_name, "
          "description = :description "
          "WHERE id = :role_id AND org_id = :org_id AND deleted_at IS NULL "
          "RETURNING id AS role_id"
      }
    };
    option (w17.event_emit) = {
      event: "OrgRoleUpdated"
      payload: {
        fields: [
          { key: "role_id", value: "$response.role_id" }
        ]
      }
    };
  }

  // DeleteRole — retire a role (the admin Roles page's `delete`). Nothing is
  // deleted, in one transaction:
  //
  //   grants  every live grant of the role is revoked (revoked_at, ended_key),
  //           so no reader counts it — it used to be the caller's job to
  //           clean them up, and a grant left behind kept granting through
  //           GetUserPermissions;
  //   main    the role is stamped deleted_at, and ended_key takes its id,
  //           which frees its name for a new role. preset_key is KEPT.
  //
  // A PRESET role (preset_key set, seeded from the project's
  // `(w17.acl_roles)` declarations) may be deleted too — the seed never
  // retires a role the project stopped declaring, so this is the only way
  // to end one (a stale wildcard, an assign_default role still handed to
  // every sign-up). Its preset_key stays on the deleted row: the next seed
  // finds the row by that key (its upsert target), rewrites the declared
  // columns it owns, and leaves deleted_at alone, so the preset STAYS
  // deleted across re-seeds and nothing collides (the seed writes no id or
  // name of a second row). To bring it back, declare it under a new key.
  //
  // Its RolePermission rows stay as they are, the record of what it granted;
  // no reader joins them past a deleted role. Guarded on `deleted_at IS
  // NULL`: deleting a deleted role (or a missing one) matches nothing
  // (NotFound), as deleting a missing one did. revoked_by stays NULL: the
  // admin page binds this mutation directly, and a statement cannot name its
  // caller.
  rpc DeleteRole(DeleteRoleReq) returns (DeleteRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "grants"
        dql:  "UPDATE @module.UserRole SET revoked_at = NOW(), ended_key = id WHERE role_id = :role_id AND revoked_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Role SET deleted_at = NOW(), ended_key = id "
          "WHERE id = :role_id AND deleted_at IS NULL "
          "RETURNING id AS role_id"
      }
    };
    option (w17.event_emit) = {
      event: "RoleDeleted"
      payload: {
        fields: [
          { key: "role_id", value: "$response.role_id" }
        ]
      }
    };
  }

  // UpdateUser — the admin Users page detail `update`. Sets the email
  // only; password_hash stays with UpdateUserPassword (gated
  // password_reset) so credential material never rides an admin form.
  // Gated user_admin.
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "email = :email, "
          // ⚠️ `email_verified_at` records only THAT something was
          // verified, never WHICH address — so a verified account whose email
          // was changed stayed "verified" for an address it had never proved.
          // That walks straight through the invite gate the flag exists for:
          // verify one address, change to the invited one, accept.
          //
          // Cleared here rather than storing the verified address beside it.
          // Both fix it; this one cannot drift, because there is no second copy
          // to keep in step — and re-verifying after an address change is what
          // a person expects anyway.
          "?feature(email_verification) email_verified_at = NULL "
          // An erased account keeps its placeholder: re-personalising it
          // would undo the erasure (User.erased_at).
          "WHERE id = :user_id AND erased_at IS NULL "
          "RETURNING id AS user_id, email AS email"
      }
    };
    option (w17.event_emit) = {
      event: "UserUpdated"
      payload: {
        fields: [
          { key: "user_id", value: "$response.user_id" },
          { key: "email",   value: "$response.email" }
        ]
      }
    };
  }

  // BeginUserErasure — the first step of an erasure: end the account's
  // access, leaving its address alone. Idempotent, so a retried erasure runs
  // it again harmlessly; the response comes from the last op.
  //
  //   tokens   every token of the account is revoked, reason USER_ERASED,
  //            the operator as revoked_by (first revocation stands);
  //   devices  every Device of the account is revoked, and its
  //            label / ip (the user agent and address it was seen from)
  //            are blanked;
  //   disable  the account is disabled (an earlier disable's time stands);
  //   main     the password hash becomes the unusable `!` (no password
  //            verifies against it — CreateBotUser's sentinel), the email
  //            proof is cleared (no OAuth link-by-email can attach to the
  //            account while the erasers run) and device trust ends.
  //
  // Gated user_admin.
  rpc BeginUserErasure(BeginUserErasureReq) returns (BeginUserErasureResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "tokens"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :revoked_by, revoke_reason = 9 "
          "WHERE user_id = :user_id AND revoked_at IS NULL"
      }
      ops: {
        name: "devices"
        dql:  "UPDATE @module.Device SET revoked_at = NOW() WHERE user_id = :user_id AND revoked_at IS NULL"
      }
      ops: {
        name: "device_details"
        dql:  "UPDATE @module.Device SET label = \'\', ip = \'\' WHERE user_id = :user_id"
      }
      ops: {
        name: "disable"
        dql:  "UPDATE @module.User SET disabled_at = NOW() WHERE id = :user_id AND disabled_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "password_hash = \'!\', "
          // The email proof goes now, not at the last step: OAuth links a
          // provider identity to a VERIFIED account by address, and a link
          // made while the erasers run would survive the erasure.
          "?feature(email_verification) email_verified_at = NULL, "
          "device_trust_revoked_at = NOW() "
          "WHERE id = :user_id "
          "RETURNING id AS user_id"
      }
    };
  }

  // EraseUser — the last step of an erasure (BeginUserErasure and the
  // feature erasers have run): the User row is pseudonymised in place — the
  // address becomes the handler's placeholder, the email proof is cleared,
  // and erased_at is stamped. Guarded on `erased_at IS NULL`: a second erase
  // matches no row (NotFound) and changes nothing. Last because it replaces
  // the address the invitation eraser looks for, and because erased_at is
  // what a retry reads to skip it. Emits UserDeleted. Gated user_admin.
  rpc EraseUser(EraseUserReq) returns (EraseUserResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "email = :email, "
          "erased_at = NOW(), "
          "?feature(email_verification) email_verified_at = NULL "
          "WHERE id = :user_id AND erased_at IS NULL "
          "RETURNING id AS user_id"
      }
    };
    option (w17.event_emit) = {
      event: "UserDeleted"
      payload: {
        fields: [
          { key: "user_id", value: "$response.user_id" }
        ]
      }
    };
  }

  // DisableUsers — bulk soft-disable (Django is_active=false). Sets
  // disabled_at on the still-active rows in the id set, and REVOKES every
  // token of those accounts — sessions and API tokens — with reason
  // USER_DISABLED. Disabling a departing person has to end their access,
  // not only their next sign-in: tokens used to survive until they expired
  // (30 days for a session). Re-enabling gives nothing back; the person
  // signs in again. revoked_by stays NULL: the admin action binds this
  // storage mutation directly, and a statement cannot name its caller. One
  // unit of work, both legs on the same id set (an `IN (:ids)` on a
  // non-final leg needs w17 platform 1.9). Gated user_admin.
  rpc DisableUsers(DisableUsersReq) returns (DisableUsersResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: [
        {
          name: "disable"
          // The account's device trust ends too: a device trusted before
          // the disable must pass the second factor again once the account
          // is re-enabled (User.device_trust_revoked_at).
          dql:  "UPDATE @module.User SET disabled_at = NOW(), "
                "device_trust_revoked_at = NOW() "
                "WHERE id IN (:ids) AND disabled_at IS NULL"
        },
        {
          name: "main"
          dql:  "UPDATE @module.UserToken SET revoked_at = NOW(), revoke_reason = 8 "
                "WHERE user_id IN (:ids) AND revoked_at IS NULL"
        }
      ]
    };
  }

  // EnableUsers — bulk re-enable (clear disabled_at). Single-op, so its
  // `IN (:ids)` binds on the final leg. An ERASED account is left disabled:
  // the `erased_at IS NULL` guard makes enabling one a no-op, so an erasure
  // cannot be turned back into a usable account. Gated user_admin.
  rpc EnableUsers(EnableUsersReq) returns (EnableUsersResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:  "UPDATE @module.User SET disabled_at = NULL "
              "WHERE id IN (:ids) AND disabled_at IS NOT NULL AND erased_at IS NULL"
      }
    };
  }

  // AssignRoleToUser — INSERT UserRole linking a user to a
  // role. A live duplicate (same user, role and org, ended_key '') is refused
  // by the unique index with AlreadyExists; a REVOKED grant does not block it
  // (its ended_key is its own id), so a grant revoked earlier is given again
  // as a new row and the revoked one stays as history. A deleted (or
  // unknown) role is refused with NOT_FOUND / ROLE_NOT_FOUND before the
  // write: a grant of a deleted role would grant nothing, yet still be listed
  // among the member's org roles.
  rpc AssignRoleToUser(AssignRoleToUserReq) returns (AssignRoleToUserResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "role"
        // A no-op write rather than a read: it locks the live role row for
        // the rest of the transaction, so writes naming one role — two adds,
        // an add and a DeleteRole — run one after another.
        dql:  "UPDATE @module.Role SET id = id WHERE id = :role_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "ROLE_NOT_FOUND"
          message:    "That role does not exist, or it was deleted."
        }
      }
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.UserRole SET "
          "user_id = :user_id, "
          "role_id = :role.id, "
          "?feature(org_membership) org_id = :org_id "
          "RETURNING id AS user_role.id, "
          "          user_id AS user_role.user_id, "
          "          role_id AS user_role.role_id, "
          "          ?feature(org_membership) org_id AS user_role.org_id, "
          "          created_at AS user_role.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "UserRoleAssigned"
      payload: {
        fields: [
          { key: "user_role_id", value: "$response.user_role.id" },
          { key: "user_id",      value: "$response.user_role.user_id" },
          { key: "role_id",      value: "$response.user_role.role_id" },
          // Gated in step with UserRoleAssigned.org_id and with the
          // column it reads: with `org_membership` off none of the
          // three exist, and an entry naming a field that is not there
          // is a parse-time error.
          { key: "org_id",       value: "$response.user_role.org_id",
            plugin_feature: "org_membership" },
          { key: "assigned_at",  value: "$response.user_role.created_at" }
        ]
      }
    };
  }

  // RevokeRoleFromUser — revoke the matching live grant: revoked_at,
  // revoked_by and ended_key are stamped and the row stays. Guarded on
  // `revoked_at IS NULL`: with no live grant it matches nothing (NotFound),
  // as the DELETE it replaces did.
  rpc RevokeRoleFromUser(RevokeRoleFromUserReq) returns (RevokeRoleFromUserResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserRole SET revoked_at = NOW(), revoked_by = :revoked_by, ended_key = id "
          "WHERE user_id = :user_id AND role_id = :role_id "
          "AND ?feature(org_membership) org_id IS NOT DISTINCT FROM :org_id "
          "AND revoked_at IS NULL "
          "RETURNING user_id, role_id, ?feature(org_membership) org_id"
      }
    };
    option (w17.event_emit) = {
      event: "UserRoleRevoked"
      payload: {
        fields: [
          { key: "user_id", value: "$response.user_id" },
          { key: "role_id", value: "$response.role_id" },
          { key: "org_id",  value: "$response.org_id",
            plugin_feature: "org_membership" }
        ]
      }
    };
  }

  // AddPermissionToRole — grant a permission to a role. RolePermission keeps
  // one row per (role, permission) — the unique index is the role seed's
  // conflict target — so the write is an UPSERT on that pair: a new pair is
  // inserted, a REMOVED one is revived (removed_at / removed_by cleared).
  // Two guards run first, so only a real change is logged and announced: a
  // deleted (or unknown) role is refused with NOT_FOUND / ROLE_NOT_FOUND —
  // by a no-op UPDATE that also LOCKS the role row, so two concurrent adds of
  // one pair cannot both pass the next guard and log twice — and
  // a permission the role already carries with ALREADY_EXISTS /
  // PERMISSION_ALREADY_GRANTED (as the INSERT's unique index refused it
  // before). Then the change is appended to RolePermissionChange and the pair
  // written, in the same transaction; RolePermissionAdded fires only then.
  rpc AddPermissionToRole(AddPermissionToRoleReq) returns (AddPermissionToRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "role"
        // A no-op write rather than a read: it locks the live role row for
        // the rest of the transaction, so writes naming one role — two adds,
        // an add and a DeleteRole — run one after another.
        dql:  "UPDATE @module.Role SET id = id WHERE id = :role_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "ROLE_NOT_FOUND"
          message:    "That role does not exist, or it was deleted."
        }
      }
      ops: {
        name: "granted"
        dql:  "SELECT rp.id AS id FROM @module.RolePermission rp WHERE rp.role_id = :role.id AND rp.permission_id = :permission_id AND rp.removed_at IS NULL"
        on_present: {
          code:       ON_PRESENT_ALREADY_EXISTS
          error_code: "PERMISSION_ALREADY_GRANTED"
          message:    "The role already carries that permission."
        }
      }
      ops: {
        name: "log"
        dql:
          "INSERT INTO @module.RolePermissionChange SET "
          "role_id = :role.id, permission_id = :permission_id, kind = 1, changed_by = :added_by"
      }
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.RolePermission SET "
          "role_id = :role.id, "
          "permission_id = :permission_id "
          "ON CONFLICT (role_id, permission_id) DO UPDATE SET "
          "removed_at = NULL, "
          "removed_by = NULL "
          "RETURNING id AS role_permission.id, "
          "          role_id AS role_permission.role_id, "
          "          permission_id AS role_permission.permission_id, "
          "          created_at AS role_permission.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "RolePermissionAdded"
      payload: {
        fields: [
          { key: "role_permission_id", value: "$response.role_permission.id" },
          { key: "role_id",            value: "$response.role_permission.role_id" },
          { key: "permission_id",      value: "$response.role_permission.permission_id" },
          { key: "added_at",           value: "$response.role_permission.created_at" }
        ]
      }
    };
  }

  // RemovePermissionFromRole — take a permission from a role: removed_at and
  // removed_by are stamped and the row stays; no permission reader counts a
  // removed row. The change is appended to RolePermissionChange in the same
  // transaction. Guarded on `removed_at IS NULL`: with nothing granted it
  // matches nothing (NotFound, as the DELETE it replaces did) and the log row
  // rolls back with it.
  rpc RemovePermissionFromRole(RemovePermissionFromRoleReq) returns (RemovePermissionFromRoleResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "log"
        dql:
          "INSERT INTO @module.RolePermissionChange SET "
          "role_id = :role_id, permission_id = :permission_id, kind = 2, changed_by = :removed_by"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.RolePermission SET removed_at = NOW(), removed_by = :removed_by "
          "WHERE role_id = :role_id AND permission_id = :permission_id AND removed_at IS NULL "
          "RETURNING role_id, permission_id"
      }
    };
    option (w17.event_emit) = {
      event: "RolePermissionRemoved"
      payload: {
        fields: [
          { key: "role_id",       value: "$response.role_id" },
          { key: "permission_id", value: "$response.permission_id" }
        ]
      }
    };
  }

  // ── password_reset mutations ────────────────────────────────

  // CreatePasswordResetToken — INSERT the hashed reset token + expiry and
  // emit PasswordResetRequested carrying the plaintext token + email (the
  // INSERT binds only the persisted columns; the plaintext is event-only).
  rpc CreatePasswordResetToken(CreatePasswordResetTokenReq) returns (CreatePasswordResetTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.PasswordResetToken SET "
          "user_id = :user_id, "
          "token_hash = :token_hash, "
          "expires_at = :expires_at "
          "RETURNING id AS token.id, "
          "          user_id AS token.user_id, "
          "          token_hash AS token.token_hash, "
          "          expires_at AS token.expires_at, "
          "          consumed_at AS token.consumed_at, "
          "          created_at AS token.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "PasswordResetRequested"
      payload: {
        fields: [
          { key: "user_id",    value: "$response.token.user_id" },
          { key: "email",      value: "$request.email" },
          { key: "token",      value: "$request.token" },
          { key: "expires_at", value: "$response.token.expires_at" }
        ]
      }
    };
  }

  // ConsumePasswordResetToken — atomically claim a live token: flip
  // consumed_at single-use AND require not-yet-consumed + not-expired in
  // the WHERE, so a replay / expired / already-used token matches zero rows
  // (empty user_id). No TOCTOU between validate + consume.
  rpc ConsumePasswordResetToken(ConsumePasswordResetTokenReq) returns (ConsumePasswordResetTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PasswordResetToken SET "
          "consumed_at = NOW() "
          "WHERE token_hash = :token_hash AND consumed_at IS NULL AND expires_at > NOW() "
          "RETURNING user_id"
      }
    };
  }

  // SpendPasswordResetTokens — mark every live reset link of an account used.
  // Runs in the same transaction as a password reset or change: a link the
  // person asked for before is a way to set the password again, and after
  // the password changed nobody should hold one.
  rpc SpendPasswordResetTokens(SpendPasswordResetTokensReq) returns (SpendPasswordResetTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.PasswordResetToken SET "
          "consumed_at = NOW() "
          "WHERE user_id = :user_id AND consumed_at IS NULL"
      }
    };
  }

  // UpdateUserPassword — apply a reset: set the user's password_hash.
  rpc UpdateUserPassword(UpdateUserPasswordReq) returns (UpdateUserPasswordResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "password_hash = :password_hash "
          "WHERE id = :user_id "
          "RETURNING id AS user_id"
      }
    };
  }

  // UpdateUserPasswordIfUnchanged — apply a CHANGE: set the password_hash
  // only while the stored one is still the value the caller's proof was
  // verified against.
  //
  // Separate from UpdateUserPassword rather than a predicate added to it,
  // because that one also serves the RESET flow — where the whole premise is
  // that nobody knows the current password, so there is no hash to compare
  // and a predicate would make every reset match zero rows.
  //
  // Same shape as ConsumePasswordResetToken above, for the same reason: the
  // check and the write are one statement, so nothing can change underneath
  // between them. ChangePassword otherwise reads the hash, verifies it, and
  // writes — with an argon2id hash computed in the middle, which is tens of
  // milliseconds of window BY DESIGN. Last write wins there, so a victim's
  // fresh rotation can be overwritten by an attacker who knew the old
  // password, and two honest tabs silently lose one of the two changes.
  rpc UpdateUserPasswordIfUnchanged(UpdateUserPasswordIfUnchangedReq) returns (UpdateUserPasswordIfUnchangedResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_change";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "password_hash = :password_hash, "
          // A change also ends the trust of every device of the account, the
          // caller's own included: whoever held the old password may have
          // signed in from a device that is trusted now. In this statement,
          // so the two cannot come apart.
          "device_trust_revoked_at = NOW() "
          "WHERE id = :user_id AND password_hash = :current_hash "
          "RETURNING id AS user_id"
      }
    };
  }

  // SetUserMarketingConsent records the user's decision and when it was made
  // — a withdrawal as much as a consent, because the time a consent ended is
  // part of the record too. MarketingConsentChanged tells whoever keeps a copy
  // (a marketing tool's contact) without waiting for the user's next request.
  rpc SetUserMarketingConsent(SetUserMarketingConsentReq) returns (SetUserMarketingConsentResp) {
    option (w17.contrib.plugin_feature_rpc) = "marketing_consent";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "marketing_consent = :consent, "
          "marketing_consent_at = NOW() "
          "WHERE id = :user_id "
          "RETURNING id AS user_id, marketing_consent AS consent, marketing_consent_at AS decided_at"
      }
    };
    option (w17.event_emit) = {
      event: "MarketingConsentChanged"
      payload: {
        fields: [
          { key: "user_id",    value: "$response.user_id" },
          { key: "consent",    value: "$response.consent" },
          { key: "decided_at", value: "$response.decided_at" },
          { key: "device_id",  value: "$request.thumbprint" }
        ]
      }
    };
  }

  // RevokeTokensForReset — revoke every token of the user after a reset
  // (sessions + API tokens; the conservative post-reset default), reason
  // PASSWORD_RESET. revoked_by NULL: whoever reset the password proved only
  // the link, not an identity. No RETURNING: an account holding no live
  // token revokes nothing, and that is no failure (it used to answer
  // NotFound, which ResetPassword reported as "sessions not revoked").
  rpc RevokeTokensForReset(RevokeTokensForResetReq) returns (RevokeTokensForResetResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoke_reason = 4 "
          "WHERE user_id = :user_id AND revoked_at IS NULL"
      }
    };
  }
  // RevokeOtherSessionTokens — see the request. The person changing the
  // password is the actor; reason PASSWORD_CHANGED. No RETURNING: a person
  // with no other session revokes nothing, and that is no failure.
  rpc MarkSessionSteppedUp(MarkSessionSteppedUpReq) returns (MarkSessionSteppedUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET stepped_up_at = NOW(), step_up_attempts = 0 "
          "WHERE id = :token_id AND user_id = :user_id AND revoked_at IS NULL "
          "RETURNING id, stepped_up_at"
      }
    };
  }

  // RecordPasswordStepUpAttempt — count a ConfirmPassword guess on the
  // caller's session, refusing (no row back) while it is locked. One
  // statement, so concurrent guesses get distinct counts.
  rpc RecordPasswordStepUpAttempt(RecordPasswordStepUpAttemptReq) returns (RecordPasswordStepUpAttemptResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET step_up_attempts = step_up_attempts + 1 "
          "WHERE id = :token_id AND user_id = :user_id AND revoked_at IS NULL "
          "AND (step_up_locked_until IS NULL OR step_up_locked_until < NOW()) "
          "RETURNING step_up_attempts AS attempts"
      }
    };
  }
  rpc LockPasswordStepUp(LockPasswordStepUpReq) returns (LockPasswordStepUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET step_up_attempts = 0, step_up_locked_until = :until "
          "WHERE id = :token_id "
          "RETURNING id"
      }
    };
  }

  // SetStepUpCode — stamp a mailed step-up code's hash on the caller's
  // session and emit the plaintext for delivery. Refuses (no row back) a
  // session that got one less than a minute ago (resend_before), so a stolen
  // session cannot turn the person's mailbox into a flood.
  rpc SetStepUpCode(SetStepUpCodeReq) returns (SetStepUpCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up_code";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET step_up_code_hash = :code_hash, step_up_code_sent_at = NOW() "
          "WHERE id = :token_id AND user_id = :user_id AND revoked_at IS NULL "
          "AND (step_up_code_sent_at IS NULL OR step_up_code_sent_at < :resend_before) "
          "RETURNING id AS token_id, user_id, step_up_code_sent_at AS sent_at"
      }
    };
    option (w17.event_emit) = {
      event: "StepUpCodeRequested"
      payload: {
        fields: [
          { key: "user_id",    value: "$response.user_id" },
          { key: "token_id",   value: "$response.token_id" },
          { key: "email",      value: "$request.email" },
          { key: "code",       value: "$request.code" },
          { key: "expires_at", value: "$request.expires_at" },
          { key: "device_id",  value: "$request.thumbprint" }
        ]
      }
    };
  }

  // ConsumeStepUpCode — the mailed code was right: stamp the session and
  // spend the code, in one statement and only while it is still the live
  // one, so a code is used once and a newer code is not spent by an older.
  rpc ConsumeStepUpCode(ConsumeStepUpCodeReq) returns (ConsumeStepUpCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up_code";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET stepped_up_at = NOW(), step_up_attempts = 0, "
          "step_up_code_hash = NULL, step_up_code_sent_at = NULL "
          "WHERE id = :token_id AND user_id = :user_id AND revoked_at IS NULL "
          "AND step_up_code_hash = :code_hash "
          "RETURNING id, stepped_up_at"
      }
    };
  }

  rpc RevokeOtherSessionTokens(RevokeOtherSessionTokensReq) returns (RevokeOtherSessionTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_change";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :user_id, revoke_reason = 3 "
          "WHERE user_id = :user_id AND id <> :keep_token_id AND revoked_at IS NULL "
          "AND ?feature(api_token) token_type = 1"
      }
    };
  }


  // ── email_verification mutations ────────────────────────────

  rpc CreateEmailVerificationToken(CreateEmailVerificationTokenReq) returns (CreateEmailVerificationTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.EmailVerificationToken SET "
          "user_id = :user_id, "
          "token_hash = :token_hash, "
          "expires_at = :expires_at "
          "RETURNING id AS token.id, "
          "          user_id AS token.user_id, "
          "          token_hash AS token.token_hash, "
          "          expires_at AS token.expires_at, "
          "          consumed_at AS token.consumed_at, "
          "          created_at AS token.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "EmailVerificationRequested"
      payload: {
        fields: [
          { key: "user_id",    value: "$response.token.user_id" },
          { key: "email",      value: "$request.email" },
          { key: "token",      value: "$request.token" },
          { key: "expires_at", value: "$response.token.expires_at" }
        ]
      }
    };
  }

  rpc ConsumeEmailVerificationToken(ConsumeEmailVerificationTokenReq) returns (ConsumeEmailVerificationTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.EmailVerificationToken SET "
          "consumed_at = NOW() "
          "WHERE token_hash = :token_hash AND consumed_at IS NULL AND expires_at > NOW() "
          "RETURNING user_id"
      }
    };
  }

  // MarkEmailVerified — stamp the user's email_verified_at.
  rpc MarkEmailVerified(MarkEmailVerifiedReq) returns (MarkEmailVerifiedResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          // SELF_CONFIRMED (2) alongside the timestamp, and no `?feature` guard:
          // this whole RPC is gated on `email_verification`, so the column exists
          // wherever this statement can run — the same reason `email_verified_at`
          // above carries no guard either.
          //
          // Found by review. `email_proof` was added for the floors and this
          // mutation was left alone, so anyone verifying through the ordinary flow
          // got the timestamp set and the proof still UNPROVEN — two fields about
          // one fact, disagreeing. The gate reads the timestamp first and behaved
          // correctly, which is exactly why the data would have stayed wrong
          // without anybody noticing.
          "email_verified_at = NOW(), "
          "email_proof = 2 "
          "WHERE id = :user_id "
          "RETURNING id AS user_id"
      }
    };
  }

  // MarkEmailDerivedFromInvite — record that a BOUND invitation proved this
  // address, without claiming the person confirmed it themselves.
  //
  // `email_verified_at` is deliberately NOT touched: that column means "the owner
  // completed the verification flow", and writing it here would erase the very
  // distinction the mode `full` exists to demand. The proof LEVEL carries the fact
  // instead.
  //
  // Never downgrades. The WHERE refuses to move a SELF_CONFIRMED address back to
  // derived — accepting a second invitation must not weaken an address somebody
  // already confirmed, and a guard in the statement cannot be forgotten by a caller.
  rpc MarkEmailDerivedFromInvite(MarkEmailDerivedFromInviteReq) returns (MarkEmailDerivedFromInviteResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.User SET "
          "email_proof = 1 "
          "WHERE id = :user_id AND email_proof < 2 AND email_verified_at IS NULL "
          "RETURNING id AS user_id"
      }
    };
  }

  // ── cli_login (first-party CLI OAuth authorization code) ──

  // RegisterAuthClient — write down a redirect target an operator vouches
  // for. One row per (client_id, redirect_uri); the composite unique makes a
  // repeat registration a no-op rather than a duplicate.
  rpc RegisterAuthClient(RegisterAuthClientReq) returns (RegisterAuthClientResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.AuthClient SET "
          "client_id = :client_id, "
          "name = :name, "
          "redirect_uri = :redirect_uri, "
          "client_secret = :client_secret, "
          "enabled = TRUE "
          "RETURNING id AS client.id, "
          "          client_id AS client.client_id, "
          "          name AS client.name, "
          "          redirect_uri AS client.redirect_uri, "
          "          enabled AS client.enabled, "
          "          created_at AS client.created_at"
      }
    };
  }

  // SetAuthClientEnabled — retire (or restore) ONE registered callback.
  // Per row, not per client: an operator taking down a single environment's
  // callback must not have to remove the others. A REVOKED registration is
  // not restored: the `revoked_at IS NULL` guard makes it match no row.
  rpc SetAuthClientEnabled(SetAuthClientEnabledReq) returns (SetAuthClientEnabledResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.AuthClient SET enabled = :enabled "
          "WHERE id = :id AND revoked_at IS NULL RETURNING id AS id"
      }
    };
  }

  // RotateAuthClientSecret — replace the secret of a LIVE registration. A
  // revoked one matches no row (NotFound): its secret stays as it was, and it
  // is refused anyway.
  rpc RotateAuthClientSecret(RotateAuthClientSecretReq) returns (RotateAuthClientSecretResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.AuthClient SET client_secret = :client_secret "
          "WHERE id = :id AND revoked_at IS NULL RETURNING id AS id"
      }
    };
  }

  // RevokeAuthClient — end a registration for good: stamps revoked_at (and
  // clears enabled, so a reader of either column sees it retired). The row
  // stays as the record of what was trusted; every resolver refuses it and
  // the pair can be registered again as a new row. Guarded on
  // `revoked_at IS NULL`: revoking it again matches no row (NotFound).
  rpc RevokeAuthClient(RevokeAuthClientReq) returns (RevokeAuthClientResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.AuthClient SET revoked_at = NOW(), enabled = FALSE "
          "WHERE id = :id AND revoked_at IS NULL RETURNING id AS id"
      }
    };
  }
  // ClaimBootstrapAdmin takes the bootstrap-administrator slot for the user
  // being created, inside its sign-up transaction. `written` is 1 for the
  // one sign-up that took it and 0 for every other: a concurrent sign-up
  // waits on the key and then conflicts. See BootstrapClaim.
  rpc ClaimBootstrapAdmin(ClaimBootstrapAdminReq) returns (ClaimBootstrapAdminResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.BootstrapClaim SET "
          "slot = :slot, "
          "user_id = :user_id "
          "ON CONFLICT (slot) DO NOTHING"
      }
    };
  }
  // CreateOAuthLoginCode stores the single-use code an OAuth callback hands
  // the browser, bound to a sha256 digest of the authorize step's PKCE challenge.
  rpc CreateOAuthLoginCode(CreateOAuthLoginCodeReq) returns (CreateOAuthLoginCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.OAuthLoginCode SET "
          "user_id = :user_id, "
          "code_hash = :code_hash, "
          "code_challenge = :code_challenge, "
          "expires_at = :expires_at, "
          "provider_id = :provider_id, "
          "external_id = :external_id, "
          "email = :email, "
          "email_verified = :email_verified "
          "RETURNING id"
      }
    };
  }
  // ConsumeOAuthLoginCode redeems a code once: the conditional UPDATE is the
  // single-use guarantee, so of two concurrent exchanges exactly one gets a
  // row back. The verifier is checked against the returned digest after
  // the consume, so a wrong verifier burns the code too.
  rpc ConsumeOAuthLoginCode(ConsumeOAuthLoginCodeReq) returns (ConsumeOAuthLoginCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OAuthLoginCode SET "
          "consumed_at = NOW() "
          "WHERE code_hash = :code_hash AND consumed_at IS NULL AND expires_at > NOW() "
          "RETURNING user_id, code_challenge, provider_id, external_id, email, email_verified"
      }
    };
  }


  // CreateCliAuthCode — INSERT a single-use PKCE code bound to the
  // approving user + challenge (only the hash is stored), and to the
  // approving session's expiry, which caps the session CliToken mints.
  rpc CreateCliAuthCode(CreateCliAuthCodeReq) returns (CreateCliAuthCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.CliAuthCode SET "
          "user_id = :user_id, "
          "code_hash = :code_hash, "
          "code_challenge = :code_challenge, "
          "redirect_uri = :redirect_uri, "
          "client_id = :client_id, "
          "expires_at = :expires_at, "
          "session_expires_at = :session_expires_at, "
          "approved_by_device_id = :approved_by_device_id "
          "RETURNING id AS code.id, "
          "          user_id AS code.user_id, "
          "          code_hash AS code.code_hash, "
          "          code_challenge AS code.code_challenge, "
          "          expires_at AS code.expires_at, "
          "          consumed_at AS code.consumed_at, "
          "          created_at AS code.created_at"
      }
    };
  }

  // ConsumeCliAuthCode — atomically claim a live code: flip consumed_at
  // single-use AND require not-consumed + not-expired in the WHERE, so a
  // replay / expired / used code matches zero rows (empty user_id). No
  // TOCTOU between validate + consume.
  rpc ConsumeCliAuthCode(ConsumeCliAuthCodeReq) returns (ConsumeCliAuthCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.CliAuthCode SET "
          "consumed_at = NOW() "
          "WHERE code_hash = :code_hash AND consumed_at IS NULL AND expires_at > NOW() "
          "RETURNING user_id, code_challenge, redirect_uri, client_id, session_expires_at, approved_by_device_id"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // org_membership mutations — the two org write primitives (the
  // symmetric counterpart to CreateUser). A consuming handler /
  // subscriber composes them: CreateOrganization then
  // AddOrgMembership(creator, org, "owner"), atomically via distx
  // like SignUp. Both gated `org_membership`.
  // ────────────────────────────────────────────────────────────

  // CreateOrganization — INSERT Organization. Refuses a duplicate slug
  // (unique violation → AlreadyExists via the storage DB-error
  // classification). Emits OrganizationCreated — the keystone
  // provisioning hook (a subscriber seeds the org's default data off
  // org_id) so a project never has to INSERT into this plugin's tables
  // directly.
  rpc CreateOrganization(CreateOrganizationReq) returns (CreateOrganizationResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.Organization SET "
          "slug = :slug, "
          "name = :name, "
          "kind = :kind "
          "RETURNING id AS organization.id, "
          "          slug AS organization.slug, "
          "          name AS organization.name, "
          "          kind AS organization.kind, "
          "          created_at AS organization.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "OrganizationCreated"
      payload: {
        fields: [
          { key: "org_id",     value: "$response.organization.id" },
          { key: "slug",       value: "$response.organization.slug" },
          { key: "name",       value: "$response.organization.name" },
          { key: "kind",       value: "$response.organization.kind" },
          { key: "created_at", value: "$response.organization.created_at" }
        ]
      }
    };
  }

  // AddOrgMembership — INSERT OrgMembership linking a user to an org
  // with a role. A live duplicate (same user and org, ended_key '') is
  // refused by the unique index with AlreadyExists; a REMOVED membership does
  // not block it, so a removed member can be added again (a new row). Emits OrgMembershipAdded (fires for
  // the creator's owner grant + every later invite accept). Mirrors
  // AssignRoleToUser.
  rpc AddOrgMembership(AddOrgMembershipReq) returns (AddOrgMembershipResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.OrgMembership SET "
          "user_id = :user_id, "
          "org_id = :org_id, "
          "role = :role, "
          "?feature(membership_kinds) kind = :kind "
          "RETURNING id AS membership.id, "
          "          user_id AS membership.user_id, "
          "          org_id AS membership.org_id, "
          "          role AS membership.role, "
          "          ?feature(membership_kinds) kind AS membership.kind, "
          "          created_at AS membership.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "OrgMembershipAdded"
      payload: {
        fields: [
          { key: "membership_id", value: "$response.membership.id" },
          { key: "user_id",       value: "$response.membership.user_id" },
          { key: "org_id",        value: "$response.membership.org_id" },
          { key: "role",          value: "$response.membership.role" },
          { key: "created_at",    value: "$response.membership.created_at" }
        ]
      }
    };
  }

  // UpdateOrganization — the admin Organizations page detail `update`.
  // Gated org_membership.
  rpc UpdateOrganization(UpdateOrganizationReq) returns (UpdateOrganizationResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Organization SET "
          "slug = :slug, "
          "name = :name, "
          "kind = :kind "
          "WHERE id = :id AND deleted_at IS NULL "
          "RETURNING id AS org_id"
      }
    };
    option (w17.event_emit) = {
      event: "OrganizationUpdated"
      payload: {
        fields: [
          { key: "org_id", value: "$response.org_id" }
        ]
      }
    };
  }

  // DeleteOrganization — the admin Organizations page delete. Nothing is
  // deleted, in one transaction:
  //
  //   memberships  every live membership of the org is removed (removed_at,
  //                ended_key);
  //   grants       every live grant scoped to the org is revoked, for the
  //                reason MarkOrgMembershipRemoved gives;
  //   main         the org is stamped deleted_at, and ended_key takes its id,
  //                which frees its slug for a new organization.
  //
  // Every organization reader reads live rows only, so the org disappears
  // from every list and lookup, cannot be selected, and its owner_id grants
  // nothing. Its invitations are not touched here — org_invite is a feature
  // of its own, and a statement cannot name a table its activation may not
  // have — so AuthService.RemoveOrganization (which the admin page binds)
  // closes them first, in the same transaction (CloseOrgInvitesOfOrg); and
  // every statement that reads, binds or accepts an invitation requires its
  // organization to be live, so one called directly leaves none usable either.
  // Guarded on
  // `deleted_at IS NULL`: a second delete matches nothing (NotFound), as it
  // did. removed_by / revoked_by stay NULL: the admin page binds this
  // mutation directly. Emits OrganizationDeleted for downstream per-org
  // cleanup. Gated org_membership.
  rpc DeleteOrganization(DeleteOrganizationReq) returns (DeleteOrganizationResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "memberships"
        dql:  "UPDATE @module.OrgMembership SET removed_at = NOW(), ended_key = id WHERE org_id = :id AND removed_at IS NULL"
      }
      ops: {
        name: "grants"
        dql:  "UPDATE @module.UserRole SET revoked_at = NOW(), ended_key = id WHERE org_id = :id AND revoked_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Organization SET deleted_at = NOW(), ended_key = id "
          "WHERE id = :id AND deleted_at IS NULL "
          "RETURNING id AS org_id"
      }
    };
    option (w17.event_emit) = {
      event: "OrganizationDeleted"
      payload: {
        fields: [
          { key: "org_id", value: "$response.org_id" }
        ]
      }
    };
  }

  // UpdateOrgMembership — the admin OrgMemberships page detail
  // `update`. Role only: re-pointing a membership at a different user
  // or org is a removal + re-add, not an edit (the unique
  // (user_id, org_id, ended_key) index makes an in-place move a constraint
  // trap).
  // Gated org_membership.
  // The membership's role label and the org-scoped grant behind it change
  // TOGETHER. Changing the label alone would revoke nothing on a demotion:
  // the member would keep every permission of the role they were demoted
  // from, because permissions are read from UserRole and never from this
  // label. One method, one transaction: read whose membership it is, check
  // the new role is still an org role, revoke every grant the member holds IN
  // THIS ORGANIZATION (revoked_at, the caller as revoked_by — the rows stay),
  // and grant the new one as a new row. Realm-wide grants are not
  // touched. Called by AuthService.UpdateOrgMembershipRole, which holds the
  // change to the role ceiling; it checks nothing about the caller itself.
  rpc UpdateOrgMembership(UpdateOrgMembershipReq) returns (UpdateOrgMembershipResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "m"
        dql:  "SELECT m.user_id AS user_id, m.org_id AS org_id FROM @module.OrgMembership m WHERE m.id = :id AND m.removed_at IS NULL"
      }
      ops: {
        name: "r"
        dql:  "SELECT r.id AS id, r.name AS name FROM @module.Role r WHERE r.id = :role_id AND r.org_scoped = TRUE AND r.deleted_at IS NULL"
        // Two kinds of caller, two reasons for a miss. Through
        // AuthService.UpdateOrgMembershipRole (which the plugin's own admin
        // page binds) the role was resolved by name a moment ago, so a miss is
        // a race: deleted, or stopped being an org role, in between. A project
        // that calls this mutation ITSELF with a role_id — an admin binding of
        // its own — most often misses on a role that never was assignable here:
        // realm-wide, or no such id. The sentence names both; speaking only of
        // the race would send that caller looking for one. Not a missing
        // membership, which op "m" answers.
        on_empty: {
          code:       ON_EMPTY_FAILED_PRECONDITION
          error_code: "ORG_ROLE_NOT_ASSIGNABLE"
          message:    "That role cannot be assigned in this organization: it is not an organization role, or it no longer exists. Choose a role again."
        }
      }
      ops: {
        name: "revoke"
        dql:
          "UPDATE @module.UserRole SET revoked_at = NOW(), revoked_by = :changed_by, ended_key = id "
          "WHERE user_id = :m.user_id AND org_id = :m.org_id AND revoked_at IS NULL"
      }
      ops: {
        name: "grant"
        dql:  "INSERT INTO @module.UserRole SET user_id = :m.user_id, role_id = :r.id, org_id = :m.org_id"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgMembership SET "
          "role = :r.name "
          "WHERE id = :id AND removed_at IS NULL "
          "RETURNING id AS membership_id"
      }
    };
    // The first op locks the membership row, so two changes to one membership
    // run one after the other. Unlocked, two concurrent updates could both
    // pass the revoke and each insert its own role — the label would name one
    // and the member would hold both.
    option (w17.db.lock) = {
      locks: [
        { resource: "OrgMembership", kind: SELECT_FOR_UPDATE }
      ]
    };
    option (w17.event_emit) = {
      event: "OrgMembershipUpdated"
      payload: {
        fields: [
          { key: "membership_id", value: "$response.membership_id" }
        ]
      }
    };
  }

  // MarkOrgMembershipRemoved — remove a member (AuthService.RemoveOrgMembership,
  // the OrgMemberships page's delete). Was DeleteOrgMembership; nothing is
  // deleted: the membership is stamped removed_at / removed_by and its
  // ended_key takes its id, so the person can be added again as a new row.
  //
  // A membership leaves WITH its org-scoped grants. Left live, the grants
  // would keep counting — permissions read UserRole by (user, org) and join no
  // membership — so a member re-invited at a LESSER role would come back with
  // their old one, and one re-invited at the same role would hit the unique
  // grant and could never accept. They are revoked (revoked_at, the same
  // actor as revoked_by), not deleted. The request names only the membership,
  // so the first op reads whose it is; a removed membership matches nothing
  // (NotFound), as a deleted one did. An owner without a membership is
  // unaffected: ownership is read off the organization.
  rpc MarkOrgMembershipRemoved(MarkOrgMembershipRemovedReq) returns (MarkOrgMembershipRemovedResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "m"
        dql:  "SELECT m.user_id AS user_id, m.org_id AS org_id FROM @module.OrgMembership m WHERE m.id = :id AND m.removed_at IS NULL"
      }
      ops: {
        name: "revoke"
        dql:
          "UPDATE @module.UserRole SET revoked_at = NOW(), revoked_by = :removed_by, ended_key = id "
          "WHERE user_id = :m.user_id AND org_id = :m.org_id AND revoked_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgMembership SET removed_at = NOW(), removed_by = :removed_by, ended_key = id "
          "WHERE id = :id AND removed_at IS NULL "
          "RETURNING id AS membership_id"
      }
    };
    // The first op locks the membership row, so two changes to one membership
    // run one after the other. Unlocked, two concurrent updates could both
    // pass the revoke and each insert its own role — the label would name one
    // and the member would hold both.
    option (w17.db.lock) = {
      locks: [
        { resource: "OrgMembership", kind: SELECT_FOR_UPDATE }
      ]
    };
    option (w17.event_emit) = {
      event: "OrgMembershipRemoved"
      payload: {
        fields: [
          { key: "membership_id", value: "$response.membership_id" }
        ]
      }
    };
  }

  // RevokeUserToken — an operator revokes one token (the admin Sessions
  // page's revoke, through AuthService.RevokeSessions): that session/API
  // bearer stops authenticating immediately. Reason ADMIN_REVOKED, the
  // operator as revoked_by; the row stays and the Sessions page shows it
  // revoked. Guarded on `revoked_at IS NULL`: revoking a revoked token
  // matches no row (NotFound, which the service reads as done) and emits
  // nothing. Emits UserTokenRevoked. Gated user_admin.
  rpc RevokeUserToken(RevokeUserTokenReq) returns (RevokeUserTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.UserToken SET revoked_at = NOW(), revoked_by = :revoked_by, revoke_reason = 7 "
          "WHERE id = :id AND revoked_at IS NULL "
          "RETURNING id AS token_id"
      }
    };
    option (w17.event_emit) = {
      event: "UserTokenRevoked"
      payload: {
        fields: [
          { key: "token_id",  value: "$response.token_id" },
          { key: "device_id", value: "$request.thumbprint" }
        ]
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // erasure — the feature-owned halves of AuthService.EraseUsers (see
  // EraseUser for the base tables). Each runs inside the erasure's
  // transaction; none deletes a row and none carries a RETURNING, so an
  // account with nothing in the table is no failure.
  // ────────────────────────────────────────────────────────────

  // EraseOAuthData — identities: the asserted email is blanked and the
  // provider subject is replaced by the row's own id, which is unique (so
  // the (provider_id, external_id) index holds) and matches no subject a
  // provider sends — the person can sign in through the provider again and
  // gets a new account, and nothing resolves to the erased one. Login codes
  // of the account are spent and their identity copy blanked.
  //
  // That includes the codes of the sign-in that CREATED the account: such a
  // code is written with user_id NULL (the account did not exist yet) and
  // nothing back-fills it, so it is found by the identity it carries — the
  // (provider_id, external_id) of one of the account's identities. That op
  // runs first, while the identities still hold the subject.
  rpc EraseOAuthData(EraseOAuthDataReq) returns (EraseOAuthDataResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
    option (w17.db.method) = {
      ops: {
        name: "unlinked_codes_spent"
        dql:
          "UPDATE @module.OAuthLoginCode c SET consumed_at = NOW() "
          "WHERE c.user_id IS NULL AND c.consumed_at IS NULL AND EXISTS (SELECT i.id FROM @module.OAuthIdentity i "
          "WHERE i.user_id = :user_id AND i.provider_id = c.provider_id AND i.external_id = c.external_id)"
      }
      ops: {
        name: "unlinked_codes"
        dql:
          "UPDATE @module.OAuthLoginCode c SET email = \'\', external_id = \'\' "
          "WHERE c.user_id IS NULL AND EXISTS (SELECT i.id FROM @module.OAuthIdentity i "
          "WHERE i.user_id = :user_id AND i.provider_id = c.provider_id AND i.external_id = c.external_id)"
      }
      ops: {
        name: "codes_spent"
        dql:  "UPDATE @module.OAuthLoginCode SET consumed_at = NOW() WHERE user_id = :user_id AND consumed_at IS NULL"
      }
      ops: {
        name: "codes"
        dql:  "UPDATE @module.OAuthLoginCode SET email = \'\', external_id = \'\' WHERE user_id = :user_id"
      }
      ops: {
        name: "main"
        dql:  "UPDATE @module.OAuthIdentity SET external_id = id, email = \'\' WHERE user_id = :user_id"
      }
    };
  }

  // EraseTwoFactorData — the authenticator's seed (and the legacy sealed
  // copy) is cleared and the row unconfirmed, every unused recovery code is
  // spent, every pending challenge consumed. The rows stay.
  rpc EraseTwoFactorData(EraseTwoFactorDataReq) returns (EraseTwoFactorDataResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
    option (w17.db.method) = {
      ops: {
        name: "challenges"
        dql:  "UPDATE @module.MfaChallenge SET consumed_at = NOW() WHERE user_id = :user_id AND consumed_at IS NULL"
      }
      ops: {
        name: "codes"
        dql:  "UPDATE @module.UserRecoveryCode SET used_at = NOW() WHERE user_id = :user_id AND used_at IS NULL"
      }
      ops: {
        name: "main"
        dql:  "UPDATE @module.UserTotpSecret SET seed = NULL, secret = NULL, confirmed_at = NULL WHERE user_id = :user_id"
      }
    };
  }

  // SpendEmailVerificationTokens — see the request.
  rpc SpendEmailVerificationTokens(SpendEmailVerificationTokensReq) returns (SpendEmailVerificationTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.EmailVerificationToken SET "
          "consumed_at = NOW() "
          "WHERE user_id = :user_id AND consumed_at IS NULL"
      }
    };
  }

  // EraseOrgInviteAddress — every invitation addressed to the erased
  // address loses it: email becomes NULL, pending or accepted. NULL, not a
  // placeholder, because the one-pending-per-(org, email) partial index
  // would make a placeholder collide (an organization that re-invited the
  // address between two attempts of a retried erasure), and NULL never
  // collides.
  //
  // But NULL on a PENDING invitation means OPEN — whoever holds the link
  // picks an address — so a pending one is ended first: its expires_at is
  // set to NOW(), and every path that binds or accepts an invitation
  // requires `expires_at > NOW()`. An accepted one keeps the record of the
  // membership without the address.
  rpc EraseOrgInviteAddress(EraseOrgInviteAddressReq) returns (EraseOrgInviteAddressResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "pending"
        dql:
          "UPDATE @module.OrgInvite SET email = NULL, expires_at = NOW() "
          "WHERE email = :email AND accepted_at IS NULL AND expires_at > NOW()"
      }
      ops: {
        name: "main"
        dql:  "UPDATE @module.OrgInvite SET email = NULL WHERE email = :email"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // org_invite — the three writes an invitation needs. Reads live
  // in AuthQuery; the business handler composes them in one distx
  // transaction so an accepted invite can never leave a membership
  // without its role grant, or the reverse.
  // ────────────────────────────────────────────────────────────

  // CreateOrgInvite — record a pending invitation. The partial unique
  // index on (org_id, email) WHERE accepted_at IS NULL is what makes a
  // second pending invite for the same address a database refusal rather
  // than a duplicate row two admins race to create; a CONSUMED invite does
  // not block a later one, because being removed from an org and invited
  // back is a normal thing to happen.
  rpc CreateOrgInvite(CreateOrgInviteReq) returns (CreateOrgInviteResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.OrgInvite SET "
          "org_id = :org_id, "
          "email = :email, "
          "role = :role, "
          "invited_by = :invited_by, "
          "expires_at = :expires_at, "
          "token_hash = :token_hash, "
          "metadata = :metadata, "
          "role_snapshot = :role_snapshot, "
          "?feature(membership_kinds) kind = :kind "
          "RETURNING id AS invite.id, "
          "          org_id AS invite.org_id, "
          "          email AS invite.email, "
          "          role AS invite.role, "
          "          invited_by AS invite.invited_by, "
          "          expires_at AS invite.expires_at, "
          "          accepted_at AS invite.accepted_at, "
          "          created_at AS invite.created_at"
      }
    };
    option (w17.event_emit) = {
      event: "OrgInviteCreated"
      payload: {
        fields: [
          { key: "invite_id",  value: "$response.invite.id" },
          { key: "org_id",     value: "$response.invite.org_id" },
          { key: "email",      value: "$response.invite.email" },
          { key: "role",       value: "$response.invite.role" },
          { key: "invited_by", value: "$response.invite.invited_by" },
          { key: "expires_at", value: "$response.invite.expires_at" }
        ]
      }
    };
  }

  // BindOpenOrgInvite — see the request. No RETURNING: a link already bound
  // (or unknown, or spent) matches nothing, and the caller reads the
  // invitation back to learn whose it is — a zero-row RETURNING inside a
  // transaction would abort the registration it is part of.
  rpc BindOpenOrgInvite(BindOpenOrgInviteReq) returns (BindOpenOrgInviteResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgInvite i SET email = :email "
          "WHERE i.token_hash = :token_hash AND i.email IS NULL AND i.accepted_at IS NULL AND i.closed_at IS NULL AND i.expires_at > NOW() "
          "AND EXISTS (SELECT o.id FROM @module.Organization o WHERE o.id = i.org_id AND o.deleted_at IS NULL)"
      }
    };
  }

  // ConsumeOrgInviteByToken — spend the link.
  //
  // Keyed on the TOKEN, not on (id, email), which is the whole of the model change:
  // the identifier in the URL used to be the row id, and a row id reaches logs and
  // `Referer` and cannot be rotated without changing the identity of the row.
  //
  // `accepted_at IS NULL` is the single-use guard — there is deliberately no second
  // `consumed_at` column, because that is the same fact under another name and the
  // partial pending index already reads this one.
  //
  // RETURNS the email, and that is load-bearing rather than convenience: NULL means
  // the invitation was OPEN, which is what decides whether accepting it may derive a
  // verified address. The caller cannot ask afterwards — the row is spent.
  rpc ConsumeOrgInviteByToken(ConsumeOrgInviteByTokenReq) returns (ConsumeOrgInviteByTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgInvite i SET "
          "accepted_at = NOW() "
          "WHERE i.token_hash = :token_hash AND i.accepted_at IS NULL AND i.closed_at IS NULL AND i.expires_at > NOW() "
          "AND EXISTS (SELECT o.id FROM @module.Organization o WHERE o.id = i.org_id AND o.deleted_at IS NULL) "
          "RETURNING id AS invite_id, org_id, role, email, metadata, role_snapshot, "
          "          ?feature(membership_kinds) kind"
      }
    };
    // The acceptance's announcement. OrgInviteAccepted was declared and nothing
    // emitted it: acceptance moved to this token-keyed claim and the emit
    // stayed behind with nobody (an id-keyed claim that nothing called, removed
    // in rc.19), so a subscriber waiting for "joined" never fired. Emitted
    // after commit, so a claim the transaction rolls back — a role that moved
    // since the invitation — announces nothing.
    option (w17.event_emit) = {
      event: "OrgInviteAccepted"
      payload: {
        fields: [
          { key: "invite_id", value: "$response.invite_id" },
          { key: "org_id",    value: "$response.org_id" },
          { key: "user_id",   value: "$request.user_id" },
          { key: "role",      value: "$response.role" }
        ]
      }
    };
  }

  // CloseExpiredOrgInvite — release the slot an EXPIRED invitation holds, by
  // closing it (closed_at; closed_by NULL — nobody withdrew it, it lapsed).
  // Was ClearExpiredOrgInvite, which deleted the row; the row stays.
  //
  // The pending-invite index is unique on (org_id, email) WHERE accepted_at
  // IS NULL AND closed_at IS NULL, and it cannot say "and not expired": a
  // partial index predicate
  // must be IMMUTABLE, and `NOW()` is not. So an invitation that lapsed still
  // occupies the pair, and re-inviting the same address fails on a unique
  // violation whose message reads like two people racing — when in fact
  // nobody is, and the blocker is a row the inviter can see in their own
  // list and cannot get past.
  //
  // Expired only. A LIVE invitation must still block a second one: that
  // refusal is correct and is what stops two roles being offered to one
  // address at once.
  //
  // Zero rows is the ordinary case — nothing has lapsed — and arrives as
  // NOT_FOUND because of the RETURNING. The caller treats it as "nothing to
  // clear" rather than as a failure.
  rpc CloseExpiredOrgInvite(CloseExpiredOrgInviteReq) returns (CloseExpiredOrgInviteResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgInvite SET closed_at = NOW() "
          "WHERE org_id = :org_id AND email = :email "
          "AND accepted_at IS NULL AND closed_at IS NULL AND expires_at <= NOW() "
          "RETURNING id"
      }
    };
  }

  // CloseOrgInvitesOfOrg — close every pending invitation of an organization
  // being deleted (AuthService.RemoveOrganization runs it before
  // DeleteOrganization, in one transaction). No RETURNING: an organization
  // with none is not an error.
  rpc CloseOrgInvitesOfOrg(CloseOrgInvitesOfOrgReq) returns (CloseOrgInvitesOfOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgInvite SET closed_at = NOW(), closed_by = :closed_by "
          "WHERE org_id = :org_id AND accepted_at IS NULL AND closed_at IS NULL"
      }
    };
  }

  // CloseOrgInvite — withdraw a PENDING invitation: closed_at and closed_by
  // are stamped and the row stays; every path that binds, accepts or lists a
  // pending invitation skips a closed one. Was DeleteOrgInvite. Scoped by
  // org_id in the WHERE and not only by id: the handler already knows the
  // caller's active org, and an id-only close would let a member of one
  // organization revoke another's invitation by guessing a uuid. Guarded on
  // `closed_at IS NULL`: a second withdrawal matches nothing (NotFound), as
  // the delete did.
  rpc CloseOrgInvite(CloseOrgInviteReq) returns (CloseOrgInviteResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgInvite SET closed_at = NOW(), closed_by = :closed_by "
          "WHERE id = :invite_id AND org_id = :org_id AND accepted_at IS NULL AND closed_at IS NULL "
          "RETURNING id AS invite_id"
      }
    };
    option (w17.event_emit) = {
      event: "OrgInviteRevoked"
      payload: {
        fields: [
          { key: "invite_id", value: "$response.invite_id" },
          { key: "org_id",    value: "$request.org_id" }
        ]
      }
    };
  }

  // ── oauth_server writes ──

  rpc CreateOAuthClient(CreateOAuthClientReq) returns (CreateOAuthClientResp) {
