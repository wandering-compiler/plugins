          "INSERT INTO @module.OAuthClient SET "
          "client_id = :client_id, client_id_hash = :client_id_hash, kind = :kind, "
          "client_name = :client_name, client_uri = :client_uri, logo_uri = :logo_uri, "
          "redirect_uris = :redirect_uris, software_id = :software_id, created_ip = :created_ip, "
          "metadata_fetched_at = :metadata_fetched_at "
          "RETURNING id, created_at"
