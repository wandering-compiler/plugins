  rpc ConsumeOAuthCode(ConsumeOAuthCodeReq) returns (ConsumeOAuthCodeResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
