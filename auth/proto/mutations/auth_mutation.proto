  // DeleteTeam — see its request message. The first op locks the team, so a
  // member or a role added at the same time waits for it and then finds no
  // live team.
  rpc DeleteTeam(DeleteTeamReq) returns (DeleteTeamResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "team"
        dql:  "UPDATE @module.Team SET id = id WHERE id = :id AND org_id = :org_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "TEAM_NOT_FOUND"
          message:    "That team does not exist, or it was deleted."
        }
      }
      ops: {
        name: "members"
        dql:
          "UPDATE @module.TeamMember SET removed_at = NOW(), removed_by = :deleted_by, ended_key = id "
          "WHERE team_id = :team.id AND removed_at IS NULL"
      }
      ops: {
        name: "roles"
        dql:
          "UPDATE @module.TeamRole SET revoked_at = NOW(), revoked_by = :deleted_by, ended_key = id "
          "WHERE team_id = :team.id AND revoked_at IS NULL"
      }
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Team SET deleted_at = NOW(), deleted_by = :deleted_by, ended_key = id "
          "WHERE id = :team.id AND deleted_at IS NULL "
          "RETURNING id AS team_id"
      }
    };
  }

  // EnableOrgPackage — a new live row; a live duplicate is refused by the
  // unique index (the caller checks first).
  rpc EnableOrgPackage(EnableOrgPackageReq) returns (EnableOrgPackageResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_packages";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.OrgPackage SET "
          "org_id = :org_id, "
          "package = :package, "
          "enabled_by = :enabled_by "
          "RETURNING id AS id"
      }
    };
  }

  // EndOrgPackage — switches the live row off; nothing is deleted.
  rpc EndOrgPackage(EndOrgPackageReq) returns (EndOrgPackageResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_packages";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.OrgPackage SET ended_at = NOW(), ended_by = :ended_by, ended_key = id "
          "WHERE org_id = :org_id AND package = :package AND ended_at IS NULL "
          "RETURNING id AS id"
      }
    };
  }

  // AddTeamMember — see its request message. The first op locks the live team
  // of the organization (DeleteTeam takes the same lock).
  rpc AddTeamMember(AddTeamMemberReq) returns (AddTeamMemberResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "team"
        dql:  "UPDATE @module.Team SET id = id WHERE id = :team_id AND org_id = :org_id AND deleted_at IS NULL RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_NOT_FOUND
          error_code: "TEAM_NOT_FOUND"
          message:    "That team does not exist, or it was deleted."
        }
      }
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.TeamMember SET "
          "team_id = :team.id, "
          "user_id = :user_id, "
          "org_id = :org_id, "
          "added_by = :added_by "
          "RETURNING id AS member_id"
      }
    };
  }

  rpc RemoveTeamMember(RemoveTeamMemberReq) returns (RemoveTeamMemberResp) {
