syntax = "proto3";

// Auth plugin — User + UserToken + RBAC table definitions.
//
// Wire identity (`w17.contrib.auth`) is derived from the
// plugin's manifest `name`; the placement-layer identity
// comes from the activation's `registered_as` (default:
// source_name). Tables emit as `<registered_as>_<message_lower>`
// via the existing module-prefix derivation; the path the IR
// loader sees at codegen time is
// `domains/<activating_domain>/<registered_as>/types/models.proto`
// because the plugin staging step copies this file there with
// `@project` / `@pkg` / `@self` expanded.
//
// Tables target the project's lock-declared default connection
// — this plugin omits any (w17.module).connection annotation,
// so default-connection binding stays implicit.
//
// Identifier strategy — every PK + every FK across this plugin
// is UUID (string carrier, type: UUID). PKs carry
// `default_auto: UUID_V7` so inserts get time-sortable values
// app-side without round-tripping through a sequence; PG emits
// native UUID storage (16 bytes, indexable), MySQL/SQLite emit
// CHAR(36)/TEXT with auto-emitted regex CHECK. FKs share the
// same type so the storage shape matches end-to-end.

package w17.contrib.auth;

import "google/protobuf/timestamp.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

// go_package is resolved per-activation at install/codegen
// time. `@project` expands to
// `<go_module>/<pb_root>/<activating_domain>/<registered_as>`
// and `@pkg` to `<registered_as>pb` (or `<registered_as>_pb`
// when registered_as already ends in `pb`).
option go_package = "@project;@pkg";

// TokenType — the credential class a UserToken belongs to, and the
// realm a Role applies to. SESSION is the browser bearer session
// (today's only kind); API is the API / MCP token issued for non-
// browser clients. Authenticate resolves a token's permissions from
// the user's roles whose realm matches the presented token's type.
// SESSION = 1 is
// the DB default so existing + IssueToken-minted tokens stay session
// tokens.
enum TokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  TOKEN_TYPE_SESSION     = 1;
  TOKEN_TYPE_API         = 2;
}

// User — the project-wide identity record. One row per
// distinct sign-up; emails are unique inside the activation's
// table.
//
// Plugin protos deliberately OMIT `(w17.db.table).name` so the
// table identifier derives from the activation's
// `registered_as` (the synthetic module slot) — e.g. activating
// auth as `w17auth` produces `w17auth_user`. The bare table
// name `user` collides with the Postgres reserved keyword;
// the activation prefix sidesteps that.
message User {
  option (w17.db.table) = {};

  string id = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string email = 2 [(w17.field) = { type: EMAIL, max_len: 320, unique: true }];
  string password_hash = 3 [(w17.field) = { type: PASSWORD }];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];

  // email_verified_at — when the user confirmed ownership of their
  // address via the `email_verification` flow (VerifyEmail). NULL = not
  // verified. Non-blocking by default: SignIn does NOT reject an
  // unverified user (a project can layer that policy on); the column just
  // records the fact for projects that want to gate features on it. Field-
  // gated `email_verification`: absent entirely when the feature is off.
  google.protobuf.Timestamp email_verified_at = 6 [
    (w17.field) = { type: DATETIME, null: true },
    (w17.contrib.plugin_feature_field) = "email_verification"
  ];
  // HOW that address was proved, because "verified" stopped being one thing.
  //
  // A bound invitation derives it: the invitation named this address and the
  // secret link reached whoever registered, so no round trip is needed. That is
  // weaker than a confirmation the person completed themselves, and a deployment
  // is allowed to demand the stronger one — which it cannot do while both look
  // identical in the data. Hence a METHOD beside the timestamp rather than a
  // second boolean: `email_verification_mode = at_least_derived` has to be able
  // to tell them apart, and one nullable timestamp cannot say which.
  //
  // ⚠️ The derivation is only as good as the channel the link travelled, and it
  // says nothing at all about an OPEN invitation, where the registrant picks the
  // address. There the method stays UNPROVEN even though the caller was
  // authorised — authorisation is not address proof
  // (decisions/invite-proof-belongs-on-the-link).
  //
  // ⚠️ `zero_is_value` for the same reason `kind` below carries it: UNPROVEN is
  // the answer for every address that existed before this column, so 0 has to be
  // a stored classification rather than the proto3 sentinel. Without it the
  // codegen refuses `default_int: 0` outright ("0 is not a value of enum
  // EmailProof (valid: [1 2])") — the enum would have a value no row could hold
  // and the ADD COLUMN would have no default to backfill with.
  EmailProof email_proof = 9 [
    (w17.field) = { type: ENUM, zero_is_value: true, default_int: 0 },
    (w17.contrib.plugin_feature_field) = "email_verification"
  ];

  // tenant_id — the owning tenant, behind `tenant_scope`. Sourced
  // from auth (AuthQuery.GetUserTenant) into the `tenant_id` data
  // scope; never client-set. NOT NULL so every user resolves a
  // tenant. No DB-level FK (the activation-rename caveat that
  // applies to every cross-table id ref in this plugin — see
  // UserToken.user_id); referential integrity is app-enforced.
  // Field-gated: dropped entirely when `tenant_scope` is off, and
  // it shares the tag with the Tenant message so the FK target +
  // the column drop atomically (no dangling reference).
  string tenant_id = 5 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];

  // disabled_at — when an admin soft-disabled this account (the
  // Django `is_active` analogue, inverted: NULL = active, non-NULL =
  // disabled). A disabled account holds no working credential:
  // SignIn and every other path that issues a token refuse it, and
  // Authenticate refuses every token it already has, session or API,
  // for as long as it stays disabled (handlers/user_admin.go overrides
  // the signInDisabledGate seam). DisableUsers also revokes the tokens
  // (USER_DISABLED); the check on every request covers one minted after
  // it. Set /
  // cleared by AuthMutation.DisableUsers / EnableUsers from the admin
  // Users page. Field-gated `user_admin`: absent entirely when the
  // feature is off, so the always-compiled SignIn handler must reach
  // it only through the seam (never name the field directly).
  google.protobuf.Timestamp disabled_at = 7 [
    (w17.field) = { type: DATETIME, null: true },
    (w17.contrib.plugin_feature_field) = "user_admin"
  ];

  // kind says whether this account is a PERSON or a machine.
  //
  // An enum and not a string: an int-carrier enum column generates a
  // `CHECK IN (…)`, so "some other kind of account" cannot reach the
  // database at all.
  //
  // ⚠️ `zero_is_value` — HUMAN is 0 because that is the answer for every
  // account that existed before this feature, and for every account a person
  // signs up as. Left as the proto3 sentinel it would be excluded from the
  // CHECK and unavailable as a default, and "not a bot" would have to be
  // stored as NULL — an indirection on the field that a security decision
  // reads.
  //
  // Field-gated `service_account`: absent entirely when the feature is off,
  // so the always-compiled SignIn handler must reach it through the seam and
  // never name it directly — the same rule `disabled_at` above carries.
  AccountKind kind = 8 [
    (w17.field) = { zero_is_value: true, default_int: 0 },
    (w17.contrib.plugin_feature_field) = "service_account"
  ];

  // device_trust_revoked_at — when this account's device trust was last
  // revoked as a whole. A Device trusted at or before this instant no longer
  // counts as trusted (`two_factor_scope=new_devices` challenges it again).
  // NULL = never revoked.
  //
  // Written by the statements that end an account's credentials, in the same
  // statement: a password CHANGE (UpdateUserPasswordIfUnchanged) and
  // disabling the account (DisableUsers). A changed password usually means
  // "someone else may have the old one", and a device that person signed in
  // from must not keep skipping the second factor. A stamp on the account,
  // not a write to every Device row: those statements belong to other
  // features and stay single-statement.
  //
  // Base tier since device identity became base (it was gated `devices`).
  google.protobuf.Timestamp device_trust_revoked_at = 10 [
    (w17.field) = { type: DATETIME, null: true }
  ];

  // erased_at — when this account was ERASED on request (GDPR): NULL = never.
  // Erasure is not a delete. The row stays, with its history, and its personal
  // data is replaced in place: the email becomes `erased-<id>@erased.invalid`
  // (unique, non-routable, and it frees the old address for a new sign-up),
  // the password hash becomes the unusable `!`, and the account is disabled,
  // its tokens and devices revoked. Set once by AuthMutation.EraseUser, never
  // cleared: EnableUsers and UpdateUser leave an erased account alone, so it
  // cannot be turned back into a usable one. Field-gated `user_admin`, like
  // disabled_at: the erase action belongs to the admin Users page.
  google.protobuf.Timestamp erased_at = 11 [
    (w17.field) = { type: DATETIME, null: true },
    (w17.contrib.plugin_feature_field) = "user_admin"
  ];
}

// RevokeReason — why a UserToken stopped being valid before its expiry. The
// first revocation wins: every revoking statement is guarded on
// `revoked_at IS NULL`, so a later one never rewrites the time, the reason or
// who did it.
//
// Values are explicit and never reused; a token revoked by a path added later
// gets a new number. NONE (0) is the stored value of every live token, which is
// why it is a real value (`zero_is_value`) rather than the proto3 sentinel.
// Prefixed because proto enum values share the package's scope.
enum RevokeReason {
  // Not revoked.
  REVOKE_REASON_NONE = 0;
  // The holder signed out (Logout).
  REVOKE_REASON_LOGOUT = 1;
  // The owner revoked their own API token (RevokeApiToken).
  REVOKE_REASON_API_TOKEN_REVOKED = 2;
  // A password change signed the account out of its other sessions.
  REVOKE_REASON_PASSWORD_CHANGED = 3;
  // A password reset ended every token of the account.
  REVOKE_REASON_PASSWORD_RESET = 4;
  // The device the token is bound to was revoked (RevokeDevice and the
  // revoke-others / revoke-all calls).
  REVOKE_REASON_DEVICE_REVOKED = 5;
  // A session bound to no device (minted before device binding), ended by
  // RevokeOtherDevices / RevokeAllDevices.
  REVOKE_REASON_UNBOUND_SESSION = 6;
  // An operator revoked it from the admin Sessions page.
  REVOKE_REASON_ADMIN_REVOKED = 7;
  // The account was disabled (DisableUsers).
  REVOKE_REASON_USER_DISABLED = 8;
  // The account was erased (EraseUser).
  REVOKE_REASON_USER_ERASED = 9;
  // Project code revoked it through the low-level AuthMutation.RevokeToken
  // (by the token itself, e.g. while rotating it).
  REVOKE_REASON_TOKEN_REVOKED = 10;
  // Project code revoked every token of the account through
  // AuthMutation.RevokeAllUserTokens.
  REVOKE_REASON_ALL_TOKENS_REVOKED = 11;
}

// AccountKind separates people from machines.
//
// The distinction is not cosmetic and is not only for the admin UI: it is what
// makes "an admin may mint a token for another account" safe to offer at all.
// Without it that endpoint is "make yourself access as anyone".
// EmailProof — how an address came to be trusted, for deployments that care
// about the difference. Ordered weakest to strongest so a mode can be read as a
// floor.
enum EmailProof {
  // Nobody proved anything. The state of every address today that did not go
  // through VerifyEmail, and of every OPEN invitation's registrant.
  UNPROVEN = 0;
  // A bound invitation: the invitation named this address, and the secret link
  // reached the person who registered. No round trip asked of them.
  DERIVED_FROM_INVITE = 1;
  // The address made a round trip: the `email_verification` link, a
  // `sign_up_confirmation` code, or an OAuth provider asserting
  // email_verified=true for the account it created.
  SELF_CONFIRMED = 2;
}

enum AccountKind {
  // A person. Zero on purpose — see `User.kind`.
  HUMAN = 0;
  // A machine: CI, a deploy runner. Cannot sign in with a password; acts
  // only through an API token an admin minted for it.
  BOT = 1;
}

// Tenant — an isolation boundary (organization / workspace) that
// owns users. Behind `tenant_scope`: present only when the
// activation enables tenant scoping. `User.tenant_id` references a
// row here (app-enforced; same no-DB-FK caveat as the rest of the
// plugin). The authenticated principal's tenant becomes the
// `tenant_id` data scope, so a project that scopes its owned rows
// by `name: "tenant_id"` gets per-tenant isolation with no hand-
// written facade — sourced from auth as the data-scope rule
// requires.
message Tenant {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "tenant_scope";

  string id   = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  // name doubles as the URL slug — SignUp resolves a tenant by it
  // when the REST path carries `{tenant_slug}` (AuthQuery.GetTenantBySlug).
  string name = 2 [(w17.field) = { type: SLUG, max_len: 100, unique: true }];
  // domain — the host that maps to this tenant (e.g. `acme.example.com`),
  // for host-based resolution at SignUp (AuthQuery.GetTenantByDomain reads
  // the forwarded Host header). Nullable: a tenant may be slug-only.
  string domain = 4 [
    (w17.field) = { type: CHAR, max_len: 253, unique: true, null: true },
    (w17.db.column) = { index: true }
  ];
  google.protobuf.Timestamp created_at = 3 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// UserToken — bearer-token record. Project clients trade an
// (email, password) sign-in for a long-lived token they send
// on subsequent requests. A token ends when it expires or is
// revoked, and in both cases the row STAYS: revoking sets
// revoked_at (+ revoked_by, revoke_reason), and nothing deletes a
// token, so the table is the history of every credential the
// account ever held.
//
// v1 LIMITATION — no DB-level FK constraint on `user_id`. The
// FK target table name is `<registered_as>_user`, but plugin
// authoring time can't see the per-activation rename, and
// w17's current `fk:` syntax doesn't carry an activation-aware
// placeholder. Application-layer code enforces the link via
// the AuthService handler. Lifting this requires extending the
// FK syntax with a plugin-aware reference (parked). Same
// caveat applies to every cross-table id reference in this
// plugin (User↔Role + Role's permission grants via RolePermission).
message UserToken {
  option (w17.db.table) = {};

  string id = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  // LEGACY: the bearer token in the clear, as rows minted before 0.1.0-rc.24
  // still hold it. Nothing writes it any more — a token is stored only as
  // token_hash — and the lookup that finds a row by it moves the row to the
  // hash and clears this column (UpgradeTokenHash). A later release drops it,
  // which ends every legacy token that was never used in between.
  string token = 2 [(w17.field) = {
    type: SECRET
    max_len: 64
    unique: true
    null: true
  }];
  string user_id = 3 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true }
  ];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];

  // expires_at — absolute token lifetime. BASE-TIER (not api_token-
  // gated): expiry is a universal token concept, not API-token-only.
  // Session tokens get it set at mint time (IssueToken, from the
  // configurable session_token_ttl_seconds, default 30d); API tokens
  // are minted with it NULL today (never-expiring, the historical
  // behaviour). NULL = never expires. The token-validation queries
  // enforce `expires_at IS NULL OR expires_at > NOW()`, so the NULL
  // case keeps never-expiring tokens valid across every config.
  google.protobuf.Timestamp expires_at = 8 [(w17.field) = { type: DATETIME, null: true }];

  // token_type — SESSION (browser bearer, the default) vs API (MCP /
  // non-browser). DB default SESSION (=1) so existing rows + IssueToken-
  // minted tokens are session tokens; CreateApiToken stamps API.
  // Gated by api_token: a project using only session bearer tokens
  // carries no token_type column (every token is implicitly a session),
  // so enabling/​disabling the feature is the only thing that touches the
  // token schema — no breaking column on projects that don't opt in.
  TokenType token_type = 5 [
    (w17.field) = { type: ENUM, default_int: 1 },
    (w17.contrib.plugin_feature_field) = "api_token"
  ];

  // --- api_token feature: management metadata for API/MCP tokens ---
  // Dropped together when the feature is off (a project using only
  // session bearer tokens carries none of these columns). `name` is the
  // human label shown in the token list; last_used_at backs audit.
  // (expiry lives in the base-tier expires_at above — it applies to
  // every token, not just API ones.)
  string name = 6 [
    (w17.field) = { type: CHAR, max_len: 128, blank: true },
    (w17.contrib.plugin_feature_field) = "api_token"
  ];
  google.protobuf.Timestamp last_used_at = 7 [
    (w17.field) = { type: DATETIME, null: true },
    (w17.contrib.plugin_feature_field) = "api_token"
  ];

  // device_id — the Device this token is BOUND to (DPoP's `cnf.jkt`, kept
  // as a reference to the Device row whose `thumbprint` is the binding).
  // Every session mint path (SignIn, SignUp, ConfirmSignUp, VerifyMfa,
  // OAuthExchange, CliToken) stamps it from the request's proof of
  // possession; an API token (CreateApiToken, IssueBotToken) from the public
  // key its request names — the program that will use it. Authenticate
  // refuses a token whose device's thumbprint is not the one the request's
  // proof was signed with, and a token with none.
  // No DB-level FK (the activation-rename caveat that applies to every
  // cross-table id ref in this plugin — see the message header).
  // Nullable only for rows minted before device binding (refused by
  // Authenticate, so their holders sign in once more) and for MCP-flow
  // tokens (mcp_only).
  string device_id = 9 [
    (w17.field) = { type: UUID, null: true },
    (w17.db.column) = { index: true }
  ];

  // mcp_only — a token issued by the MCP OAuth 2.1 flow, for MCP clients,
  // which cannot sign DPoP proofs yet. It is accepted WITHOUT a proof, and
  // only on the MCP surface: Authenticate takes a proofless request only
  // when the gateway marks it `x-w17-surface: mcp` (a gateway-owned key no
  // client can set), and only for a token with this flag. Refused on every
  // other surface, with or without a proof (it is bound to no device). The
  // authorization server that mints it sets it; nothing else does — every
  // other mint leaves the FALSE default. Base tier.
  bool mcp_only = 11 [(w17.field) = { default_auto: FALSE }];

  // token_hash — sha256 (hex) of the bearer token, the only form a token is
  // stored in. The handler that mints a token generates it, stores this
  // hash and hands the token to the caller once; a lookup hashes the
  // presented bearer and compares. Whoever reads the table or a backup gets
  // nothing they can present. SECRET keeps it out of admin list views even
  // so. NULL only on a legacy row (see `token`).
  string token_hash = 10 [(w17.field) = {
    type: SECRET
    max_len: 64
    unique: true
    null: true
  }];

  // revoked_at — when the token was revoked; NULL = not revoked. BASE-TIER,
  // like expires_at: revocation applies to every token. Every revoking
  // statement is an UPDATE guarded on `revoked_at IS NULL`, so the first
  // revocation's time, reason and actor stand and a later one changes
  // nothing. Every token lookup refuses a revoked token exactly as it refuses
  // an expired one (`revoked_at IS NULL` beside the expiry predicate), and the
  // miss-path lookup reads the row so the key's holder hears SESSION_EXPIRED
  // (or DEVICE_REVOKED) as for an expired token, and anyone else the opaque
  // refusal. Never cleared: a revoked token is not revived.
  google.protobuf.Timestamp revoked_at = 12 [(w17.field) = { type: DATETIME, null: true }];

  // revoked_by — the account that revoked it: the holder for a logout, a
  // password change or a device revocation, the operator for an admin
  // revocation or erasure. NULL when the system did it (a password reset, a
  // disable, the low-level RevokeToken primitive). No DB-level FK (the
  // activation-rename caveat in the message header).
  string revoked_by = 13 [(w17.field) = { type: UUID, null: true }];

  // revoke_reason — why (RevokeReason). NONE on a live token. Written in the
  // same statement as revoked_at, so the two never disagree.
  RevokeReason revoke_reason = 14 [(w17.field) = { type: ENUM, zero_is_value: true, default_int: 0 }];

  // public_computer — the session was signed in with "this is a public
  // computer" (SignIn, VerifyMfa through its challenge, OAuthExchange,
  // SignUp, ConfirmSignUp): it got the public session lifetime
  // (public_session_ttl_seconds) and its device was not made trusted. Shown
  // on the admin Sessions page; the client keeps such a token in session
  // storage only. FALSE for every other token. Base tier.
  bool public_computer = 15 [(w17.field) = { default_auto: FALSE }];

  // approved_by_device_id — the Device row of the session that AUTHORIZED a
  // token bound to another key: for a CLI session (cli_login's CliToken) the
  // browser session that approved the login (CliAuthorize); for an API token
  // the caller's device that created it (CreateApiToken) or, for a machine
  // account's token, the operator's device that issued it (IssueBotToken).
  // The token itself is bound to the CLI's, the program's or the machine
  // account's own key (device_id); the authorizing device is a different one
  // and is recorded here, so an operator can see "approved from device X".
  // Revoking that device revokes the tokens it approved of the same owner: a
  // stolen session could otherwise approve a key of the thief's that outlives
  // the revocation. CLI sessions end with every revocation of the device
  // (RevokeDeviceTokens' "approved" op); API tokens when that ONE device is
  // revoked on purpose — the owner's RevokeDevice, the admin Devices revoke
  // (RevokeApprovedApiTokens) — and not by RevokeOtherDevices /
  // RevokeAllDevices, which spare API tokens. A machine account's token is
  // owned by the machine account, not the operator, so revoking the
  // operator's device leaves it (it is bound to the account's one key; revoke
  // the account's device to end it). NULL on every
  // other token, and when the authorizing request was bound to no device. Base
  // tier. No DB-level FK (the activation-rename caveat in the message header).
  string approved_by_device_id = 16 [(w17.field) = { type: UUID, null: true }];

  // bearer — a machine account's token that works WITHOUT a proof of
  // possession (device/bot-bearer): bound to no device, presented as
  // `Bearer`, and recognisable by its prefix (botBearerPrefix) so that
  // Authenticate still refuses every other proofless request before the
  // lookup. Only IssueBotToken's keyless path sets it (IssueBotBearerToken),
  // only for an account of kind BOT, and always with an expires_at. The flag on
  // the row is what authorizes the request, never the prefix: a token without
  // the flag is refused proofless whatever it looks like. FALSE on every other
  // token. Gated service_account.
  bool bearer = 17 [
    (w17.field) = { default_auto: FALSE },
    (w17.contrib.plugin_feature_field) = "service_account"
  ];
}

// Device — one (user, device key) pair. Base tier: every session is bound
// to one.
//
// A device is identified by the RFC 7638 JWK thumbprint of the public key
// its client signs DPoP proofs with (base64url SHA-256, 43 characters). The
// gateway verifies the proof and hands the thumbprint to the plugin as the
// `x-w17-dpop-jkt` metadata; no header, body field or envelope value a
// client sends can name a device. The private key never leaves the client.
//
// Keyed by (user_id, thumbprint), not by the thumbprint alone: trust and
// revocation belong to the pair, so one browser shared by two accounts is
// two rows, and one account's trust never carries over to the other.
//
// `trusted_at` is the signal `two_factor_scope=new_devices` reads: set by a
// sign-in that passed the second factor, renewed by a later one, and void
// when it is not later than User.device_trust_revoked_at. Holding the key
// is the proof, so there is no separate trust token to steal.
//
// `revoked_at` ends the pair for good: every token bound to it is refused,
// and a sign-in with the same key is refused with DEVICE_REVOKED. The row
// is never deleted and never revived — a client answers DEVICE_REVOKED by
// generating a new key, which is a new device (and passes the second factor
// like any new device).
//
// Same no-DB-FK caveat as the rest of the plugin (user_id is app-enforced;
// see UserToken).
message Device {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "user_id" }, { name: "thumbprint" }] }
    ]
  };

  // 3 = identifier (a client-chosen X-Device-Id or a UA+IP fingerprint),
  // 9 = trust_token_hash (a server-issued trust token the client replayed):
  // both replaced by the key thumbprint.
  reserved 3, 9;
  reserved "identifier", "trust_token_hash";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id     = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  // RFC 7638 JWK thumbprint of the device's public key: base64url (no
  // padding) of a SHA-256, always 43 characters. NULL only on a LEGACY row —
  // a device recorded before device binding, named by a client-chosen id
  // and never by a key. Such rows are kept as history (nothing in the auth
  // tables is deleted) and can never be used: no key matches them, so
  // RegisterDevice never finds one, a token bound to one resolves with no
  // thumbprint and is refused, and ListUserDevices leaves them out. The
  // unique (user_id, thumbprint) index does not make NULLs collide (the
  // default NULLS DISTINCT of every supported dialect), so any number of
  // legacy rows coexist while live keys stay unique per user.
  string thumbprint  = 10 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  string label       = 4 [(w17.field) = { type: CHAR, max_len: 255, blank: true }]; // UA-derived friendly name
  // IP-as-string (CHAR, not INET): the request may carry no client IP
  // (absent X-Forwarded-For), and an empty string is a valid CHAR but not a
  // valid INET. Stored for display in ListDevices only.
  string ip          = 5 [(w17.field) = { type: CHAR, max_len: 45, blank: true }];
  google.protobuf.Timestamp trusted_at   = 6 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp last_seen_at = 7 [(w17.field) = { type: DATETIME, default_auto: NOW }];
  google.protobuf.Timestamp created_at   = 8 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // When the pair was revoked; NULL = live. Set once, never cleared.
  google.protobuf.Timestamp revoked_at   = 11 [(w17.field) = { type: DATETIME, null: true }];
  // api_key — a PROGRAM's key, named in an API-token request (CreateApiToken,
  // IssueBotToken) rather than proved by a sign-in. Set when the row is
  // created and never changed: a key is a program's or a signed-in client's
  // for good. A program key never signs in (every sign-in mint refuses it),
  // a signed-in client's key is never taken for an API token, and the
  // owner's device management (`devices`: ListDevices, RevokeOtherDevices,
  // RevokeAllDevices) lists and revokes signed-in devices only — an API
  // token ends by RevokeApiToken, by revoking its device on the admin
  // Devices page, or by revoking the one device that created it. Base tier.
  bool api_key = 12 [(w17.field) = { default_auto: FALSE }];
}

// SignInMethod — which mint path a SignInEvent records. Values are explicit
// and never reused; a mint path added later gets a new number. Prefixed
// because proto enum values share the package's scope.
enum SignInMethod {
  SIGN_IN_METHOD_UNSPECIFIED = 0;
  // SignIn: an address and a password (the admin's sign-in included).
  SIGN_IN_METHOD_PASSWORD = 1;
  // VerifyMfa: the second step of a password sign-in (two_factor).
  SIGN_IN_METHOD_MFA = 2;
  // SignUp when it issues a session (sign_up_turnkey without
  // sign_up_confirmation). A parked registration signs nobody in and is not
  // recorded; its ConfirmSignUp is.
  SIGN_IN_METHOD_SIGN_UP = 3;
  // ConfirmSignUp (sign_up_confirmation).
  SIGN_IN_METHOD_SIGN_UP_CONFIRM = 4;
  // OAuthExchange: the page redeems the provider's login code (oauth).
  SIGN_IN_METHOD_OAUTH = 5;
  // CliToken: a CLI redeems the code a signed-in browser approved
  // (cli_login).
  SIGN_IN_METHOD_CLI = 6;
  // CreateApiToken: a signed-in person issues an API token bound to a
  // program's key (api_token). Not a sign-in of the request's own client, but
  // a credential minted for a device all the same; the row names that
  // device, and the client address and user agent of the creating request.
  SIGN_IN_METHOD_API_TOKEN = 7;
  // IssueBotToken: an operator issues a machine account's token bound to its
  // key (service_account). The row names the machine account and its device,
  // and the operator's client address and user agent.
  SIGN_IN_METHOD_BOT_TOKEN = 8;
}

// SignInOutcome — how a sign-in attempt ended. One value per refusal the mint
// paths make; what the caller was told is unchanged (most of these reach the
// wire as the same opaque refusal — the history is the operator's, never the
// caller's). Values are explicit and never reused.
enum SignInOutcome {
  SIGN_IN_OUTCOME_UNSPECIFIED = 0;
  // A session was issued.
  SIGN_IN_OUTCOME_OK = 1;
  // The password was right and a second factor was asked for (SignIn
  // answered mfa_required). VerifyMfa records how it ended.
  SIGN_IN_OUTCOME_MFA_REQUIRED = 2;
  // No account has the address (user_id NULL).
  SIGN_IN_OUTCOME_UNKNOWN_ACCOUNT = 3;
  // The account exists; the password was wrong.
  SIGN_IN_OUTCOME_WRONG_PASSWORD = 4;
  // The account is disabled (or erased).
  SIGN_IN_OUTCOME_ACCOUNT_DISABLED = 5;
  // A machine account (service_account) tried a password sign-in.
  SIGN_IN_OUTCOME_MACHINE_ACCOUNT = 6;
  // The request proved no device key (DEVICE_PROOF_REQUIRED).
  SIGN_IN_OUTCOME_DEVICE_PROOF_REQUIRED = 7;
  // The device key was revoked for this account (DEVICE_REVOKED; for an API
  // or machine-account token, the key its request names: DEVICE_KEY_REVOKED).
  SIGN_IN_OUTCOME_DEVICE_REVOKED = 8;
  // A single-use code was wrong, unknown, expired or spent: the second
  // factor's code, a sign-up confirmation code, an OAuth login code or its
  // verifier, a CLI code, its verifier or its redirect.
  SIGN_IN_OUTCOME_WRONG_CODE = 9;
  // The code's attempt budget was spent (an MFA challenge, a pending
  // sign-up).
  SIGN_IN_OUTCOME_TOO_MANY_ATTEMPTS = 10;
  // VerifyMfa signed by another key than the challenged sign-in.
  SIGN_IN_OUTCOME_OTHER_DEVICE = 11;
  // Too many second-factor challenges for the account in the window.
  SIGN_IN_OUTCOME_RATE_LIMITED = 12;
  // A registration named an address that has an account (EMAIL_TAKEN).
  SIGN_IN_OUTCOME_EMAIL_TAKEN = 13;
  // A registration refused by a sign-up gate: the reserved domain, the
  // allowlist, invite-only, an invitation for another address, an unknown
  // tenant.
  SIGN_IN_OUTCOME_SIGN_UP_REFUSED = 14;
  // OAuth refused to link an identity: the account or the provider has not
  // verified the address.
  SIGN_IN_OUTCOME_UNVERIFIED_EMAIL = 15;
  // A registered CLI-login client failed its authentication or is revoked.
  SIGN_IN_OUTCOME_CLIENT_REFUSED = 16;
  // The service failed (a store or coordinator outage, an unexpected
  // error): the caller was told so, or refused.
  SIGN_IN_OUTCOME_ERROR = 17;
  // Any other refusal (for example a CLI exchange after the approving
  // session ended).
  SIGN_IN_OUTCOME_REFUSED = 18;
  // An API or machine-account token was asked for with no key, a key that is
  // not a public P-256 or Ed25519 JWK (a private one included), or — for a
  // machine account — another key than the one it has (DEVICE_KEY_REQUIRED,
  // DEVICE_KEY_INVALID, BOT_KEY_MISMATCH).
  SIGN_IN_OUTCOME_KEY_REFUSED = 19;
}

// SignInEvent — the sign-in history: one row per sign-in attempt on every
// mint path (SignInMethod above), whatever its outcome, failures included.
// Base tier.
//
// APPEND-ONLY. A row is written once (RecordSignInEvent) and never updated
// or deleted, with one exception: an erasure (user_admin's EraseUsers)
// pseudonymises the personal columns of the erased account's rows — address,
// ip and user_agent — in place (EraseSignInEvents), and the row stays.
//
// A successful sign-in writes its row in the transaction that mints the
// session, so a session never exists without its history row; a refusal
// writes it on its own, and a failure to write it is logged and does not
// change the refusal the caller gets. An attempt at an account erased
// before it is written without the client's address and user agent, and
// with the account's placeholder address.
//
//   user_id     the account the attempt reached; NULL when it reached none
//               (an unknown address, or a refusal before any account was
//               looked up).
//   address     what the attempt named, normalised (trimmed, lower-case):
//               the typed address of a password sign-in or registration,
//               the provider's address of an OAuth one; blank when the path
//               names none (VerifyMfa, CliToken).
//   device_id   the Device ROW's UUID the attempt registered or found (as
//               UserToken.device_id is, for the session it issued); NULL
//               when it got no further (a wrong password registers no
//               device). NOT the device_id of events and AuthResp: that
//               one is the key thumbprint, the column below.
//   thumbprint  the key that signed the request's proof (the gateway's
//               x-w17-dpop-jkt), even with no Device row; NULL without a
//               proof. This is the id the events and AuthResp.device_id
//               carry, so it is the column to match them on.
//   ip, user_agent  the client address (first X-Forwarded-For hop) and user
//               agent, as Device.ip / Device.label take them. Display only.
//
// No DB-level FK on user_id / device_id (the activation-rename caveat, see
// UserToken).
message SignInEvent {
  option (w17.db.table) = {
    indexes: [
      { fields: [{ name: "user_id" }, { name: "created_at" }] },
      { fields: [{ name: "address" }, { name: "created_at" }] }
    ]
  };

  string id = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  google.protobuf.Timestamp created_at = 2 [
    (w17.field) = { type: DATETIME, default_auto: NOW, immutable: true },
    (w17.db.column) = { index: true }
  ];
  string user_id    = 3 [(w17.field) = { type: UUID, null: true }];
  string address    = 4 [(w17.field) = { type: CHAR, max_len: 320, blank: true }];
  string device_id  = 5 [(w17.field) = { type: UUID, null: true }];
  string thumbprint = 6 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  string ip         = 7 [(w17.field) = { type: CHAR, max_len: 45, blank: true }];
  string user_agent = 8 [(w17.field) = { type: CHAR, max_len: 255, blank: true }];
  SignInMethod  method  = 9 [(w17.field) = { type: ENUM }];
  SignInOutcome outcome = 10 [(w17.field) = { type: ENUM }];
  // The attempt asked for a public-computer session (SignIn, OAuthExchange,
  // SignUp, ConfirmSignUp; VerifyMfa takes it from its challenge). Recorded
  // whatever the outcome.
  bool public_computer = 11 [(w17.field) = { default_auto: FALSE }];
}

// OAuthProvider — an admin-configured OAuth2/OIDC server, behind `oauth`.
// Generic by design: provider differences (GitHub isn't OIDC) are captured
// by userinfo_url + the *_path mapping columns, never per-provider code.
// `secret` is the client secret, CRYPTED_SECRET: encrypted at rest with the
// project's field keyring (W17_FIELD_KEYS), decrypted on read, masked in the
// admin. oauth.go signs the OAuth state with it as an HMAC key and posts it to
// the token endpoint verbatim, so it is read back, never hashed.
//
// `client_secret` is where rc.19 and earlier stored it, in the clear (SECRET).
// It is read only while `secret` is empty, and the first sign-in through the
// provider moves it there (MoveOAuthProviderSecret); once `secret` is set, a
// value in the legacy column is ignored and cleared. Edit `secret`. A fixture
// cannot seed `secret` (the console holds no key), so seeding the legacy
// column is how a dev sandbox gets one until it is removed in a later release.
//
// It is not PASSWORD — the annotation for a hash you VERIFY against, whose
// rules all follow from that. The one that would bite: fixtures refuse a
// PASSWORD value that is not PHC-encoded, correctly for a credential and
// wrongly here, so this row could not be seeded at all.
//
// Operators CRUD these through the generated admin. Same no-DB-FK caveat as
// the rest of the plugin.
message OAuthProvider {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "oauth";

  string id            = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string name          = 2 [(w17.field) = { type: SLUG, max_len: 64, unique: true }]; // url key: /auth/oauth/{name}/...
  string display_name  = 3 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string client_id     = 4 [(w17.field) = { type: CHAR, max_len: 255 }];
  string client_secret = 5 [(w17.field) = { type: SECRET, null: true }]; // legacy, plaintext — moved into `secret` on use
  string authorize_url = 6 [(w17.field) = { type: URL }];
  string token_url     = 7 [(w17.field) = { type: URL }];
  string userinfo_url  = 8 [(w17.field) = { type: URL, blank: true }]; // empty → OIDC id_token claims
  string scopes        = 9 [(w17.field) = { type: CHAR, max_len: 512, blank: true }]; // space-delimited
  // userinfo field mapping — the generic knob that makes non-OIDC
  // providers work without code. Defaults (applied in the handler) suit
  // OIDC: sub / email.
  string subject_path  = 10 [(w17.field) = { type: CHAR, max_len: 128, blank: true }]; // default "sub"
  string email_path    = 11 [(w17.field) = { type: CHAR, max_len: 128, blank: true }]; // default "email"
  bool   enabled       = 12 [(w17.field) = { default_auto: TRUE }];
  google.protobuf.Timestamp created_at = 13 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];

  // tenant_id — same shape as User.tenant_id, so a multi-tenant project
  // can scope providers per tenant. Field-gated `tenant_scope` (drops with
  // the feature). No DB-level FK (app-enforced, like the rest).
  string tenant_id = 14 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
  string secret = 15 [(w17.field) = { type: CRYPTED_SECRET, null: true }]; // the client secret
}

// OAuthIdentity — links a local User to an external IdP subject, behind
// `oauth`. (provider_id, external_id) is unique; a user may link several
// providers. Same no-DB-FK caveat as the rest of the plugin.
message OAuthIdentity {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "provider_id" }, { name: "external_id" }] }
    ]
  };
  option (w17.contrib.plugin_feature) = "oauth";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id     = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string provider_id = 3 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string external_id = 4 [(w17.field) = { type: CHAR, max_len: 255 }]; // the IdP "sub"
  string email       = 5 [(w17.field) = { type: EMAIL, max_len: 320, blank: true }];
  google.protobuf.Timestamp created_at = 6 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// UserTotpSecret — one per user (the built-in authenticator), behind
// `two_factor`. `seed` is the base32 TOTP seed, CRYPTED_SECRET: encrypted at
// rest with the project's field keyring (W17_FIELD_KEYS) and decrypted on
// read; RFC 6238 needs the raw seed to verify, so unlike a password it can't
// be one-way hashed. confirmed_at NULL = enrolled-but-unconfirmed (the first
// code hasn't been verified yet); a user "has an authenticator" iff
// confirmed_at IS NOT NULL. Unique on user_id (one authenticator per user).
// Same no-DB-FK caveat as the rest of the plugin.
//
// `secret` is the seed as rc.19 and earlier stored it — encrypted by the
// plugin's own lib/secretbox under the two_factor_secret_key knob. Nothing
// writes it any more: a row that still has it is read through the old key
// once and moved into `seed` (MoveTotpSeed), so the column empties itself as
// people sign in. It, the knob and lib/secretbox go in a later release.
//
// An authenticator is never deleted. Disabling it, or enrolling a new one in
// its place, revokes it (RevokeTotpSecret): revoked_at is stamped, the seed and
// the legacy secret are cleared — a revoked authenticator's seed is not kept
// usable at rest — and the row stays as the record of when the account had an
// authenticator. Every reader and every verifying statement reads the live row
// only (`revoked_at IS NULL`), so a revoked one verifies nothing.
//
// One LIVE authenticator per user: the unique index is (user_id, ended_key),
// and ended_key is '' on the live row and the row's own id once it is revoked
// (the mechanism every re-addable auth table uses — see ended_key on UserRole).
message UserTotpSecret {
  option (w17.db.table) = {
    indexes: [ { unique: true, fields: [{ name: "user_id" }, { name: "ended_key" }] } ]
  };
  option (w17.contrib.plugin_feature) = "two_factor";

  string id      = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string secret  = 3 [(w17.field) = { type: CHAR, max_len: 512, null: true }]; // legacy: secretbox-encrypted seed (two_factor_secret_key)
  google.protobuf.Timestamp confirmed_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at   = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  string seed    = 6 [(w17.field) = { type: CRYPTED_SECRET, null: true }]; // base32 seed
  // last_step — the highest RFC 6238 time step this authenticator has had
  // accepted. A code is taken only for a LATER step (ClaimTotpStep, one
  // conditional UPDATE), so a code that was used — or overheard — cannot be
  // replayed inside its validity window, by a second request or a concurrent
  // one. 0 = never used.
  int64  last_step = 7 [(w17.field) = { default_int: 0 }];
  // stepup_attempts / stepup_locked_until — the guess budget of the step-up
  // (the code EnrollTotp / DisableTotp / GenerateRecoveryCodes ask for). A
  // sign-in's guesses are bounded per challenge; these calls take a code from
  // a SESSION, so without their own budget a stolen one could try six-digit
  // codes until one landed. RecordStepUpAttempt counts in one statement and
  // refuses while locked; a success resets the count.
  int64  stepup_attempts = 8 [(w17.field) = { type: COUNTER, default_int: 0 }];
  google.protobuf.Timestamp stepup_locked_until = 9 [(w17.field) = { type: DATETIME, null: true }];
  // revoked_at — when the authenticator was disabled or replaced by a new
  // enrolment. NULL = the live one.
  google.protobuf.Timestamp revoked_at = 10 [(w17.field) = { type: DATETIME, null: true }];
  // ended_key — '' while live, the row's own id once revoked; part of the
  // unique index, so a revoked row frees the user for a new enrolment.
  string ended_key = 11 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}

// UserRecoveryCode — the one-time codes that stand in for the authenticator
// when the phone is gone, behind `two_factor`. Issued as a set of ten when an
// authenticator is confirmed (and again on GenerateRecoveryCodes, replacing
// the set), shown once, stored as a SHA-256 hash: a code is ~50 random bits,
// so it is looked up by hash rather than verified against a slow hash, and
// guessing is bounded by the challenge's attempt budget like any MFA code.
// used_at NULL = still usable; ConsumeRecoveryCode spends one atomically.
//
// A set is never deleted. Replacing it (GenerateRecoveryCodes, a new
// confirmation) or disabling the authenticator revokes the unused codes
// (revoked_at), and a revoked code is refused exactly like a used one.
message UserRecoveryCode {
  option (w17.db.table) = {
    indexes: [ { unique: true, fields: [{ name: "user_id" }, { name: "code_hash" }] } ]
  };
  option (w17.contrib.plugin_feature) = "two_factor";

  string id        = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id   = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string code_hash = 3 [(w17.field) = { type: CHAR, max_len: 64 }]; // hex sha256 of the normalised code
  google.protobuf.Timestamp used_at    = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // revoked_at — the set this code belongs to was replaced, or the
  // authenticator disabled, before the code was used. NULL = still part of
  // the live set.
  google.protobuf.Timestamp revoked_at = 6 [(w17.field) = { type: DATETIME, null: true }];
}

// MfaChallenge — a pending second-factor verification, behind
// `two_factor`. Created by SignIn when 2FA fires; consumed by VerifyMfa.
// `code_hash` backs the EVENT / fallback path only (a TOTP-enrolled user
// is verified against their secret, no stored code). Expiry is NOT a
// stored column: VerifyMfa computes it as created_at + mfa_code_ttl
// (env), so there's no Timestamp-input-param binding and the TTL stays a
// pure deploy knob. The challenge carries no device_id — VerifyMfa
// re-resolves the device from its own request metadata (the client uses
// the same device for the SignIn→VerifyMfa pair), which keeps this table
// device-feature-agnostic.
message MfaChallenge {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "two_factor";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id     = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string code_hash   = 3 [(w17.field) = { type: CHAR, max_len: 255, blank: true }]; // event-flow only
  google.protobuf.Timestamp consumed_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // attempts — failed VerifyMfa tries against this challenge. VerifyMfa
  // increments it on every wrong code and refuses once it reaches the
  // lockout threshold, so a 6-digit second factor can't be brute-forced
  // within the TTL.
  int64 attempts     = 6 [(w17.field) = { type: COUNTER, default_int: 0 }];
  // thumbprint — the device key that passed the password (SignIn's proof).
  // VerifyMfa must be signed by the same key: the second factor completes
  // the sign-in of THAT device, so the session it issues and the trust it
  // grants land on the key that was challenged. NULL only on a challenge
  // raised before device binding (refused, like any other key).
  string thumbprint  = 7 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  // public_computer — the challenged SignIn asked for a public-computer
  // session. VerifyMfa completes the sign-in the SignIn started, so it takes
  // the choice from here and never from its own request: the session gets the
  // public lifetime and the device is not trusted, even though the second
  // factor passed.
  bool public_computer = 8 [(w17.field) = { default_auto: FALSE }];
}

// PendingSignUp — a registration that has not yet proved its address
// (`sign_up_confirmation`).
//
// SignUp writes this row INSTEAD of a User and mails a code; ConfirmSignUp
// turns it into the User once the code comes back. The reason it is a table of
// its own rather than an unverified User: a User row HOLDS its address (the
// email is unique), so a registration abandoned before the code — by the owner,
// or on purpose by someone who knows the address — would block that address for
// good. Pending rows hold nothing: any number may exist for one address, none
// of them can sign in, and each dies at expires_at. The first one confirmed
// becomes the account (claimed_at) and the rest are ended with it
// (superseded_at). Nothing deletes a pending row: a claimed, superseded or
// expired one stays, and every statement that reads a registration as live
// requires all three to say it is not over.
//
// Only hashes are stored: the password the User will get, and the code (the
// plaintext travels once, in SignUpConfirmationRequested).
message PendingSignUp {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";

  string id            = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string email         = 2 [(w17.field) = { type: EMAIL, max_len: 320 }, (w17.db.column) = { index: true }];
  string password_hash = 3 [(w17.field) = { type: PASSWORD }];
  string code_hash     = 4 [(w17.field) = { type: CHAR, max_len: 255 }];
  // attempts — codes tried against this row. ConfirmSignUp claims one in the
  // same statement that counts it, so concurrent guesses cannot share a budget
  // (the RecordMfaAttempt shape).
  int64  attempts      = 5 [(w17.field) = { type: COUNTER, default_int: 0 }];
  google.protobuf.Timestamp expires_at = 6 [(w17.field) = { type: DATETIME }];
  google.protobuf.Timestamp created_at = 7 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // tenant_id — the tenant SignUp resolved, so the account is created where
  // the person registered, not wherever the confirmation request arrives.
  // Nullable here: the row is not the account, and the User insert is what
  // enforces a tenant.
  string tenant_id     = 8 [
    (w17.field) = { type: UUID, null: true },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
  // claimed_at — the registration became the account (ClaimPendingSignUp:
  // one guarded UPDATE, so two confirmations racing on one row get one
  // account).
  google.protobuf.Timestamp claimed_at = 9 [(w17.field) = { type: DATETIME, null: true }];
  // superseded_at — another registration of the same address became the
  // account first (SupersedePendingSignUpsForEmail, in the confirming
  // transaction).
  google.protobuf.Timestamp superseded_at = 10 [(w17.field) = { type: DATETIME, null: true }];
}

// PasswordResetToken — a single-use, time-bounded credential the
// `password_reset` flow mints for a user who asks to reset their
// password. Only the SHA-256 hash of the token is stored (a DB read
// can't reset an account); the plaintext travels once, in the
// PasswordResetRequested event, for a hand-written delivery channel
// (e-mail).
message PasswordResetToken {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "password_reset";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id     = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string token_hash  = 3 [(w17.field) = { type: CHAR, max_len: 128, unique: true }]; // sha256 hex
  google.protobuf.Timestamp expires_at  = 4 [(w17.field) = { type: DATETIME }];
  google.protobuf.Timestamp consumed_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 6 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// EmailVerificationToken — single-use, time-bounded token the
// `email_verification` flow mints to confirm a user owns their address.
// Same hashed-at-rest + single-plaintext-delivery contract as
// PasswordResetToken.
message EmailVerificationToken {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "email_verification";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id     = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string token_hash  = 3 [(w17.field) = { type: CHAR, max_len: 128, unique: true }]; // sha256 hex
  google.protobuf.Timestamp expires_at  = 4 [(w17.field) = { type: DATETIME }];
  google.protobuf.Timestamp consumed_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 6 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// Role — a named bundle of permissions. Projects typically
// declare a small fixed set ("admin" / "editor" / "viewer")
// via fixtures or first-boot seeds; the admin UI lets operators
// CRUD them at runtime. Role assignment to users goes through
// UserRole; role's permission membership goes through
// RolePermission.
//
// A role is never deleted. DeleteRole stamps deleted_at, revokes every grant
// of the role (UserRole) and releases its name: ended_key moves from '' to the
// row's own id, and `name` is unique only together with it, so a new role may
// take the name. A PRESET role (preset_key set) may be deleted too and keeps
// its preset_key: the role seed matches the row by that key and rewrites only
// the columns it declares, never deleted_at, so a deleted preset stays deleted
// across re-seeds (declare it under a new key to bring it back). The deleted
// row keeps its id, name, flags and RolePermission rows as the record of what
// it granted. Every role reader reads live roles only.
message Role {
  option (w17.db.table) = {
    indexes: [ { unique: true, fields: [{ name: "name" }, { name: "ended_key" }] } ]
  };
  option (w17.contrib.plugin_feature) = "rbac";

  string id          = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string name        = 2 [(w17.field) = { type: SLUG, max_len: 100 }];
  string description = 3 [(w17.field) = { type: TEXT, max_len: 500, blank: true }];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];

  // token_type — the realm this role applies to. SESSION roles count
  // toward bearer-session auth; API roles toward API/MCP tokens. A user
  // may hold roles of both realms; Authenticate picks the matching set
  // for the presented token. Default SESSION. The domain's
  // (w17.acl_roles) declaration drives which roles are seeded with which
  // realm (via the role's `realm` string). Gated by api_token: without
  // the feature there is one realm, so no column — every role counts for
  // the (only) bearer-session path, exactly as today.
  TokenType token_type = 5 [
    (w17.field) = { type: ENUM, default_int: 1 },
    (w17.contrib.plugin_feature_field) = "api_token"
  ];

  // all_permissions — WILDCARD grant. A user holding a role with
  // this flag set passes EVERY ACL permission check for the role's
  // realm, regardless of the RolePermission rows present and
  // INCLUDING permissions added by later codegen runs. Authenticate
  // detects the flag (storage returns it as a bool alongside
  // permission_ids) and expands the granted set to
  // `acllock.GrantAll(lock)` from the compile-time lock — so the
  // grant follows the deployed permission catalogue, never a
  // RolePermission seed snapshot. This is the superuser / superadmin
  // knob; a wildcard role carries NO RolePermission rows by design
  // (nothing to seed — the expansion is purely runtime). Driven by
  // the domain's `(w17.acl_roles) { all_permissions: true }`
  // declaration. Part of `rbac` (the whole Role message is gated).
  bool all_permissions = 6 [(w17.field) = { default_auto: FALSE }];

  // assign_first_user / assign_default — turnkey SignUp assignment
  // policy, seeded from the domain's `(w17.acl_roles)` first_user /
  // default flags. The generated SignUp handler assigns every role
  // flagged assign_first_user to the FIRST registered user (bootstrap
  // admin) and every role flagged assign_default to each later signup.
  // Realm is NOT consulted here — the UserRole link is realm-agnostic;
  // the realm (token_type) only decides which roles count at auth time.
  bool assign_first_user = 7 [(w17.field) = { default_auto: FALSE }];
  bool assign_default     = 8 [(w17.field) = { default_auto: FALSE }];

  // preset_key — PROVENANCE. Carries the declaring
  // `(w17.acl_roles).key` for a role that codegen seeded; NULL for a
  // role a customer created through the project's own role-management
  // surface.
  //
  // NULL rather than blank because the state being recorded is ABSENCE:
  // a customer's role has no declaration to point at. It also keeps the
  // SLUG format CHECK honest — a check applied to an empty-string
  // sentinel would have to carry an exception for it.
  //
  // It is what lets those two kinds of row live in one table without
  // either damaging the other. A seeded row is the supplier's preset:
  // codegen owns its permission set and rewrites it on every regen, so
  // a permission added upstream reaches every installation. A NULL
  // row is the customer's own: no seed, migration or codegen pass
  // reads or writes it, ever.
  //
  // A role-management UI reads this to tell the operator which rows it
  // may not edit — and it is the predicate the seed's prune runs on,
  // which is why it must be a stored column rather than an inference
  // from "is this id in the current seed set".
  //
  // UNIQUE, because it is the row's IDENTITY and the seed now upserts on it
  // (`upsert_on`). The seed used to key on `id`, which the generator derives
  // from the declaration — so a change in how that derivation is spelled
  // re-minted every id, the upsert matched nothing, and the INSERT collided
  // with the unique over `name`, taking `stack build` down on any database
  // old enough to hold the previous ids.
  //
  // NULL stays NULL-able and PostgreSQL treats NULLs as DISTINCT, so the
  // customer's own rows — the whole point of this column — are untouched by
  // the constraint: any number of them may coexist.
  string preset_key = 9 [(w17.field) = { type: SLUG, max_len: 100, null: true, unique: true }];

  // display_name — the CUSTOMER-owned label. Blank falls back to
  // `name`.
  //
  // `name` is unique and belongs to the declaration; the seed rewrites
  // it on every apply. Without a separate label, a customer renaming a
  // preset would have the rename reverted on the next `fixtures
  // apply` — and if they had renamed it onto a name another declared
  // preset claims, the UNIQUE violation would abort the ENTIRE fixture
  // transaction, since apply runs every statement in one. Splitting the
  // technical identity from the label removes both failures, and means
  // the seed needs no per-column upsert policy.
  string display_name = 10 [(w17.field) = { type: CHAR, max_len: 100, blank: true }];

  // org_scoped — TRUE when this role's grants apply only inside the
  // organization they were assigned in (`(w17.acl_roles).scope: ORG`).
  // FALSE = realm-wide, which is what an unset column means and what
  // every role meant before organizations existed.
  //
  // Read by the two permission queries (GetUserOrgPermissions,
  // GetUserRealmWidePermissions), which is where a grant's MEANING is
  // decided: a UserRole row with a NULL org_id means "realm-wide", and
  // for an org-scoped role that reading is the opposite of what the
  // declaration asked for, so both queries ask this column before they
  // honour a NULL.
  //
  // The project has no role-assignment surface that reads this column; a
  // column written by the seed and read by nothing would make `scope: ORG`
  // a declaration with no enforcement point anywhere. Enforcement sits
  // on the READ side deliberately: a write-side check would only bind rows
  // written after it, while the queries decide what every existing row
  // means, every time they run.
  //
  // Gated org_membership, like the UserRole.org_id column it describes.
  bool org_scoped = 11 [
    (w17.field) = { default_auto: FALSE },
    (w17.contrib.plugin_feature_field) = "org_membership"
  ];

  // deleted_at — when DeleteRole retired the role. NULL = live.
  google.protobuf.Timestamp deleted_at = 12 [(w17.field) = { type: DATETIME, null: true }];

  // ended_key — '' while the row is live, the row's own id once it has ended
  // (here: deleted). It is part of the unique index over the row's natural
  // key, so the ended row keeps every column and still frees that key for a
  // new live row: every live row shares the one value '', so two live rows
  // still collide, and every ended row carries a value of its own.
  //
  // The mechanism every auth table whose key must be reusable after a removal
  // uses (Role.name, Organization.slug, UserRole, OrgMembership,
  // UserTotpSecret): a full index, which every dialect builds — a partial
  // `WHERE deleted_at IS NULL` index is refused on MySQL — and a re-add is a
  // plain INSERT of a new row, so no row is ever rewritten back to live and the
  // ended rows are the history.
  string ended_key = 13 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}

// RolePermission — M2M link tuple (role_id, permission_id).
// `permission_id` is an INT32 referencing the activating
// domain's generated `AclPermission` enum from
// `w17.lock.acl.proto` — there's no Permission table in the
// schema because the lock enum IS the catalog. Composite
// uniqueness on (role_id, permission_id) prevents duplicate
// grants.
//
// `permission_id` carries `auto_choices: ACL_PERMISSION_IDS`
// → DB-level `CHECK col IN (1,2,…)` against the activating
// domain's AclPermission enum numeric values. Inserting an
// ID outside the catalog (stale JWT, hand-edit, allocator
// drift) is refused at the storage layer with
// VALIDATION_CHECK_CONSTRAINT mapped to InvalidArgument.
//
// v1 LIMITATION — no DB-level FK constraint on `role_id`
// (activation-rename caveat; see UserToken). `permission_id`
// has no FK target by design (the catalog is a proto enum,
// not a DB table); the CHECK constraint covers the integrity
// the FK would have provided.
//
// A permission is never deleted from a role. RemovePermissionFromRole stamps
// removed_at (and removed_by), and every permission reader skips a removed
// row. Unlike the other re-addable tables (see Role.ended_key), RolePermission
// keeps ONE row per (role, permission) for good, and adding a removed
// permission back REVIVES it (AddPermissionToRole: an UPSERT that clears
// removed_at): the unique (role_id, permission_id) index is the conflict
// target of the platform's role seed (`upsert_on: [role_id, permission_id]`),
// so it cannot take an ended_key column without breaking every seed. What the
// revive overwrites is kept in RolePermissionChange, which both mutations
// append to.
message RolePermission {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "role_id" }, { name: "permission_id" }] }
    ]
  };
  option (w17.contrib.plugin_feature) = "rbac";

  string id            = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string role_id       = 2 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true }
  ];
  int32  permission_id = 3 [
    (w17.field) = { type: NUMBER, auto_choices: ACL_PERMISSION_IDS },
    (w17.db.column) = { index: true }
  ];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // removed_at / removed_by — the permission was taken from the role, and by
  // whom (NULL when the caller named nobody). NULL removed_at = granted.
  google.protobuf.Timestamp removed_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  string removed_by = 6 [(w17.field) = { type: UUID, null: true }];
}

// RolePermissionChangeKind — what a RolePermissionChange row records.
enum RolePermissionChangeKind {
  ROLE_PERMISSION_CHANGE_KIND_UNSPECIFIED = 0;
  ROLE_PERMISSION_CHANGE_KIND_ADDED       = 1;
  ROLE_PERMISSION_CHANGE_KIND_REMOVED     = 2;
}

// RolePermissionChange — the append-only log of AddPermissionToRole and
// RemovePermissionFromRole. RolePermission keeps one row per pair and an add
// revives a removed one (see RolePermission), so the row alone shows only the
// latest state; this table keeps every change. Written in the same statement
// list (one transaction) as the change itself, never updated, never deleted.
// The platform's role seed writes RolePermission directly: with this table
// present it logs its own changes here (changed_by NULL), each in the same
// statement as the change; a role seed older than that logs nothing.
//
// permission_id is a plain number, not CHECK-constrained to the deployed
// catalogue like RolePermission's: a log row must survive a permission that
// was later dropped from the lock.
message RolePermissionChange {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "rbac";

  string id            = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string role_id       = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  int32  permission_id = 3 [(w17.field) = { type: NUMBER }];
  RolePermissionChangeKind kind = 4 [(w17.field) = { type: ENUM }];
  // changed_by — the account that made the change; NULL when the caller
  // named nobody (an admin binding, project code).
  string changed_by    = 5 [(w17.field) = { type: UUID, null: true }];
  google.protobuf.Timestamp created_at = 6 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// UserRole — M2M link User ↔ Role. Composite uniqueness prevents
// duplicate assignments. Same per-column index rationale as
// RolePermission.
//
// The uniqueness is stated THREE times because it means two different
// things depending on `org_membership` (the entries are staging-time
// feature-gated — see `w17.db.Index.plugin_feature`):
//
//   - feature OFF — `(user_id, role_id)`, the historical guarantee.
//   - feature ON  — `(user_id, role_id)` among REALM-WIDE rows
//     (`org_id IS NULL`) and `(user_id, role_id, org_id)` among
//     ORG-SCOPED ones.
//
// Two partial indexes rather than one three-column UNIQUE because
// PostgreSQL treats NULLs as DISTINCT in a unique index: the plain
// triple would let the same realm-wide grant be inserted any number of
// times, quietly dropping the very guarantee that holds today. Partial
// indexes are PG + SQLite only, which is the same support surface the
// rest of this plugin's `where:` usage has.
//
// v1 LIMITATION — no DB-level FK on `user_id` / `role_id` / `org_id`
// (activation-rename caveat applies; see UserToken).
//
// A grant is never deleted. Revoking one (RevokeRoleFromUser, a membership's
// role change or removal, DeleteRole, DeleteOrganization) stamps revoked_at
// (and revoked_by when the caller is known) and moves ended_key from '' to the
// row's own id; every index above includes ended_key, so the revoked row stays
// as the record of the grant while the same grant can be written again — as a
// NEW row, by the same plain INSERT (see Role.ended_key). Every permission
// reader counts live grants only (`revoked_at IS NULL`).
message UserRole {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "user_id" }, { name: "role_id" }, { name: "ended_key" }],
        plugin_feature_unless: "org_membership" },
      { unique: true, fields: [{ name: "user_id" }, { name: "role_id" }, { name: "ended_key" }],
        where: "org_id IS NULL", plugin_feature: "org_membership" },
      { unique: true, fields: [{ name: "user_id" }, { name: "role_id" }, { name: "org_id" }, { name: "ended_key" }],
        where: "org_id IS NOT NULL", plugin_feature: "org_membership" }
    ]
  };
  option (w17.contrib.plugin_feature) = "rbac";

  string id      = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id = 2 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true }
  ];
  string role_id = 3 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true }
  ];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];

  // org_id — WHICH organization this grant applies in.
  //
  //   NULL — realm-wide. The role counts in every org context (staff /
  //          admin roles, and every role in a project that predates
  //          `org_membership`). This is what an unset column means, so
  //          existing rows keep behaving exactly as they do today.
  //   set  — the grant exists only while that org is the request's
  //          ACTIVE org (Authenticate resolves it from the validated
  //          membership, never from client input).
  //
  // Two rows differing only in `role_id` for the same (user, org) is
  // the ROLE-COMPOSITION shape — "accountant + worker" for someone who
  // does both. It falls out of the M2M rather than needing a feature.
  //
  // Field-gated: dropped entirely when `org_membership` is off, exactly
  // like `User.tenant_id` under `tenant_scope` — which is why the index
  // entries above are gated in step with it.
  //
  // The gate is why NO permission-resolving query mentions this column.
  // Putting `(ur.org_id IS NULL OR ur.org_id = :org_id)` into their DQL
  // would need a second variant of each, and `api_token` already owns a
  // realm-aware variant of the same queries — the two features would
  // then require a THIRD variant for the build where both are on, owned
  // and stageable by neither. Instead the queries project `role_id` and
  // the org narrowing happens in Go against the role ids
  // `GetUserOrgRoleIds` reports as applicable (see handlers/
  // org_membership.go). One gated query, no matrix, and the realm axis
  // keeps its own queries untouched.
  //
  // `tenant_scope` deliberately gets nothing here: it is 1:1
  // user↔tenant, so a per-user role is ALREADY a per-tenant role there
  // and an org axis would be a second name for the same thing.
  string org_id = 5 [
    (w17.field) = { type: UUID, null: true },
    (w17.db.column) = { index: true },
    (w17.contrib.plugin_feature_field) = "org_membership"
  ];

  // revoked_at / revoked_by — the grant was revoked, and by whom (NULL when
  // the caller named nobody: an admin binding, a cascade, project code).
  google.protobuf.Timestamp revoked_at = 6 [(w17.field) = { type: DATETIME, null: true }];
  string revoked_by = 7 [(w17.field) = { type: UUID, null: true }];
  // ended_key — '' while live, the row's own id once revoked (Role.ended_key).
  string ended_key  = 8 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}

// TokenPermission — the per-API-token permission subset (least-privilege
// narrowing). When an API token has rows here, Authenticate intersects
// the user's API-realm role permissions with this set — a token can only
// narrow, never escalate (no rows = no narrowing = the user's full API
// perms). `permission_id` shares RolePermission's semantics (INT32 into
// the activating domain's AclPermission enum + CHECK; no FK by design).
// Gated by `api_token`: drops with the rest of the API-token surface.
message TokenPermission {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "token_id" }, { name: "permission_id" }] }
    ]
  };
  option (w17.contrib.plugin_feature) = "api_token";

  string id            = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string token_id      = 2 [
    (w17.field) = { type: UUID },
    (w17.db.column) = { index: true }
  ];
  int32  permission_id = 3 [
    (w17.field) = { type: NUMBER, auto_choices: ACL_PERMISSION_IDS },
    (w17.db.column) = { index: true }
  ];
  google.protobuf.Timestamp created_at = 4 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// AuthClient is a REGISTERED redirect target for the authorization-code
// flow — the thing that lets it serve a browser app on its own origin
// instead of only a CLI on loopback.
//
// Why a registry and not a looser check: CliAuthorize refuses any
// non-loopback redirect, and correctly — a stolen authorize link pointing at
// an attacker-controlled origin hands them the code. Loopback is safe without
// registration because the target is the user's own machine (RFC 8252 §7.3).
// Anything else has to be something the operator wrote down, and matched
// EXACTLY: a prefix match would accept `https://app.example.com.evil.example`.
//
// One row per (client, redirect_uri) pair, so a client with three callbacks is
// three rows sharing a client_id. `name` is therefore denormalised across
// them. That is deliberate — the alternative is a parent table and a join on
// the hot path of an auth check, to hold one label — and `enabled` is per row
// so an operator can retire a single callback without touching the others.
//
// A registration is never deleted: revoking one sets `revoked_at`, and the row
// stays as the record of what was trusted and when. A revoked row is refused by
// every resolver and cannot be re-enabled, and its (client_id, redirect_uri)
// pair stays taken: client_id is the operator's choice, so registering the
// callback again means choosing a new client_id (RegisterClient refuses the
// old pair with CLIENT_REVOKED rather than reviving it).
//
// Without it, a flow that works on loopback cannot be deployed behind any
// other callback.
message AuthClient {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "client_id" }, { name: "redirect_uri" }] }
    ]
  };
  option (w17.contrib.plugin_feature) = "cli_login";

  string id           = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  // client_id — the client's stable identity, chosen by the operator. A slug
  // because it appears in an authorize request and in logs.
  string client_id    = 2 [(w17.field) = { type: SLUG, max_len: 64 }, (w17.db.column) = { index: true }];
  string name         = 3 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  // redirect_uri — matched EXACTLY against the authorize request. Not a
  // pattern, not a prefix, not a host: the whole string.
  string redirect_uri = 4 [(w17.field) = { type: URL, max_len: 2048 }];
  bool   enabled      = 5 [(w17.field) = { default_auto: TRUE }];
  // client_secret — what the client proves it is with at the TOKEN endpoint.
  //
  // PASSWORD, not SECRET: we never need the bytes back, we only verify what
  // is presented, so what is stored is a hash (same argon2id as a user's
  // password). The plaintext travels once, in the RegisterClient response.
  //
  // REQUIRED, with no blank: registering IS the act of becoming a
  // confidential client. A target that cannot hold a secret does not need a
  // registration either — loopback is served without one, per RFC 8252 §7.3,
  // and that is the only public-client shape this flow offers.
  //
  // The flow was built for CLIs, where a secret cannot be kept and PKCE
  // alone is the right answer. Extending it past loopback to browser and
  // server apps carries that shape onto clients that CAN keep one, which
  // without a secret would leave the redirect allowlist as the only thing
  // standing between a registration and a delivered code.
  string client_secret = 7 [(w17.field) = { type: PASSWORD }];
  google.protobuf.Timestamp created_at = 6 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // revoked_at — when the registration was revoked (AuthMutation.RevokeAuthClient);
  // NULL = live. Set once, never cleared. A revoked row is refused by
  // GetRegisteredRedirect and GetAuthClientSecret exactly as an unregistered
  // one, and SetAuthClientEnabled leaves it alone, so it cannot come back. Its
  // pair stays taken (the unique index is not partial: that is refused on
  // MySQL), so a re-registration uses a new client_id.
  google.protobuf.Timestamp revoked_at = 8 [(w17.field) = { type: DATETIME, null: true }];
}

// BootstrapClaim — the one row that says the bootstrap administrator has
// been handed out (rbac).
//
// The first account gets the `first_user` roles (typically every
// permission). Deciding that from "no users yet" alone is a read, and two
// sign-ups reading it at the same time both see zero. The decision is
// therefore also a write: the sign-up that gets the first_user roles inserts
// this row, keyed on a constant, in its own transaction, and a concurrent
// one that conflicts on the key gets the default roles instead. Once
// written, the row stays: deleting every account later does not reopen the
// bootstrap. Only a sign-up writes it, so a seeded first account (or a
// deployment with users before this table existed) leaves it empty.
message BootstrapClaim {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "rbac";

  string slot    = 1 [(w17.field) = { type: SLUG, max_len: 32, pk: true }];
  string user_id = 2 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp created_at = 3 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
}

// OAuthLoginCode — the single-use code an OAuth callback hands the browser
// instead of a session (oauth).
//
// The callback is a browser redirect, so whatever it carries lands in a URL
// any page can be made to open. A session there would sign the opener in,
// and a callback link minted by one person would sign in whoever followed
// it. The code is worth nothing on its own: OAuthExchange redeems it once,
// within minutes, and only with the PKCE verifier whose challenge the
// browser that STARTED the flow sent to OAuthAuthorizeURL.
message OAuthLoginCode {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "oauth";

  string id             = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  // user_id is the account the code signs in to. NULL when the identity
  // belongs to no account yet: the callback then keeps the verified
  // identity below, and OAuthExchange creates the account — with the
  // invitation the page passes there, never through a URL.
  optional string user_id = 2 [(w17.field) = { type: UUID, null: true }, (w17.db.column) = { index: true }];
  string code_hash      = 3 [(w17.field) = { type: CHAR, max_len: 64, unique: true }]; // sha256 hex of the code
  string code_challenge = 4 [(w17.field) = { type: CHAR, max_len: 64 }];                // challengeDigest (sha256 hex) of the authorize step's PKCE challenge
  google.protobuf.Timestamp expires_at  = 5 [(w17.field) = { type: DATETIME }];
  google.protobuf.Timestamp consumed_at = 6 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 7 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // The provider-verified identity, kept for a code whose account does not
  // exist yet (user_id NULL). The defaults fill the rows written before these
  // columns existed: login codes are never purged, so adding a NOT NULL
  // column without one fails the migration of any deployment that has
  // signed someone in through a provider.
  optional string provider_id = 8 [(w17.field) = { type: UUID, null: true }];
  string external_id    = 9  [(w17.field) = { type: CHAR, max_len: 255, blank: true, default_string: "" }];
  string email          = 10 [(w17.field) = { type: CHAR, max_len: 320, blank: true, default_string: "" }];
  bool   email_verified = 11 [(w17.field) = { default_auto: FALSE }];
}

// CliAuthCode is a single-use PKCE authorization code minted by
// CliAuthorize and redeemed by CliToken (the `cli_login` feature — the
// console as a first-party OAuth authorization server for CLIs). Only the
// code's sha256 hash is stored, so a DB read can't redeem a live code; the
// code is bound to the approving user + the CLI's PKCE challenge and
// expires in seconds. consumed_at enforces single-use (the atomic
// ConsumeCliAuthCode flips it under a not-consumed/not-expired WHERE).
// Mirrors PasswordResetToken.
message CliAuthCode {
  option (w17.db.table) = {};
  option (w17.contrib.plugin_feature) = "cli_login";

  string id             = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id        = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string code_hash      = 3 [(w17.field) = { type: CHAR, max_len: 128, unique: true }]; // sha256 hex of the code
  string code_challenge = 4 [(w17.field) = { type: CHAR, max_len: 128 }];                // PKCE S256 challenge
  // redirect_uri — the target this code was issued FOR, kept so the token
  // endpoint can require the exchange to name the same one (RFC 6749 §4.1.3).
  //
  // It was validated at authorize time and then forgotten, which is fine while
  // every target is loopback: PKCE carries the binding and the address is the
  // user's own machine either way. It stops being fine the moment a client can
  // register more than one callback — a code minted for one could then be
  // redeemed as though it came from another.
  string redirect_uri   = 8 [(w17.field) = { type: URL, max_len: 2048, blank: true }];
  // client_id — WHICH registered client this code was minted for, so the
  // token endpoint can demand that client's secret and refuse anyone else
  // redeeming it. Blank for a loopback code: there is no registration and no
  // secret, and PKCE is the whole binding there.
  string client_id      = 9 [(w17.field) = { type: SLUG, max_len: 64, blank: true }];
  google.protobuf.Timestamp expires_at  = 5 [(w17.field) = { type: DATETIME }];
  google.protobuf.Timestamp consumed_at = 6 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 7 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // session_expires_at — when the browser session that APPROVED this code
  // expires. CliToken mints the CLI's session no later than this, so a CLI
  // login lasts only as long as the session that granted it. Without the cap
  // a session could renew itself indefinitely: approve a CLI login shortly
  // before it expires, receive a fresh full-lifetime session, repeat.
  //
  // NULL when the approving session never expires (and on a code minted
  // before this column existed); CliToken then uses the normal session TTL.
  google.protobuf.Timestamp session_expires_at = 10 [(w17.field) = { type: DATETIME, null: true }];
  // approved_by_device_id — the Device row the approving browser session is
  // bound to (read with its expiry by CliAuthorize). CliToken copies it onto
  // the CLI session as UserToken.approved_by_device_id; the CLI session is
  // bound to the CLI's own key, never to this one. NULL when the approving
  // session is bound to no device, and on a code minted before this column.
  string approved_by_device_id = 11 [(w17.field) = { type: UUID, null: true }];
}

// Organization is a GitHub-style org — a membership boundary an identity
// can belong to MANY of (a private personal org + a company org + …). The
// `org_membership` feature's generalization of single-tenant tenant_scope:
// where Tenant is 1:1 with a User, an Organization is M2M via OrgMembership.
//
// An organization is never deleted. DeleteOrganization stamps deleted_at,
// removes every membership and revokes every grant scoped to it, and releases
// its slug (ended_key, see Role.ended_key) so a new organization may take it.
// Every organization reader reads live organizations only, so a deleted one is
// invisible, cannot be selected, and its owner_id grants nothing.
message Organization {
  option (w17.db.table) = {
    indexes: [ { unique: true, fields: [{ name: "slug" }, { name: "ended_key" }] } ]
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string id   = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string slug = 2 [(w17.field) = { type: SLUG, max_len: 64 }];
  string name = 3 [(w17.field) = { type: CHAR, max_len: 128 }];
  // kind groups the org for the CLI's picker: "private" (personal) or
  // "company". Free-form (not an enum) so a project can add its own kinds.
  string kind = 4 [(w17.field) = { type: CHAR, max_len: 32, blank: true }];
  google.protobuf.Timestamp created_at = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // owner_id — the account that OWNS this organization, and the only
  // authorization fact that is not a role grant.
  //
  // Ownership is a property of the organization, not a permission somebody
  // was handed, so it is recorded here rather than as a row in UserRole. A
  // principal whose id matches this column is granted the whole permission
  // catalogue by GetUserOrgPermissions — see that query for why the
  // expansion cannot happen in SQL.
  //
  // This deliberately replaces reading `OrgMembership.role == "owner"`.
  // That column is free-form and documented as such ("project policy owns
  // the vocabulary; the plugin only passes it through"), so hanging
  // authorization on one of its values would turn every writer of that
  // string into a privilege-granting path.
  //
  // Nullable, and left so: organizations created before this column existed
  // have no owner, and an absent owner must read as "nobody is
  // auto-granted" rather than as an error. App-enforced, no DB-level FK —
  // the same caveat every other link in this plugin carries.
  string owner_id = 6 [(w17.field) = { type: UUID, null: true }, (w17.db.column) = { index: true }];
  // deleted_at — when DeleteOrganization retired it. NULL = live.
  google.protobuf.Timestamp deleted_at = 7 [(w17.field) = { type: DATETIME, null: true }];
  // ended_key — '' while live, the row's own id once deleted (Role.ended_key).
  string ended_key = 8 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}

// OrgMembership is the M2M link between a User and an Organization, with
// the user's role in that org. Unique per (user_id, org_id). Mirrors the
// OAuthIdentity user↔external link shape. The plugin stamps the active
// org's id into scopes[org_id] (Authenticate decorator) after validating
// the principal's membership — so per-org data isolation reuses the
// existing (w17.db.scope) machinery with no client-trusted org input.
//
// A membership is never deleted. Removing one stamps removed_at (and
// removed_by) and moves ended_key to the row's own id, so the person can be
// added again — a new row, by the same INSERT — while the removed row stays as
// the record (see Role.ended_key). Every membership reader reads live rows
// only.
message OrgMembership {
  option (w17.db.table) = {
    indexes: [
      { unique: true, fields: [{ name: "user_id" }, { name: "org_id" }, { name: "ended_key" }] }
    ]
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string id      = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string user_id = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string org_id  = 3 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  // role: owner | admin | member. Free-form CHAR — project policy owns the
  // vocabulary; the plugin only passes it through. An accepted invitation and
  // the admin's role edit write a Role.name here, so it is as wide as one.
  string role    = 4 [(w17.field) = { type: CHAR, max_len: 100 }];
  google.protobuf.Timestamp created_at = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // removed_at / removed_by — the membership was removed, and by whom (NULL
  // when nobody is known: an admin binding, an organization's deletion).
  google.protobuf.Timestamp removed_at = 6 [(w17.field) = { type: DATETIME, null: true }];
  string removed_by = 7 [(w17.field) = { type: UUID, null: true }];
  // ended_key — '' while live, the row's own id once removed (Role.ended_key).
  string ended_key  = 8 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}

// OrgInvite — a pending invitation for an EMAIL to join an Organization
// with a named role.
//
// Keyed on (org, email), NOT on a user id, and that is the whole point.
// PasswordResetToken and EmailVerificationToken both hang off `user_id`
// because the person is already known; an invitation is the one flow where
// they may not exist yet. Anchoring on the address collapses "invite an
// existing user" and "invite someone who has to register" into ONE object
// with two endings, decided at acceptance rather than at creation — which is
// also the only correct time to decide it, since the invitee can register
// on their own between the two.
//
// No token column, deliberately. The sibling token tables carry a hashed
// secret because possession of the secret IS the proof; here the proof is
// possession of the ADDRESS, checked at acceptance against the authenticated
// account's email. That leaves a window: someone who guesses an invited
// address and registers it first inherits the membership and the role.
//
// ⚠️ Enabling `email_verification` does NOT close the window. That feature
// adds a column and two RPCs; it blocks nothing. A project can turn it on,
// verify nobody, and every account still has the column NULL.
//
// What closes it today is `invite_requires_verified_email`, which refuses an
// acceptance from an unverified account. It is off by default, so the weak
// proof is still the shipped behaviour and is now named rather than implied.
//
// What closes it PROPERLY is moving the proof off the address and onto the
// link — a single-use token on the invitation, which also removes the need to
// verify anything. That is a model change, made deliberately rather than
// guessed at.
//
// `role` is a Role.name, not free text: accepting writes BOTH the
// OrgMembership row (carrying this name as its label) and the UserRole grant
// scoped to this org, so an invited member arrives with permissions rather
// than with a label and nothing behind it.
message OrgInvite {
  option (w17.db.table) = {
    indexes: [
      // One PENDING invite per (org, email). Partial, because a consumed
      // or closed invite must not block a later re-invite — the same person
      // can be removed from an org and invited back. PG + SQLite only, which
      // is the support surface this plugin's other `where:` indexes already
      // assume (org_invite requires org_membership, whose UserRole indexes
      // are partial too).
      { unique: true, fields: [{ name: "org_id" }, { name: "email" }],
        where: "accepted_at IS NULL AND closed_at IS NULL" }
    ]
  };
  option (w17.contrib.plugin_feature) = "org_invite";

  string id      = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string org_id  = 2 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  // The invited address, and NULL is a real state: the invitation is OPEN and
  // whoever holds the link picks their own address.
  //
  // Nullable since the link became the proof (decisions/invite-proof-belongs-on-the-link).
  // Bound (non-NULL) is the corporate case — this address and no other — and it is
  // also the only case that can derive a verified address, because only there does
  // "the invitation named it" say anything about the address the registrant types.
  //
  // The partial unique index below keeps working across the change on purpose: two
  // OPEN invitations carry NULL and NULL does not collide with NULL, so an org can
  // have many open links at once, each its own secret. Two BOUND invitations to one
  // address still collide while pending, which is the rule that index exists for.
  //
  // Stored normalized (lower-cased) by the handler when present, the same
  // normalization SignIn applies, or "Someone@x" and "someone@x" would be two
  // different invitations and only one of them would ever match.
  string email   = 3 [(w17.field) = { type: EMAIL, max_len: 320, null: true }, (w17.db.column) = { index: true }];
  // The role the invitee gets in this org — a Role.name, validated to exist
  // when the invite is created rather than when it is accepted, so a typo is
  // the inviter's error at the moment they make it and not a failure the
  // invitee sees days later.
  string role    = 4 [(w17.field) = { type: SLUG, max_len: 100 }];
  // Who sent it. Kept for the invite list, and because an org that cannot
  // see who admitted a member cannot audit its own membership.
  string invited_by = 5 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp expires_at = 6 [(w17.field) = { type: DATETIME }];
  // NULL while pending. Set (not deleted) on acceptance so the row stays as
  // the record of how that membership came to exist.
  google.protobuf.Timestamp accepted_at = 7 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at  = 8 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  // sha256 hex of the single-use token that IS the invitation link.
  //
  // The same shape `PasswordResetToken` and `EmailVerificationToken` carry: it
  // existed twice in this plugin and not where it was needed. Only the hash is stored; the plaintext is returned to the
  // INVITER once, because here the sender is the delivery channel — unlike a
  // password reset, where the token goes to the mailbox and never to a caller.
  //
  // ⚠️ NO `consumed_at` beside it, deliberately: `accepted_at` above is already that
  // fact, and the partial index already reads it as "pending". A second timestamp
  // meaning the same thing is two names for one state, and they drift.
  string token_hash = 9 [(w17.field) = { type: CHAR, max_len: 128, unique: true }];
  // Consumer-owned, OPAQUE. Whatever the caller needs paired with this invitation —
  // for example a tenant and one object in the caller's own system, so that
  // accepting an invitation pairs both at once instead of joining a side table on
  // the e-mail address, which is the weak key this whole change is about.
  //
  // The plugin never reads it. That is what makes this answerable without deciding
  // the general question ("does a plugin's table take CONSUMER-SHAPED columns?"):
  // it takes one column whose CONTENTS the plugin has no opinion about. The
  // precedent is already shipped — `payment`'s UsageEvent.metadata is the same
  // field with the same annotation, and nothing in that plugin interprets it
  // either.
  //
  // It comes back at ACCEPTANCE, out of the same statement that spends the
  // invitation (ConsumeOrgInviteByToken RETURNING metadata). That is the half a
  // side table cannot do: the consumer's pairing and the acceptance either both
  // happen or neither does.
  //
  // `blank: true` rather than `null: true` — an invitation with nothing pinned to
  // it carries the empty string, so a reader never has to tell "no metadata" from
  // "metadata I could not read". JSON because the shape is the consumer's and a
  // single opaque column has to hold whatever they put there.
  string metadata = 10 [(w17.field) = { type: JSON, blank: true }];

  // role_snapshot — the role as the inviter was allowed to hand it out:
  // `<role id>:<permission ids, sorted, comma-separated>`, a wildcard expanded
  // from the deployed lock. Written at invite time by the role ceiling
  // (handlers/role_ceiling.go) and checked at accept, because the grant is
  // written THEN, against a catalogue that may have moved in between: a role
  // widened during the invitation's life, or a different role now answering to
  // the name, would otherwise hand out permissions the inviter never held.
  //
  // Empty on an invitation made before the ceiling existed — the default only
  // fills those rows. An empty snapshot is refused at accept: such an
  // invitation was never checked, and the inviter can send a new one.
  string role_snapshot = 11 [(w17.field) = { type: TEXT, blank: true, default_string: "" }];

  // closed_at / closed_by — the invitation ended without being accepted:
  // withdrawn (CloseOrgInvite, the withdrawing account as closed_by), or,
  // once expired, closed so the address can be invited again
  // (CloseExpiredOrgInvite, closed_by NULL). Nothing deletes an invitation: a
  // closed one stays, refused by every path that binds, accepts or lists
  // pending invitations, and out of the pending index above.
  google.protobuf.Timestamp closed_at = 12 [(w17.field) = { type: DATETIME, null: true }];
  string closed_by = 13 [(w17.field) = { type: UUID, null: true }];
}
