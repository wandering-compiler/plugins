          "       s.confirmed_at AS confirmed_at, s.created_at AS created_at, s.revoked_at AS revoked_at "
          "FROM @module.UserTotpSecret s "
          "JOIN @module.User u ON u.id = s.user_id "
          "WHERE s.id = :id"
      }
    };
  }

  // GetDevice — one device for the admin Devices detail view (and the
  // Revoke action, which reads the device's account and state with it), the
  // list's projection. Gated user_admin.
  rpc GetDevice(GetDeviceReq) returns (DeviceAdminRow) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS id, COALESCE(u.email, '') AS owner, d.user_id AS user, "
          "       d.label AS label, d.thumbprint AS thumbprint, d.ip AS ip, "
          "       d.created_at AS created_at, d.last_seen_at AS last_seen_at, "
          "       d.trusted_at AS trusted_at, u.device_trust_revoked_at AS trust_revoked_at, "
          "       CASE WHEN d.trusted_at IS NOT NULL AND d.revoked_at IS NULL "
          "            AND (u.device_trust_revoked_at IS NULL OR d.trusted_at > u.device_trust_revoked_at) "
          "            THEN TRUE ELSE FALSE END AS trusted, "
          "       d.revoked_at AS revoked_at "
          "FROM @module.Device d "
          "LEFT JOIN @module.User u ON u.id = d.user_id "
          "WHERE d.id = :id"
      }
    };
  }

  // ListUserSignInEvents — one account's own sign-in history, newest first,
  // the latest 100 (AuthService.ListMySignInEvents, which passes the
  // caller's id). Served by the (user_id, created_at) index. Gated
  // authenticate_turnkey, the feature that knows the caller.
  rpc ListUserSignInEvents(ListUserSignInEventsReq) returns (ListUserSignInEventsResp) {
    option (w17.contrib.plugin_feature_rpc) = "authenticate_turnkey";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT e.id AS id, e.created_at AS created_at, "
          "       e.user_id AS user_id, e.address AS address, "
          "       e.device_id AS device_id, e.thumbprint AS thumbprint, "
          "       e.ip AS ip, e.user_agent AS user_agent, "
          "       e.method AS method, e.outcome AS outcome, "
          "       e.public_computer AS public_computer "
          "FROM @module.SignInEvent e WHERE e.user_id = :user_id "
          "ORDER BY e.created_at DESC, e.id DESC "
          "LIMIT 100"
      }
    };
  }

  // ────────────────────────────────────────────────────────────
  // org member + invite reads
  // ────────────────────────────────────────────────────────────

  // ListOrgMembersByOrg — ONE organization's members, a page at a time
  // (keyset on the address, which is unique). The ByOrg
  // suffix is not decoration: every proto in this plugin generates into
  // ONE Go package, so a query message may not share a name with the
  // business message that wraps it — and the business RPC is the one
  // callers see, so it keeps the plain name., with the address that
  // identifies them. Distinct from ListOrgMemberships, which is the
  // admin preset's paged list across EVERY org and carries no org filter:
  // a member list scoped to the caller's active org is a different
  // question, and answering it by filtering the admin list in a handler
  // would mean reading every organization's rows to return one's.
  rpc ListOrgMembersByOrg(ListOrgMembersByOrgReq) returns (ListOrgMembersByOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT m.user_id AS user_id, "
          "       u.email AS email, "
          "       m.role AS role, "
          "       m.created_at AS joined_at, "
          "       m.id AS membership_id "
          "FROM @module.OrgMembership m "
          "JOIN @module.User u ON u.id = m.user_id "
          "JOIN @module.Organization o ON o.id = m.org_id "
          "WHERE m.org_id = :org_id AND m.removed_at IS NULL AND o.deleted_at IS NULL "
          "AND u.email > :after_email "
          "ORDER BY u.email ASC "
          "LIMIT :limit"
      }
    };
  }

  // ListOrgInvitesByOrg — the PENDING invitations of one organization.
  // Suffixed for the same reason as ListOrgMembersByOrg above.
  // Accepted rows are excluded rather than deleted on acceptance, so the
  // table keeps the record of how each membership came to exist while
  // this list stays the set of things still outstanding.
  // GetPendingOrgInviteByToken — read the link's invitation WITHOUT spending it.
  //
  // The read exists because the proof gate has to know whether the invitation is
  // BOUND before anything is consumed, and the old ordering ("gate first, claim
  // second") cannot answer that — the gate ran before there was an invitation in
  // hand. Consuming first and rolling back would do it only where a transaction is
  // running, and `AcceptOrgInvite` begins one only when DistTx is wired. So: read,
  // decide, then consume.
  //
  // Leaks nothing a guesser did not already supply: it answers only for a token
  // they presented, and a wrong token is NOT_FOUND exactly like a spent one.
  rpc GetPendingOrgInviteByToken(GetPendingOrgInviteByTokenReq) returns (GetPendingOrgInviteByTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT i.org_id AS org_id, "
          "       i.role AS role, "
          "       i.email AS email, "
          "       i.metadata AS metadata "
          "FROM @module.OrgInvite i "
          "JOIN @module.Organization o ON o.id = i.org_id "
          "WHERE i.token_hash = :token_hash AND i.accepted_at IS NULL AND i.closed_at IS NULL AND i.expires_at > NOW() AND o.deleted_at IS NULL "
          "LIMIT 1"
      }
    };
  }

  // GetPendingOrgInviteForEmail — a pending invitation by its id, only if it
  // is bound to this address (invite_accept_from_list). Answers the hash the
  // acceptance then spends it by, through the one claim (and the one
  // OrgInviteAccepted) accepting through the link uses.
  rpc GetPendingOrgInviteForEmail(GetPendingOrgInviteForEmailReq) returns (GetPendingOrgInviteForEmailResp) {
    option (w17.contrib.plugin_feature_rpc) = "invite_accept_from_list";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT i.org_id AS org_id, "
          "       i.token_hash AS token_hash "
          "FROM @module.OrgInvite i "
          "JOIN @module.Organization o ON o.id = i.org_id "
          "WHERE i.id = :invite_id AND i.email = :email AND i.accepted_at IS NULL AND i.closed_at IS NULL AND i.expires_at > NOW() AND o.deleted_at IS NULL "
          "LIMIT 1"
      }
    };
  }

  rpc ListOrgInvitesByOrg(ListOrgInvitesByOrgReq) returns (ListOrgInvitesByOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT i.id AS id, "
          "       i.org_id AS org_id, "
          "       i.email AS email, "
          "       i.role AS role, "
          "       i.invited_by AS invited_by, "
          "       i.expires_at AS expires_at, "
          "       i.accepted_at AS accepted_at, "
          "       i.created_at AS created_at, "
          "       i.metadata AS metadata, "
          "       ?feature(product_roles) i.product_roles AS product_roles "
          "FROM @module.OrgInvite i "
          "WHERE i.org_id = :org_id AND i.accepted_at IS NULL AND i.closed_at IS NULL "
          "ORDER BY i.created_at DESC"
      }
    };
  }

  // ListPendingInvitesForEmail — invitations waiting for ONE address,
  // across every organization. Two callers, and they are why the org name
  // is joined in: the signed-in person listing what they have been
  // invited to, and SignUp under `invite_only` asking whether this
  // address may create an account at all.
  //
  // The expiry test is in the query, not in a caller: an expired
  // invitation must not appear in a list, and must not open sign-up
  // either, and putting the predicate in one place is what keeps those
  // two answers from drifting apart.
  rpc ListPendingInvitesForEmail(ListPendingInvitesForEmailReq) returns (ListPendingInvitesForEmailResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_invite";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT i.id AS invite_id, "
          "       i.org_id AS org_id, "
          "       o.slug AS org_slug, "
          "       o.name AS org_name, "
          "       i.role AS role, "
          "       i.expires_at AS expires_at, "
          "       ?feature(product_roles) i.product_roles AS product_roles "
          "FROM @module.OrgInvite i "
          "JOIN @module.Organization o ON o.id = i.org_id "
          "WHERE i.email = :email AND i.accepted_at IS NULL AND i.closed_at IS NULL AND i.expires_at > NOW() AND o.deleted_at IS NULL "
          "ORDER BY i.created_at DESC"
      }
    };
  }

  // ── oauth_server reads ──

  rpc GetOAuthClientByHash(GetOAuthClientByHashReq) returns (GetOAuthClientByHashResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS client.id, c.client_id AS client.client_id, c.kind AS client.kind, "
          "       c.client_name AS client.client_name, c.client_uri AS client.client_uri, "
          "       c.logo_uri AS client.logo_uri, c.redirect_uris AS client.redirect_uris, "
          "       c.metadata_fetched_at AS client.metadata_fetched_at, c.disabled_at AS client.disabled_at, "
          "       c.software_id AS client.software_id "
          "FROM @module.OAuthClient c WHERE c.client_id_hash = :client_id_hash"
      }
    };
  }

  rpc GetOAuthClientByRowID(GetOAuthClientByRowIDReq) returns (GetOAuthClientByRowIDResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS client.id, c.client_id AS client.client_id, c.kind AS client.kind, "
          "       c.client_name AS client.client_name, c.client_uri AS client.client_uri, "
          "       c.logo_uri AS client.logo_uri, c.redirect_uris AS client.redirect_uris, "
          "       c.metadata_fetched_at AS client.metadata_fetched_at, c.disabled_at AS client.disabled_at "
          "FROM @module.OAuthClient c WHERE c.id = :id"
      }
    };
  }

  rpc GetPendingOAuthAuthorization(GetPendingOAuthAuthorizationReq) returns (GetPendingOAuthAuthorizationResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT a.id AS id, a.kind AS kind, a.redirect_uri AS redirect_uri, a.scope AS scope, "
          "       a.resource AS resource, a.expires_at AS expires_at, "
          "       c.id AS client.id, c.client_id AS client.client_id, c.kind AS client.kind, "
          "       c.client_name AS client.client_name, c.client_uri AS client.client_uri, "
          "       c.logo_uri AS client.logo_uri, c.redirect_uris AS client.redirect_uris, "
          "       c.metadata_fetched_at AS client.metadata_fetched_at, c.disabled_at AS client.disabled_at "
          "FROM @module.OAuthAuthorization a JOIN @module.OAuthClient c ON c.id = a.client_row_id "
          "WHERE a.request_hash = :request_hash AND a.decided_at IS NULL AND a.expires_at > NOW() AND c.disabled_at IS NULL"
      }
    };
  }

  rpc GetOAuthApprovingSession(GetOAuthApprovingSessionReq) returns (GetOAuthApprovingSessionResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth_server";
    option (w17.db.method) = {
      ops: {
