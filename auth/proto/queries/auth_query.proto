    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(tr.role_id) AS role_ids "
          "FROM @module.TeamRole tr "
          "JOIN @module.Role r ON r.id = tr.role_id "
          "WHERE tr.team_id = :team_id AND tr.revoked_at IS NULL AND r.deleted_at IS NULL"
      }
    };
  }

  // GetUserTeamRoleGrants — see its request message. Every link is read live:
  // the team, the membership in it, the organization membership it was made
  // under (created no later than the team membership, so a person removed and
  // invited back holds nothing from before), the team's role and the role
  // itself; only an org-scoped role counts.
  rpc GetUserTeamRoleGrants(GetUserTeamRoleGrantsReq) returns (GetUserTeamRoleGrantsResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.TeamMember tm "
          "JOIN @module.Team t ON t.id = tm.team_id AND t.deleted_at IS NULL "
          "JOIN @module.OrgMembership m ON m.user_id = tm.user_id AND m.org_id = t.org_id "
          "  AND m.removed_at IS NULL AND m.created_at <= tm.created_at "
          "JOIN @module.TeamRole tr ON tr.team_id = t.id AND tr.revoked_at IS NULL "
          "JOIN @module.Role r ON r.id = tr.role_id AND r.deleted_at IS NULL AND r.org_scoped = TRUE "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE tm.user_id = :user_id AND t.org_id = :org_id AND tm.removed_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
  }

  rpc GetOrgMemberAccount(GetOrgMemberAccountReq) returns (GetOrgMemberAccountResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       ?feature(service_account) u.kind AS user.kind, "
          "       u.created_at AS user.created_at "
          "FROM @module.OrgMembership m "
          "JOIN @module.User u ON u.id = m.user_id "
          "WHERE m.user_id = :user_id AND m.org_id = :org_id AND m.removed_at IS NULL"
      }
    };
  }

  // ListOrgTeamSuperadmins — see its request message. The joins are
  // GetUserTeamRoleGrants', narrowed to wildcard roles.
  rpc ListOrgTeamSuperadmins(ListOrgTeamSuperadminsReq) returns (ListOrgTeamSuperadminsResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT tm.user_id AS user_id, r.id AS role_id, t.id AS team_id, "
          "       ?feature(user_admin) u.disabled_at AS disabled_at, "
          "       ?feature(user_admin) u.erased_at AS erased_at "
          "FROM @module.TeamMember tm "
          "JOIN @module.Team t ON t.id = tm.team_id AND t.deleted_at IS NULL "
          "JOIN @module.OrgMembership m ON m.user_id = tm.user_id AND m.org_id = t.org_id "
          "  AND m.removed_at IS NULL AND m.created_at <= tm.created_at "
          "JOIN @module.TeamRole tr ON tr.team_id = t.id AND tr.revoked_at IS NULL "
          "JOIN @module.Role r ON r.id = tr.role_id AND r.deleted_at IS NULL AND r.org_scoped = TRUE "
          "  AND r.all_permissions = TRUE "
          "JOIN @module.User u ON u.id = tm.user_id "
          "WHERE t.org_id = :org_id AND tm.removed_at IS NULL "
          "ORDER BY tm.user_id ASC, t.id ASC, r.id ASC"
      }
    };
  }

  rpc CountTeamRoleGrants(CountTeamRoleGrantsReq) returns (CountTeamRoleGrantsResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
