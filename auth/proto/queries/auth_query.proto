  rpc GetAuthenticator(GetAuthenticatorReq) returns (AuthenticatorAdminRow) {
    option (w17.contrib.plugin_feature_rpc) = "admin_mfa";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
