        name: "main"
        dql:
          "SELECT t.stepped_up_at AS stepped_up_at FROM @module.UserToken t "
          "WHERE t.id = :token_id AND t.user_id = :user_id AND t.revoked_at IS NULL"
      }
    };
  }

  // ListAuthenticators / GetAuthenticator — the admin Authenticators page
