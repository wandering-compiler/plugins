service AuthQuery {
  rpc GetUserByEmail(GetUserByEmailReq) returns (GetUserByEmailResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        // EVERY gate SignIn runs reads its field off THIS lookup, so a
        // column left out of the projection is a gate that consults a
        // field nobody filled and passes. A gate on the projection
        // target is what makes one statement serve both activations.
        //
        // disabled_at (`user_admin`): without it every soft-disabled
        // account still signs in.
        //
        // kind (`service_account`): without it signInBotGate read an
        // unset AccountKind, and HUMAN is 0 — so a machine account that
        // set itself a password through `password_change` would sign in
        // as a person.
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       u.created_at AS user.created_at, "
          "       ?feature(service_account) u.kind AS user.kind, "
          "       ?feature(user_admin) u.disabled_at AS user.disabled_at, "
          // erased_at (`user_admin`): the sign-in history writes an attempt
          // at an erased account without the client's address and agent.
          "       ?feature(user_admin) u.erased_at AS user.erased_at, "
          // email_verified_at (`email_verification`): read by the OAuth
          // local-account check, which refuses to link a provider identity to
          // an existing password account unless that address is verified.
          // Missing from the projection it inverted the gate — the field was
          // never valid, so EVERY local account was refused, and unlike the
          // invite gate this one is not behind an opt-in knob.
          "       ?feature(email_verification) u.email_verified_at AS user.email_verified_at "
          "FROM @module.User u WHERE u.email = :email"
      }
    };
  }

  rpc GetUserByToken(GetUserByTokenReq) returns (GetUserByTokenResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       ?feature(service_account) u.kind AS user.kind, "
          "       u.created_at AS user.created_at, "
          "       COALESCE(t.token_hash, '') AS stored_token_hash "
          "FROM @module.User u JOIN @module.UserToken t ON t.user_id = u.id WHERE (t.token_hash = :token_hash OR t.token = :legacy_token) AND (t.expires_at IS NULL OR t.expires_at > NOW()) AND t.revoked_at IS NULL"
      }
    };
  }

  // GetUserPermissions — flattens UserRole → RolePermission for
  // one user and returns the permission IDs (referencing the
  // activating domain's generated AclPermission enum) as a single
  // ROWS_TO_ARRAY list on the response's `repeated` field (a bare
  // `SELECT rp.permission_id` is one-per-row and can't scan into a
  // repeated scalar — the codegen decodes repeated scalars from an
  // array column). Empty list when the user has no roles / none of
  // their roles carry permissions (ROWS_TO_ARRAY never returns NULL).
  // Two roles overlapping on a permission can list an id twice; that
  // is harmless for the membership check the consumer runs (dedup via
  // `array_agg(DISTINCT …)` isn't expressible — the DQL has no
  // aggregate-DISTINCT — and matches GetUserByTokenWithPermissions).
  rpc GetUserPermissions(GetUserPermissionsReq) returns (GetUserPermissionsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(rp.permission_id) AS permission_ids "
          "FROM @module.RolePermission rp "
          "JOIN @module.UserRole ur ON ur.role_id = rp.role_id "
          "JOIN @module.Role r ON r.id = rp.role_id "
          "WHERE ur.user_id = :user_id AND ur.revoked_at IS NULL AND rp.removed_at IS NULL AND r.deleted_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetExpiredToken — see the request. Matches the same two keys as the live
  // lookup (hash, or the legacy clear token) and only rows that have ENDED:
  // expired (`expires_at <= NOW()` never matches a NULL, never-expiring row)
  // or revoked — exactly the rows the live lookup's two predicates refuse.
  // Read only — an ended row is never moved to the hash or otherwise touched.
  rpc GetExpiredToken(GetExpiredTokenReq) returns (GetExpiredTokenResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.expires_at AS expires_at, "
          "       COALESCE(d.thumbprint, '') AS device_thumbprint, "
          "       t.revoked_at AS revoked_at, "
          "       d.revoked_at AS device_revoked_at "
          "FROM @module.UserToken t "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "WHERE (t.token_hash = :token_hash OR t.token = :legacy_token) AND (t.expires_at <= NOW() OR t.revoked_at IS NOT NULL)"
      }
    };
  }

  // GetUserByTokenWithPermissions — Authenticate's bearer lookup: the live
  // token (by its hash, or the legacy plaintext column), its user, and the
  // device it is bound to. Despite the name it returns no permissions: those
  // are a second read, GetUserRoleGrants, which the resolver narrows (realm,
  // organization, token subset). The token JOIN is inner — no live token, no
  // row (NotFound), and the gateway answers 401.
  rpc GetUserByTokenWithPermissions(GetUserByTokenWithPermissionsReq) returns (GetUserByTokenWithPermissionsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       ?feature(service_account) u.kind AS user.kind, "
          "       ?feature(user_admin) u.disabled_at AS user.disabled_at, "
          "       ?feature(marketing_consent) u.marketing_consent AS user.marketing_consent, "
          "       u.created_at AS user.created_at, "
          "       t.id AS token_id, "
          "       COALESCE(t.token_hash, '') AS stored_token_hash, "
          "       COALESCE(d.thumbprint, '') AS device_thumbprint, "
          "       d.revoked_at AS device_revoked_at, "
          "       t.mcp_only AS mcp_only "
          "FROM @module.User u "
          "JOIN @module.UserToken t ON t.user_id = u.id "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "WHERE (t.token_hash = :token_hash OR t.token = :legacy_token) AND (t.expires_at IS NULL OR t.expires_at > NOW()) AND t.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetUserRoleGrants — every role this user holds, role-attributed.
  //
  // Its own query because the shape demands it: a repeated sub-message is
  // generated as a fan-out only when it is the WHOLE response. Folding it
  // into the token lookup produced scan code that did not compile.
  rpc GetUserRoleGrants(GetUserRoleGrantsReq) returns (GetUserRoleGrantsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE ur.user_id = :user_id AND ur.revoked_at IS NULL AND r.deleted_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // ListRoleGrants — the role catalogue, role-attributed. See the message.
  rpc ListRoleGrants(ListRoleGrantsReq) returns (ListRoleGrantsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.Role r "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE r.deleted_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // CountUsers — total user count. The turnkey SignUp handler reads it
  // right after the insert: count == 1 ⇒ this is the first registered
  // user ⇒ assign the bootstrap-admin (first_user) roles. rbac-gated
  // (only the role-assignment path calls it).
  rpc CountUsers(CountUsersReq) returns (CountUsersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT COUNT(*) AS count FROM @module.User u"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // ListUsers — the admin Users page catalogue. Projects the safe
  // columns only (NO password_hash) into the repeated User; newest
  // first. Gated user_admin.
  rpc ListUsers(ListUsersReq) returns (ListUsersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS id, u.email AS email, "
          "       ?feature(service_account) u.kind AS kind, "
          "       u.disabled_at AS disabled_at, u.erased_at AS erased_at, "
          "       u.created_at AS created_at "
          "FROM @module.User u ORDER BY u.created_at DESC, u.id DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
  }

  // ListOrgMemberAccounts — every account that is a member of THIS
  // organization, with its kind when `service_account` is on.
  //
  // The org-scoped half of the machine-account directory (ListBots): the
  // handler keeps the BOT rows. It is gated `org_membership` and not
  // `service_account` because the JOIN needs the membership table, and a
  // query staged with service_account alone broke a realm WITHOUT orgs at
  // codegen — one organization, no membership table, and machine accounts
  // that are the realm's (the platform's own backoffice). The kind filter
  // moved to Go for the same reason: `User.kind` exists only with
  // service_account, and an rpc carries one gate. `kind` and `disabled_at`
  // ride feature-gated projections.
  rpc ListOrgMemberAccounts(ListOrgMemberAccountsReq) returns (ListOrgMemberAccountsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS id, u.email AS email, "
          "       ?feature(service_account) u.kind AS kind, "
          "       ?feature(user_admin) u.disabled_at AS disabled_at, "
          "       ?feature(tenant_scope) u.tenant_id AS tenant_id, "
          "       u.created_at AS created_at "
          "FROM @module.User u "
          "JOIN @module.OrgMembership m ON m.user_id = u.id AND m.org_id = :org_id AND m.removed_at IS NULL "
          "ORDER BY u.created_at DESC, u.id DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
  }

  // ListBotAccounts — every machine account, for the admin ServiceAccounts page.
  //
  // REALM-WIDE, on purpose, and only for the admin surface: that surface is the
  // operator's, and its Users page already lists every person (ListUsers). The
  // org-scoped ListOrgMemberAccounts above serves the in-product bot directory
  // where the realm has organizations, and a company's operator must see their
  // own bots only. In a realm WITHOUT organizations this is that directory too:
  // the realm is one organization, and its machine accounts are all of them.
  //
  // The page used to name a query that does not exist, and before that the
  // org-scoped one — whose required org_id an admin list cannot supply. No
  // project ever published the page, so nothing ever generated it; plugin dev
  // now publishes every preset surface, which is what found it.
  rpc ListBotAccounts(ListBotAccountsReq) returns (ListBotAccountsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS id, u.email AS email, "
          "       u.kind AS kind, "
          "       u.disabled_at AS disabled_at, u.erased_at AS erased_at, "
          "       u.created_at AS created_at "
          "FROM @module.User u "
          "WHERE u.kind = 1 "
          "ORDER BY u.created_at DESC, u.id DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  // ListRealmMachineAccounts — every machine account of the realm, for the
  // in-product directory (ListBots) in a realm WITHOUT organizations.
  //
  // Not ListBotAccounts: that one is the admin page's source and PAGED, so a
  // handler reading it would see the first page and call it the whole list.
  // Unpaged like its org-scoped sibling ListOrgMemberAccounts, which a realm
  // with organizations reads instead.
  rpc ListRealmMachineAccounts(ListRealmMachineAccountsReq) returns (ListRealmMachineAccountsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS id, u.email AS email, "
          "       u.kind AS kind, "
          "       u.disabled_at AS disabled_at, "
          "       ?feature(tenant_scope) u.tenant_id AS tenant_id, "
          "       u.created_at AS created_at "
          "FROM @module.User u "
          "WHERE u.kind = 1 "
          "ORDER BY u.created_at DESC, u.id DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  // GetOrgMember — is this account a member of THIS organization?
  //
  // Empty user_id = no. An endpoint acting on a machine account by id must
  // ask, because the id arrives on the wire: without it an operator in one
  // company could name a machine account in another and be served. Whether
  // the member is a BOT is the caller's second question, asked of the
  // account itself (IssueBotToken reads it before minting) — gated
  // `org_membership` for the reason ListOrgMemberAccounts is.
  rpc GetOrgMember(GetOrgMemberReq) returns (GetOrgMemberResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user_id "
          "FROM @module.User u "
          "JOIN @module.OrgMembership m ON m.user_id = u.id AND m.org_id = :org_id AND m.removed_at IS NULL "
          "WHERE u.id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
  }

  // ListApiRealmRoles — the roles a BOT may be given.
  //
  // The filter is the point and it is SERVER-side. A picker that merely omits
  // a person's roles from a dropdown is decoration; an api-realm principal
  // cannot reach a session-realm role anyway — permissions resolve within the
  // presented token's realm — so offering one would produce a bot whose grant
  // silently does nothing.
  rpc ListApiRealmRoles(ListApiRealmRolesReq) returns (ListApiRealmRolesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS id, r.name AS name, "
          "       r.description AS description "
          "FROM @module.Role r WHERE r.token_type = 2 AND r.deleted_at IS NULL "
          "ORDER BY r.name ASC, r.id ASC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  // GetUser — one user for the admin detail view. Returns the User
  // model DIRECTLY (readonly_fields resolve against its top-level
  // fields). NO password_hash in the projection. Gated user_admin.
  rpc GetUser(GetUserReq) returns (User) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        // kind is projected for the same reason as in GetUserByEmail,
        // and it was missing here too: labelMachineAccount reads it off
        // THIS lookup to stamp the machine-account ACL label. An unset
        // AccountKind is HUMAN, so the label was never stamped and
        // every rule written against it matched nothing — a gate that
        // fails OPEN and reports no error while doing it.
        dql:
          "SELECT u.id AS id, u.email AS email, "
          "       ?feature(service_account) u.kind AS kind, "
          "       u.disabled_at AS disabled_at, u.erased_at AS erased_at, "
          "       u.created_at AS created_at "
          "FROM @module.User u WHERE u.id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
  }

  // GetFirstUserRoles — role ids flagged assign_first_user (seeded from
  // `(w17.acl_roles) { first_user: true }`). The bootstrap-admin set the
  // SignUp handler grants the first user.
  rpc GetFirstUserRoles(GetFirstUserRolesReq) returns (GetFirstUserRolesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT ROWS_TO_ARRAY(r.id) AS role_ids FROM @module.Role r WHERE r.assign_first_user = TRUE AND r.deleted_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetDefaultRoles — role ids flagged assign_default (seeded from
  // `(w17.acl_roles) { default: true }`). Granted to every signup after
  // the first.
  rpc GetDefaultRoles(GetDefaultRolesReq) returns (GetDefaultRolesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT ROWS_TO_ARRAY(r.id) AS role_ids FROM @module.Role r WHERE r.assign_default = TRUE AND r.deleted_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // ListRoles — the role catalogue for the admin role-management page.
  // ⚠️ Both role reads project every UNGATED column the model declares.
  //
  // A column added to the model after these queries were written is
  // not widened into them by anything — `preset_key` and `display_name`
  // were declared, stored, seeded, and unreadable through any path in
  // either realm.
  // `preset_key`'s own comment calls it PROVENANCE, i.e. a thing a reader
  // consults; no reader could.
  //
  // That breaks the one operation the field exists for: granting a
  // founder `org-admin` in CreateOrg by matching the role the SEED owns
  // rather than by name, which is a label a customer may rename. A guard
  // on it fires `role preset "org-admin" is not seeded` against a
  // database where it demonstrably is.
  //
  // Add an ungated column to Role and add it here too. A projection is
  // not a convenience list — it is the only way the field leaves the
  // database.
  //
  // ⚠️ The two GATED columns stay out, and this is a known limit rather
  // than an oversight: `token_type` is gated on `api_token` and
  // `org_scoped` on `org_membership`, so naming either here makes the
  // typecheck fail for every project without that feature ("column
  // r.org_scoped not found on Role" — measured, not predicted). Reading
  // them needs feature-variant DQL, which this vocabulary does not have.
  // The consequence worth knowing: a caller cannot tell an org-scoped
  // role from a global one through the API, only through the seed.

  // ListOrgScopedRoles — the role catalogue restricted to roles that mean
  // something INSIDE an organization.
  //
  // Separate from ListRoles rather than a flag on it, and the comment above
  // that RPC is the reason: `org_scoped` only exists as a column when the
  // `org_membership` feature is on, so naming it in the shared query fails
  // the typecheck for every project without that feature. This one is GATED
  // on org_membership, so the column is guaranteed to be there — the same
  // shape GetUserOrgPermissions already uses.
  //
  // Exists so an invitation UI can offer choices instead of asking a person
  // to type a role name and find out afterwards whether it was one.
  rpc ListOrgScopedRoles(ListOrgScopedRolesReq) returns (ListOrgScopedRolesResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS id, r.name AS name, r.description AS description, "
          "       r.display_name AS display_name, "
          "       ?feature(api_token) r.token_type AS token_type "
          "FROM @module.Role r WHERE r.org_scoped = TRUE AND r.deleted_at IS NULL "
          "ORDER BY r.name ASC, r.id ASC"
      }
    };
  }

  // ListOrgRoleRows — see its request message.
  rpc ListOrgRoleRows(ListOrgRoleRowsReq) returns (ListOrgRoleRowsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_roles";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS id, r.name AS name, r.description AS description, "
          "       r.display_name AS display_name, "
          "       (r.org_id IS NOT NULL) AS custom, "
          "       r.all_permissions AS all_permissions, "
          "       ?feature(api_token) r.token_type AS token_type "
          "FROM @module.Role r "
          "WHERE r.org_scoped = TRUE AND r.deleted_at IS NULL "
          "  AND (r.org_id IS NULL OR r.org_id = :org_id) "
          "ORDER BY r.name ASC, r.id ASC"
      }
    };
  }

  // CountRoleGrants — see its request message.
  rpc CountRoleGrants(CountRoleGrantsReq) returns (CountRoleGrantsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_roles";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT COUNT(*) AS count FROM @module.UserRole ur "
          "WHERE ur.role_id = :role_id AND ur.revoked_at IS NULL"
      }
    };
  }

  // LockOrganization — SELECT … FOR UPDATE on the organization's row, read
  // inside the transaction of a change that can take a superadmin away; see
  // the request.
  rpc LockOrganization(LockOrganizationReq) returns (LockOrganizationResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT o.id AS org_id FROM @module.Organization o WHERE o.id = :org_id AND o.deleted_at IS NULL"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "Organization", kind: SELECT_FOR_UPDATE }
      ]
    };
  }

  // ListOrgSuperadmins — see its request message. Only grants of a live
  // membership count: a removed member's grants are revoked with it, but the
  // join says so rather than relying on it. The account's disabled_at and
  // erased_at exist only with user_admin, so they are PROJECTED behind a gate
  // (a SELECT's WHERE conjunct cannot be gated: dropping one would return more
  // rows) and orgSuperadmins drops a disabled or erased account's rows;
  // without user_admin no account can be disabled or erased.
  rpc ListOrgSuperadmins(ListOrgSuperadminsReq) returns (ListOrgSuperadminsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ur.user_id AS user_id, r.id AS role_id, "
          "       ?feature(user_admin) u.disabled_at AS disabled_at, "
          "       ?feature(user_admin) u.erased_at AS erased_at, "
          "       ?feature(api_token) r.token_type AS token_type "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "JOIN @module.OrgMembership m ON m.user_id = ur.user_id AND m.org_id = ur.org_id AND m.removed_at IS NULL "
          "JOIN @module.User u ON u.id = ur.user_id "
          "WHERE ur.org_id = :org_id AND ur.revoked_at IS NULL "
          "  AND r.all_permissions = TRUE AND r.deleted_at IS NULL "
          "ORDER BY ur.user_id ASC, r.id ASC"
      }
    };
  }

  // ListRealmSuperadmins — see its request message.
  rpc ListRealmSuperadmins(ListRealmSuperadminsReq) returns (ListRealmSuperadminsResp) {
    option (w17.contrib.plugin_feature_rpc) = "rbac";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ur.user_id AS user_id, r.id AS role_id, "
          "       ?feature(user_admin) u.disabled_at AS disabled_at, "
          "       ?feature(user_admin) u.erased_at AS erased_at, "
          "       ?feature(api_token) r.token_type AS token_type "
          "FROM @module.User u "
          "JOIN @module.UserRole ur ON ur.user_id = u.id "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "WHERE ur.revoked_at IS NULL "
          "  AND r.all_permissions = TRUE AND r.deleted_at IS NULL "
          "ORDER BY ur.user_id ASC, r.id ASC"
      }
    };
  }

  // LockUsers — SELECT … FOR UPDATE on the named accounts' User rows, in id
  // order. The last-admin rule locks the realm's administrators with it and
  // then reads them again (a JOIN-shaped read cannot carry the lock itself),
  // so two operators disabling each other at once take the same rows in the
  // same order and the second one's read sees what the first one wrote.
  rpc LockUsers(LockUsersReq) returns (LockUsersResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT u.id AS user_id FROM @module.User u WHERE u.id IN (:ids) ORDER BY u.id ASC"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "User", kind: SELECT_FOR_UPDATE }
      ]
    };
  }

  rpc ListRoles(ListRolesReq) returns (ListRolesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS id, r.name AS name, r.description AS description, "
          "       r.display_name AS display_name, "
          "       r.all_permissions AS all_permissions, "
          "       r.assign_first_user AS assign_first_user, "
          "       r.assign_default AS assign_default, "
          "       r.preset_key AS preset_key, "
          "       r.created_at AS created_at "
          "FROM @module.Role r WHERE r.deleted_at IS NULL ORDER BY r.name ASC, r.id ASC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetRole — one role for the admin detail view.
  // GetRole — one role for the admin detail view. Returns the Role
  // model DIRECTLY (not a wrapper): the admin detail `read` contract is
  // "returns a single <model> instance", and its readonly_fields resolve
  // against the response's top-level fields.
  rpc GetRole(GetRoleReq) returns (Role) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS id, r.name AS name, "
          "       r.description AS description, "
          "       r.display_name AS display_name, "
          "       r.all_permissions AS all_permissions, "
          "       r.assign_first_user AS assign_first_user, "
          "       r.assign_default AS assign_default, "
          "       r.preset_key AS preset_key, "
          "       r.created_at AS created_at "
          "FROM @module.Role r WHERE r.id = :id AND r.deleted_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetTokenWithType — resolve a token string into its owner + id +
  // kind (SESSION/API). The api_token Authenticate path calls this
  // first to branch on the credential class. Gated api_token.
  rpc GetTokenWithType(GetTokenWithTypeReq) returns (GetTokenWithTypeResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.user_id AS user_id, "
          "       t.id AS token_id, "
          "       t.token_type AS token_type, "
          "       COALESCE(t.token_hash, '') AS stored_token_hash, "
          "       u.id AS user.id, "
          "       ?feature(service_account) u.kind AS user.kind, "
          "       ?feature(user_admin) u.disabled_at AS user.disabled_at, "
          "       ?feature(marketing_consent) u.marketing_consent AS user.marketing_consent, "
          "       ?feature(bot_token_guard) u.allowed_cidrs AS user.allowed_cidrs, "
          "       t.last_used_at AS last_used_at, "
          "       COALESCE(d.thumbprint, '') AS device_thumbprint, "
          "       d.revoked_at AS device_revoked_at, "
          "       ?feature(service_account) t.bearer AS bearer, "
          "       ?feature(oauth_server) COALESCE(t.resource, '') AS oauth_resource, "
          "       ?feature(oauth_server) t.oauth_org_id AS oauth_org_id, "
          "       ?feature(oauth_server) t.oauth_grant_id AS oauth_grant_id, "
          "       t.mcp_only AS mcp_only "
          "FROM @module.UserToken t JOIN @module.User u ON u.id = t.user_id "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "WHERE (t.token_hash = :token_hash OR t.token = :legacy_token) AND (t.expires_at IS NULL OR t.expires_at > NOW()) AND t.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetExpiredTokenWithType — see the request. The realm-aware twin of
  // GetExpiredToken: same keys, ended (expired or revoked) rows only, plus the kind so the
  // refusal can say "sign in again" to a session and "create a new token" to
  // an API token. Read only.
  rpc GetExpiredTokenWithType(GetExpiredTokenWithTypeReq) returns (GetExpiredTokenWithTypeResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.expires_at AS expires_at, "
          "       t.token_type AS token_type, "
          "       COALESCE(d.thumbprint, '') AS device_thumbprint, "
          "       t.revoked_at AS revoked_at, "
          "       ?feature(service_account) t.bearer AS bearer, "
          "       d.revoked_at AS device_revoked_at "
          "FROM @module.UserToken t "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "WHERE (t.token_hash = :token_hash OR t.token = :legacy_token) AND (t.expires_at <= NOW() OR t.revoked_at IS NOT NULL)"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetUserRolePermissionsByRealm — distinct permission IDs the user
  // holds through roles of the given realm (token_type). The realm
  // filter (Role.token_type = :token_type) is why a session token and
  // an API token for the same user resolve different permission sets.
  // Gated api_token (reads Role.token_type, an api_token column).
  rpc GetUserRolePermissionsByRealm(GetUserRolePermissionsByRealmReq) returns (GetUserRolePermissionsByRealmResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE ur.user_id = :user_id AND r.token_type = :token_type AND ur.revoked_at IS NULL AND r.deleted_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
  }


  // GetTokenPermissionSubset — the per-token permission subset rows.
  // Empty = no narrowing. Authenticate intersects these with the realm
  // permissions for API tokens (narrow-only). Gated api_token.
  rpc GetTokenPermissionSubset(GetTokenPermissionSubsetReq) returns (GetTokenPermissionSubsetResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(tp.permission_id) AS permission_ids "
          "FROM @module.TokenPermission tp WHERE tp.token_id = :token_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // ListApiTokensByUser — the caller's API tokens (management view, no
  // secret token string). Filtered to token_type = :token_type (handler
  // stamps API). Revoked tokens are listed, with revoked_at and
  // revoke_reason, so the owner sees them revoked. Newest first. Gated
  // api_token.
  rpc ListApiTokensByUser(ListApiTokensByUserReq) returns (ListApiTokensByUserResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          // FLAT aliases, matching the repeated ELEMENT's fields. A
          // list-shaped response scans into ApiTokenInfo, so a
          // `tokens.`-prefixed path walks the wrapper field name on the
          // element and fails ("segment \"tokens\" not found on
          // ApiTokenInfo"). The nested form above (GetUserByEmail's
          // `u.id AS user.id`) is for a response that wraps ONE message;
          // this one is the ListUsers shape. Nothing caught it because
          // api_token is off by default and no example activated it, so
          // this query had never been emitted.
          "SELECT t.id AS id, "
          "       t.name AS name, "
          "       t.last_used_at AS last_used_at, "
          "       t.expires_at AS expires_at, "
          "       t.created_at AS created_at, "
          "       t.revoked_at AS revoked_at, "
          "       t.revoke_reason AS revoke_reason, "
          "       d.thumbprint AS device_thumbprint, "
          "       d.revoked_at AS device_revoked_at "
          "FROM @module.UserToken t "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "WHERE t.user_id = :user_id AND t.token_type = :token_type "
          "ORDER BY t.created_at DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetUserDeviceByThumbprint — the live (user, thumbprint) Device row; see
  // the request. Gated api_token.
  rpc GetUserDeviceByThumbprint(GetUserDeviceByThumbprintReq) returns (GetUserDeviceByThumbprintResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS device_id "
          "FROM @module.Device d "
          "WHERE d.user_id = :user_id AND d.thumbprint = :thumbprint AND d.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetSessionApprover — the caller's session's approver; see the request.
  // Gated api_token.
  rpc GetSessionApprover(GetSessionApproverReq) returns (GetSessionApproverResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.approved_by_device_id AS approved_by_device_id "
          "FROM @module.UserToken t "
          "WHERE t.id = :token_id AND t.user_id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // LockMachineAccount — SELECT … FOR UPDATE on the machine account's user
  // row, read inside IssueBotToken's transaction; see the request. Gated
  // service_account.
  rpc LockMachineAccount(LockMachineAccountReq) returns (LockMachineAccountResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT u.id AS user_id FROM @module.User u WHERE u.id = :user_id"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "User", kind: SELECT_FOR_UPDATE }
      ]
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  // ListMachineKeys — the machine account's live keyed devices; see the
  // request. FLAT aliases (a list-shaped response). Gated service_account.
  rpc ListMachineKeys(ListMachineKeysReq) returns (ListMachineKeysResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS id, d.thumbprint AS thumbprint "
          "FROM @module.Device d "
          "WHERE d.user_id = :user_id AND d.revoked_at IS NULL AND d.thumbprint IS NOT NULL "
          "ORDER BY d.created_at"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "service_account";
  }

  // GetBotAllowedCidrs — see the request. Gated bot_token_guard.
  rpc GetBotAllowedCidrs(GetBotAllowedCidrsReq) returns (GetBotAllowedCidrsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.allowed_cidrs AS allowed_cidrs "
          "FROM @module.User u "
          "WHERE u.id = :user_id AND u.kind = 1"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "bot_token_guard";
  }

  // ListBotTokenUses — see the request. Unpaged: the rows grow with new
  // combinations only. Gated bot_token_guard.
  rpc ListBotTokenUses(ListBotTokenUsesReq) returns (ListBotTokenUsesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT b.token_id AS token_id, b.address AS address, b.surface AS surface, "
          "       b.method AS method, b.first_used_at AS first_used_at, b.last_used_at AS last_used_at "
          "FROM @module.BotTokenUse b "
          "WHERE b.user_id = :user_id "
          "ORDER BY b.last_used_at DESC, b.id DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "bot_token_guard";
  }

  // GetUserTenant — resolves the principal's tenant_id (the
  // tenant data scope) by user id. The gated tenant.go handler
  // calls this from Authenticate's scope decorator to stamp
  // scopes["tenant_id"]. Tagged `tenant_scope`: the User.tenant_id
  // column it reads is gated by the same feature, so the query
  // and its column appear / disappear together. tenant_id is
  // NOT NULL on User, so a resolved principal always yields one.
  rpc GetUserTenant(GetUserTenantReq) returns (GetUserTenantResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT u.tenant_id AS tenant_id FROM @module.User u WHERE u.id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "tenant_scope";
  }

  // GetTenantBySlug — resolve a tenant id from its slug (Tenant.name).
  // Used by SignUp for URL-based tenancy (`/t/{tenant_slug}/...`).
  rpc GetTenantBySlug(GetTenantBySlugReq) returns (GetTenantBySlugResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT t.id AS tenant_id FROM @module.Tenant t WHERE t.name = :slug"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "tenant_scope";
  }

  // GetTenantByDomain — resolve a tenant id from its host domain.
  // Used by SignUp for host-based tenancy (the forwarded Host header).
  rpc GetTenantByDomain(GetTenantByDomainReq) returns (GetTenantByDomainResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT t.id AS tenant_id FROM @module.Tenant t WHERE t.domain = :domain"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "tenant_scope";
  }

  // GetProviderByName — the OAuth provider keyed by URL slug. Returns all
  // columns incl. client_secret (the handler needs it for the token
  // exchange + state HMAC). The handler enforces `enabled`. Gated oauth.
  // GetRegisteredRedirect — is this (client_id, redirect_uri) pair one the
  // operator wrote down, and still enabled?
  //
  // The whole check is in the WHERE: an exact equality on the redirect, never
  // a prefix or a host comparison. A prefix match would accept
  // `https://app.example.com.evil.example`, and a host comparison would
  // accept any path on a registered origin — including one an attacker can
  // make the app render.
  //
  // NotFound (or an empty row) means "not registered", which is the same
  // answer as "no such client": the authorize refusal must not tell a caller
  // which half they got wrong.
  rpc GetRegisteredRedirect(GetRegisteredRedirectReq) returns (GetRegisteredRedirectResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS client.id, "
          "       c.client_id AS client.client_id, "
          "       c.name AS client.name, "
          "       c.redirect_uri AS client.redirect_uri, "
          "       c.enabled AS client.enabled, "
          "       c.created_at AS client.created_at "
          "FROM @module.AuthClient c "
          "WHERE c.client_id = :client_id AND c.redirect_uri = :redirect_uri AND c.enabled = TRUE AND c.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  // ListAuthClients — the operator's view of what is registered, revoked
  // registrations included (with revoked_at). Admin-only.
  rpc ListAuthClients(ListAuthClientsReq) returns (ListAuthClientsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS id, "
          "       c.client_id AS client_id, "
          "       c.name AS name, "
          "       c.redirect_uri AS redirect_uri, "
          "       c.enabled AS enabled, "
          "       c.created_at AS created_at, "
          "       c.revoked_at AS revoked_at "
          "FROM @module.AuthClient c ORDER BY c.client_id, c.redirect_uri"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  // GetAuthClientRevocation — see the request. Keyed on the unique pair, so
  // it reads one row (there is at most one: the index is not partial).
  rpc GetAuthClientRevocation(GetAuthClientRevocationReq) returns (GetAuthClientRevocationResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS id, c.revoked_at AS revoked_at "
          "FROM @module.AuthClient c "
          "WHERE c.client_id = :client_id AND c.redirect_uri = :redirect_uri"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  // GetAuthClientSecret — the registered client's secret hash, for the token
  // endpoint to verify what the client presents. Keyed on the same
  // (client_id, redirect_uri) pair the registry is unique on, so it reads the
  // row the code was actually minted against. `enabled` rides along: a client
  // disabled between authorize and exchange must not be able to redeem.
  rpc GetAuthClientSecret(GetAuthClientSecretReq) returns (GetAuthClientSecretResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.client_secret AS client_secret, "
          "       c.enabled AS enabled "
          "FROM @module.AuthClient c "
          // Live rows only: a revoked registration is refused like an unknown
          // one.
          "WHERE c.client_id = :client_id AND c.redirect_uri = :redirect_uri AND c.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  // GetLiveSessionExpiry — the approving session's expires_at, for CliAuthorize
  // to bind into the code. Scoped by the token id AND the owner, so a caller
  // can read only their own session, and live only. No row = refuse the
  // approval.
  //
  // No token_type filter: a SELECT cannot gate a WHERE conjunct, and the
  // column exists only under `api_token`. The session-only guarantee comes
  // from the handler instead — requireSessionCaller runs first, and the
  // envelope carries a session_token_id only for a session-realm token, so
  // the id this query is asked about is always a session's.
  // GetCliApproverRevocation — the approving device's revoked_at, read by
  // CliToken for a code that names one. Gated cli_login.
  rpc GetCliApproverRevocation(GetCliApproverRevocationReq) returns (GetCliApproverRevocationResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT d.id AS device_id, d.revoked_at AS revoked_at FROM @module.Device d WHERE d.id = :device_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  rpc GetLiveSessionExpiry(GetLiveSessionExpiryReq) returns (GetLiveSessionExpiryResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.id AS token_id, "
          "       t.expires_at AS expires_at, "
          "       t.device_id AS device_id "
          "FROM @module.UserToken t "
          "WHERE t.id = :token_id AND t.user_id = :user_id "
          "AND (t.expires_at IS NULL OR t.expires_at > NOW()) AND t.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  rpc GetProviderByName(GetProviderByNameReq) returns (GetProviderByNameResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS provider.id, "
          "       p.name AS provider.name, "
          "       p.display_name AS provider.display_name, "
          "       p.client_id AS provider.client_id, "
          "       p.client_secret AS provider.client_secret, "
          "       p.secret AS secret, "
          "       p.authorize_url AS provider.authorize_url, "
          "       p.token_url AS provider.token_url, "
          "       p.userinfo_url AS provider.userinfo_url, "
          "       p.scopes AS provider.scopes, "
          "       p.subject_path AS provider.subject_path, "
          "       p.email_path AS provider.email_path, "
          "       p.enabled AS provider.enabled, "
          "       p.created_at AS provider.created_at, "
          "       p.response_mode AS provider.response_mode, "
          "       p.team_id AS provider.team_id, "
          "       p.key_id AS provider.key_id "
          "FROM @module.OAuthProvider p WHERE p.name = :name"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "oauth";
  }

  // GetOAuthIdentity — the existing User↔subject link for a provider.
  // NotFound = first sign-in (the handler creates user + identity). Gated
  // oauth.
  rpc GetOAuthIdentity(GetOAuthIdentityReq) returns (GetOAuthIdentityResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT i.id AS identity.id, "
          "       i.user_id AS identity.user_id, "
          "       i.provider_id AS identity.provider_id, "
          "       i.external_id AS identity.external_id, "
          "       i.email AS identity.email, "
          "       i.created_at AS identity.created_at "
          "FROM @module.OAuthIdentity i WHERE i.provider_id = :provider_id AND i.external_id = :external_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "oauth";
  }

  // GetUserById — resolve a user by id, password_hash included. Callers
  // include ResolveUser (the account a principal is answered for), the
  // EnrollTotp otpauth label (which wants the email) and ChangePassword (which must verify the CURRENT password of the
  // authenticated principal, and must not look that principal up by an
  // address the request supplied). Ungated — see the messages above.
  rpc GetUserById(GetUserByIdReq) returns (GetUserByIdResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       ?feature(service_account) u.kind AS user.kind, "
          // email_verified_at (`email_verification`): without it
          // inviteVerifiedEmailGate read a field nobody filled, so with
          // AUTH_INVITE_REQUIRES_VERIFIED_EMAIL on it refused EVERY invite —
          // including verified accounts. Third instance of the
          // shape GetUserByEmail's comment already names.
          "       ?feature(email_verification) u.email_verified_at AS user.email_verified_at, "
          // disabled_at (`user_admin`): every path that issues a session for
          // an EXISTING account re-checks it through this read
          // (refuseUnsignableAccount). Left out, the second sign-in step,
          // the OAuth callback and the CLI exchange issued sessions to an
          // account disabled after its password step.
          "       ?feature(user_admin) u.disabled_at AS user.disabled_at, "
          // erased_at (`user_admin`): EraseUsers reads it to make a second
          // erase a no-op.
          "       ?feature(user_admin) u.erased_at AS user.erased_at, "
          // tenant_id (`tenant_scope`): IssueBotToken holds the target to the
          // operator's tenant (service_account_tenant.go) through this read.
          "       ?feature(tenant_scope) u.tenant_id AS user.tenant_id, "
          // marketing_consent (`marketing_consent`): ResolveUser answers it in
          // AuthResp as Authenticate does from GetUserByTokenWithPermissions.
          "       ?feature(marketing_consent) u.marketing_consent AS user.marketing_consent, "
          "       u.created_at AS user.created_at "
          "FROM @module.User u WHERE u.id = :user_id"
      }
    };
  }

  // The user's marketing consent and when they decided it (NULL = never
  // asked). Gated marketing_consent.
  rpc GetUserMarketingConsent(GetUserMarketingConsentReq) returns (GetUserMarketingConsentResp) {
    option (w17.contrib.plugin_feature_rpc) = "marketing_consent";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.marketing_consent AS consent, "
          "       u.marketing_consent_at AS decided_at "
          "FROM @module.User u "
          "WHERE u.id = :user_id"
      }
    };
  }

  // GetTotpSecret — the user's TOTP row (seed — or the legacy secretbox
  // `secret` seedOf moves — + confirmed_at).
  // NotFound = not enrolled. The gate reads confirmed_at for totp_enrolled;
  // VerifyMfa / ConfirmTotp verify against the seed. Gated
  // two_factor.
  rpc GetTotpSecret(GetTotpSecretReq) returns (GetTotpSecretResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT s.id AS secret.id, "
          "       s.user_id AS secret.user_id, "
          "       s.secret AS secret.secret, "
          "       s.seed AS seed, "
          "       s.last_step AS secret.last_step, "
          "       s.confirmed_at AS secret.confirmed_at, "
          "       s.created_at AS secret.created_at "
          "FROM @module.UserTotpSecret s WHERE s.user_id = :user_id AND s.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // CountRecoveryCodes — the user's still-usable recovery codes, for
  // GetMfaStatus. Gated two_factor.
  rpc CountRecoveryCodes(CountRecoveryCodesReq) returns (CountRecoveryCodesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT COUNT(*) AS count FROM @module.UserRecoveryCode r "
          "WHERE r.user_id = :user_id AND r.used_at IS NULL AND r.revoked_at IS NULL"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // GetMfaChallenge — load a pending challenge by id for VerifyMfa
  // (user_id to scope the verify, code_hash for the event/fallback path,
  // consumed_at + created_at for the single-use + TTL checks). Gated
  // two_factor.
  rpc GetMfaChallenge(GetMfaChallengeReq) returns (GetMfaChallengeResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS challenge.id, "
          "       c.user_id AS challenge.user_id, "
          "       c.code_hash AS challenge.code_hash, "
          "       c.consumed_at AS challenge.consumed_at, "
          "       c.created_at AS challenge.created_at, "
          "       c.attempts AS challenge.attempts, "
          "       COALESCE(c.thumbprint, '') AS challenge.thumbprint, "
          "       c.public_computer AS challenge.public_computer "
          "FROM @module.MfaChallenge c WHERE c.id = :challenge_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // LockUserForIssuance — SELECT … FOR UPDATE on the user row. Read inside
  // the issuance transaction, so the count-then-insert that follows is one
  // serialised section per user. Gated two_factor.
  rpc LockUserForIssuance(LockUserForIssuanceReq) returns (LockUserForIssuanceResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT u.id AS user_id FROM @module.User u WHERE u.id = :user_id"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "User", kind: SELECT_FOR_UPDATE }
      ]
    };
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // CountRecentMfaChallenges — how many challenges this user has been
  // ISSUED since :since, consumed or not. It counts ROWS, not live codes:
  // a superseded challenge still spent its slice of the window, which is
  // the whole point — the cap is on issuance, and superseding is what the
  // issuer does to the previous one. Gated two_factor.
  rpc CountRecentMfaChallenges(CountRecentMfaChallengesReq) returns (CountRecentMfaChallengesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT COUNT(*) AS count FROM @module.MfaChallenge c "
          "WHERE c.user_id = :user_id AND c.created_at > :since"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // GetDeviceTrustRevokedAt — when the account's device trust was last
  // revoked (a password change or a disable stamps it). The sign-in resolver
  // and ListDevices count a device as trusted only when its trusted_at is
  // later. Base tier, like the Device table.
  rpc GetDeviceTrustRevokedAt(GetDeviceTrustRevokedAtReq) returns (GetDeviceTrustRevokedAtResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT u.device_trust_revoked_at AS device_trust_revoked_at FROM @module.User u WHERE u.id = :user_id"
      }
    };
  }

  // ListUserDevices — the caller's live devices (management view), newest
  // first; a revoked device, and a legacy one recorded before device binding
  // (no thumbprint), is history, not a device to manage — both stay in the
  // table, queryable. A program's key (api_key: an API token's device) is not
  // a device the owner signs in with: it is managed through its API token,
  // so RevokeOtherDevices and RevokeAllDevices, which read this list, leave
  // API tokens alone. The handler
  // maps each row to DeviceInfo, deriving `trusted` (trusted_at later than
  // the account's trust revocation) + `current` (thumbprint matches the
  // device the caller's token is bound to). Gated devices.
  rpc ListUserDevices(ListUserDevicesReq) returns (ListUserDevicesResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS id, "
          "       d.user_id AS user_id, "
          "       d.thumbprint AS thumbprint, "
          "       d.label AS label, "
          "       d.ip AS ip, "
          "       d.trusted_at AS trusted_at, "
          "       d.last_seen_at AS last_seen_at, "
          "       d.created_at AS created_at "
          "FROM @module.Device d WHERE d.user_id = :user_id AND d.revoked_at IS NULL "
          "AND d.thumbprint IS NOT NULL AND d.api_key = FALSE "
          "ORDER BY d.last_seen_at DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "devices";
  }

  // ── org_membership (multi-org, GitHub-style) ──

  // ListUserOrgs — the organizations a user belongs to, with their role
  // in each (join OrgMembership → Organization).
  rpc ListUserOrgs(ListUserOrgsReq) returns (ListUserOrgsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT o.id AS org_id, "
          "       o.slug AS slug, "
          "       o.name AS name, "
          "       o.kind AS kind, "
          "       m.role AS role, "
          "       ?feature(membership_kinds) m.kind AS membership_kind "
          "FROM @module.OrgMembership m "
          "JOIN @module.Organization o ON o.id = m.org_id "
          "WHERE m.user_id = :user_id AND m.removed_at IS NULL AND o.deleted_at IS NULL "
          "ORDER BY o.name ASC"
      }
    };
  }

  // ListUserOrgGrants — the role ids a user holds INSIDE one organization
  // (see its request message).
  rpc ListUserOrgGrants(ListUserOrgGrantsReq) returns (ListUserOrgGrantsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(ur.role_id) AS role_ids "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "WHERE ur.user_id = :user_id AND ur.org_id = :org_id AND ur.revoked_at IS NULL AND r.deleted_at IS NULL"
      }
    };
  }

  // GetUserOrgPermissions — the permissions the user holds IN A GIVEN
  // ORGANIZATION: the union of every role assigned to them realm-wide
  // (`UserRole.org_id IS NULL`) and every role assigned inside that org.
  // The Authenticate org-narrowing step calls it after the scope
  // decorator has validated membership and resolved the active org, and
  // its answer REPLACES the unfiltered set — the unfiltered set is the
  // union across every org the user belongs to, which is precisely what
  // must not leak between tenants.
  //
  // This is the ONLY query that names `UserRole.org_id`, which is why it
  // is the only one that had to be gated: the column is dropped when
  // `org_membership` is off.
  //
  // Notes on the DQL, both of which are load-bearing:
  //
  //   - the org predicate sits in the LEFT JOIN's ON clause, NOT in
  //     WHERE. In WHERE it would discard every row of a user whose roles
  //     are all assigned in OTHER organizations, taking the user's own
  //     row with them — the query would answer NotFound where the right
  //     answer is "no permissions here". In ON, those roles simply fail
  //     to join and the aggregate yields an empty list.
  //   - the wildcard EXISTS repeats the same predicate. A superadmin
  //     role assigned inside org A must not pass checks in org B, and a
  //     wildcard carries no RolePermission rows to filter, so the org
  //     test has to happen in the probe itself.
  //   - the NULL-org leg asks the ROLE whether it is org-scoped, which is
  //     why Role joins before the predicate rather than after it. A NULL
  //     `org_id` means "realm-wide", deliberately and load-bearing for the
  //     roles that are — but `(w17.acl_roles).scope: ORG` says this role's
  //     grants live in the organization they were assigned in, and those
  //     two readings collide on exactly the row the declaration exists to
  //     prevent. Unless a read enforces it, `org_scoped` is written by the
  //     seed and read by nobody, and an org-scoped role assigned without an
  //     organization grants itself in every one of them. Enforced HERE
  //     rather than on the write side, because the read decides what an
  //     existing row MEANS — whatever wrote it, and whenever.
  rpc GetUserOrgPermissions(GetUserOrgPermissionsReq) returns (GetUserOrgPermissionsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE ur.user_id = :user_id "
          "  AND (ur.org_id = :org_id "
          "       OR (ur.org_id IS NULL AND r.org_scoped = FALSE)) "
          "  AND ur.revoked_at IS NULL AND r.deleted_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
  }

  // GetUserRealmWidePermissions — what the caller holds when NO active
  // organization could be resolved (they belong to none, or to several
  // and sent no `W17-Org` header). Only realm-wide grants count; every
  // org-scoped role is out of context — which this now ASKS, rather than
  // inferring it from a NULL `org_id`. A role declared `scope: ORG` and
  // assigned with no organization wrote exactly that NULL, so the
  // inference answered "realm-wide" for the one role that must never be
  // (GetUserOrgPermissions carries the reasoning). Without this the request would
  // fall back to the unfiltered set, which is the union across every org
  // the user belongs to — the leak this whole feature exists to close.
  rpc GetUserRealmWidePermissions(GetUserRealmWidePermissionsReq) returns (GetUserRealmWidePermissionsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS role_id, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids, "
          "       r.all_permissions AS all_permissions "
          "FROM @module.UserRole ur "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = r.id AND rp.removed_at IS NULL "
          "WHERE ur.user_id = :user_id "
          "  AND ur.org_id IS NULL AND r.org_scoped = FALSE "
          "  AND ur.revoked_at IS NULL AND r.deleted_at IS NULL "
          "GROUP BY r.id, r.all_permissions "
          "ORDER BY r.id ASC"
      }
    };
  }

  // GetUserOrgBySlug — resolve an org slug to its id AND validate the
  // caller's membership in one shot (the join requires a membership row).
  // Empty org_id = not a member. Backs the active-org scope decorator.
  rpc GetUserOrgBySlug(GetUserOrgBySlugReq) returns (GetUserOrgBySlugResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT o.id AS org_id, m.role AS role "
          "FROM @module.OrgMembership m "
          "JOIN @module.Organization o ON o.id = m.org_id "
          "WHERE m.user_id = :user_id AND o.slug = :slug AND m.removed_at IS NULL AND o.deleted_at IS NULL"
      }
    };
  }

  // ── org_membership admin reads (turnkey Organizations /
  //    OrgMemberships pages) ──

  // ListOrganizations — the org catalogue for the admin Organizations
  // page list `source`. Projects the Organization columns; newest orgs
  // are found by name (a stable, human-scannable order). Gated
  // org_membership.
  rpc ListOrganizations(ListOrganizationsReq) returns (ListOrganizationsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT o.id AS id, o.slug AS slug, o.name AS name, "
          "       o.kind AS kind, o.created_at AS created_at "
          "FROM @module.Organization o WHERE o.deleted_at IS NULL ORDER BY o.name ASC, o.id ASC"
      }
    };
  }

  // GetOrganization — one org for the admin detail view. Returns the
  // Organization model DIRECTLY (readonly_fields resolve against its
  // top-level fields). Gated org_membership.
  rpc GetOrganization(GetOrganizationReq) returns (Organization) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT o.id AS id, o.slug AS slug, o.name AS name, "
          "       o.kind AS kind, o.created_at AS created_at "
          "FROM @module.Organization o WHERE o.id = :id AND o.deleted_at IS NULL"
      }
    };
  }

  // ListOrgMemberships — every membership row for the admin
  // OrgMemberships page list `source`; newest first. Projects into
  // OrgMembershipAdminRow (ADMIN-FK): the member's EMAIL (LEFT JOIN
  // User) + the org's NAME (LEFT JOIN Organization, linked to the
  // Organizations page by the page's AdminColumnRef) instead of the two
  // raw UUIDs the link table stores. LEFT JOINs + COALESCE so a membership
  // whose user or org was hard-deleted (no DB-level FK) still lists with an
  // empty handle instead of erroring the whole page (a NULL join scanned
  // into a Go string is a scan error). Gated org_membership.
  rpc ListOrgMemberships(ListOrgMembershipsReq) returns (ListOrgMembershipsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT m.id AS id, COALESCE(u.email, '') AS member, "
          "       m.org_id AS organization, COALESCE(o.name, '') AS org_name, "
          "       m.role AS role, m.created_at AS created_at "
          "FROM @module.OrgMembership m "
          "LEFT JOIN @module.User u ON u.id = m.user_id "
          "LEFT JOIN @module.Organization o ON o.id = m.org_id "
          "WHERE m.removed_at IS NULL "
          "ORDER BY m.created_at DESC, m.id DESC"
      }
    };
  }

  // GetOrgMembership — one membership for the admin detail view. Returns
  // the OrgMembership model DIRECTLY. Gated org_membership.
  rpc GetOrgMembership(GetOrgMembershipReq) returns (OrgMembership) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT m.id AS id, m.user_id AS user_id, m.org_id AS org_id, "
          "       m.role AS role, m.created_at AS created_at "
          "FROM @module.OrgMembership m WHERE m.id = :id AND m.removed_at IS NULL"
      }
    };
  }

  // ── user_admin: global session/token review ──

  // ListUserTokens — every token for the admin Sessions page list
  // `source`; newest first. Projects into UserTokenAdminRow (ADMIN-FK):
  // the session owner's EMAIL (LEFT JOIN User — a display-only handle) +
  // the raw user_id (linked to Users by the page's AdminColumnRef, which
  // declares no title so the cell reads "User" with the id in its
  // tooltip), so the list shows a name + a labelled link instead of a
  // bare user UUID. The projection NEVER includes the secret `token`
  // column — only base-tier id / user_id / created_at / expires_at and the
  // revocation (so it stays valid whether or not api_token / devices add
  // their columns). Revoked tokens are listed, shown as revoked.
  // LEFT JOIN + COALESCE so an orphan token (its user row missing — there
  // is no DB-level FK, and rows from before erasure replaced deletion may
  // exist) still lists with an empty owner instead of erroring the whole
  // page (converting a NULL join into a Go string is a scan error). Gated
  // user_admin.
  rpc ListUserTokens(ListUserTokensReq) returns (ListUserTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.id AS id, COALESCE(u.email, '') AS owner, t.user_id AS user, "
          "       t.created_at AS created_at, t.expires_at AS expires_at, "
          "       t.revoked_at AS revoked_at, t.revoke_reason AS revoke_reason, "
          "       t.device_id AS device, COALESCE(d.label, '') AS device_label, "
          "       d.thumbprint AS thumbprint, t.public_computer AS public_computer "
          "FROM @module.UserToken t "
          "LEFT JOIN @module.User u ON u.id = t.user_id "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "ORDER BY t.created_at DESC, t.id DESC"
      }
    };
  }

  // GetUserToken — one token for the admin Sessions detail view, as
  // UserTokenAdminDetail: only the safe columns (NO secret `token` or
  // `token_hash`, same discipline as GetUser omitting password_hash), the
  // device the token is bound to (LEFT JOIN Device d) and, for a CLI session,
  // the device that approved it (LEFT JOIN Device a). Gated user_admin.
  rpc GetUserToken(GetUserTokenReq) returns (UserTokenAdminDetail) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.id AS id, t.user_id AS user_id, "
          "       t.created_at AS created_at, t.expires_at AS expires_at, "
          "       t.revoked_at AS revoked_at, t.revoked_by AS revoked_by, "
          "       t.revoke_reason AS revoke_reason, t.public_computer AS public_computer, "
          "       t.device_id AS device_id, COALESCE(d.label, '') AS device_label, "
          "       d.thumbprint AS device_thumbprint, "
          "       t.approved_by_device_id AS approved_by_device_id, "
          "       COALESCE(a.label, '') AS approver_label, a.thumbprint AS approver_thumbprint "
          "FROM @module.UserToken t "
          "LEFT JOIN @module.Device d ON d.id = t.device_id "
          "LEFT JOIN @module.Device a ON a.id = t.approved_by_device_id "
          "WHERE t.id = :id"
      }
    };
  }

  // ListSignInEvents — the sign-in history for the admin Sign-ins page,
  // newest first, cursor-paged on (created_at, id). LEFT JOIN User: an
  // attempt that reached no account has no user, and shows the address it
  // named instead. Every outcome is listed, failures included. Gated
  // user_admin.
  rpc ListSignInEvents(ListSignInEventsReq) returns (ListSignInEventsResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT e.id AS id, COALESCE(u.email, e.address) AS account, e.user_id AS user, "
          "       e.method AS method, e.outcome AS outcome, e.ip AS ip, "
          "       e.created_at AS created_at, e.thumbprint AS thumbprint "
          "FROM @module.SignInEvent e "
          "LEFT JOIN @module.User u ON u.id = e.user_id "
          "ORDER BY e.created_at DESC, e.id DESC"
      }
    };
  }

  // GetSignInEvent — one attempt for the admin Sign-ins detail view, every
  // column. Gated user_admin.
  rpc GetSignInEvent(GetSignInEventReq) returns (SignInEvent) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT e.id AS id, e.created_at AS created_at, e.user_id AS user_id, "
          "       e.address AS address, e.device_id AS device_id, "
          "       e.thumbprint AS thumbprint, e.ip AS ip, e.user_agent AS user_agent, "
          "       e.method AS method, e.outcome AS outcome, "
          "       e.public_computer AS public_computer "
          "FROM @module.SignInEvent e WHERE e.id = :id"
      }
    };
  }

  // ListAllDevices — every device for the admin Devices page, the newest
  // first, cursor-paged on (created_at, id): an immutable key, because every
  // sign-in rewrites last_seen_at and a keyset over it would skip or repeat
  // rows while an operator pages (last seen is shown as a column). LEFT JOIN User
  // for the owner's address and the account's trust revocation; `trusted` is
  // the sign-in's rule (trusted_at later than the account's revocation, the
  // device not revoked). Revoked and legacy (keyless) devices are listed.
  // Gated user_admin.
  rpc ListAllDevices(ListAllDevicesReq) returns (ListAllDevicesResp) {
    option (w17.contrib.plugin_feature_rpc) = "user_admin";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS id, COALESCE(u.email, '') AS owner, d.user_id AS user, "
          "       d.label AS label, d.thumbprint AS thumbprint, d.ip AS ip, "
          "       d.created_at AS created_at, d.last_seen_at AS last_seen_at, "
          "       d.trusted_at AS trusted_at, u.device_trust_revoked_at AS trust_revoked_at, "
          "       CASE WHEN d.trusted_at IS NOT NULL AND d.revoked_at IS NULL "
          "            AND (u.device_trust_revoked_at IS NULL OR d.trusted_at > u.device_trust_revoked_at) "
          "            THEN TRUE ELSE FALSE END AS trusted, "
          "       d.revoked_at AS revoked_at "
          "FROM @module.Device d "
          "LEFT JOIN @module.User u ON u.id = d.user_id "
          "ORDER BY d.created_at DESC, d.id DESC"
      }
    };
  }

  // GetSessionStepUp — the mailed step-up code out for the caller's session
  // (ConfirmStepUp reads it). Gated step_up_code.
  rpc GetSessionStepUp(GetSessionStepUpReq) returns (GetSessionStepUpResp) {
