  // GetSessionSteppedUpAt — when the caller's session was last stepped up.
  // Gated step_up.
  rpc GetSessionSteppedUpAt(GetSessionSteppedUpAtReq) returns (GetSessionSteppedUpAtResp) {
    option (w17.contrib.plugin_feature_rpc) = "step_up";
    option (w17.db.method) = {
