  string user_id  = 2;
}
message GetSessionSteppedUpAtResp {
  option (w17.contrib.plugin_feature) = "step_up";
  google.protobuf.Timestamp stepped_up_at = 1 [(w17.field) = { type: DATETIME, null: true }];
}

message ListAuthenticatorsReq {
  option (w17.contrib.plugin_feature) = "admin_mfa";
}
// AuthenticatorAdminRow — one authenticator enrolment as the operator reads
// it (the list and the detail share it). Not a table.
//   - owner        — the account's address; the row's link to its detail.
//                    Plain columns only: the table carries the encrypted
//                    seed, and a statement over it projects no computed
//                    value (so no COALESCE, no recovery-code count).
//   - user         — the raw user_id, linked to the Users page.
//   - confirmed_at — when the person confirmed it (NULL: set up, never
//                    confirmed, so it never guarded a sign-in).
//   - revoked_at   — when it was disabled, replaced or reset (NULL: live).
// Never the seed. Gated admin_mfa.
message AuthenticatorAdminRow {
  option (w17.contrib.plugin_feature) = "admin_mfa";
  string id    = 1 [(w17.field) = { type: UUID }];
  string owner = 2;
  string user  = 3 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp confirmed_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp created_at   = 5;
  google.protobuf.Timestamp revoked_at   = 6 [(w17.field) = { type: DATETIME, null: true }];
}
message ListAuthenticatorsResp {
  option (w17.contrib.plugin_feature) = "admin_mfa";
  repeated AuthenticatorAdminRow authenticators = 1;
  // Cursor-paged (admin-only), like ListAllDevices: no enrolment is deleted.
  w17.Paging paging = 2;
}
message GetAuthenticatorReq {
  option (w17.contrib.plugin_feature) = "admin_mfa";
  string id = 1;
}

