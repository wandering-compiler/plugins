syntax = "proto3";

// Auth plugin — AuthQuery read-only RPCs.
//
// Read primitives for the auth surface. The consumer's
// business layer composes these into SignIn / Authenticate-
// header-middleware / similar.
//
// All methods are pure SELECTs through the standard
// `(w17.db.method).query` annotation; codegen emits the
// handler bodies generically — no plugin-specific handler
// surface.

package w17.contrib.auth;

// Plugin-internal cross-file import; placeholder expansion
// rewrites `@self` at staging time to the activation's staged
// directory.
import "google/protobuf/timestamp.proto";
import "@self/types/models.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";
import "w17/paging.proto";

option go_package = "@project;@pkg";

message GetUserByEmailReq  { string email = 1; }
message GetUserByEmailResp { User user = 1; }

// token_hash is sha256(token) in hex, the form a token is stored in.
// legacy_token is the token itself, which only finds a legacy row that
// predates the hash (see UserToken); the caller then runs UpgradeTokenHash.
// Named so a caller that sets only the token does not compile against a
// lookup that would miss every hashed row.
message GetUserByTokenReq  { string legacy_token = 1; string token_hash = 2; }
message GetUserByTokenResp {
  User user = 1;
  // The row's token_hash, empty on a legacy row (the caller moves it).
  string stored_token_hash = 2;
}

// GetExpiredToken — the miss-path lookup of the default (single-realm)
// Authenticate: the presented token is a row that EXISTS and has ENDED —
// past its expires_at, or revoked. Run only after the live lookup found
// nothing, so a valid token never pays for it. A revoked token is answered
// exactly as an expired one (the earlier of the two instants is when it
// ended). See GetExpiredTokenWithType for the api_token twin.
message GetExpiredTokenReq  { string legacy_token = 1; string token_hash = 2; }
message GetExpiredTokenResp {
  // NULL for a never-expiring token that was revoked.
  google.protobuf.Timestamp expires_at = 1 [(w17.field) = { type: DATETIME, null: true }];
  // The key the expired token is bound to ('' for none): SESSION_EXPIRED is
  // said only to a request whose proof is by that key.
  string device_thumbprint = 2;
  // When the token was revoked; NULL = not revoked (it expired).
  google.protobuf.Timestamp revoked_at = 3 [(w17.field) = { type: DATETIME, null: true }];
  // When the device it is bound to was revoked; NULL = live (or bound to
  // none). The key's holder then hears DEVICE_REVOKED, as a live token of a
  // revoked device answers.
  google.protobuf.Timestamp device_revoked_at = 4 [(w17.field) = { type: DATETIME, null: true }];
}

message GetUserPermissionsReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
}
message GetUserPermissionsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  // Permission IDs from the activating domain's generated
  // AclPermission enum (w17.lock.acl.proto). Plugin handler
  // passes them through to AuthResp.permission_ids verbatim —
  // no bitset packing, no string→id mapping.
  repeated int32 permission_ids = 1;
}

message GetUserByTokenWithPermissionsReq {
  option (w17.contrib.plugin_feature) = "rbac";
  // See GetUserByTokenReq.
  string legacy_token = 1 [(w17.field) = { blank: true, sensitive: true }];
  string token_hash   = 2;
}
// UserWithPermissions packs identity + the deduped permission
// IDs the user holds across every assigned role. One SQL
// round-trip via ROWS_TO_ARRAY — no separate
// permission lookup. `permission_ids` is always populated
// (never nil); an empty list means the user has no role
// assignments or none of their roles carry any permissions.
// RoleGrant — ONE role and what it carries, as resolved by ONE narrowing
// axis.
//
// This shape is what makes two narrowings composable. Permissions used to be
// resolved as bare id lists, so the realm axis and the organization axis each
// produced a SET and the two were intersected. Intersecting sets is only sound
// when one answer is a subset of the other, and neither query can see the
// other's axis: a permission reachable through a session-realm role scoped to
// org X *and* through an api-realm realm-wide role survived both filters for a
// session token acting in org Y, where neither role applies.
//
// Carrying the role id turns that intersection into one over ROLES: a
// permission survives only if a SINGLE role grants it and that role passes
// every axis. There is no longer a way to assemble a grant from two roles that
// individually fail.
//
// Ungated on purpose — see the note at the callers.
message GetUserRoleGrantsReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message GetUserRoleGrantsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated RoleGrant grants = 1;
}

// ListRoleGrants — every role in the catalogue with the permissions it
// carries, in the same RoleGrant shape a user's grants come back in.
//
// Answers "may this caller hand out that role": a role may be granted only by
// someone who holds every permission it carries (handlers/role_ceiling.go).
// One read for the whole catalogue rather than one per role, because the
// pickers ask it of every role they offer.
message ListRoleGrantsReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message ListRoleGrantsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated RoleGrant grants = 1;
}

message RoleGrant {
  string role_id = 1 [(w17.field) = { type: UUID }];

  // The permissions this role carries. Empty for a wildcard role: its rows
  // are not materialised, the grant is expanded from the deployed lock.
  repeated int32 permission_ids = 2;

  // all_permissions — this ROLE is a wildcard. Kept per-role rather than as
  // one flag over the whole answer, because a wildcard must pass the other
  // axis like any other role: a superadmin of one organization is not a
  // superadmin in the next one.
  bool all_permissions = 3;
}

message GetUserByTokenWithPermissionsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  User   user     = 1;
  // token_id is the id of the UserToken the bearer resolved to — threaded
  // by Authenticate into AuthResp.session_token_id so base-tier Logout can
  // revoke exactly this session without ever seeing the raw token.
  string token_id = 3 [(w17.field) = { type: UUID }];
  // The row's token_hash, empty on a legacy row: the caller then moves the
  // row to the hash (UpgradeTokenHash).
  string stored_token_hash = 6;

  // The device the token is bound to: its key thumbprint (empty for a token
  // bound to none — minted before device binding, or an API token) and when
  // it was revoked (NULL = live). Authenticate compares the thumbprint with
  // the request's proof and refuses a revoked device.
  string device_thumbprint = 7;
  google.protobuf.Timestamp device_revoked_at = 8 [(w17.field) = { type: DATETIME, null: true }];
  // UserToken.mcp_only: accepted without a proof on the MCP surface only.
  bool mcp_only = 9;

  // The role grants are NOT here: they come from GetUserRoleGrants.
  //
  // They were, and the emitted scan code did not compile — a response that
  // mixes header scalars with a repeated sub-message is a shape the query
  // generator does not produce a fan-out for, and it silently generated a
  // single-message assignment instead. Codegen SUCCEEDED; the Go build is
  // what caught it. Two queries is the shape that works, at the cost of one
  // extra round trip on the session path.
  //
  // 2 = permission_ids, 4 = all_permissions, 5 = grants.
  reserved 2, 4, 5;
}

// Signup role-assignment support (rbac). CountUsers backs the
// first-user determination (COUNT==1 right after the insert = bootstrap
// admin); GetFirstUserRoles / GetDefaultRoles return the role ids the
// turnkey SignUp assigns, driven by the seeded assign_first_user /
// assign_default Role columns. Realm-agnostic — the UserRole link does
// not carry realm; the realm only decides which roles count at auth.
message CountUsersReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message CountUsersResp {
  option (w17.contrib.plugin_feature) = "rbac";
  int64 count = 1;
}

// --- user_admin feature: turnkey admin user directory ---
// ListUsers backs the admin Users page list `source`; GetUser backs its
// detail `read` (returns the User model DIRECTLY, like GetRole — the
// detail read contract is "returns a single <model>"). Both deliberately
// project WITHOUT password_hash (a PASSWORD column that must never leave
// storage into an admin view). All gated user_admin.
message ListUsersReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}
message ListUsersResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated User users = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's user table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page.
  w17.Paging paging = 2;
}
message ListOrgMemberAccountsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  // The ACTIVE organization. Not optional: User is not an org-scoped model —
  // a person belongs to several — so without this the list would be every
  // account on the deployment, and one company's operator would see another's
  // bots in the machine-account directory.
  string org_id = 1 [(w17.field) = { type: UUID }];
}

message ListRealmMachineAccountsReq {
  option (w17.contrib.plugin_feature) = "service_account";
}
message ListRealmMachineAccountsResp {
  option (w17.contrib.plugin_feature) = "service_account";
  repeated User accounts = 1;
}

message GetOrgMemberReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string org_id  = 2 [(w17.field) = { type: UUID }];
}
message GetOrgMemberResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  // Empty when the account is not a member of this organization. A member is
  // a person or a machine; whether it is a BOT the caller asks of the account.
  string user_id = 1 [(w17.field) = { type: UUID, blank: true }];
}
message ListOrgMemberAccountsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated User accounts = 1;
}

message ListBotAccountsReq {
  option (w17.contrib.plugin_feature) = "service_account";
}
message ListBotAccountsResp {
  option (w17.contrib.plugin_feature) = "service_account";
  repeated User bots = 1;

  // Cursor-paged admin-only, like ListUsersResp — see there.
  w17.Paging paging = 2;
}

message ListApiRealmRolesReq {
  option (w17.contrib.plugin_feature) = "service_account";
}
message ListApiRealmRolesResp {
  option (w17.contrib.plugin_feature) = "service_account";
  repeated ApiRealmRole roles = 1;
}

// ApiRealmRole — a role a machine account may hold. Its own message, not
// OrgScopedRole: that one is gated `org_membership`, and the api-realm roles
// exist in a realm without orgs too.
message ApiRealmRole {
  option (w17.contrib.plugin_feature) = "service_account";
  string id          = 1;
  string name        = 2;
  string description = 3;
}

message GetUserReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
}

message GetFirstUserRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message GetFirstUserRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated string role_ids = 1;
}

message GetDefaultRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message GetDefaultRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated string role_ids = 1;
}

// Role read side — backs the plugin-contributed admin role-management
// pages (ListRoles = list source, GetRole = detail read). rbac-gated.
// token_type is deliberately NOT selected (it is an api_token-gated
// column absent from the base Role table); the always-present rbac
// columns carry the management view.
message ListRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message ListOrgScopedRolesReq {
  option (w17.contrib.plugin_feature) = "org_membership";
}
message ListOrgScopedRolesResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated OrgScopedRole roles = 1;
}
// OrgScopedRole is the projection an invitation picker needs: what to send and
// what to show. Deliberately not the full Role — permissions and the signup
// flags are not a chooser's business.
message OrgScopedRole {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id           = 1;
  string name         = 2;
  string description  = 3;
  // display_name — the label to show; blank falls back to name (Role.display_name).
  string display_name = 4;
  // token_type — the role's realm. A membership carries a SESSION-realm role:
  // an API-realm one (a bot's) is filtered out of every org-role catalogue in
  // Go (assignableRoles), because the column exists only with api_token.
  TokenType token_type = 5 [(w17.contrib.plugin_feature_field) = "api_token"];
}

// ListOrgRoleRows — the org-scoped roles ONE organization may use: every shared
// (seeded) org role plus the custom roles that organization composed
// (Role.org_id). With `org_roles` on, this replaces ListOrgScopedRoles as the
// catalogue every org-role grant reads (handlers/org_roles.go), because that
// one cannot tell one company's custom roles from another's.
message ListOrgRoleRowsReq {
  option (w17.contrib.plugin_feature) = "org_roles";
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message ListOrgRoleRowsResp {
  option (w17.contrib.plugin_feature) = "org_roles";
  repeated OrgRoleRow roles = 1;
}
message OrgRoleRow {
  option (w17.contrib.plugin_feature) = "org_roles";
  string id              = 1;
  string name            = 2;
  string description     = 3;
  string display_name    = 4;
  // custom — the organization's own role (Role.org_id set): editable by it.
  // FALSE for a shared role, which the seed owns.
  bool   custom          = 5;
  bool   all_permissions = 6;
  // token_type — the role's realm. A membership carries a SESSION-realm role:
  // an API-realm one (a bot's) is filtered out of every org-role catalogue in
  // Go (assignableRoles), because the column exists only with api_token.
  TokenType token_type = 7 [(w17.contrib.plugin_feature_field) = "api_token"];
}

// CountRoleGrants — the live grants of one role, wherever they apply. A custom
// role still held by someone is not deleted (DeleteOrgRole): deleting it would
// silently take every holder's permissions away.
message CountRoleGrantsReq {
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id = 1 [(w17.field) = { type: UUID }];
}
message CountRoleGrantsResp {
  option (w17.contrib.plugin_feature) = "org_roles";
  int64 count = 1;
}

// ListOrgSuperadmins — the organization's superadmins who can act, one row per
// live grant of a wildcard role (all_permissions) held there DIRECTLY. With
// the rows of every other source (a team's wildcard role,
// ListOrgTeamSuperadmins) it is the ONE definition of "the organization's
// superadmins" the last-superadmin rule reads (handlers/org_membership_role.go,
// orgSuperadmins): a membership change, a removal and the team methods each
// drop the rows they would end and refuse when none is left.
//
// Only a superadmin who can act counts: a live grant of a live role, on a live
// membership, of an account that is neither disabled nor erased (user_admin:
// the query projects both stamps and orgSuperadmins drops such rows), of a
// session-realm role (api_token: the realm is projected the same way; a bot's
// API-realm wildcard is no superadmin who administers the organization).
// A disabled superadmin holds no working credential, so counting one let the
// last ACTIVE superadmin leave an organization nobody could administer.
message ListOrgSuperadminsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message ListOrgSuperadminsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated OrgSuperadminRow grants = 1;
}
// LockOrganizationReq — the organization whose row a change that can take a
// superadmin away locks first (SELECT … FOR UPDATE), in the transaction that
// then checks the last-superadmin rule and writes the change. Every such
// change takes the same lock, so two of them in one organization run one after
// the other and the second one's check sees what the first one ended.
message LockOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message LockOrganizationResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1;
}

// OrgSuperadminRow — one wildcard grant a superadmin holds in an organization:
// directly (team_id empty) or through a team.
message OrgSuperadminRow {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string role_id = 2;
  // team_id — the team the role is held through; empty for a direct grant.
  string team_id = 3;
  // disabled_at / erased_at — the account's (user_admin; unset without it).
  // A row of a disabled or erased account is no superadmin who can act, and
  // orgSuperadmins drops it.
  google.protobuf.Timestamp disabled_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp erased_at   = 5 [(w17.field) = { type: DATETIME, null: true }];
  // token_type — the role's realm (api_token; unset without it). An API-realm
  // wildcard is a machine account's: it administers nothing through a
  // session, and SetBotRoles takes it away unasked, so orgSuperadmins drops
  // the row. A team's roles are session-realm by construction.
  TokenType token_type = 6 [(w17.contrib.plugin_feature_field) = "api_token"];
}

// ListRealmSuperadmins — every account that can administer the realm: one row
// per live grant of a live wildcard role (all_permissions), in any
// organization or none. The last-admin rule of DisableAccounts / EraseUsers
// reads it (handlers/admin_lockout_rbac.go): disabling or erasing the accounts
// it would leave with none is refused. The rule locks the accounts it finds
// (LockUsers) and reads again, so two operators disabling each other at once
// run one after the other and the second sees what the first disabled.
//
// The account's disabled_at / erased_at exist only with user_admin and the
// role's realm only with api_token, so they are PROJECTED behind gates and
// the handler drops a disabled or erased account and an API-realm grant (a
// machine account's wildcard administers nothing through a session).
message LockUsersReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated string ids = 1;
}
message LockUsersResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated LockedUser users = 1;
}
message LockedUser {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
}
message ListRealmSuperadminsReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message ListRealmSuperadminsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated RealmSuperadminRow grants = 1;
}
message RealmSuperadminRow {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
  string role_id = 2;
  google.protobuf.Timestamp disabled_at = 3 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp erased_at   = 4 [(w17.field) = { type: DATETIME, null: true }];
  TokenType token_type = 5 [(w17.contrib.plugin_feature_field) = "api_token"];
}

message ListRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated Role roles = 1;

  // Cursor-paged like the other admin lists (the `w17.Paging` field IS
  // the declaration). The role catalogue is bounded by declaration and rarely
  // outgrows one page, so in practice the SPA renders no pager at all
  // (the footer appears only once a second page exists) — but a project
  // with a long, generated role set pages like everything else instead
  // of being the one list that loads unbounded.
  w17.Paging paging = 2;
}
message GetRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string id = 1;
}

// --- api_token feature: realm-aware + subset-narrowed auth lookup ---
// These three back the gated realm-aware Authenticate path (handlers/
// apitoken.go): resolve a token's kind, pull the user's permissions
// for that realm, and (for API tokens) the token's permission subset.
// Authenticate intersects realm-perms ∩ subset in Go — no SQL
// subquery. All gated api_token.

message GetTokenWithTypeReq {
  option (w17.contrib.plugin_feature) = "api_token";
  // See GetUserByTokenReq.
  string legacy_token = 1 [(w17.field) = { blank: true, sensitive: true }];
  string token_hash   = 2;
}
message GetTokenWithTypeResp {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  string    token_id   = 2;
  TokenType token_type = 3;
  // The row's token_hash, empty on a legacy row (see
  // GetUserByTokenWithPermissionsResp).
  string stored_token_hash = 6;
  // The token's owner, carrying what Authenticate checks on every request
  // (under `user_admin`, whether the account is disabled) plus `kind`, which
  // every User-filling query projects so no gate reads an unset one as HUMAN.
  User user = 7;
  // When the token was last presented, so Authenticate can skip the
  // last_used_at write within the throttle window without a round trip.
  // NULL = never recorded.
  google.protobuf.Timestamp last_used_at = 8 [(w17.field) = { type: DATETIME, null: true }];

  // The device the token is bound to: its key thumbprint (empty for a token
  // bound to none — minted before device binding, or an API token) and when
  // it was revoked (NULL = live). Authenticate compares the thumbprint with
  // the request's proof and refuses a revoked device.
  string device_thumbprint = 9;
  google.protobuf.Timestamp device_revoked_at = 10 [(w17.field) = { type: DATETIME, null: true }];
  // UserToken.mcp_only: accepted without a proof on the MCP surface only.
  bool mcp_only = 11;
  // UserToken.bearer: a machine account's token, accepted without a proof
  // (device/bot-bearer). Under service_account only; false without it.
  bool bearer = 12;
  // An OAuth access token's resource, organization and grant (oauth_server);
  // empty on every other token and without the feature.
  string oauth_resource = 13;
  string oauth_org_id = 14 [(w17.field) = { type: UUID, null: true }];
  string oauth_grant_id = 15 [(w17.field) = { type: UUID, null: true }];
}

// GetExpiredTokenWithType — the lookup Authenticate runs only after
// GetTokenWithType found nothing: is the presented token a row that EXISTS
// and is past its expires_at, or revoked? Tells "your session expired" (sign in again)
// apart from "no such token". The caller already holds the token, so the
// expiry and the kind are nothing it could not have known. Gated api_token.
message GetExpiredTokenWithTypeReq {
  option (w17.contrib.plugin_feature) = "api_token";
  // See GetUserByTokenReq.
  string legacy_token = 1 [(w17.field) = { blank: true, sensitive: true }];
  string token_hash   = 2;
}
message GetExpiredTokenWithTypeResp {
  option (w17.contrib.plugin_feature) = "api_token";
  // See GetExpiredTokenResp for every field.
  google.protobuf.Timestamp expires_at = 1 [(w17.field) = { type: DATETIME, null: true }];
  TokenType                 token_type = 2;
  string device_thumbprint = 3;
  google.protobuf.Timestamp revoked_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp device_revoked_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  // UserToken.bearer: its holder is whoever presents it, so an ended bearer
  // token says so without a proof (device/bot-bearer).
  bool bearer = 6;
}

message GetUserRolePermissionsByRealmReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  TokenType token_type = 2;
}
message GetUserRolePermissionsByRealmResp {
  option (w17.contrib.plugin_feature) = "api_token";
  // Role-attributed, so the organization axis can intersect on ROLES rather
  // than on permission ids — the whole reason this feature may now be
  // enabled alongside org_membership. A wildcard role arrives here like any
  // other, flagged, so it has to pass the org axis too.
  repeated RoleGrant grants = 2;
  reserved 1;
}


message GetTokenPermissionSubsetReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id = 1;
}
message GetTokenPermissionSubsetResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated int32 permission_ids = 1;
}

// ApiTokenInfo — one API token's management view: id + label + audit
// timestamps, NEVER the secret token string. ListApiTokensByUser
// returns these for the token-management UI. A revoked token is listed
// too (nothing is deleted), with revoked_at and revoke_reason set, so the
// UI shows it as revoked rather than losing it. api_token-gated.
message ApiTokenInfo {
  option (w17.contrib.plugin_feature) = "api_token";
  string                    id           = 1 [(w17.field) = { type: UUID }];
  string                    name         = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp expires_at   = 4;
  google.protobuf.Timestamp created_at   = 5;
  // NULL = live.
  google.protobuf.Timestamp revoked_at   = 6 [(w17.field) = { type: DATETIME, null: true }];
  RevokeReason              revoke_reason = 7;
  // The key the token is bound to (its device's thumbprint, the device id
  // Authenticate answers for it); NULL for a token minted before binding.
  string                    device_thumbprint = 8 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  // When that device was revoked; NULL = live. A token of a revoked device
  // is refused like a revoked token.
  google.protobuf.Timestamp device_revoked_at = 9 [(w17.field) = { type: DATETIME, null: true }];
}
message ListApiTokensByUserReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  TokenType token_type = 2;
}
message ListApiTokensByUserResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated ApiTokenInfo tokens = 1;
}

// GetUserDeviceByThumbprint — the caller's own Device row for the key its
// request was proved with (the envelope's device_id), recorded as the
// approver of an API token it creates. A revoked or unknown pair is no row:
// Authenticate already refused a revoked device.
message GetUserDeviceByThumbprintReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string user_id    = 1 [(w17.field) = { type: UUID }];
  string thumbprint = 2 [(w17.field) = { type: CHAR, max_len: 43 }];
}
message GetUserDeviceByThumbprintResp {
  option (w17.contrib.plugin_feature) = "api_token";
  string device_id = 1;
}

// GetSessionApprover — the device that approved the caller's own session
// (UserToken.approved_by_device_id: a CLI session's approving browser), so a
// token the session creates records that ROOT approver and ends when it is
// revoked. A session approved by nothing answers NULL (empty).
message GetSessionApproverReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id = 1 [(w17.field) = { type: UUID }];
  string user_id  = 2 [(w17.field) = { type: UUID }];
}
message GetSessionApproverResp {
  option (w17.contrib.plugin_feature) = "api_token";
  string approved_by_device_id = 1 [(w17.field) = { type: UUID, null: true }];
}

// LockMachineAccount takes a row lock on the machine account for the rest of
// the caller's transaction, so two IssueBotToken calls for ONE account
// serialise: each reads the account's key (ListMachineKeys) and registers
// one only when there is none, and that read-then-write is the one-key rule
// only when nothing runs beside it. Two concurrent first tokens with
// different keys would otherwise both read "no key" and register both. The
// account row always exists by then (the handler just read it), so it is the
// row to serialise on — the key row may not exist yet.
message LockMachineAccountReq {
  option (w17.contrib.plugin_feature) = "service_account";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message LockMachineAccountResp {
  option (w17.contrib.plugin_feature) = "service_account";
  string user_id = 1;
}

// ListMachineKeys — a machine account's LIVE keyed devices (not revoked,
// with a thumbprint): at most one by device/bot-one-key.
message ListMachineKeysReq {
  option (w17.contrib.plugin_feature) = "service_account";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message MachineKey {
  option (w17.contrib.plugin_feature) = "service_account";
  string id         = 1;
  string thumbprint = 2;
}
message ListMachineKeysResp {
  option (w17.contrib.plugin_feature) = "service_account";
  repeated MachineKey keys = 1;
}

// --- bot_token_guard: a machine account's allowlist and where it is used ---
// GetBotAllowedCidrs — a machine account's allowlist (User.allowed_cidrs).
// NotFound for an account that is not a bot.
message GetBotAllowedCidrsReq {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message GetBotAllowedCidrsResp {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string allowed_cidrs = 1;
}
// ListBotTokenUses — every (token, address, surface, method) a machine
// account's bearer tokens were used with, the latest first.
message ListBotTokenUsesReq {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message BotTokenUseRow {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  string token_id = 1;
  string address  = 2;
  string surface  = 3;
  string method   = 4;
  google.protobuf.Timestamp first_used_at = 5;
  google.protobuf.Timestamp last_used_at  = 6;
}
message ListBotTokenUsesResp {
  option (w17.contrib.plugin_feature) = "bot_token_guard";
  repeated BotTokenUseRow rows = 1;
}

// --- oauth feature: provider + identity lookups ---
// GetProviderByName resolves the provider the authorize/callback URL keys
// on (the handler checks `enabled` + does the token exchange + state HMAC
// with client_secret). GetOAuthIdentity finds an existing User↔subject
// link. Both gated `oauth`.

message GetRegisteredRedirectReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string client_id    = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string redirect_uri = 2 [(w17.field) = { type: URL, max_len: 2048 }];
}
message GetRegisteredRedirectResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  AuthClient client = 1;
}

// GetAuthClientSecret is the ONLY reader of the stored secret hash, and it
// exists as its own RPC rather than as a wider projection on
// GetRegisteredRedirect for that reason: a hash that is selected in one place
// cannot be leaked by a second caller who did not know it was there.
// ListAuthClients and RegisterAuthClient project column lists that do not
// name it, and this keeps that true by construction.
message GetAuthClientSecretReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string client_id    = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string redirect_uri = 2 [(w17.field) = { type: URL, max_len: 2048 }];
}
message GetAuthClientSecretResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string client_secret = 1 [(w17.field) = { blank: true, sensitive: true }]; // argon2id PHC hash — verified against, never returned to a caller
  bool   enabled       = 2;
}

// GetLiveSessionExpiry reads the expiry of the session approving a CLI login,
// so the session CliToken mints can inherit it. Keyed on the token id the
// gateway envelope carries AND the caller's user id, and on live rows only: a
// session revoked or expired by the time it approves is no approval at all.
// GetAuthClientRevocation — whether the registration of one
// (client_id, redirect_uri) pair is revoked, live or not. Read by
// RegisterClient only after a collision, to say a revoked pair stays taken.
message GetAuthClientRevocationReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string client_id    = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string redirect_uri = 2 [(w17.field) = { type: URL, max_len: 2048 }];
}
message GetAuthClientRevocationResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string id = 1;
  // NULL = live.
  google.protobuf.Timestamp revoked_at = 2 [(w17.field) = { type: DATETIME, null: true }];
}

message GetLiveSessionExpiryReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string token_id = 1 [(w17.field) = { type: UUID }];
  string user_id  = 2 [(w17.field) = { type: UUID }];
}
// GetCliApproverRevocation — whether the device that approved a CLI code
// has been revoked since (cli_login). CliToken refuses a code whose approver
// was revoked during the code's short life.
message GetCliApproverRevocationReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string device_id = 1 [(w17.field) = { type: UUID }];
}
message GetCliApproverRevocationResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  // Echoed so the handler can tell "found, live" from "no row".
  string device_id = 1;
  google.protobuf.Timestamp revoked_at = 2 [(w17.field) = { type: DATETIME, null: true }];
}

message GetLiveSessionExpiryResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  // Echoed so the handler can tell "found, never expires" (NULL expires_at)
  // from "no row".
  string token_id = 1;
  // NULL = the session never expires. Declared so a SQL NULL scans.
  google.protobuf.Timestamp expires_at = 2 [(w17.field) = { type: DATETIME, null: true }];
  // The Device row the approving session is bound to — recorded on the code
  // as the approver of the CLI login. NULL (empty) when it has none.
  string device_id = 3 [(w17.field) = { type: UUID, null: true }];
}

message ListAuthClientsReq {
  option (w17.contrib.plugin_feature) = "cli_login";
}
message ListAuthClientsResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  repeated AuthClient clients = 1;
}

message GetProviderByNameReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string name = 1;
}
message GetProviderByNameResp {
  option (w17.contrib.plugin_feature) = "oauth";
  OAuthProvider provider = 1;
  // The decrypted client secret (OAuthProvider.secret) — top-level because an
  // encrypted column decrypts only into a single-segment target.
  string secret = 2 [(w17.field) = { blank: true, sensitive: true }];
}

message GetOAuthIdentityReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string provider_id = 1;
  string external_id = 2;
}
message GetOAuthIdentityResp {
  option (w17.contrib.plugin_feature) = "oauth";
  OAuthIdentity identity = 1;
}

// --- two_factor feature: TOTP secret + MFA challenge lookups ---
// GetTotpSecret backs the enrollment state (totp_enrolled = confirmed)
// AND the VerifyMfa TOTP path (the handler decrypts `secret`).
// GetMfaChallenge loads the pending challenge VerifyMfa consumes. Both
// gated `two_factor`.

// UNGATED, like its sibling GetUserByEmail. It was tagged `two_factor`
// because that was the first feature to want "resolve a user by id" — but
// the query says nothing about second factors, and the tag made every
// later feature that needs the same row either drag `two_factor` in or
// duplicate the read.
message GetUserByIdReq {
  string user_id = 1;
}
message GetUserByIdResp {
  User user = 1;
}

// The caller's marketing consent, for SetMarketingConsent's reader. Gated
// marketing_consent.
message GetUserMarketingConsentReq {
  option (w17.contrib.plugin_feature) = "marketing_consent";
  string user_id = 1;
}
message GetUserMarketingConsentResp {
  option (w17.contrib.plugin_feature) = "marketing_consent";
  bool                      consent    = 1;
  google.protobuf.Timestamp decided_at = 2;
}

message GetTotpSecretReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}
message GetTotpSecretResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  UserTotpSecret secret = 1;
  // The decrypted seed — top-level because an encrypted column decrypts only
  // into a single-segment target (`secret.seed` would carry ciphertext).
  string seed = 2 [(w17.field) = { blank: true, sensitive: true }];
}

message CountRecoveryCodesReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message CountRecoveryCodesResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  int64 count = 1;
}

message GetMfaChallengeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1;
}
message GetMfaChallengeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  MfaChallenge challenge = 1;
}

// LockUserForIssuance takes a row lock on the user for the duration of the
// caller's transaction, so MFA challenge issuance for ONE user serialises.
//
// The cap reads the count and then decides, which is only a cap when nothing
// runs beside it. Twenty concurrent sign-ins against a limit of ten would each
// read zero before any of them committed, and all twenty would issue a
// challenge. An attacker who already holds the password — the whole
// threat the second factor is for — sends twenty at once as easily as twenty
// in a row.
//
// A lock on the USER row rather than on the challenges: the challenges being
// counted may not exist yet, and a row that does not exist cannot be locked,
// which is exactly the case the measurement hit. The user always exists by
// this point (the password just verified against it), so it is the one row
// guaranteed to be there to serialise on.
message LockUserForIssuanceReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}
message LockUserForIssuanceResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}

// CountRecentMfaChallenges backs the ISSUANCE cap. The attempts counter on
// MfaChallenge bounds guesses against ONE challenge; a new challenge starts
// a fresh budget, so without a second cap the total number of guesses an
// attacker who already has the password can buy is unbounded — they just
// sign in again.
message CountRecentMfaChallengesReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
  google.protobuf.Timestamp since = 2;
}
message CountRecentMfaChallengesResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  int64 count = 1;
}

// --- device identity: the trust cutoff (base) + the mgmt list (devices) ---
// The sign-in finds or creates its Device with AuthMutation.RegisterDevice
// (one UPSERT); ListUserDevices backs the ListDevices management RPC.

// GetDeviceTrustRevokedAt reads User.device_trust_revoked_at: a device
// trusted at or before it is no longer trusted.
message GetDeviceTrustRevokedAtReq {
  string user_id = 1;
}
message GetDeviceTrustRevokedAtResp {
  google.protobuf.Timestamp device_trust_revoked_at = 1;
}

message ListUserDevicesReq {
  option (w17.contrib.plugin_feature) = "devices";
  string user_id = 1;
}
message ListUserDevicesResp {
  option (w17.contrib.plugin_feature) = "devices";
  repeated Device devices = 1;
}

// GetUserTenant resolves the authenticated principal's tenant —
// the `tenant_id` data scope, sourced from auth (never client-
// sent, per the data-scope rule). Behind `tenant_scope`: present
// only when the activation enables the tenant feature; the
// `User.tenant_id` column it reads is gated by the same tag, so
// the query and its column appear / disappear together.
message GetUserTenantReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string user_id = 1;
}
message GetUserTenantResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}

// GetTenantBySlug / GetTenantByDomain resolve a Tenant id from the
// request context at SignUp (slug from the URL `{tenant_slug}` path
// param, domain from the forwarded Host header). The SignUp handler
// stamps the result onto the new user's tenant_id. Both gated by
// `tenant_scope` — they read the Tenant table the same feature adds.
message GetTenantBySlugReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string slug = 1;
}
message GetTenantBySlugResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}
message GetTenantByDomainReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string domain = 1;
}
message GetTenantByDomainResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}

// ── org_membership query request/response messages ──────────
//
// Read primitives for the multi-org (GitHub-style) membership model: one
// identity belongs to many Organizations via OrgMembership. The business
// ListMyOrgs RPC composes ListUserOrgs for the authed caller; the
// Authenticate org-scope decorator uses GetUserOrgBySlug to validate +
// resolve the request's active org.

// UserOrg is one organization the user belongs to, joined with the
// caller's role in it (the SELECT aliases map onto these fields).
message UserOrg {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1;
  string slug   = 2;
  string name   = 3;
  string kind   = 4; // private | company
  string role   = 5; // a name from the org role catalogue
  // owner — DEPRECATED, always false. Ownership is no longer an
  // authorization fact (Organization.owner_id is dropped; see Organization in
  // types/models.proto): whoever administers an organization holds a role in
  // it. ListUserOrgs no longer projects it; the field stays, unset, so a
  // client reading UserOrg (ListMyOrgs answers it) does not break.
  bool   owner  = 6;
  // membership_kind — the kind of this membership (membership_kinds):
  // `staff`, `client`, … One membership per organization, so one kind.
  string membership_kind = 7 [(w17.contrib.plugin_feature_field) = "membership_kinds"];
}

message ListUserOrgsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
}
message ListUserOrgsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated UserOrg orgs = 1;
}

message GetUserOrgBySlugReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string slug    = 2;
}

// Permissions scoped to one organization — realm-wide grants
// (UserRole.org_id IS NULL) plus the grants assigned inside that org.
// Mirrors GetUserByTokenWithPermissionsResp's permission half so the
// narrowing step can substitute one for the other.
// ListUserOrgGrants — the roles granted to a user INSIDE one organization:
// exactly the UserRole rows a membership change or removal revokes (it deletes
// by (user_id, org_id)). Realm-wide grants are not among them; the member
// keeps those. Read by the role ceiling's other half — whoever changes or
// removes a membership must cover what the member loses.
message ListUserOrgGrantsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string org_id  = 2;
}
message ListUserOrgGrantsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated string role_ids = 1;
}

message GetUserOrgPermissionsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string org_id  = 2;
}
message GetUserOrgPermissionsResp {
  option (w17.contrib.plugin_feature) = "org_membership";

  // grants — the roles that APPLY IN THIS ORG: realm-wide ones plus those
  // assigned inside it. Role-attributed so the realm axis can intersect on
  // roles; a wildcard role carries its own flag and is scoped per org,
  // because a superadmin of one company is not a superadmin of another.
  repeated RoleGrant grants = 3;


  // 1 = permission_ids, 2 = all_permissions (a wildcard role, which then
  // also meant ownership).
  reserved 1, 2;
}

// The no-active-org half of the pair above. A separate query rather
// than the same one called with an empty `org_id`: the column is a UUID
// and an empty string is not one, so the comparison would fail at the
// database rather than match nothing. A sentinel UUID would work but
// puts a magic value in the request; the predicate is short enough to
// state twice.
message GetUserRealmWidePermissionsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
}
message GetUserRealmWidePermissionsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  // Realm-wide roles only — every org-scoped role is out of context here.
  repeated RoleGrant grants = 3;
  reserved 1, 2;
}
message GetUserOrgBySlugResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  // Empty org_id = the user is NOT a member of an org with this slug
  // (unknown slug, or a real org they don't belong to).
  string org_id = 1;
  string role   = 2;
}

// ── org_membership admin surface (turnkey Organizations /
//    OrgMemberships pages) ────────────────────────────────────
//
// The per-user reads above (ListUserOrgs / GetUserOrgBySlug) back the
// CLI's own-org flows; these GLOBAL list + get reads back the admin
// preset's Organizations + OrgMemberships pages (a project can't author
// them itself — the tables are plugin-owned). All gated org_membership.
// The Get requests key on a bare `id` field so the admin detail id-stamp
// resolves against it regardless of the model name.

message ListOrganizationsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
}
message ListOrganizationsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated Organization organizations = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's organization table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page.
  w17.Paging paging = 2;
}

message GetOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
}

message ListOrgMembershipsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
}

// OrgMembershipAdminRow — the OrgMemberships list projection (ADMIN-FK).
// NOT a `(w17.db.table)`: a read-only DTO the ListOrgMemberships DQL
// joins User + Organization into, so the admin list shows the member's
// EMAIL + the organization's NAME (both human handles) instead of the
// two raw UUIDs the link table stores.
//   - id           — the membership id; stamped into the detail link +
//                    `record.id` navigation. Not a rendered column.
//   - member       — u.email, the row's clickable human handle (opens the
//                    membership's OWN detail via detail_link_column).
//   - organization — the raw org_id, annotated by an AdminColumnRef to
//                    link to the Organizations page while rendering
//                    org_name (the org's name, not the UUID).
//   - org_name     — o.name, the ref's row-local title source (projected
//                    but not a rendered column).
// The member's user page is deliberately NOT linked: the Users page is
// gated by a DIFFERENT feature (user_admin) and may be absent, so an
// org_membership-only activation would carry a dangling ref. The email
// handle already identifies the member. Gated org_membership.
message OrgMembershipAdminRow {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id           = 1 [(w17.field) = { type: UUID }];
  string member       = 2;
  string organization = 3 [(w17.field) = { type: UUID }];
  string org_name     = 4;
  string role         = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOrgMembershipsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated OrgMembershipAdminRow memberships = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's membership table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page.
  w17.Paging paging = 2;
}

message GetOrgMembershipReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
}

// ── user_admin: global session/token review ──────────────────
//
// UserToken has only per-user reads (api_token's ListApiTokensByUser);
// these GLOBAL list + get back the admin Sessions page (review + revoke
// tokens across every user). The projection NEVER includes the secret
// `token` column — only the base-tier id / user_id / created_at /
// expires_at and the revocation (revoked_at / revoke_reason, and
// revoked_by on the detail): a revoked token stays listed, shown as
// revoked. Gated user_admin (the same realm that manages accounts).

message ListUserTokensReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}

// UserTokenAdminRow — the Sessions list projection (ADMIN-FK). NOT a
// `(w17.db.table)`: a read-only DTO the ListUserTokens DQL joins User
// into, so the admin list shows the session owner's EMAIL (a human
// handle) + a link to their Users page instead of a bare user UUID —
// Django-admin discipline (no raw ids in a list an operator reads).
//   - id      — the token id; the admin runtime stamps it into the
//               detail link + `record.id` navigation. Deliberately not
//               among the page's rendered `columns` (it stays a UUID).
//   - owner   — u.email, the row's clickable human handle (opens the
//               session's OWN detail via detail_link_column).
//   - user    — the raw user_id, annotated by an AdminColumnRef to link
//               to the Users page. The ref declares NO `title`, so the
//               cell renders the column header ("User") with the id in
//               its tooltip — the email already shows who it is, and a
//               title here would just repeat `owner` in the next cell.
// NEVER carries the secret `token` value. Gated user_admin.
message UserTokenAdminRow {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id        = 1 [(w17.field) = { type: UUID }];
  string owner     = 2;
  string user      = 3 [(w17.field) = { type: UUID }];
  reserved 4;
  reserved "link_text";
  google.protobuf.Timestamp created_at = 5;
  // expires_at is NULL for a never-expiring API token, so the row field has
  // to declare it: the annotation is what makes the row scan a SQL NULL
  // (sql.NullTime) instead of failing on it, and — now that this list is
  // cursor-paged — what tells the admin auto-sort to leave the column out
  // of the sortable set (a keyset seek on a NULL key silently drops rows).
  // A read-projection row is not the model, so nothing else carries this.
  google.protobuf.Timestamp expires_at = 6 [(w17.field) = { type: DATETIME, null: true }];
  // When it was revoked (NULL = live, so declared null for the same scan
  // and sort reasons as expires_at) and why.
  google.protobuf.Timestamp revoked_at = 7 [(w17.field) = { type: DATETIME, null: true }];
  RevokeReason revoke_reason = 8;
  // device — the Device row the token is bound to. NULL for a token bound to
  // no device (minted before binding, an API or MCP token). The Sessions page
  // does not link it to the Devices page: that page is the opt-in
  // admin_devices feature, and a column ref cannot be gated.
  string device = 9 [(w17.field) = { type: UUID, null: true }];
  // The device's label (its user agent), blank when there is none — the
  // Sessions column, so the cell reads as the browser rather than a UUID.
  string device_label = 10;
  // The device's key thumbprint (the id events and AuthResp call device_id);
  // NULL for no device or a legacy (keyless) one.
  string thumbprint = 11 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  // A public-computer session (UserToken.public_computer).
  bool public_computer = 12;
}

message ListUserTokensResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated UserTokenAdminRow tokens = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's session table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page.
  w17.Paging paging = 2;
}

message GetUserTokenReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id = 1;
}

// UserTokenAdminDetail — the Sessions detail projection: the token's safe
// columns (NEVER the secret `token` or `token_hash`) joined to the Device it
// is bound to and, for a CLI session, to the Device of the browser session
// that approved it. Not a table. Every joined column is NULL / blank when
// there is no such device. Gated user_admin.
message UserTokenAdminDetail {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id      = 1 [(w17.field) = { type: UUID }];
  string user_id = 2 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4 [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp revoked_at = 5 [(w17.field) = { type: DATETIME, null: true }];
  string revoked_by = 6 [(w17.field) = { type: UUID, null: true }];
  RevokeReason revoke_reason = 7;
  bool public_computer = 8;
  // The device the token is bound to: its row, label and key thumbprint.
  string device_id         = 9  [(w17.field) = { type: UUID, null: true }];
  string device_label      = 10;
  string device_thumbprint = 11 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  // A CLI session's approver: the Device of the browser session that
  // approved the login (UserToken.approved_by_device_id), its label and
  // thumbprint. NULL / blank on every other token.
  string approved_by_device_id = 12 [(w17.field) = { type: UUID, null: true }];
  string approver_label        = 13;
  string approver_thumbprint   = 14 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
}

// ── sign-in history reads ─────────────────────────────────────
//
// ListSignInEvents / GetSignInEvent back the admin Sign-ins page (user_admin,
// the realm that manages accounts); ListUserSignInEvents backs the signed-in
// person's own history (AuthService.ListMySignInEvents). Read-only: the
// table is append-only (SignInEvent).

message ListSignInEventsReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}

// SignInEventAdminRow — the Sign-ins list projection (ADMIN-FK), like
// UserTokenAdminRow: not a table, a read-only DTO the ListSignInEvents DQL
// joins User into.
//   - account — who the attempt was about, as a person reads it: the
//               account's current address, or the address typed when the
//               attempt reached no account; the row's link to its detail.
//   - user    — the raw user_id, linked to the Users page by the page's
//               AdminColumnRef; NULL when the attempt reached no account
//               (declared null so the row scans it).
// The user agent and the Device row are on the detail.
// Gated user_admin.
message SignInEventAdminRow {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id      = 1 [(w17.field) = { type: UUID }];
  string account = 2;
  string user    = 3 [(w17.field) = { type: UUID, null: true }];
  SignInMethod  method  = 4;
  SignInOutcome outcome = 5;
  string ip      = 6;
  google.protobuf.Timestamp created_at = 7;
  // The proof's key thumbprint — the value events and AuthResp call
  // device_id — so an operator can match a row to an event. NULL without a
  // proof.
  string thumbprint = 8 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
}

message ListSignInEventsResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated SignInEventAdminRow events = 1;

  // Cursor-paged (admin-only), like ListUserTokens: the history grows with
  // every attempt, failures included, so an unpaged list would load it
  // whole.
  w17.Paging paging = 2;
}

message GetSignInEventReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id = 1;
}

// ── user_admin: the Devices page ──────────────────────────────
//
// ListAllDevices / GetDevice back the admin Devices page: every Device row
// of every account — revoked and legacy ones included, nothing in the table
// is deleted — with the account's address and whether the device's trust
// still stands. Gated user_admin.

message ListAllDevicesReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}

// DeviceAdminRow — one device as the operator reads it (ADMIN-FK, like
// UserTokenAdminRow; the list and the detail share it). Not a table.
//   - owner      — the account's address (COALESCE: a device of a missing
//                  account lists with a blank owner instead of failing the
//                  page); the row's link to its detail.
//   - user       — the raw user_id, linked to the Users page by the page's
//                  AdminColumnRef.
//   - thumbprint — the key thumbprint; NULL on a LEGACY row (recorded before
//                  device binding, never usable).
//   - created_at / last_seen_at — first and last seen.
//   - trusted_at — when the device last passed the second factor (NULL:
//                  never); trust_revoked_at — when the account's device trust
//                  was last revoked as a whole (User.device_trust_revoked_at:
//                  a password change, a disable, an erasure).
//   - trusted    — whether the trust still stands: trusted_at set, later than
//                  trust_revoked_at, and the device not revoked — the rule the
//                  sign-in applies.
//   - revoked_at — when the device was revoked for good (NULL: live).
// Gated user_admin.
message DeviceAdminRow {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id         = 1 [(w17.field) = { type: UUID }];
  string owner      = 2;
  string user       = 3 [(w17.field) = { type: UUID }];
  string label      = 4;
  string thumbprint = 5 [(w17.field) = { type: CHAR, max_len: 43, null: true }];
  string ip         = 6;
  google.protobuf.Timestamp created_at   = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  google.protobuf.Timestamp trusted_at       = 9  [(w17.field) = { type: DATETIME, null: true }];
  google.protobuf.Timestamp trust_revoked_at = 10 [(w17.field) = { type: DATETIME, null: true }];
  bool trusted = 11;
  google.protobuf.Timestamp revoked_at = 12 [(w17.field) = { type: DATETIME, null: true }];
}

message ListAllDevicesResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated DeviceAdminRow devices = 1;

  // Cursor-paged (admin-only), like ListUserTokens: every key that ever
  // passed a password is a row, and none is ever deleted.
  w17.Paging paging = 2;
}

message GetDeviceReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id = 1;
}

// GetSessionStepUpReq — the caller's own session (step_up_code).
message GetSessionStepUpReq {
  option (w17.contrib.plugin_feature) = "step_up_code";
  string token_id = 1;
  string user_id  = 2;
}
