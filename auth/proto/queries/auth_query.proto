  google.protobuf.Timestamp sent_at = 2 [(w17.field) = { type: DATETIME, null: true }];
}

// GetSessionSteppedUpAtReq — the caller's own session (step_up): when it was
// last stepped up, for an action of the plugin's own that asks for one
// (CreateApiToken under api_token_step_up_seconds).
message GetSessionSteppedUpAtReq {
