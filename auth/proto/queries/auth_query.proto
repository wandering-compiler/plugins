  // ListTeamMembersByOrg — every live member of every live team of one
  // organization. A member whose organization membership ended (or began
  // again after they were added) is not one: the same join the grants read.
  rpc ListTeamMembersByOrg(ListTeamMembersByOrgReq) returns (ListTeamMembersByOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT tm.team_id AS team_id, tm.user_id AS user_id, u.email AS email, tm.created_at AS added_at "
          "FROM @module.TeamMember tm "
          "JOIN @module.Team t ON t.id = tm.team_id AND t.deleted_at IS NULL "
          "JOIN @module.OrgMembership m ON m.user_id = tm.user_id AND m.org_id = t.org_id "
          "  AND m.removed_at IS NULL AND m.created_at <= tm.created_at "
          "JOIN @module.User u ON u.id = tm.user_id "
          "WHERE t.org_id = :org_id AND tm.removed_at IS NULL "
          "ORDER BY u.email ASC"
      }
    };
  }

  rpc ListTeamRolesByOrg(ListTeamRolesByOrgReq) returns (ListTeamRolesByOrgResp) {
    option (w17.contrib.plugin_feature_rpc) = "teams";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT tr.team_id AS team_id, tr.role_id AS role_id "
          "FROM @module.TeamRole tr "
          "JOIN @module.Team t ON t.id = tr.team_id AND t.deleted_at IS NULL "
          "JOIN @module.Role r ON r.id = tr.role_id AND r.deleted_at IS NULL "
          "WHERE t.org_id = :org_id AND tr.revoked_at IS NULL "
          "ORDER BY tr.team_id ASC, tr.role_id ASC"
      }
    };
  }

  rpc ListTeamRoleIds(ListTeamRoleIdsReq) returns (ListTeamRoleIdsResp) {
