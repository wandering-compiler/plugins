// AuthQuery — read-only DB lookups.
//
// `GetUserByEmail` is the canonical "I have credentials" entry
// point: returns the User row (including password_hash) so the
// consumer's business layer can call passwordhash.Verify.
//
// `GetUserByToken` is the canonical "I have a bearer token"
// entry point — typically called from gateway middleware to
// populate request context from the Authorization header.
//
// `GetUserPermissions` is the canonical "give me everything
// this user can do" entry point — the project's hand-written
// `Authenticate` RPC composes it with `GetUserByToken` and
// passes the returned int32 IDs straight into
// `AuthResp.permission_ids` (no packing, no string→id mapping;
// the activating domain's AclPermission proto enum IS the
// catalog). Returns the deduped union of permission IDs across
// every role the user holds; empty list means the user has no
// role assignments (no permissions).
// ── org member + invite reads ───────────────────────────────

// OrgMemberRow — one row of an organization's member list: the
// membership joined to the identity behind it. The email is what an
// admin recognises a person by; a list of user ids is not a member list.
message OrgMemberRow {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string email   = 2;
  string role    = 3;
  google.protobuf.Timestamp joined_at = 4;
  // The membership row's id (OrgMember.membership_id).
  string membership_id = 6;

  // 5 = owner, (Organization.owner_id = user_id): dropped with the column.
  // OrgMember.owner, which this filled, stays — deprecated, always false.
  reserved 5;
  reserved "owner";
}

message ListOrgMembersByOrgReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1 [(w17.field) = { type: UUID }];
  // after_email — the last address of the previous page; '' = the first page
  // (every address sorts after the empty one).
  // The keyset of the list's order (u.email, unique).
  string after_email = 2 [(w17.field) = { type: CHAR, max_len: 320, blank: true }];
  // limit — the rows read. The handler asks one more than the page it
  // returns, to tell whether another page follows.
  int32 limit = 3 [(w17.field) = { type: NUMBER, gte: 1, lte: 501 }];
}
message ListOrgMembersByOrgResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated OrgMemberRow members = 1;
}

message GetPendingOrgInviteForEmailReq {
  option (w17.contrib.plugin_feature) = "invite_accept_from_list";
  string invite_id = 1 [(w17.field) = { type: UUID }];
  string email     = 2 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message GetPendingOrgInviteForEmailResp {
  option (w17.contrib.plugin_feature) = "invite_accept_from_list";
  string org_id     = 1;
  string token_hash = 2;
}
message GetPendingOrgInviteByTokenReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string token_hash = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message GetPendingOrgInviteByTokenResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  string org_id = 1;
  string role   = 2;
  // Empty = the invitation is OPEN — it names no address, and accepting it
  // therefore derives nothing about the one the registrant holds.
  string email  = 3;
  // So a caller can look at what is pinned BEFORE spending the invitation. Opaque
  // here as everywhere — see OrgInvite.metadata.
  string metadata = 4;
}

message ListOrgInvitesByOrgReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message ListOrgInvitesByOrgResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  repeated OrgInvite invites = 1;
}

message ListPendingInvitesForEmailReq {
  option (w17.contrib.plugin_feature) = "org_invite";
  string email = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
// Carries the ORG NAME, not just its id. This backs the "you have been
// invited to X" list a person sees in their own account, and an
// invitation that can only name a uuid is not one anybody can act on.
message PendingInviteRow {
  option (w17.contrib.plugin_feature) = "org_invite";
  string invite_id = 1;
  string org_id    = 2;
  string org_slug  = 3;
  string org_name  = 4;
  string role      = 5;
  google.protobuf.Timestamp expires_at = 6;
  // See OrgInvite.product_roles.
  string product_roles = 7 [(w17.contrib.plugin_feature_field) = "product_roles"];
}
message ListPendingInvitesForEmailResp {
  option (w17.contrib.plugin_feature) = "org_invite";
  repeated PendingInviteRow invites = 1;
}

