syntax = "proto3";

// Auth plugin — lifecycle event catalogue.
//
// Three notifications fire post-mutation: user creation, token
// issuance, token revocation. Token rotation is consumer-composed
// (GetUserByToken → RevokeToken → IssueToken) and fires only the
// IssueToken event (RevokeToken emits nothing; see it).
//
// Channel reference uses the plugin-internal alias `events`;
// activation maps the alias to a real project channel. Plugin authors don't bake in a real channel name —
// they pick `events` as the logical destination and the project
// picks the transport (NATS / Redis / in-memory).
//
// Every id field on every event is a UUID (string carrier) —
// mirrors the plugin's UUID-native identifier strategy
// (types/models.proto §"Identifier strategy").
//
// device_id is the exception: on the token, sign-in and MFA events it is the
// key thumbprint of the device that caused the event (RFC 7638, 43
// characters) — the value AuthResp.device_id and principal.DeviceID carry,
// so a subscriber can match it against the device of any request — not the
// Device row's UUID. Each emit fills it from its request's event-only
// `thumbprint`. The sign-in attempts themselves are not events: they are the
// SignInEvent rows (types/models.proto).

package w17.contrib.auth;

import "google/protobuf/timestamp.proto";
import "w17/contrib.proto";
import "w17/field.proto";
import "w17/event.proto";

option go_package = "@project;@pkg";

// UserCreated — emitted on AuthMutation.CreateUser after the
// User row commits. Downstream subscribers might send welcome
// emails, populate audit logs, prime per-user projections, etc.
message UserCreated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.created"
  };

  string                    user_id    = 1;
  string                    email      = 2;
  google.protobuf.Timestamp created_at = 3;
}

// UserDeleted — emitted on AuthMutation.EraseUser once an account has been
// erased (GDPR): its row pseudonymised in place, its tokens and devices
// revoked. Erasure is how this plugin deletes an account: nothing is deleted,
// in this plugin or by it, and the event keeps its released name and topic so
// every project's events lock that lists it still compiles. A subscriber
// holding the person's data under this user_id (a profile, a mailing list, a
// billing contact) erases its own copy here. Carries only the id: the address
// is gone, and an event is no place to keep it. Gated user_admin.
message UserDeleted {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.deleted"
  };
  option (w17.contrib.plugin_feature) = "user_admin";

  string user_id = 1;
}

// UserDisabled — emitted on AuthMutation.DisableUser, once per account the
// admin Disable action (AuthService.DisableAccounts) disables. The disable
// already revoked every token of the account, so a subscriber can end what
// it holds for the person too (a cached session, a websocket). An account
// that was already disabled emits nothing. Gated user_admin.
message UserDisabled {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.disabled"
  };
  option (w17.contrib.plugin_feature) = "user_admin";

  string user_id     = 1;
  string disabled_by = 2;
  // device_id — the key thumbprint of the operator's device.
  string device_id   = 3;
}

// UserEnabled — emitted on AuthMutation.EnableUser, once per account the admin
// Enable action (AuthService.EnableAccounts) re-enables. Nothing comes back
// with it: the person signs in again. Gated user_admin.
message UserEnabled {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.enabled"
  };
  option (w17.contrib.plugin_feature) = "user_admin";

  string user_id    = 1;
  string enabled_by = 2;
  // device_id — the key thumbprint of the operator's device.
  string device_id  = 3;
}

// UserUpdated — emitted on AuthMutation.UpdateUser (the admin Users page
// detail edit). Carries the new email so a subscriber can re-sync any
// denormalised copy of it (mailing list, billing contact, search index)
// without re-reading the row. Gated user_admin.
message UserUpdated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.updated"
  };
  option (w17.contrib.plugin_feature) = "user_admin";

  string user_id = 1;
  string email   = 2;
}

// MarketingConsentChanged — emitted on AuthMutation.SetUserMarketingConsent
// (its one emit site), when the user gives or withdraws their consent to
// marketing messages, here or in the marketing tool. A
// subscriber holding a copy of it (a marketing tool's contact attribute)
// updates that copy here, rather than on the user's next request, which may
// never come after a withdrawal. Gated marketing_consent.
message MarketingConsentChanged {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.user.marketing_consent_changed"
  };
  option (w17.contrib.plugin_feature) = "marketing_consent";

  string                    user_id    = 1;
  bool                      consent    = 2;
  google.protobuf.Timestamp decided_at = 3;
  // device_id — the key thumbprint of the device the user decided from: with
  // decided_at, the record of how the consent was given.
  string                    device_id  = 4;
}

// BotAllowlistChanged — emitted on AuthMutation.SetBotAllowedCidrs, when an
// operator sets or clears where a machine account's bearer tokens are
// accepted from: widening or clearing it is a security change, so who made it
// is part of the record. Gated bot_token_guard.
message BotAllowlistChanged {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.bot.allowlist_changed"
  };
  option (w17.contrib.plugin_feature) = "bot_token_guard";

  string user_id       = 1;
  // The new list (canonical CIDRs, comma-separated); empty = anywhere.
  string allowed_cidrs = 2;
  // The operator who changed it, and the key thumbprint of their device.
  string changed_by    = 3;
  string device_id     = 4;
}

// UserTokenRevoked — emitted on AuthMutation.RevokeUserToken (the admin
// Sessions page revoke) once the token is revoked (the row stays, with
// revoked_at set). Subscribers can
// audit forced logouts or drop the token from any hot session cache.
// Distinct from the base-tier TokenRevoked (auth.token.revoked, the live
// self-logout path): the eventbus allows only one emit site per event,
// and this is the admin-initiated revoke — its own event + topic.
message UserTokenRevoked {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.token.admin_revoked"
  };
  option (w17.contrib.plugin_feature) = "user_admin";

  string token_id = 1;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry): the operator's device,
  // not the revoked token's.
  string device_id = 2;
}

// ApiTokenRevoked — emitted on AuthMutation.MarkApiTokenRevoked, when a person
// revokes one of their API tokens (RevokeApiToken). The counterpart of
// ApiTokenCreated: a long-lived credential ending is as much an audit fact as
// one being made. A token already revoked emits nothing. Gated api_token.
message ApiTokenRevoked {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.api_token.revoked"
  };
  option (w17.contrib.plugin_feature) = "api_token";

  string token_id   = 1;
  string user_id    = 2;
  // device_id — the key thumbprint of the device that revoked it.
  string device_id  = 3;
}

// ApiTokenCreated — emitted on AuthMutation.IssueApiToken after the token
// commits: a person's API token (CreateApiToken) or a machine account's
// (IssueBotToken). Audit and notification hook ("a new API token was created
// on your account"). No secret: never the token, its hash or a key — only the
// key's thumbprint.
message ApiTokenCreated {
  option (w17.event) = { channel: "events", topic: "auth.api_token.created" };
  option (w17.contrib.plugin_feature) = "api_token";

  string                    token_id   = 1;
  // The token's owner: the person, or the machine account.
  string                    user_id    = 2;
  google.protobuf.Timestamp created_at = 3;
  // device_id — the key thumbprint of the device that CREATED it (the value
  // AuthResp.device_id and principal.DeviceID carry for the creating
  // request): the browser, or the CLI session's own key when a CLI created
  // it. Empty when the request carried no device. The token records the
  // ROOT approver instead (UserToken.approved_by_device_id: for a CLI
  // session, the browser that approved the CLI), so this is where the
  // immediate creator stays visible.
  string                    device_id  = 4;
  // key_thumbprint — the thumbprint of the PROGRAM's key the token is bound
  // to (the device id Authenticate answers for its requests).
  string                    key_thumbprint = 5;
  string                    name       = 6;
  // created_by — the account that created it: the owner itself for
  // CreateApiToken, the operator for IssueBotToken.
  string                    created_by = 7;
}

// OAuthGrantApproved — emitted when a user approves an MCP client on the
// consent page and the client redeems its code (oauth_server): a connected
// app came into being. No token value travels.
message OAuthGrantApproved {
  option (w17.event) = { channel: "events", topic: "auth.oauth_grant.approved" };
  option (w17.contrib.plugin_feature) = "oauth_server";

  string                    grant_id   = 1;
  string                    user_id    = 2;
  google.protobuf.Timestamp created_at = 3;
  // client_id — what the client is known by: the URL of its metadata
  // document, or the id this server minted it.
  string                    client_id  = 4;
  // resource — the MCP surface the grant is for.
  string                    resource   = 5;
}

// TokenIssued — emitted on AuthMutation.IssueToken after the
// UserToken row commits. Subscribers might rate-limit token
// issuance, populate a per-user session count, fan out to a
// "new device" notification path, etc.
message TokenIssued {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.token.issued"
  };

  string                    token_id  = 1;
  string                    user_id   = 2;
  google.protobuf.Timestamp issued_at = 3;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry): the device the token
  // is bound to, which signed the sign-in.
  string                    device_id = 4;
}

// TokenRevoked — emitted on AuthMutation.RevokeSessionToken (the live
// logout path; the eventbus allows one emit site per event and the
// uncalled RevokeToken primitive does not emit). Idempotent upstream
// → the event fires only when a live token was actually revoked; a
// logout of an already revoked token doesn't emit (emit is gated on
// RowsAffected > 0 via the storage codegen's per-mutation conditional
// emit path).
message TokenRevoked {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.token.revoked"
  };
  // Gated in step with its ONLY emit site. RevokeSessionToken is the
  // base-tier logout primitive and carries `authenticate_turnkey`, so an
  // activation without that feature has no logout path in the plugin —
  // and used to be left declaring an event nothing could ever fire, with
  // every subscriber to auth.token.revoked silently never running.
  //
  // Found by the staging emit-coverage check the moment it landed; it is
  // the fourth instance of this shape (UserCreated / TokenIssued /
  // org-scoped roles were the others).
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";

  string token_id = 1;
  string user_id  = 2;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry): the device that
  // signed out.
  string device_id = 3;
}

// RBAC lifecycle — fired by the eight mutations on the
// Role/Permission/RolePermission/UserRole tables. Subscribers
// typically audit grants/revokes, invalidate per-user permission
// caches, or fan out to security review pipelines.

message RoleCreated {
  option (w17.event) = { channel: "events", topic: "auth.role.created" };
  option (w17.contrib.plugin_feature) = "rbac";
  string                    role_id    = 1;
  string                    name       = 2;
  google.protobuf.Timestamp created_at = 3;
}

// RoleDeleted — emitted on AuthMutation.DeleteRole. The role row stays,
// stamped deleted_at, and every grant of it was revoked in the same
// transaction (no UserRoleRevoked is emitted for those).
message RoleDeleted {
  option (w17.event) = { channel: "events", topic: "auth.role.deleted" };
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id = 1;
}

// RoleUpdated — emitted on AuthMutation.UpdateRole (the admin Roles page
// detail edit). Copy-only: the privilege flags are not editable there,
// so a subscriber never has to re-evaluate grants off this event.
message RoleUpdated {
  option (w17.event) = { channel: "events", topic: "auth.role.updated" };
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id = 1;
}

// OrgRoleUpdated — emitted on AuthMutation.UpdateOrgRoleLabel: an
// organization renamed one of its custom roles or changed its description.
// Copy only; a permission change has its own RolePermissionAdded / Removed.
message OrgRoleUpdated {
  option (w17.event) = { channel: "events", topic: "auth.org_role.updated" };
  option (w17.contrib.plugin_feature) = "org_roles";
  string role_id = 1;
}

// Permission table is gone — the activating domain's
// AclPermission proto enum (w17.lock.acl.proto) is now the
// catalog. PermissionCreated / PermissionDeleted events were
// retired together with the CreatePermission /
// DeletePermission mutations.

message UserRoleAssigned {
  option (w17.event) = { channel: "events", topic: "auth.user_role.assigned" };
  option (w17.contrib.plugin_feature) = "rbac";
  string                    user_role_id = 1;
  string                    user_id      = 2;
  string                    role_id      = 3;
  google.protobuf.Timestamp assigned_at  = 4;
  // org_id — WHICH organization the grant applies in; empty means
  // realm-wide (`UserRole.org_id` NULL). Without it a subscriber could
  // not tell a grant in one company from one that applies in all of
  // them, which is the whole distinction `org_membership` adds.
  //
  // Gated in step with the column and with the emit's payload entry:
  // all three drop together, and they have to, because an entry naming
  // a field that is not there is a parse-time error.
  string                    org_id       = 5 [(w17.contrib.plugin_feature_field) = "org_membership"];
}

// UserRoleRevoked — emitted on AuthMutation.RevokeRoleFromUser. The grant
// row stays, stamped revoked_at.
message UserRoleRevoked {
  option (w17.event) = { channel: "events", topic: "auth.user_role.revoked" };
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
  string role_id = 2;
  // Which org's grant was revoked — see UserRoleAssigned.org_id.
  string org_id  = 3 [(w17.contrib.plugin_feature_field) = "org_membership"];
}

// RolePermissionAdded — emitted when AuthMutation.AddPermissionToRole grants
// a permission: a new pair, or a removed one revived. Not for a refusal (a
// deleted role, a permission the role already carries): nothing changed.
message RolePermissionAdded {
  option (w17.event) = { channel: "events", topic: "auth.role_permission.added" };
  option (w17.contrib.plugin_feature) = "rbac";
  string                    role_permission_id = 1;
  string                    role_id            = 2;
  // int32 — references the activating domain's AclPermission
  // enum value (w17.lock.acl.proto). The catalog is the proto
  // enum, not a DB table; the event payload mirrors the
  // RolePermission.permission_id column shape.
  int32                     permission_id      = 3;
  google.protobuf.Timestamp added_at           = 4;
}

// RolePermissionRemoved — emitted on AuthMutation.RemovePermissionFromRole.
// The row stays, stamped removed_at.
message RolePermissionRemoved {
  option (w17.event) = { channel: "events", topic: "auth.role_permission.removed" };
  option (w17.contrib.plugin_feature) = "rbac";
  string role_id       = 1;
  // int32 — see RolePermissionAdded.permission_id.
  int32  permission_id = 2;
}

// two_factor lifecycle — emitted by the TOTP enrollment mutations + the
// MFA challenge create/consume. All gated `two_factor`.

// MfaChallengeRequested — emitted by CreateMfaChallenge whenever a second
// factor is required (i.e. by SignIn's 2FA gate). Fires on EVERY
// challenge, carrying `totp_enrolled` so a hand-written subscriber knows
// whether the built-in authenticator will satisfy it
// (totp_enrolled=true → stay out of the way) or it must deliver a code
// itself (totp_enrolled=false → SMS/e-mail using `code`). This single
// boolean is the design's keystone. `code` is the plaintext fallback
// code — present only in plugin-generates mode (TOTP off / not enrolled),
// blank otherwise; it is never persisted.
message MfaChallengeRequested {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.mfa.challenge_requested"
  };
  option (w17.contrib.plugin_feature) = "two_factor";

  string                    user_id       = 1;
  string                    challenge_id  = 2;
  bool                      totp_enrolled = 3; // ← the keystone signal
  string                    email         = 4; // delivery hint
  string                    code          = 5 [(w17.field) = { blank: true, sensitive: true }]; // plugin-generates mode only; blank otherwise
  google.protobuf.Timestamp expires_at    = 6;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry): the device that passed
  // the password and must complete the sign-in.
  string                    device_id     = 7;
  // sealed_code — the code sealed to the activation's delivery_recipient (age,
  // standard base64). Set INSTEAD of code whenever a recipient is configured,
  // which every activation outside W17_ENV=dev must have; the mailer opens
  // it with its identity (sdk/go/service/secret.OpenSealed, or `age -d`).
  string sealed_code = 8;
}

// StepUpCodeRequested — emitted by SetStepUpCode when a signed-in person
// without an authenticator asks to step their session up (RequestStepUpCode).
// `code` is the plaintext six-digit code for a hand-written delivery channel
// (e-mail), exactly like MfaChallengeRequested's; only its hash is stored, on
// the session row. `token_id` is the session it can complete.
message StepUpCodeRequested {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.step_up.code_requested"
  };
  option (w17.contrib.plugin_feature) = "step_up_code";

  string                    user_id    = 1;
  string                    token_id   = 2;
  string                    email      = 3; // delivery hint
  string                    code       = 4 [(w17.field) = { blank: true, sensitive: true }];
  google.protobuf.Timestamp expires_at = 5;
  // device_id — the key thumbprint of the session's device.
  string                    device_id  = 6;
  // sealed_code — the code sealed to the activation's delivery_recipient (age,
  // standard base64). Set INSTEAD of code whenever a recipient is configured,
  // which every activation outside W17_ENV=dev must have; the mailer opens
  // it with its identity (sdk/go/service/secret.OpenSealed, or `age -d`).
  string sealed_code = 7;
}

// MfaVerified — emitted by ConsumeMfaChallenge on a successful second
// factor. Audit hook (logins-with-2FA, anomaly detection).
message MfaVerified {
  option (w17.event) = { channel: "events", topic: "auth.mfa.verified" };
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id      = 1;
  string challenge_id = 2;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry).
  string device_id    = 3;
}

// TotpEnrolled / TotpConfirmed / TotpDisabled — authenticator lifecycle
// audit hooks.
message TotpEnrolled {
  option (w17.event) = { channel: "events", topic: "auth.totp.enrolled" };
  option (w17.contrib.plugin_feature) = "two_factor";
  string                    user_id     = 1;
  google.protobuf.Timestamp enrolled_at = 2;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry).
  string                    device_id   = 3;
}

message TotpConfirmed {
  option (w17.event) = { channel: "events", topic: "auth.totp.confirmed" };
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry).
  string device_id = 2;
}

// TotpDisabled — emitted on AuthMutation.RevokeTotpSecret: the authenticator
// was disabled, or ended because a new enrolment replaces it. The row stays,
// stamped revoked_at, its seed cleared.
message TotpDisabled {
  option (w17.event) = { channel: "events", topic: "auth.totp.disabled" };
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry).
  string device_id = 2;
}

// RecoveryCodeUsed — a recovery code was spent (sign-in, or the step-up of
// EnrollTotp / DisableTotp / GenerateRecoveryCodes). Worth telling the person:
// one they did not spend means their codes are in someone else's hands.
message RecoveryCodeUsed {
  option (w17.event) = { channel: "events", topic: "auth.mfa.recovery_code_used" };
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
  // device_id — the key thumbprint of the device that caused it (the value
  // AuthResp.device_id and principal.DeviceID carry).
  string device_id = 2;
}

// password_reset lifecycle — emitted by CreatePasswordResetToken when a
// user requests a reset. Carries the PLAINTEXT token (never persisted —
// only its hash is stored) + email for a hand-written delivery channel
// (e-mail with a reset link). The handler emits only on a known email and
// silently no-ops an unknown one (anti-enumeration), so a subscriber only
// ever sees a request for a real account.
message PasswordResetRequested {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.password_reset.requested"
  };
  option (w17.contrib.plugin_feature) = "password_reset";

  string                    user_id    = 1;
  string                    email      = 2; // delivery hint
  string                    token      = 3 [(w17.field) = { blank: true, sensitive: true }]; // plaintext reset token; NEVER persisted
  google.protobuf.Timestamp expires_at = 4;
  // sealed_token — the token sealed to the activation's delivery_recipient (age,
  // standard base64). Set INSTEAD of token whenever a recipient is configured,
  // which every activation outside W17_ENV=dev must have; the mailer opens
  // it with its identity (sdk/go/service/secret.OpenSealed, or `age -d`).
  string sealed_token = 5;
}

// sign_up_confirmation — emitted by CreatePendingSignUp when SignUp parks a
// registration until its address is proved. Carries the PLAINTEXT code (only
// its hash is stored) for a hand-written delivery channel, which must be
// e-mail to the address below: delivering it there is the proof the
// confirmation stands for. The person types the code into ConfirmSignUp
// together with pending_id.
message SignUpConfirmationRequested {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.sign_up.confirmation_requested"
  };
  option (w17.contrib.plugin_feature) = "sign_up_confirmation";

  string                    pending_id = 1;
  string                    email      = 2; // where the code must go
  string                    code       = 3 [(w17.field) = { blank: true, sensitive: true }]; // plaintext; NEVER persisted
  google.protobuf.Timestamp expires_at = 4;
  // sealed_code — the code sealed to the activation's delivery_recipient (age,
  // standard base64). Set INSTEAD of code whenever a recipient is configured,
  // which every activation outside W17_ENV=dev must have; the mailer opens
  // it with its identity (sdk/go/service/secret.OpenSealed, or `age -d`).
  string sealed_code = 5;
}

// email_verification lifecycle — emitted by CreateEmailVerificationToken
// when a verification is requested (e.g. just after sign-up). Same shape
// + single-plaintext-delivery contract as PasswordResetRequested.
message EmailVerificationRequested {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.email_verification.requested"
  };
  option (w17.contrib.plugin_feature) = "email_verification";

  string                    user_id    = 1;
  string                    email      = 2; // delivery hint + the address being verified
  string                    token      = 3 [(w17.field) = { blank: true, sensitive: true }]; // plaintext verification token; NEVER persisted
  google.protobuf.Timestamp expires_at = 4;
  // sealed_token — the token sealed to the activation's delivery_recipient (age,
  // standard base64). Set INSTEAD of token whenever a recipient is configured,
  // which every activation outside W17_ENV=dev must have; the mailer opens
  // it with its identity (sdk/go/service/secret.OpenSealed, or `age -d`).
  string sealed_token = 5;
}

// org_membership lifecycle — emitted by the two org write primitives
// (AuthMutation.CreateOrganization / AddOrgMembership) after their rows
// commit. These are the symmetric counterpart to UserCreated: a project
// hangs its provisioning subscribers here (seed default resources for a
// new org, audit membership grants, prime per-org projections) rather than
// plumbing owned/replicated state off the plugin's Organization /
// OrgMembership tables on the write path: these events are the stable
// contract, whereas the plugin's table schema is internal and may change on
// a version bump. A consuming PROJECT MAY still read the plugin's tables —
// e.g. a read-only display JOIN in its own query (`... o.name AS
// organization_name`) — it pins the plugin version, so the schema is frozen
// until it deliberately updates. What stays forbidden is a *plugin's*
// handler code reaching into *another plugin's* tables (the enforced
// cross-plugin isolation rule).
// All gated `org_membership`.

// OrganizationCreated — emitted on AuthMutation.CreateOrganization after
// the Organization row commits. The keystone provisioning hook: a
// subscriber seeds an org's default data off org_id.
message OrganizationCreated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org.created"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string                    org_id     = 1;
  string                    slug       = 2;
  string                    name       = 3;
  string                    kind       = 4; // private | company
  google.protobuf.Timestamp created_at = 5;
}

// OrgMembershipAdded — emitted on AuthMutation.AddOrgMembership after the
// OrgMembership row commits (the creator's membership + every later
// invite accept). Subscribers audit grants, invalidate per-user org
// caches, or notify. `role` is the membership's role label (admin | member).
message OrgMembershipAdded {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_membership.added"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string                    membership_id = 1;
  string                    user_id       = 2;
  string                    org_id        = 3;
  string                    role          = 4; // a label: admin | member
  google.protobuf.Timestamp created_at    = 5;
}

// OrganizationDeleted — emitted on AuthMutation.DeleteOrganization (the
// admin Organizations page delete) after the org is stamped deleted_at and
// its memberships and org-scoped grants ended (the rows stay). The symmetric
// teardown counterpart to OrganizationCreated: a subscriber tears down the
// org's provisioned resources off org_id.
message OrganizationDeleted {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org.deleted"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string org_id = 1;
}

// OrganizationUpdated — emitted on AuthMutation.UpdateOrganization (the
// admin Organizations page detail edit), carrying the organization's
// columns as they now are. The slug is its public handle — the W17-Org
// selector and the `/orgs/{org}/` path segment — so a subscriber that knows
// the organization by org_id learns its new slug here: the old one no longer
// selects it, and a client still naming the old one is refused (or, should
// another organization take the slug later, reaches only what its own
// membership there admits).
message OrganizationUpdated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org.updated"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string org_id = 1;
  string slug   = 2;
  string name   = 3;
  string kind   = 4;
}

// OrgMembershipUpdated — emitted on AuthMutation.UpdateOrgMembership
// (the admin OrgMemberships page detail edit) after the member's role
// changed. Subscribers invalidate the user's per-org authorization
// cache — this event DOES change what the member may do.
message OrgMembershipUpdated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_membership.updated"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string membership_id = 1;
}

// OrgMembershipRemoved — emitted on AuthMutation.MarkOrgMembershipRemoved
// (AuthService.RemoveOrgMembership, the admin OrgMemberships page delete)
// after the membership and its org-scoped grants ended (the rows stay).
// Subscribers audit revocations or invalidate the user's per-org cache.
message OrgMembershipRemoved {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_membership.removed"
  };
  option (w17.contrib.plugin_feature) = "org_membership";

  string membership_id = 1;
}

// ── org_invite lifecycle ────────────────────────────────────
//
// The plugin DELIVERS nothing, exactly as with PasswordResetRequested and
// EmailVerificationRequested: it records the invitation and says so on the
// bus, and a project that wants the invitee to hear about it writes a
// subscriber. That is what keeps this feature usable on a deployment with
// no mail channel at all — the invitation still works, it is just told to
// the person some other way.

message OrgInviteCreated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_invite.created"
  };
  option (w17.contrib.plugin_feature) = "org_invite";

  string invite_id  = 1;
  string org_id     = 2;
  string email      = 3; // delivery hint — the address invited
  string role       = 4;
  string invited_by = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message OrgInviteAccepted {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_invite.accepted"
  };
  option (w17.contrib.plugin_feature) = "org_invite";

  string invite_id = 1;
  string org_id    = 2;
  // The account that accepted. Present here and absent from the invitation
  // itself, which is the whole shape of this feature: an invitation names
  // an address, an acceptance names a user.
  string user_id   = 3;
  string role      = 4;
}

// OrgInviteRevoked — emitted on AuthMutation.CloseOrgInvite (a withdrawn
// invitation). The row stays, stamped closed_at.
message OrgInviteRevoked {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.org_invite.revoked"
  };
  option (w17.contrib.plugin_feature) = "org_invite";

  string invite_id = 1;
  string org_id    = 2;
}

// OAuthIdentityLinked — emitted on AuthMutation.CreateOAuthIdentity, when a
// provider identity is linked to an account: at its creation through the
// provider, or to an existing account whose address the provider asserted.
// Linking grants a new way into the account — a sign-in through the provider
// alone — so it is the event an owner should hear about ("Google was linked
// to your account"). Never the provider's token or subject. Gated oauth.
message OAuthIdentityLinked {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.oauth.identity_linked"
  };
  option (w17.contrib.plugin_feature) = "oauth";

  string identity_id = 1;
  string user_id     = 2;
  string provider_id = 3;
  // device_id — the key thumbprint of the device that signed in through the
  // provider (the exchange's), empty when it carried none.
  string device_id   = 4;
}

// BotCreated — emitted on AuthMutation.CreateBotUser, when an operator creates
// a machine account (AuthService.CreateBot). A machine account acts with the
// roles it is given, so its creation is an audit fact like a person's
// sign-up; UserCreated stays the sign-up's event (one emit site per event).
// Its tokens are ApiTokenCreated, emitted by IssueApiToken. Gated
// service_account.
message BotCreated {
  option (w17.event) = {
    channel: "events"
    topic:   "auth.bot.created"
  };
  option (w17.contrib.plugin_feature) = "service_account";

  string user_id    = 1;
  string email      = 2;
  string created_by = 3;
  // device_id — the key thumbprint of the operator's device.
  string device_id  = 4;
}
