name: auth
version: 0.1.0-rc.28
requires_w17: ">=1.12"

# v3 — explicit Go module anchor. Staging text-rewrites every
# occurrence of this prefix in handlers/ + lib/ source to the
# per-activation pb path when the plugin is staged into a project.
go_module: github.com/wandering-compiler/plugins/auth

description: "Email + password authentication primitives + bearer tokens + RBAC. v3 plugin — proto + DQL primitives + authored Go business handlers (Authenticate, SignIn)."
license: "Apache-2.0"

channels:
  - events

# Plugin-author env-var contract. Each entry becomes one
# PascalCase field on the codegen-emitted EnvConfig the plugin's
# RegisterPlugin receives. Bundle main.go reads
# `<DOMAIN>_<PLUGIN>_<NAME>` from os.Getenv at boot, coerces to
# the declared type, and populates the struct before invoking
# RegisterPlugin. Consumers set the env var via their deploy
# manifest; the plugin author treats the value as the typed knob
# for that activation.
env:
  - name: password_hash_algo
    type: string
    default: argon2id
    description: "Password-hash algorithm used by SignIn / SignUp. One of: argon2id (default, recommended), bcrypt, scrypt, pbkdf2. Algo-specific params follow each algo's library defaults; production deployments that need tuned cost knobs swap in a custom RegisterPlugin or extend this env: surface with per-algo tunables."
  - name: two_factor_totp
    type: bool
    default: "true"
    description: "Built-in TOTP second factor (two_factor feature). false = the plugin never verifies TOTP; every challenge goes out via MfaChallengeRequested for a hand-written delivery channel (SMS/e-mail)."
  - name: two_factor_scope
    type: string
    default: all_logins
    description: "When 2FA fires: all_logins (every password sign-in) | new_devices (only an untrusted device). A device is the key its client signs requests with, and trust belongs to the (account, device) pair: a device becomes trusted by passing the second factor, and a password change or a disable ends the trust of every device of the account. Works in every activation — device identity is base tier."
  - name: mfa_code_ttl_seconds
    type: int
    default: "300"
    description: "Lifetime of an event-flow MfaChallenge code (the SMS/e-mail path). TOTP windows are governed by RFC 6238, not this knob. Also bounds the VerifyMfa window for the TOTP path."
  - name: mfa_max_challenges_per_window
    type: int
    default: "10"
    description: "How many MFA challenges one user may be ISSUED per mfa_challenge_window_seconds (two_factor feature). The five-attempt lockout is per CHALLENGE, and every sign-in mints a new challenge with a fresh budget, so this is what bounds total guessing by an attacker who already has the password. Issuing a challenge also retires the user's previous pending ones, so at most one code is live at a time. <= 0 falls back to 10."
  - name: mfa_challenge_window_seconds
    type: int
    default: "900"
    description: "The window mfa_max_challenges_per_window counts over (two_factor feature). Default 900 = 15 minutes. <= 0 falls back to 900."
  - name: session_token_ttl_seconds
    type: int
    default: "2592000"
    description: "Absolute lifetime (seconds) of a browser session bearer token, stamped into UserToken.expires_at at mint time (SignIn / SignUp / VerifyMfa). Default 2592000 = 30 days. The token-validation queries reject an expired token (expires_at > NOW()), so a leaked session token stops working after the TTL even without an explicit logout (OWASP session-timeout baseline). <= 0 falls back to the 30-day default. API tokens have their own lifetime (api_token_default_ttl_hours)."
  - name: public_session_ttl_seconds
    type: int
    default: "0"
    description: "Absolute lifetime (seconds) of a session signed in with \"this is a public computer\" (public_computer on SignIn, OAuthExchange, SignUp, ConfirmSignUp; VerifyMfa takes it from the challenge). Such a session's device is never made trusted, and the client keeps its token in session storage only. 0 (the default) or <= 0 = 8 hours, silently capped at the session lifetime (session_token_ttl_seconds), so a deployment with sessions shorter than 8 hours boots unchanged. A value > 0 set explicitly must not be longer than session_token_ttl_seconds: a longer one fails the boot."
  - name: api_token_default_ttl_hours
    type: int
    default: "2160"
    description: "Lifetime (hours) of an API token — a person's (CreateApiToken) or a machine account's (IssueBotToken) — minted WITHOUT an explicit expires_at. Default 2160 = 90 days. A caller may still choose its own expiry (any time in the future). 0 = never expires, the behaviour before this setting existed; tokens minted earlier keep their NULL expiry. A machine account's bearer token (minted without a key) never takes \"never\": 0 gives it 90 days, and no bearer token lives more than 366 days. Rotation is issue-new-then-revoke-old; the default is what makes forgetting the revoke safe."
  - name: totp_issuer
    type: string
    default: ""
    description: "Issuer label shown in the authenticator app (the otpauth:// issuer). Empty = the account label carries no issuer prefix."
  - name: two_factor_secret_key
    type: string
    default: ""
    description: "LEGACY — only for authenticators enrolled by rc.19 or earlier. TOTP seeds are now a CRYPTED_SECRET column, encrypted with the project's field keyring (W17_FIELD_KEYS — the one key for every encrypted column, `w17ctl secrets field-key`); new deployments leave this empty. An existing deployment keeps its old value until every old seed has moved: each moves into the new column the first time it is used. Will be removed with the old column in a later release."
  - name: oauth_redirect_base
    type: string
    default: ""
    description: "Public base URL the OAuth callback is reachable at (e.g. https://app.example.com), used to build redirect_uri (oauth feature). Empty = derived from the request host."
  - name: invite_only
    type: bool
    default: "true"
    description: "Require a pending org invitation for the address before SignUp will create an account (org_invite + sign_up_turnkey). Default TRUE: the unsafe state is the one you opt into, not the one you get by forgetting a variable — a console reachable from the internet with open sign-up is a hole, and the deployment that forgot this knob is exactly the one that cannot afford it. false = anyone may register and an invitation only governs which org they can join. ⚠️ This gate proves possession of an ADDRESS only in the weak sense that the address was invited; someone who guesses an invited address can register it first and inherit the membership and role. Enabling `email_verification` does not close the window: that feature adds a column and two RPCs and blocks nothing — accounts still sign up unverified with it on. Set `invite_requires_verified_email` to close it."
  - name: email_proof_required
    type: string
    default: "none"
    description: "How much proof an address needs before AcceptOrgInvite will admit it (org_invite). Three values, ordered weakest to strongest, and they read as a FLOOR on User.email_proof: 'none' asks nothing and is today's behaviour; 'derived' accepts an address a BOUND invitation named (the invitation said this address and the secret link reached whoever registered — no round trip asked of anybody), and also accepts a self-confirmed one; 'full' accepts only an address whose owner proved it by a round trip — the email_verification link, a sign_up_confirmation code, or an OAuth provider asserting email_verified=true (the provider made that round trip; the same assertion OAuth already relies on to link an existing account). ⚠️ Defaults to 'none' on purpose, which is NOT this plugin's usual 'the unsafe state is the one you opt into': every account that exists today is UNPROVEN, so a stricter default would refuse invitations those people were legitimately sent — a default that reads as safe and is really a breaking change is worse than an honest knob, which is the same reasoning the boolean this replaces carried. 'derived' is the setting most deployments want once they are past onboarding: it closes the address-guessing hole without asking anyone for a round trip, because an OPEN invitation cannot derive anything (the registrant picks the address) and is therefore refused by it. Replaces `invite_requires_verified_email`, a boolean that could not express 'derived' at all."
  - name: sign_up_allowlist
    type: string
    default: ""
    description: "Who may register at all, for a service that is not open yet: a comma- or space-separated list of addresses (ceo@example.com) and whole domains (@example.com). Empty = no restriction. Checked by SignUp, by ConfirmSignUp (again, on the address being confirmed) and by the OAuth sign-up, before anything is written; an address outside it is refused with the same answer whether or not it has an account or an invitation, so the list cannot be probed. Accounts an administrator creates are not affected. An entry that is neither an address nor @domain fails the boot."
  - name: sign_up_confirmation_ttl_seconds
    type: int
    default: "900"
    description: "How long a sign_up_confirmation code stays valid, in seconds. Default 900 = 15 minutes. <= 0 falls back to 900."
  - name: org_invite_ttl_hours
    type: int
    default: "168"
    description: "How long an org invitation stays acceptable, in hours (org_invite). Default 168 = 7 days. Expiry is checked at acceptance AND at sign-up, so a stale invitation stops being a way in without anything having to sweep the table."
  - name: password_reset_ttl_seconds
    type: int
    default: "3600"
    description: "Lifetime (seconds) of a password-reset token (password_reset feature). Default 3600 = 1 hour. <= 0 falls back to the 1-hour default. The token is single-use and the expiry is enforced atomically at ResetPassword time."
  - name: email_verification_ttl_seconds
    type: int
    default: "86400"
    description: "Lifetime (seconds) of an e-mail verification token (email_verification feature). Default 86400 = 24 hours. <= 0 falls back to the 24-hour default. Single-use; expiry enforced atomically at VerifyEmail time."

features:
  - name: rbac
    description: "Role / Permission / UserRole / RolePermission tables + their CRUD mutations (incl. UpdateRole, which edits a role's name/description only — the privilege flags stay declarative) + their lifecycle events. Nothing is deleted: DeleteRole stamps Role.deleted_at and revokes the role's grants, RevokeRoleFromUser stamps UserRole.revoked_at, RemovePermissionFromRole stamps RolePermission.removed_at (AddPermissionToRole revives a removed pair; both are logged in the append-only RolePermissionChange table); every permission reader skips ended rows, and a released name or grant can be taken again. Required when the project's gateway has ACL annotations + uses role-based assignment. Also stages the turnkey declarative signup role assignment (first_user / default -> UserRole), with the BootstrapClaim table (one row) that hands the first_user roles to exactly one sign-up."
    default: true
    go_files:
      - handlers/signup_roles.go
  - name: authenticate_turnkey
    requires:
      # Authenticate delegates to GetUserByTokenWithPermissions, which is
      # gated `rbac` — and auth_service.go calls it unconditionally. Without
      # this, activating the turnkey resolver alone fails the BUNDLE build on
      # `undefined: pb.GetUserByTokenWithPermissionsReq`, pointing at a file
      # the project never wrote and cannot edit.
      - rbac
    description: "AuthService.Authenticate handler dispatchable from gateway (w17.rest_api).auth_methods[]. Authored Go handler in handlers/auth_service.go: extracts bearer token, delegates to AuthQuery.GetUserByTokenWithPermissions, passes the int32 permission IDs straight into AuthResp.permission_ids. AuthService.AuthenticateAdmin (the admin preset's user_lookup) is the same resolver with no organization selected, so only realm-wide roles count."
    default: true
  - name: sign_up_turnkey
    description: "AuthService.SignUp — authored Go handler composing PasswordHash.Hash + CreateUser + IssueToken. Project's REST endpoint points directly at SignUp — no business glue. Disable for custom register flows (rate limit, captcha, email confirmation, invite codes). Staged from handlers/signup.go so the pb.SignUpReq/Resp reference vanishes with the feature (an admin auth realm omits it and seeds accounts instead)."
    default: true
    go_files:
      - handlers/signup.go
  - name: sign_up_confirmation
    requires:
      # It changes what SignUp does, so there must be a SignUp to change.
      - sign_up_turnkey
    description: "SignUp proves the address before it creates the account. SignUp parks the registration in PendingSignUp (hashed password, hashed code, expiry) and emits SignUpConfirmationRequested with a code for a hand-written delivery channel, which must mail it to that address; it answers confirmation_required + pending_id and NO token. ConfirmSignUp(pending_id, code) creates the User, marks the address SELF_CONFIRMED (when email_verification is on), supersedes the address's other pending registrations and issues the session. Why a pending table and not an unverified User: a User row holds its address (the email is unique), so a registration abandoned before the code — by its owner, or on purpose by someone who knows the address — would block that address for good. Pending rows hold nothing; any number may exist for one address, none can sign in, each dies at sign_up_confirmation_ttl_seconds. Guessing is bounded by the code, not by a cap on the address: eight base32 characters (32^8 ≈ 10^12) and five attempts per pending row, so a stranger needs about 10^11 registrations — each one a mail to the address — for an even chance. There is deliberately NO per-address limit on how many codes are sent: anybody can exhaust such a limit, which would block the address again, renewably; floods are bounded per caller by the gateway's limiter on unauthenticated methods. The invite and allowlist gates run when the code is requested; the allowlist is checked again at confirmation. SignUp does not say whether the address already has an account: a taken address is answered exactly like a new one (same work, a code mailed to it), and only ConfirmSignUp, with that code, answers AlreadyExists — so only the address's owner learns it, and a delivery channel should word the mail so it also makes sense to someone who already has an account. Off by default."
    default: false
    go_files:
      - handlers/signup_confirm.go
  - name: sign_in_turnkey
    description: "AuthService.SignIn — authored Go handler chaining GetUserByEmail + passwordhash.VerifyAndRotate + IssueToken. Emits opaque Unauthenticated on every failure (anti-enumeration). Disable for custom sign-in flows (MFA, rate limit, lockout, federated identity)."
    default: true
  - name: tenant_scope
    requires:
      # The tenant create path IS the SignUp create path: tenant.go replaces
      # the `signupCreateUser` seam with a function taking `*pb.SignUpReq`,
      # a type gated `sign_up_turnkey`. Without it the bundle does not build.
      - sign_up_turnkey
    conflicts_with:
      # Stated in the description since this feature existed, enforced by
      # nothing until now: handlers/oauth.go creates users through the
      # baseline CreateUser and has no tenant to resolve, so an OAuth sign-in
      # under tenant_scope hits the NOT NULL tenant_id at RUNTIME — the worst
      # place to learn it. A documented incompatibility that codegen does not
      # know about is a promise the compiler cannot keep.
      - oauth
    description: "Multi-tenant isolation. Adds the Tenant table + a required User.tenant_id column + AuthQuery.GetUserTenant, and makes Authenticate stamp scopes[tenant_id] for the principal's tenant (resolved from auth, never client-sent). A project scoping its rows by name: tenant_id then gets per-tenant isolation. The NOT NULL tenant_id is written by AuthMutation.CreateUser through a feature-gated SET assignment (?feature(tenant_scope)), so there is ONE create rpc for every activation — this feature used to gate the baseline out and replace it with a CreateUserWithTenant twin, which cost the UserCreated event its only emit site. NOT compatible with `oauth`: handlers/oauth.go creates users through the baseline CreateUser and has no tenant to resolve (it was already broken before the gate — an OAuth sign-in under tenant_scope produced a NOT NULL violation at runtime; making OAuth tenant-aware is its own change). Compatible with `service_account`: a machine account is created in the tenant its minting operator is acting in, written by handlers/service_account_tenant.go, which is staged only when both features are on. Off by default — opt in for multi-tenant deployments."
    default: false
    go_files:
      - handlers/tenant.go
  - name: api_token
    description: "API / MCP tokens alongside browser bearer sessions. Adds UserToken.token_type discriminator (SESSION/API) + management columns (name/last_used_at) + the TokenPermission subset table, plus Create/List/Revoke management RPCs (exposed via the plugin's REST + MCP presets). API tokens resolve permissions from the user's API-realm roles, intersected with the per-token subset (narrow-only). (Token expiry is base-tier — UserToken.expires_at applies to every token, see models.proto.) Off by default — opt in for projects exposing an MCP surface or non-browser API clients. ⚠️ A token here belongs to a USER, not to an organization: it hangs off UserToken and its ceiling is that user's roles. There is deliberately no org-owned key — a credential that carries permissions must carry an identity, or nobody answers for what it does — so machine access is a VIRTUAL USER (bot1, audit-bot) with the membership and role it should have. Two narrowings over bare permission-id SETS cannot compose, so both axes resolve role-attributed grants and intersect on ROLES, so a permission survives only when ONE role grants it and that role passes every axis. Machine access is still a VIRTUAL USER (bot1, audit-bot) with the membership and role it should have, not a third realm (the anonymous case with NO permissions is a custom auth method, as in a public-link view). Every API token is bound to a device key — the program's that will use it — except a machine account's bearer token (service_account: IssueBotToken without public_key). CreateApiToken (and IssueBotToken given one) take public_key, the program's PUBLIC JWK (EC P-256 or OKP Ed25519; a private member is refused), bind the token to its RFC 7638 thumbprint, and every request with the token needs a DPoP proof by that key. Only a signed-in session creates one. The creating device (for a CLI session, the browser that approved it) is recorded, and revoking that one device ends the token. API tokens minted before device binding are refused by Authenticate like every unbound token. Emits ApiTokenCreated."
    requires:
      # GetUserRolePermissionsByRealm resolves an API token's permissions
      # from UserRole, Role and RolePermission — rbac's tables. Without rbac
      # the statement names tables the activation does not have, and code
      # generation fails (check-stage reports it).
      - rbac
    default: false
    go_files:
      - handlers/apitoken.go
  - name: devices
    description: "Self-service device management: ListDevices, RevokeDevice, RevokeOtherDevices, RevokeAllDevices (REST /auth/devices). Device identity itself is base tier and needs no feature: every token is bound to the device key its client signs requests with (DPoP, RFC 9449; the gateway verifies each proof and hands the plugin the key's thumbprint), the Device table is keyed by (user, thumbprint), and trust for two_factor_scope=new_devices belongs to that pair. Revoking a device here revokes its sessions and stamps Device.revoked_at: the key can never sign in to that account again (DEVICE_REVOKED), and its client generates a new key, which is a new device. Off by default."
    default: false
    requires:
      # devices.go names pb.AuthResp — the caller's device is read from the
      # turnkey identity envelope (callerDeviceThumbprint).
      - authenticate_turnkey
    go_files:
      - handlers/devices.go
  - name: oauth
    description: "Generic OAuth2 / OIDC sign-in. Adds OAuthProvider (admin-managed server configs, client secret encrypted) + OAuthIdentity (User↔external-subject link) + OAuthLoginCode tables and the authorize/callback/exchange handlers. The browser that starts a sign-in sends a PKCE challenge; the callback hands it a single-use code, never a session, and only that browser's verifier redeems it (OAuthExchange). Towards the provider the plugin uses PKCE and an OIDC nonce, and checks an id_token's audience, expiry and nonce. Providers are configured at runtime via the generated admin CRUD, or from the project's own code with AuthMutation.UpsertOAuthProvider; non-OIDC providers (GitHub) are handled by per-provider userinfo_url + subject_path/email_path mapping columns, not code. OAuth login bypasses plugin 2FA by default (the IdP is the second factor). Off by default."
    default: false
    go_files:
      - handlers/oauth.go
    # ⚠️ REQUIRED, and the reason is a takeover rather than a compile error.
    #
    # OAuth auto-links an incoming identity to an existing account with the
    # same address only when the IdP asserts the address is verified —
    # one half of the question. The other half is
    # whether the LOCAL account ever verified it, and without this feature
    # there is no field in which that answer could be recorded
    # (`User.email_verified_at` is gated on it).
    #
    # With no such field, a verified assertion is bound to a claim nobody
    # checked: an attacker signs in through a provider that does not verify,
    # with the victim's address in its profile, and the create branch makes
    # an account for that address; the victim signs in later through a
    # provider that does verify, and is handed a session inside it.
    #
    # Requiring verification in the create branch instead does NOT close it —
    # password sign-up is a second door to the same squat. The property is
    # about the account being linked into, so the field has to exist.
    requires:
      - email_verification
  - name: two_factor
    requires:
      # mfa.go names pb.SignInResp: the two-step sign-in RETURNS one
      # (mfa_required instead of a token). No sign-in, no build.
      - sign_in_turnkey
    description: "Second-factor auth at sign-in. Built-in TOTP (RFC 6238) on by default, disable-able via env (two_factor_totp=false). Adds UserTotpSecret (seed encrypted at rest, codes single-use) + UserRecoveryCode + MfaChallenge tables, the EnrollTotp (returns the otpauth URI and a QR code as SVG)/ConfirmTotp (returns ten recovery codes)/DisableTotp/GetMfaStatus/GenerateRecoveryCodes enrollment RPCs, and the two-step sign-in: SignIn returns mfa_required + challenge_id instead of a token, VerifyMfa (dual-path: confirmed TOTP secret, else event-flow code) completes it. Every challenge emits MfaChallengeRequested carrying totp_enrolled so a hand-written subscriber can deliver a fallback code (SMS/e-mail). Scope all_logins | new_devices (an untrusted (account, device) pair only). Off by default."
    default: false
    go_files:
      - handlers/mfa.go
      - handlers/mfa_recovery.go
  - name: password_reset
    description: "Self-service password reset. Adds the PasswordResetToken table + the RequestPasswordReset / ResetPassword RPCs (both unauthenticated, REST-exposed). RequestPasswordReset always returns success regardless of whether the email exists (anti-enumeration) and emits PasswordResetRequested carrying a single-use, time-bounded plaintext token (only its hash is stored) for a hand-written e-mail delivery channel. ResetPassword consumes the token atomically (single-use + expiry), sets the new password, spends every other live reset link of the account in the same transaction, and revokes every existing token (sessions + API). TTL via env (password_reset_ttl_seconds, default 1h). Off by default."
    default: false
    go_files:
      - handlers/reset.go
  - name: email_verification
    description: "E-mail ownership verification. Adds the EmailVerificationToken table + a nullable User.email_verified_at column + the RequestEmailVerification (bearer-authenticated) / VerifyEmail (unauthenticated link click) RPCs. RequestEmailVerification emits EmailVerificationRequested with a single-use plaintext token (hash stored) for a hand-written delivery channel; VerifyEmail consumes it and stamps email_verified_at. Non-blocking by default (SignIn does not reject unverified users; a project can layer that policy). TTL via env (email_verification_ttl_seconds, default 24h). Off by default."
    default: false
    go_files:
      - handlers/emailverify.go
  - name: cli_login
    description: "First-party CLI login — the console acts as an OAuth authorization server for CLIs (e.g. w17ctl) via the loopback + PKCE flow (the same UX as `claude login`). Adds the CliAuthCode table + CliAuthorize (bearer-authenticated: mint a single-use, PKCE-bound authorization code for the signed-in principal) and CliToken (unauthenticated: verify the PKCE code_verifier, consume the code single-use, mint a bearer) RPCs. The human authenticates through the project's existing surface (password sign-in or the `oauth` providers); cli_login only issues + redeems the CLI's code. A redirect target must be LOOPBACK (RFC 8252 §7.3 — the user's own machine, no registration needed) or listed in the AuthClient registry under its client_id, matched as a whole string; that registry is what lets the same flow serve a browser app on its own origin instead of only a CLI. Off by default."
    default: false
    go_files:
      - handlers/cli_login.go
  - name: org_members_rest
    description: "Publishes a member's management on the REST preset beside the member list: PUT /auth/orgs/{org}/members/{id}/role (UpdateOrgMembershipRole) and DELETE /auth/orgs/{org}/members/{id} (RemoveOrgMembership), both under the role ceiling — the caller must cover every role the member holds and the one they are given — and in the organization the path names. The member list carries each membership's id for them. Off by default: an upgrade adds no route an activation did not ask for."
    default: false
    requires:
      - org_membership
      # A UI changing a role needs the role vocabulary, which is org_invite's
      # (GET /auth/orgs/{org}/roles, ListAssignableRoles).
      - org_invite
  - name: org_membership
    requires:
      # org_membership.go names pb.WhoAmIResp — the caller's orgs are
      # reported through the turnkey identity answer.
      - authenticate_turnkey
      # role_ceiling.go reads the role catalogue (ListRoleGrants). rbac already
      # comes through authenticate_turnkey; declared here because this
      # feature's own file names it, and a dependency held only transitively
      # breaks the day the link in between is relaxed.
      - rbac
    description: "GitHub-style multi-org membership — one identity belongs to MANY Organizations via OrgMembership (the generalization of single-tenant tenant_scope). Adds the Organization + OrgMembership tables + AuthQuery.ListUserOrgs / GetUserOrgBySlug, the ListMyOrgs business RPC (the caller's orgs, for a CLI's `org list` + login cache + init org picker), and an Authenticate decorator that stamps scopes[org_id] for the request's ACTIVE org (a client-selected slug in the W17-Org header, VALIDATED against membership — a caller can only ever scope into an org they belong to). A project scoping rows by name: org_id then gets per-org isolation. Coexists with tenant_scope (a project picks one model). Off by default."
    default: false
    # api_token narrows permissions by REALM (inside resolvePrincipal);
    # org_membership narrows them by ORGANIZATION (a grant narrower that
    # runs after). Sequencing two narrowings is sound only when each
    # answer is a subset of the previous one, and neither query can see
    # the other's axis: a permission reachable through BOTH a
    # session-realm role scoped to org X and an api-realm realm-wide role
    # survives both filters for a session token acting in org Y, where
    # neither role applies. Refused until the queries resolve grants
    # per ROLE.
    go_files:
      - handlers/org_membership.go
      # The role ceiling reads the caller's resolved permissions off the
      # AuthResp envelope (authenticate_turnkey's, which org_membership
      # requires) and the role catalogue (rbac's, required through it). Its
      # callers are org_membership_role.go below, org_invite (which requires
      # org_membership) and service_account, which stages it as well. Staged
      # with rbac it named AuthResp in an activation that need not have it.
      - handlers/role_ceiling.go
      # A membership's role change is a grant: it resolves the role through
      # the org-scoped catalogue and holds it to the ceiling. The catalogue
      # lookup lives here, not in org_invite.go, because both features grant.
      - handlers/org_membership_role.go
  - name: org_invite
    description: "Invite-based org membership — an admin (or whoever holds the permission) invites an EMAIL into an organization with a named role. Adds the OrgInvite table + AuthQuery.ListOrgInvites / ListPendingInvitesForEmail / GetOrgInvite, AuthMutation.CreateOrgInvite / BindOpenOrgInvite / ConsumeOrgInviteByToken / CloseOrgInvite / CloseExpiredOrgInvite (a withdrawn or lapsed invitation is closed, never deleted), and the InviteToOrg / ListOrgInvites / RevokeOrgInvite / ListMyInvites / AcceptOrgInvite business RPCs. Accepting writes BOTH the OrgMembership row and the UserRole grant scoped to that org, so an invited member arrives with permissions rather than with a label and nothing behind it. Keyed on (org, email) rather than a user id — the invitee may not have an account yet — which is also what lets `invite_only` gate sign-up: with it on, SignUp refuses an address that holds no pending invitation. Off by default."
    default: false
    # Built ON org_membership, not merely alongside it: the invite writes an
    # OrgMembership row and an org-scoped UserRole, both of which are types
    # that feature owns. Without the requirement the failure is an
    # "undefined: pb.AddOrgMembershipReq" inside generated code, in a file the
    # project neither wrote nor may edit.
    requires:
      # org_membership owns the OrgMembership row an acceptance writes;
      # rbac owns the Role catalogue the invited role names and the
      # UserRole grant that makes it mean anything. Without EITHER, the
      # staged Go references types that were filtered out.
      - org_membership
      - rbac
    go_files:
      - handlers/org_invite.go
  - name: password_change
    description: "Authenticated password change — the signed-in principal supplies its current password and a new one. Distinct from `password_reset`, which is the FORGOTTEN-password flow and needs a mail channel to deliver a token; this one needs no channel at all, because the proof is the current password. A deployment that cannot send mail can still let people rotate their own credentials. Adds the ChangePassword business RPC over AuthMutation.UpdateUserPasswordIfUnchanged, and AuthMutation.RevokeOtherSessionTokens, which signs the person out of every other session in the same unit of work (API tokens are kept; the sessions are revoked, not deleted). With `password_reset` staged too, the change also spends every live reset link of the account in that unit of work. Off by default."
    default: false
    go_files:
      - handlers/password_change.go
  - name: marketing_consent
    description: "The user's own consent to marketing messages: User.marketing_consent and when it was decided (marketing_consent_at, NULL = never asked), read and set by the user on the REST preset (GET / PUT /auth/marketing-consent), announced as MarketingConsentChanged, and answered by Authenticate (AuthResp.marketing_consent), so the gateway's request stream carries it to the tool that sends the messages. It changes nothing about what is recorded. Off by default; a migration adds the two columns."
    default: false
    requires:
      # AuthResp, which carries the consent, is authenticate_turnkey's.
      - authenticate_turnkey
    go_files:
      - handlers/marketing_consent.go
  - name: service_account
    description: "Machine accounts — a BOT user that cannot sign in with a password and acts only through an API token an admin minted for it. Adds User.kind, the admin mint/revoke endpoints, and the SignIn refusal that makes the distinction enforceable rather than descriptive. IssueBotToken binds the token to the machine account's one key when given public_key, and otherwise mints a bearer token (UserToken.bearer, prefix w17bot_): no key, no proof, always expiring within 366 days, refused on the admin plane and the MCP surface; revoke it on the admin Sessions page (user_admin, which this feature requires). Requires api_token (the token machinery) — without it there is no credential for a bot to hold. Works in a realm with or without org_membership: with it, a machine account belongs to the operator's active organization, is listed and minted for only there, and holds its role inside it (handlers/service_account_org.go); without it the realm is one organization (a platform's own backoffice), and its machine accounts hold realm-wide roles and are every operator's."
    default: false
    requires:
      - api_token
      - user_admin
      # CreateBot assigns the bot's role: pb.AssignRoleToUserReq is rbac's.
      - rbac
      # CreateBot holds the role to the caller's ceiling (role_ceiling.go),
      # which reads the caller's resolved permissions off the AuthResp
      # envelope — authenticate_turnkey's.
      - authenticate_turnkey
      # org_membership is NOT required. What
      # organizations add — the membership written before the grant, the
      # org-scoped listing and minting — lives in service_account_org.go,
      # staged only when both are on (go_files_combined below), so a realm
      # without organizations builds and serves machine accounts of its own.
    go_files:
      - handlers/service_account.go
      # The role ceiling: org_membership stages it too; a file claimed by any
      # active feature is staged once.
      - handlers/role_ceiling.go
  - name: user_admin
    description: "Turnkey admin user management — a Django-style Users admin page (list + detail) plus soft-disable / enable / erase of accounts, and a Sessions page to review and revoke tokens. Nothing is deleted. Adds nullable User.disabled_at and User.erased_at columns (SignIn rejects a disabled account before issuing a token, and DisableUsers revokes every token of the accounts it disables — sessions and API tokens), AuthQuery.ListUsers + GetUser (both project WITHOUT password_hash), AuthMutation.UpdateUser (email only — password_hash stays with UpdateUserPassword, emits UserUpdated) behind AuthService.UpdateAccount (refuses the erased.invalid domain), AuthMutation.BeginUserErasure + EraseUser behind AuthService.EraseAccount (the Users and ServiceAccounts pages' delete) and its bulk form AuthService.EraseUsers (GDPR erasure by pseudonymisation: the row stays; first the account's access ends — disabled, password unusable, tokens and devices revoked — then the personal data in the other features' tables and in the sign-in history is blanked or spent, then the address becomes a placeholder; one transaction with a transaction coordinator, otherwise running it again completes a partial erasure; emits UserDeleted), AuthMutation.DisableUsers / EnableUsers (bulk; an erased account stays disabled) and AuthService.RevokeSession (the Sessions page's delete, which revokes) with its bulk form AuthService.RevokeSessions, plus the queries and the action the opt-in SignIns and Devices pages use (AuthQuery.ListSignInEvents + GetSignInEvent, AuthQuery.ListAllDevices + GetDevice, AuthService.RevokeDevices). The plugin admin preset contributes the Users page (list ListUsers; detail read GetUser + update UpdateAccount + delete EraseAccount, which erases; actions Disable / Enable) and the Sessions page (delete RevokeSession, which revokes; revoked tokens listed as revoked; each session's device, whether it is a public-computer session, and for a CLI session the device that approved it). The SignIns and Devices pages are NOT contributed by this feature: they are the admin_sign_ins and admin_devices features, so an upgrade adds no page to an existing activation (an admin that declares nav groups must list every page). Off by default — opt in on the realm whose admin manages end-user accounts (typically a staff/admin realm)."
    default: false
    go_files:
      - handlers/user_admin.go
  # The two admin pages below are features of their own, not part of
  # user_admin, because they arrived after user_admin had adopters: an admin
  # that declares `nav` groups must list EVERY page, including the pages a
  # plugin contributes (fail-closed), so a page added to an existing feature
  # breaks every such adopter on upgrade. Opt-in pages cannot. They gate the
  # PAGES only — the queries and the action stay with user_admin, which both
  # require.
  - name: admin_sign_ins
    requires:
      - user_admin
    description: "The SignIns admin page: the sign-in history of every account (every attempt, failures included; read-only, paged; AuthQuery.ListSignInEvents + GetSignInEvent, which user_admin stages). Opt in with user_admin, and add the page to the admin nav if it declares groups. Off by default."
    default: false
  # The two endpoints below are opt-in for the same reason as the pages above:
  # an endpoint published by a feature that already has adopters makes every
  # adopter's codegen scaffold a new e2e test for it, a deliberately failing
  # placeholder until someone writes it. They gate the REST ENDPOINTS only —
  # the methods stay with the features they belong to.
  - name: my_sign_ins
    requires:
      - authenticate_turnkey
    description: "Publishes GET /auth/sign-ins (AuthService.ListMySignInEvents): the signed-in caller's own sign-in history, newest first. The history is recorded in every activation; this only publishes the caller's view of it. Off by default."
    default: false
  - name: client_secret_rotation
    requires:
      - cli_login
    description: "Publishes POST /auth/clients/{id}/rotate-secret (AuthService.RotateClientSecret): issue a registered client a new client_secret, the old one stops working, the client_id stays. Off by default."
    default: false
  - name: admin_devices
    requires:
      - user_admin
    description: "The Devices admin page: every device of every account — label, key thumbprint, first and last seen, whether its trust stands, revoked or not (AuthQuery.ListAllDevices + GetDevice, which user_admin stages). Its Revoke action (AuthService.RevokeDevices) revokes a device for good, every token bound to it and every CLI session it approved, recording the operator. Opt in with user_admin, and add the page to the admin nav if it declares groups. Off by default."
    default: false

# Files that need a feature PAIR. A machine account under tenant_scope must be
# written with a tenant (User.tenant_id is NOT NULL), and the code that fills it
# references a field that exists only with tenant_scope from a handler that
# exists only with service_account — so it lives in neither feature's go_files.
go_files_combined:
  - features: [service_account, tenant_scope]
    files: [handlers/service_account_tenant.go]
  # What organizations add to machine accounts: the membership a new one is
  # written into, and listing / minting scoped to the operator's organization.
  # The calls it makes exist only with org_membership.
  - features: [service_account, org_membership]
    files: [handlers/service_account_org.go]
  # The pending registration carries the tenant SignUp resolved; the fields
  # that hold it exist only when both features do.
  - features: [sign_up_confirmation, tenant_scope]
    files: [handlers/signup_confirm_tenant.go]

# Preset surfaces this plugin injects into a consuming project's
# gateway at activation time. On by default when the gating feature
# is active; the project's activation block (`(w17.domain).plugins[]
# .presets`) controls enable / mount per surface. Refs are plugin-
# relative (`<Service>.<Method>`); codegen rewrites them to the
# activation's `registered_as` name.
presets:
  rest:
    # Headers the gateway must thread into backend gRPC metadata.
    # Activation merges these into the domain's metadata_propagation
    # (extend_defaults preserves W3C tracing), so a consuming project
    # doesn't hand-wire forwarding for headers the plugin owns.
    #
    # User-Agent and X-Forwarded-For label a device (Device.label / .ip) —
    # display only: a device is identified by its key thumbprint, which the
    # gateway stamps itself (x-w17-dpop-jkt), never by a header a client
    # sends. Base tier, like device identity.
    forward_headers:
      - { name: User-Agent }
      - { name: X-Forwarded-For }
      # tenant_scope resolves a registration's tenant from the request's Host
      # (Tenant.domain). restgw forwards it as x-forwarded-host — the gRPC hop
      # has an :authority of its own. Without this the Host never left the
      # gateway and every tenant_scope sign-up was refused.
      - { name: Host, feature: tenant_scope }
      # The active-org selector — a slug the client sends to scope a request
      # into one of its orgs. NOT in the reserved x-w17-* namespace (that's
      # for VERIFIED auth/scope metadata only — a client header there could
      # forge org scope); the plugin reads this raw selector, VALIDATES
      # membership, then stamps the trusted scopes[org_id]. Gated org_membership.
      - { name: W17-Org, feature: org_membership }
    # Bearer middleware — the gateway calls Authenticate on every
    # gated endpoint of the surface this activation injects into.
    auth_methods:
      - ref: AuthService.Authenticate
        token_types: [BEARER]
        feature: authenticate_turnkey
    groups:
      # The turnkey identity surface a consuming project used to copy
      # by hand into its rest.proto. SignIn / SignUp are unauthenticated
      # (the caller has no token yet); WhoAmI rides the bearer middleware.
      - prefix: /auth
        description: "Identity surface served turnkey by the auth plugin — sign-in / sign-up + session bootstrap."
        endpoints:
          - { ref: AuthService.SignIn, method: POST, path: /login,    exclude_auth: true, public_limit: failed_only, feature: sign_in_turnkey }
          - { ref: AuthService.SignUp, method: POST, path: /register, exclude_auth: true, feature: sign_up_turnkey }
          - { ref: AuthService.ConfirmSignUp, method: POST, path: /register/confirm, exclude_auth: true, public_limit: failed_only, feature: sign_up_confirmation }
          - { ref: AuthService.WhoAmI, method: GET,  path: /whoami,                        feature: authenticate_turnkey }
          # Logout revokes the caller's CURRENT session token (bearer-
          # authenticated). Base-tier — no `devices` feature needed;
          # "log out everywhere" stays the devices group's job.
          - { ref: AuthService.Logout, method: POST, path: /logout,                        feature: authenticate_turnkey }
          # The caller's own sign-in history. Opt-in (my_sign_ins): an
          # endpoint added to a feature that already has adopters scaffolds a
          # new e2e test into every one of them on upgrade.
          - { ref: AuthService.ListMySignInEvents, method: GET, path: /sign-ins,           feature: my_sign_ins }
          # The caller's own consent to marketing messages. Opt-in
          # (marketing_consent), for the same reason as my_sign_ins.
          - { ref: AuthService.GetMarketingConsent, method: GET, path: /marketing-consent, feature: marketing_consent }
          - { ref: AuthService.SetMarketingConsent, method: PUT, path: /marketing-consent, feature: marketing_consent }
      # API/MCP token management — the caller manages their OWN tokens,
      # authenticated by their browser-session bearer (no exclude_auth).
      # Gated api_token: the whole group drops when the feature is off.
      - prefix: /auth/tokens
        description: "API / MCP token management (create / list / revoke), bearer-authenticated."
        endpoints:
          - { ref: AuthService.CreateApiToken, method: POST,   path: "",            feature: api_token }
          - { ref: AuthService.ListApiTokens,  method: GET,    path: "",            feature: api_token }
          - { ref: AuthService.RevokeApiToken, method: DELETE, path: "/{token_id}", feature: api_token }
      # Machine accounts — provision a bot, list them, see which roles one
      # may hold, and mint its token. Bearer-authenticated: an operator does
      # this from a signed-in session, and the ACL decides which operators.
      # Gated service_account: the whole group drops when the feature is off.
      - prefix: /auth/bots
        description: "Machine accounts — provision, list, and mint an API token for a bot."
        endpoints:
          - { ref: AuthService.CreateBot,     method: POST, path: "",              feature: service_account }
          - { ref: AuthService.ListBots,      method: GET,  path: "",              feature: service_account }
          - { ref: AuthService.ListBotRoles,  method: GET,  path: /roles,          feature: service_account }
          - { ref: AuthService.IssueBotToken, method: POST, path: "/{user_id}/token", feature: service_account }
      # OAuth2/OIDC sign-in — provider redirect + callback. Both
      # unauthenticated (the caller has no token yet). Gated oauth.
      - prefix: /auth/oauth
        description: "OAuth2/OIDC sign-in — provider authorize redirect + callback."
        endpoints:
          # Starting the flow is a browser step too: this hands the
          # user to the identity provider. `allow_external` because the
          # target IS the provider's own URL — built server-side from
          # the OAuthProvider row an administrator wrote, never from
          # anything the caller sent. It carries NO token (the session
          # does not exist yet), which is what keeps an outward redirect
          # from being a way to deliver one somewhere.
          - { ref: AuthService.OAuthAuthorizeURL, method: GET, path: "/{provider}/authorize", exclude_auth: true, feature: oauth,
              browser_redirect: { target_field: "authorize_url", allow_external: true } }
          # The callback is walked by a BROWSER: the identity provider
          # sends it here with ?code=. `browser_redirect` makes it answer
          # 302 instead of a JSON document, sending the user back where
          # they started with a single-use LOGIN CODE in the fragment —
          # never the session: a URL can be handed to anyone, and a session
          # in it would sign in whoever opened it. The page redeems the code
          # at /exchange with its PKCE verifier.
          #
          # `redirect_after` has been on OAuthCallbackResp since the
          # feature shipped — caller-supplied, validated site-relative,
          # signed into `state` so the callback can trust it — and until
          # now NOTHING read it back. The browser landed on
          # {"token":"ey…"} and the flow ended there.
          - { ref: AuthService.OAuthCallback,     method: GET, path: "/{provider}/callback",  exclude_auth: true, public_limit: failed_only, feature: oauth,
              browser_redirect: { target_field: "redirect_after", token_field: "code", token_param: "code", fallback: "/" } }
          # Redeems the callback's code with the verifier whose challenge
          # the same browser sent to /authorize, and issues the session.
          # failed_only: a wrong or replayed code is what the limit is for.
          - { ref: AuthService.OAuthExchange,     method: POST, path: /exchange, exclude_auth: true, public_limit: failed_only, feature: oauth }
      # Two-factor: enrollment (bearer) + challenge verification
      # (VerifyMfa is unauthenticated — challenge_id, not a token yet).
      # Gated two_factor: the whole group drops when the feature is off.
      - prefix: /auth/mfa
        description: "Two-factor: TOTP enrollment + challenge verification."
        endpoints:
          - { ref: AuthService.VerifyMfa,    method: POST,   path: /verify,       exclude_auth: true, public_limit: failed_only, feature: two_factor }
          - { ref: AuthService.EnrollTotp,   method: POST,   path: /totp,                             feature: two_factor }
          - { ref: AuthService.ConfirmTotp,  method: POST,   path: /totp/confirm,                     feature: two_factor }
          - { ref: AuthService.DisableTotp,  method: DELETE, path: /totp,                             feature: two_factor }
          - { ref: AuthService.GetMfaStatus, method: GET,    path: /status,                           feature: two_factor }
          - { ref: AuthService.GenerateRecoveryCodes, method: POST, path: /recovery-codes,            feature: two_factor }
      # Device management — the caller manages their OWN devices,
      # authenticated by their session. Gated devices: the whole group drops
      # when the feature is off (device identity itself stays).
      - prefix: /auth/devices
        description: "Device management — list + revoke one/others/all, authenticated."
        endpoints:
          - { ref: AuthService.ListDevices,        method: GET,    path: "",              feature: devices }
          - { ref: AuthService.RevokeDevice,       method: DELETE, path: "/{device_id}",  feature: devices }
          - { ref: AuthService.RevokeOtherDevices, method: POST,   path: "/revoke-others", feature: devices }
          - { ref: AuthService.RevokeAllDevices,   method: POST,   path: "/revoke-all",    feature: devices }
      # Password reset — both unauthenticated (the caller has no token:
      # forgot-password flow). Gated password_reset.
      - prefix: /auth/password
        description: "Self-service password reset — request a token (e-mailed) + apply a new password."
        endpoints:
          - { ref: AuthService.RequestPasswordReset, method: POST, path: /reset-request, exclude_auth: true, feature: password_reset }
          - { ref: AuthService.ResetPassword,        method: POST, path: /reset,         exclude_auth: true, public_limit: failed_only, feature: password_reset }
          # Same prefix, different half of the same subject: the two above
          # are the FORGOTTEN-password flow and need a mail channel to
          # deliver a token, this one is the authenticated rotation whose
          # proof is the current password. Separate features, so a
          # deployment with no way to send mail still gets this one — and
          # NOT exclude_auth: it acts on the caller's own account.
          - { ref: AuthService.ChangePassword,       method: POST, path: /change,                            feature: password_change }
      # E-mail verification — request is bearer-authenticated (verify
      # your own address); the verify link click is unauthenticated. Gated
      # email_verification.
      - prefix: /auth/email
        description: "E-mail ownership verification — request a verification link + confirm it."
        endpoints:
          - { ref: AuthService.RequestEmailVerification, method: POST, path: /verify-request,                     feature: email_verification }
          - { ref: AuthService.VerifyEmail,              method: POST, path: /verify,        exclude_auth: true, public_limit: failed_only, feature: email_verification }
      # First-party CLI login (loopback + PKCE). CliAuthorize is bearer-
      # authenticated (the user is signed into the web; the browser carries
      # the session bearer); CliToken is unauthenticated (the CLI has no
      # token yet — it presents the authorization code + PKCE verifier).
      # Gated cli_login.
      - prefix: /auth/cli
        description: "First-party CLI login (loopback + PKCE) — the console issues CLI bearers (e.g. for w17ctl)."
        endpoints:
          - { ref: AuthService.CliAuthorize, method: POST, path: /authorize,                     feature: cli_login }
          - { ref: AuthService.CliToken,     method: POST, path: /token,     exclude_auth: true, public_limit: failed_only, feature: cli_login }
      # The registry of redirect targets the same flow may send a code to.
      #
      # ⚠ THE PLUGIN AUTHENTICATES THESE, IT DOES NOT AUTHORIZE THEM. The
      # handlers require a resolved principal and nothing more: any account
      # that can sign in can register a callback. Gating them to an
      # administrator is the PROJECT's job, through the endpoint ACL axis —
      # and a project that leaves the ACL axis off entirely gets no gate at
      # all.
      #
      # These routes are NOT admin-scoped by the ACL; reading them that way
      # assumes a property the plugin does not have. What makes a
      # registration safe is the other end: registering issues a
      # client_secret, and a code minted for a registered client cannot be
      # redeemed without it. The gate still matters — it is
      # what keeps an attacker from registering at all — but it is yours.
      #
      # Gated cli_login.
      - prefix: /auth/clients
        description: "Registered redirect targets for the authorization-code flow — what a non-loopback callback must be listed in before it can receive a code."
        endpoints:
          - { ref: AuthService.RegisterClient,   method: POST,   path: "",            feature: cli_login }
          - { ref: AuthService.ListClients,      method: GET,    path: "",            feature: cli_login }
          - { ref: AuthService.SetClientEnabled, method: PATCH,  path: "/{id}",       feature: cli_login }
          - { ref: AuthService.DeleteClient,     method: DELETE, path: "/{id}",       feature: cli_login }
          # Opt-in (client_secret_rotation), for the same upgrade reason as
          # /auth/sign-ins.
          - { ref: AuthService.RotateClientSecret, method: POST, path: "/{id}/rotate-secret", feature: client_secret_rotation }
      # Multi-org membership — the caller lists their OWN orgs, bearer-
      # authenticated. Gated org_membership.
      - prefix: /auth/orgs
        description: "Multi-org membership — list the organizations the caller belongs to."
        endpoints:
          - { ref: AuthService.ListMyOrgs, method: GET, path: "", feature: org_membership }
      # One organization's members, roles and invitations — the org is IN THE
      # PATH. `org_from_path` makes the gateway put that slug in the W17-Org
      # header before authentication, so it is resolved and validated against
      # membership exactly as the header always was; a W17-Org header naming
      # a different org is refused.
      #
      # This said "No org id in the path on purpose: an id in the URL would
      # invite a handler to trust it". The header was never more trustworthy
      # — both are client-supplied, and the same validation covers both —
      # while a header-only org meant a URL did not name what it showed: no
      # deep link, and a client cache that could not tell two orgs apart. The
      # handler still acts in the org AUTHENTICATION resolved; the request's
      # `org` field only has to agree with it.
      - prefix: "/auth/orgs/{org}"
        description: "One organization's members, roles and invitations, named in the path."
        org_from_path: org
        endpoints:
          - { ref: AuthService.ListOrgMembers,   method: GET,    path: /members,               feature: org_membership }
          # A member's role, and the member itself, managed under the role
          # ceiling (checkMayManageMembership): the caller must cover every
          # role the member holds and the one they are given.
          - { ref: AuthService.UpdateOrgMembershipRole, method: PUT, path: "/members/{id}/role", feature: org_members_rest }
          - { ref: AuthService.RemoveOrgMembership,     method: DELETE, path: "/members/{id}",   feature: org_members_rest }
          # The role vocabulary an invitation may use. Org-scoped (realm
          # roles are filtered out), and GET because a picker reads it
          # before anything is submitted.
          - { ref: AuthService.ListAssignableRoles, method: GET,  path: /roles,                 feature: org_invite }
          - { ref: AuthService.ListOrgInvites,   method: GET,    path: /invites,               feature: org_invite }
          - { ref: AuthService.InviteToOrg,      method: POST,   path: /invites,               feature: org_invite }
          - { ref: AuthService.RevokeOrgInvite,  method: DELETE, path: "/invites/{invite_id}", feature: org_invite }
      # Invitations addressed to the CALLER, across every org. Deliberately
      # NOT under /auth/orgs: these are not scoped to an active org — the
      # whole point is that the invitee may not be a member of any of them
      # yet, so an org-scoped path could not name them.
      - prefix: /auth/invites
        description: "The signed-in caller's pending invitations, and accepting one."
        endpoints:
          - { ref: AuthService.ListMyInvites,   method: GET,  path: "",                       feature: org_invite }
          # ⛔ The path carries NO id, and that is the point twice over.
          #
          # It cannot carry `invite_id` any more: the request retired that field when
          # the invitation became a secret link (reserved 1), so this binding named a
          # field the message no longer has — and codegen REFUSES that, which means
          # the plugin as published could not be installed at all. No example
          # activates org_invite, so nothing caught it until a console-app regen was
          # run against the author tree.
          #
          # And it must not carry the TOKEN either. A token in a URL path is written
          # to every access log, proxy log and browser history between the invitee and
          # the console — for a credential whose whole security model is "holding the
          # link IS the invitation", that is the one place it cannot go. It travels in
          # the POST body.
          - { ref: AuthService.AcceptOrgInvite, method: POST, path: "/accept",                 feature: org_invite }
  mcp:
    # MCP tools the plugin exposes. WhoAmI lets an MCP client confirm the
    # principal behind its API token. Deliberately a NARROW surface —
    # sign-in / token-management are browser flows, not MCP tools. A
    # project gates the MCP surface (api_token roles) to control which of
    # its OWN tools an MCP token can reach.
    tools:
      - { ref: AuthService.WhoAmI, feature: authenticate_turnkey }
  admin:
    # Auto-wire the admin surface's auth to this plugin's canonical
    # methods, so an admin author who activates auth writes NO auth
    # block (the admin surface is auth-required — gateway-parser
    # enforced). login_method issues a token from credentials; user_lookup
    # (AuthenticateAdmin) resolves a token → user_id + permission_ids + scopes
    # the admin gateway enforces ACL against. Injection qualifies these
    # plugin-relative refs with the activation's registered name.
    auth:
      login_method: AuthService.SignIn
      # AuthenticateAdmin, not Authenticate: the admin spans every
      # organization, so only realm-wide roles may count there.
      user_lookup: AuthService.AuthenticateAdmin
      feature: authenticate_turnkey
    # Admin overview widgets the plugin contributes — custom-JS slots
    # (`overview:widget:<slot>`). The project supplies the slot's JS; the
    # plugin just reserves the slot. Gated rbac (relevant only when role
    # management is on). Disable via the activation's presets.admin.enabled.
    widgets:
      - { slot: auth_user_count, size: SMALL, feature: rbac }
    # Includable role-management admin page — the "manage roles for free"
    # snippet. Injected onto the project's admin surface (refs qualified
    # with the activation name). Roles are primarily declarative (seeded
    # from `(w17.acl_roles)`), so the page is view + edit-copy + delete:
    # list catalogue, inspect a role, retitle it, retire a stray one. The
    # page's `delete` retires (DeleteRole stamps deleted_at, revokes the
    # role's grants and frees its name); nothing is deleted. The privilege
    # flags stay declarative — see the page's fields below.
    # Gated rbac. A hand-written page named "Roles" overrides this.
    pages:
      - name: Roles
        model: Role
        feature: rbac
        list:
          source: AuthQuery.ListRoles
          columns: [name, all_permissions, assign_first_user, assign_default, created_at]
          detail_link_column: name
        detail:
          read: AuthQuery.GetRole
          update: AuthMutation.UpdateRole
          delete: AuthMutation.DeleteRole
          # name + description are what UpdateRole writes, so they are
          # the editable set. The privilege flags stay readonly: they
          # are seeded declaratively from `(w17.acl_roles)` and are not
          # in the update request at all — editing a WILDCARD grant
          # from a form would be a privilege-escalation path.
          fields: [name, description]
          readonly_fields: [all_permissions, assign_first_user, assign_default, created_at]
      # Turnkey Django-style Users management. Gated user_admin — opt in
      # on the realm whose admin manages end-user accounts (typically a
      # staff/admin realm). List + editable detail (email only — never
      # surfaces password_hash); the disable / enable bulk actions flip
      # User.disabled_at (SignIn rejects a disabled account). The `delete`
      # ERASES: the GDPR request, the row stays, pseudonymised
      # (AuthService.EraseAccount). Nothing in the auth tables is deleted.
      # A hand-written page named "Users" overrides this.
      - name: Users
        model: User
        feature: user_admin
        list:
          source: AuthQuery.ListUsers
          columns: [email, disabled_at, erased_at, created_at]
          detail_link_column: email
        detail:
          read: AuthQuery.GetUser
          # Through the Service method, not AuthMutation.UpdateUser: it
          # refuses the erased-account domain, which the mutation cannot.
          update: AuthService.UpdateAccount
          # `delete` ERASES the account (GDPR, AuthService.EraseAccount): the
          # row stays, pseudonymised, disabled, every token and device
          # revoked, the operator recorded. Nothing is deleted. The slot keeps
          # its name from when it hard-deleted the row, so an existing admin
          # keeps its button, the model's delete permission still gates it
          # and its tests (admin.Users.Delete → user_id) still hold.
          delete: AuthService.EraseAccount
          # email is the only column UpdateUser writes. disabled_at
          # stays readonly — it belongs to the disable/enable actions
          # below, erased_at to the erasure — and password_hash is
          # never surfaced at all.
          fields: [email]
          readonly_fields: [id, disabled_at, erased_at, created_at]
        actions:
          - name: disable
            source: AuthMutation.DisableUsers
            label: "Disable"
            confirm: "Disable the selected accounts? They won't be able to sign in until re-enabled."
            target: both
          - name: enable
            source: AuthMutation.EnableUsers
            label: "Enable"
            confirm: "Re-enable the selected accounts? An erased account stays disabled."
            target: both
      # Machine accounts. Gated service_account.
      #
      # Its own page rather than a `kind` column on Users: `User.kind` is
      # feature-gated and a preset page's `columns` cannot be gated per entry,
      # so a build without the feature would fail codegen on a field it does
      # not have. A page CAN be gated. Same auth_user table either way — this
      # is a view over it, not a second directory.
      #
      # No `update`: a bot has nothing an operator edits. Its address is its
      # identity and its rights live in its roles, which are managed where
      # every other grant is.
      #
      # No `create` either. A machine account is created WITH its membership
      # and role in one transaction (AuthService.CreateBot), because a bot
      # without them authenticates with nothing; the only storage create is
      # the bare CreateBotUser, and under tenant_scope it also needs a tenant
      # an admin form has no way to supply.
      #
      # Erasing one revokes it: every token of the account is revoked, and the
      # record stays.
      #
      # ⚠️ The page named `AuthQuery.ListBots` and `AuthMutation.CreateBot`,
      # neither of which exists, and its name was not CamelCase — it had never
      # been generated by anything. `w17ctl plugin dev` now publishes the admin
      # preset, which is what found it.
      - name: ServiceAccounts
        model: User
        feature: service_account
        list:
          source: AuthQuery.ListBotAccounts
          columns: [email, disabled_at, created_at]
          detail_link_column: email
        detail:
          read: AuthQuery.GetUser
          # `delete` ERASES the machine account (AuthService.EraseAccount):
          # disabled for good, every token revoked, the record kept. Nothing
          # is deleted; the slot keeps its name, permission and tests.
          delete: AuthService.EraseAccount
          readonly_fields: [id, disabled_at, erased_at, created_at]
        actions:
          - name: disable
            source: AuthMutation.DisableUsers
            label: "Disable"
            confirm: "Disable the selected machine accounts? Their tokens stop working until re-enabled."
            target: both
          - name: enable
            source: AuthMutation.EnableUsers
            label: "Enable"
            confirm: "Re-enable the selected machine accounts?"
            target: both
      # Turnkey Organizations management. Gated org_membership. The
      # tables are plugin-owned, so a project can't author these pages
      # itself. View + edit + delete (list catalogue, inspect an org,
      # edit its slug/name/kind, retire one — the `delete` stamps
      # deleted_at, ends its memberships and org grants and frees its slug;
      # nothing is deleted); creation stays the project's provisioning flow
      # (CreateOrganization off the OrganizationCreated hook). A
      # hand-written page named
      # "Organizations" overrides this.
      - name: Organizations
        model: Organization
        feature: org_membership
        list:
          source: AuthQuery.ListOrganizations
          columns: [slug, name, kind, created_at]
          detail_link_column: slug
        detail:
          read: AuthQuery.GetOrganization
          update: AuthMutation.UpdateOrganization
          # Through the Service method: it also closes the organization's
          # pending invitations (org_invite), which the mutation cannot name.
          delete: AuthService.RemoveOrganization
          fields: [slug, name, kind]
          readonly_fields: [id, created_at]
      # Turnkey OrgMemberships management (the user↔org link table).
      # Gated org_membership. View + edit the member's role + delete
      # (remove one membership: removed_at, its org grants revoked; the rows
      # stay). The list projects the member's email +
      # the org's name (ListOrgMemberships → OrgMembershipAdminRow, ADMIN-
      # FK) so an operator sees "alice@x.com · Acme", never two raw UUIDs:
      # `member` (email) is the clickable handle onto this membership's own
      # detail; `organization` renders the org name and links to the
      # Organizations page. A hand-written page named "OrgMemberships"
      # overrides this.
      - name: OrgMemberships
        model: OrgMembership
        feature: org_membership
        list:
          source: AuthQuery.ListOrgMemberships
          # organization → the Organizations page, rendering the org name
          # (org_name) row-locally instead of the UUID. Organizations is
          # gated by the same org_membership feature, so it always co-
          # exists with this page (no dangling ref).
          columns:
            - member
            - { name: organization, ref: { title: org_name, page: Organizations } }
            - role
            - created_at
          detail_link_column: member
        detail:
          read: AuthQuery.GetOrgMembership
          # Through the Service method, not AuthMutation.UpdateOrgMembership:
          # a role change is a GRANT, and only the Service method holds it to
          # the role ceiling — the caller must hold every permission the new
          # role carries. Bound to the mutation, anyone who could edit a
          # membership could hand anyone (themselves included) any org role.
          update: AuthService.UpdateOrgMembershipRole
          # Removal revokes the member's org grants, so it is held to the
          # ceiling too: the caller must cover every role the member holds
          # there. The mutation alone would let anyone who may delete a
          # membership strip an org-admin.
          delete: AuthService.RemoveOrgMembership
          # Only the role is editable — moving a membership to another
          # user/org is a removal + re-add (unique (user_id, org_id,
          # ended_key)). `org` is the REST path's organization
          # (org_members_rest), listed because the method takes it, and
          # every field an admin update takes is one a direct call sets.
          # It selects nothing: a value other than the caller's org is
          # refused (refuseOtherOrg), and the membership must be in the
          # caller's active org whatever it says (checkMayManageMembership),
          # so it can neither move a membership nor reach another org's.
          fields: [role, org]
          readonly_fields: [id, user_id, org_id, created_at]
      # Turnkey session/token review. Gated user_admin. Lists every
      # UserToken across users (NEVER the secret token value) so an
      # operator can review + revoke sessions. Revoked tokens stay listed,
      # with when and why; the `delete` REVOKES one session (force-logout)
      # through AuthService.RevokeSession, which records the operator — a
      # token already revoked is left as it is. Nothing in the auth tables is
      # deleted. The list projects the session owner's email
      # (ListUserTokens → UserTokenAdminRow, ADMIN-FK) so an operator sees
      # "alice@x.com", never a bare user UUID: `owner` (email) is the
      # clickable handle onto this session's own detail; `user` links to
      # the owner's Users page. A hand-written page named "Sessions"
      # overrides this.
      - name: Sessions
        model: UserToken
        feature: user_admin
        list:
          source: AuthQuery.ListUserTokens
          # user → the Users page. NO `title`: a title here would just
          # repeat the email `owner` already shows, so the ref falls back
          # to the column header — the cell reads "User" and its tooltip
          # carries the user id. Users is gated by the same user_admin
          # feature, so it always co-exists with this page (no dangling ref).
          #
          # device_label: the device's label (its browser), as plain text. NOT
          # a ref onto the Devices page: that page is the opt-in admin_devices
          # feature, a column ref cannot be gated, and a ref to a page the
          # activation does not have fails the admin build.
          columns:
            - owner
            - { name: user, ref: { page: Users } }
            - device_label
            - thumbprint
            - public_computer
            - created_at
            - expires_at
            - revoked_at
            - revoke_reason
          detail_link_column: owner
        detail:
          # UserTokenAdminDetail: the token, its device and — for a CLI
          # session — the device of the browser session that approved it.
          read: AuthQuery.GetUserToken
          # `delete` REVOKES the session (AuthService.RevokeSession): the
          # operator is recorded as revoked_by, the row stays and is listed as
          # revoked. Nothing is deleted; the slot keeps its name, permission
          # and tests (admin.Sessions.Delete → token_id).
          delete: AuthService.RevokeSession
          readonly_fields: [id, user_id, created_at, expires_at, revoked_at, revoked_by, revoke_reason, public_computer, device_id, device_label, device_thumbprint, approved_by_device_id, approver_label, approver_thumbprint]
      # Sign-in history. Gated admin_sign_ins (opt-in, requires user_admin):
      # a page added to user_admin would break every adopter whose admin
      # declares nav groups. A hand-written page named "SignIns" overrides this.
      - name: SignIns
        model: SignInEvent
        feature: admin_sign_ins
        list:
          source: AuthQuery.ListSignInEvents
          columns:
            - account
            - { name: user, ref: { page: Users } }
            - method
            - outcome
            - ip
            - thumbprint
            - created_at
          detail_link_column: account
        detail:
          read: AuthQuery.GetSignInEvent
          readonly_fields: [id, created_at, user_id, address, method, outcome, device_id, thumbprint, ip, user_agent, public_computer]
      # Turnkey device review. Gated admin_devices (opt-in, requires
      # user_admin, for the same nav reason as SignIns). Every Device row of every
      # account — revoked and legacy (keyless, recorded before device binding)
      # ones included: nothing in the auth tables is deleted. A legacy row
      # shows no thumbprint and can never be used. The list projects the
      # account's address (ListAllDevices → DeviceAdminRow, ADMIN-FK) and
      # whether the device's trust still stands (`trusted`: trusted_at later
      # than the account's device-trust revocation, and not revoked). The
      # `revoke` action revokes the selection for good through
      # AuthService.RevokeDevices: the device, every token bound to it and every
      # CLI session it approved, the operator recorded; a revoked device is left as it is. No `delete`. A
      # hand-written page named "Devices" overrides this.
      - name: Devices
        model: Device
        feature: admin_devices
        list:
          source: AuthQuery.ListAllDevices
          columns:
            - owner
            - { name: user, ref: { page: Users } }
            - label
            - thumbprint
            - ip
            - created_at
            - last_seen_at
            - trusted
            - revoked_at
          detail_link_column: owner
        detail:
          read: AuthQuery.GetDevice
          readonly_fields: [id, owner, user, label, thumbprint, ip, created_at, last_seen_at, trusted_at, trust_revoked_at, trusted, revoked_at]
        actions:
          - name: revoke
            source: AuthService.RevokeDevices
            label: "Revoke"
            confirm: "Revoke the selected devices? Every session on them, and every CLI session they approved, ends at once, and their keys can never sign in to these accounts again."
            target: both

# Dev-only sandbox services this plugin brings for testing / manual
# trial. Each is wired into the consuming project's tool-owned
# `compose.w17.yaml` and NOWHERE else (no prod stage, never the
# hand-written compose.yaml). w17 emits the compose entry; the
# orchestrator launches it.
sandboxes:
  # A deterministic fake OIDC provider for live-proving the `oauth`
  # feature without a real Google/GitHub. Gated `oauth`: only wired
  # when the activation enables that feature. Reachable in-network at
  # `http://fakeidp:8080` — seed an OAuthProvider row whose
  # authorize/token/userinfo URLs point there. The image is built
  # locally from a clone of github.com/wandering-compiler/plugins:
  #   docker build -t ${W17_WORKSPACE:-w17}-w17-fakeidp:dev auth/sandboxes/fakeidp
  # The tag is WORKSPACE-PREFIXED: an image tag is build output, and a fixed
  # one on a shared docker daemon is a name every checkout overwrites.
  - name: fakeidp
    description: "Fake OIDC provider (dev-only) for the oauth feature"
    feature: oauth
    image: ${W17_WORKSPACE:-w17}-w17-fakeidp:dev
    # Documented default values the sandbox launches with — the e2e
    # test + the seeded OAuthProvider row are written against these.
    # Override in the hand-written compose.yaml / .env, never here.
    env:
      - name: PORT
        value: "8080"
        description: "Container listen port; siblings dial http://fakeidp:8080."
      - name: ISSUER
        value: "http://fakeidp:8080"
        description: "iss claim + discovery base (the in-network name)."
      - name: SUBJECT
        value: "fake-sub-001"
        description: "Canned external subject (the `sub` claim) every login carries."
      - name: EMAIL
        value: "oauth-user@example.com"
        description: "Canned email; the OAuth user is found-or-created under it."

