name: agent
version: 0.1.0-rc.5
requires_w17: ">=1.5"

# v3 — explicit Go module anchor. Staging text-rewrites every
# occurrence of this prefix in handlers/ + lib/ source to the
# per-activation pb path.
go_module: github.com/wandering-compiler/plugins/agent

description: "LLM calls for a w17 project: one model call in, text + token usage out. An ENGINE — no conversation, no history, no user; your own service holds those and calls this. Complete returns the whole answer, CompleteStream sends it as it is written, and RunAgent runs a tool-calling loop whose tools your project serves."
license: "Apache-2.0"

# Plugin-author env-var contract. Each entry becomes one PascalCase
# field on the codegen-emitted EnvConfig the plugin's RegisterPlugin
# receives; the consumer sets `<DOMAIN>_AGENT_<NAME>` in their deploy
# manifest.
env:
  - name: provider
    type: string
    default: azure_openai
    description: "Backend driver. v1 supports only 'azure_openai'; any other value fails at boot rather than at the first call, so a misconfigured bundle never serves a request it cannot answer."

  - name: endpoint
    type: string
    description: "Provider base URL, e.g. https://<resource>.openai.azure.com. Required — there is no default, because a wrong default is a call to somebody else's deployment. Must be https: every request carries the api key, so a plain-http endpoint is refused at boot unless its host is loopback."

  - name: api_key
    type: string
    secret: true
    description: "Provider API key. secret:true → arrives as a secret.String whose value is revealed once, at wiring time."

  - name: api_version
    type: string
    default: "2025-04-01-preview"
    description: "Azure OpenAI API version. The Responses API is version-gated, so this is a knob rather than a constant."

  - name: default_model
    type: string
    description: "Model used when a request leaves ModelSpec.id empty. Optional: leave it unset to require every caller to name their own model."

  - name: max_output_tokens
    type: int
    default: 4096
    description: "Ceiling applied when a request leaves ModelSpec.max_tokens at zero. A cap the caller cannot exceed is NOT this value — this is a default, and a deployment that needs a hard limit enforces it on its own side."

  - name: allowed_scripts
    type: string
    default: "Latin"
    description: "The Unicode scripts the final text may contain with the `final_text_scripts` filter on, comma-separated (Go's script names: Latin, Cyrillic, Greek, Arabic, Hebrew, Han, Hiragana, Katakana, Hangul, Thai, …; case-insensitive). Common and Inherited — digits, punctuation, emoji, combining marks — are always allowed. An unknown name, or none, refuses the boot. A call can name its own (FinalText.allowed_scripts)."

  - name: request_timeout_seconds
    type: int
    default: 120
    description: "Per-call deadline. A reasoning model with a large budget can legitimately think for a minute; the default is generous on purpose, and the caller's own context deadline still wins when it is shorter."

features:
  - name: final_text_scripts
    description: >-
      Cleans the final text of every answer (CompleteResp.text, Finished.text;
      never the deltas) of letters in a Unicode script the activation does not
      allow — `allowed_scripts`, default Latin. A model leaks tokens: a Thai word
      glued to the end of a Czech sentence. The run is removed with its
      combining marks, and a space the removal leaves doubled or before
      punctuation goes with it; the rest of the text is untouched. A call can
      allow other scripts or opt out (FinalText). Off by default.
    default: false
  - name: final_text_invisible
    description: >-
      Cleans the final text of every answer of characters a reader cannot see:
      control characters other than tab and line breaks, U+FFFD, zero-width
      spaces, the byte-order mark and the bidi embedding, override and isolate
      controls. The zero-width joiner and non-joiner (emoji, several scripts)
      and the left/right-to-left marks stay. A call can opt out (FinalText.raw).
      Off by default.
    default: false
  - name: usage_persistence
    description: >-
      Records what every model call spent — tokens by kind, wall time, outcome —
      against an opaque scope the caller names, with a price list and per-scope
      limits. OFF by default: switching it on adds seven tables — Scope,
      Model, Usage, ModelPrice, ScopeLimit, Label, UsageLabel — which is a
      migration, and a plugin should not schedule one for a project that did not
      ask. On, the caller cannot forget to record spend, because recording stops
      being the caller's job.
    default: false
    go_files:
      # Staged only when the feature is on. Its tables' pb types do not exist
      # otherwise, so this file could not compile — which is exactly why the
      # decision cannot be a runtime `if` and has to be made at staging time.
      - handlers/usage_enabled.go
      - handlers/limits_enabled.go
