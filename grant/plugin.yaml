name: grant
version: 0.1.0
requires_w17: ">=1.18"
requires_sdk: v0.1.0-rc.73

# Explicit Go module anchor — staging text-rewrites this prefix in
# src/handlers/ + src/lib/ + plugin.go to the per-activation pb path.
# Also the package base `w17ctl plugin gen` generates src/gen under.
go_module: github.com/wandering-compiler/plugins/grant

description: "What an organization shows before it is trusted, approved by the platform: its envelope (name, logos, verified host, links) on the consent, invitation and sign-in pages. An organization proposes, the backoffice approves; only an approved envelope is ever read. The hosts an organization is presented on are the auth plugin's (org_hosts)."
license: "MIT"

# The caller and the active organization are the auth plugin's
# (Authenticate's envelope and its org_id scope).
requires_plugins:
  - name: auth

presets:
  rpc:
    # What this plugin offers OTHER domains' services, through the domain's
    # private surface ((w17.private_api)): the approved envelope of an
    # organization — its name, logos, verified host — so a product's sign-in
    # on a co-brand host shows whose it is. Served only when that surface
    # confirms the method.
    methods:
      - { ref: GrantService.GetOrgEnvelope }
  rest:
    groups:
      # The organization's own envelope — the org is IN THE PATH, resolved
      # and checked against membership by the auth plugin as for its own
      # organization routes.
      - prefix: "/grant/orgs/{org}"
        description: "An organization's envelope — propose a version, read every version."
        org_from_path: org
        endpoints:
          - { ref: GrantService.ProposeEnvelope, method: POST, path: /envelopes }
          - { ref: GrantService.GetMyEnvelopes,  method: GET,  path: /envelopes }
      # The backoffice's: realm-wide, refused from inside an organization.
      - prefix: /grant/admin
        description: "Envelope decisions — the backoffice's."
        endpoints:
          - { ref: GrantService.ListEnvelopeProposals, method: GET,    path: /envelopes }
          - { ref: GrantService.ApproveEnvelope,       method: POST,   path: "/envelopes/{id}/approve" }
          - { ref: GrantService.RejectEnvelope,        method: POST,   path: "/envelopes/{id}/reject" }
      # Anyone's: the approved envelope. Read before sign-in (an invitation,
      # a co-brand sign-in page), so unauthenticated; not limited per address,
      # because every such page reads it and the envelope is public by intent.
      - prefix: /grant/envelopes
        description: "The approved envelope of an organization — public."
        endpoints:
          - { ref: GrantService.GetOrgEnvelope,  method: GET, path: "/orgs/{org_id}", exclude_auth: true, public_limit: none }

# GENERATED by `make plugin-msgids-sync` — do not hand-edit.
#
# The user-facing sentences this plugin's Go puts on the wire, mirrored here
# so codegen can put them in a project's .po. The SOURCE is the Go constant
# marked `//w17:msgid`; `make check-plugin-msgids` fails when the two drift.
msgids:
  - "A link must be a full https:// address."
  - "Another version of this organization's presentation was approved at the same time. Reload and decide again."
  - "Give the organization's name."
  - "Only the platform's backoffice can do this, and not from inside an organization."
  - "The accent colour must be written as #rrggbb."
  - "The host must be a lower-case domain name, such as example.com."
  - "Your organization already has a proposal waiting for a decision. Propose again once it has been decided."
