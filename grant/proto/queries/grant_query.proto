syntax = "proto3";

// Grant plugin — storage reads.

package w17.contrib.grant;

import "google/protobuf/timestamp.proto";
import "@self/types/models.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

// EnvelopeRow — one envelope version as read.
message EnvelopeRow {
  string id               = 1;
  string org_id           = 2;
  string status           = 3;
  string display_name     = 4;
  string logo_light_url   = 5;
  string logo_dark_url    = 6;
  string verified_host    = 7;
  string website_url      = 8;
  string support_url      = 9;
  string privacy_url      = 10;
  string terms_url        = 11;
  string accent_color     = 12;
  string default_language = 13;
  string operated_by      = 14;
  google.protobuf.Timestamp proposed_at = 15;
  google.protobuf.Timestamp decided_at = 16 [(w17.field) = { null: true }];
  string decision_note    = 17;
}

message GetApprovedEnvelopeReq {
  string org_id = 1 [(w17.field) = { type: UUID }];
}

message ListOrgEnvelopesReq {
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message ListPendingEnvelopesReq {}
message GetPendingEnvelopeReq {
  string org_id = 1 [(w17.field) = { type: UUID }];
}
message EnvelopeRowsResp {
  repeated EnvelopeRow envelopes = 1;
}

service GrantQuery {
  // GetApprovedEnvelope — the organization's approved envelope; NotFound
  // when it has none.
  rpc GetApprovedEnvelope(GetApprovedEnvelopeReq) returns (EnvelopeRow) {
    option (w17.db.method) = {
      ops: { name: "main", dql: "SELECT e.id AS id, e.org_id AS org_id, e.status AS status, e.display_name AS display_name, e.logo_light_url AS logo_light_url, e.logo_dark_url AS logo_dark_url, e.verified_host AS verified_host, e.website_url AS website_url, e.support_url AS support_url, e.privacy_url AS privacy_url, e.terms_url AS terms_url, e.accent_color AS accent_color, e.default_language AS default_language, e.operated_by AS operated_by, e.proposed_at AS proposed_at, e.decided_at AS decided_at, e.decision_note AS decision_note FROM @module.Envelope e WHERE e.org_id = :org_id AND e.status = 'approved'" }
    };
  }

  // GetPendingEnvelope — the organization's proposal waiting for the
  // backoffice; NotFound when none waits. One at a time (ProposeEnvelope).
  rpc GetPendingEnvelope(GetPendingEnvelopeReq) returns (EnvelopeRow) {
    option (w17.db.method) = {
      ops: { name: "main", dql: "SELECT e.id AS id, e.org_id AS org_id, e.status AS status, e.display_name AS display_name, e.logo_light_url AS logo_light_url, e.logo_dark_url AS logo_dark_url, e.verified_host AS verified_host, e.website_url AS website_url, e.support_url AS support_url, e.privacy_url AS privacy_url, e.terms_url AS terms_url, e.accent_color AS accent_color, e.default_language AS default_language, e.operated_by AS operated_by, e.proposed_at AS proposed_at, e.decided_at AS decided_at, e.decision_note AS decision_note FROM @module.Envelope e WHERE e.org_id = :org_id AND e.status = 'proposed' ORDER BY e.proposed_at ASC, e.id ASC LIMIT 1" }
    };
  }

  // ListOrgEnvelopes — the organization's newest 100 versions, newest first.
  rpc ListOrgEnvelopes(ListOrgEnvelopesReq) returns (EnvelopeRowsResp) {
    option (w17.db.method) = {
      ops: { name: "main", dql: "SELECT e.id AS id, e.org_id AS org_id, e.status AS status, e.display_name AS display_name, e.logo_light_url AS logo_light_url, e.logo_dark_url AS logo_dark_url, e.verified_host AS verified_host, e.website_url AS website_url, e.support_url AS support_url, e.privacy_url AS privacy_url, e.terms_url AS terms_url, e.accent_color AS accent_color, e.default_language AS default_language, e.operated_by AS operated_by, e.proposed_at AS proposed_at, e.decided_at AS decided_at, e.decision_note AS decision_note FROM @module.Envelope e WHERE e.org_id = :org_id ORDER BY e.proposed_at DESC, e.id DESC LIMIT 100" }
    };
  }

  // ListPendingEnvelopes — the oldest 200 proposals waiting for the
  // backoffice, oldest first; deciding them brings the next ones up.
  rpc ListPendingEnvelopes(ListPendingEnvelopesReq) returns (EnvelopeRowsResp) {
    option (w17.db.method) = {
      ops: { name: "main", dql: "SELECT e.id AS id, e.org_id AS org_id, e.status AS status, e.display_name AS display_name, e.logo_light_url AS logo_light_url, e.logo_dark_url AS logo_dark_url, e.verified_host AS verified_host, e.website_url AS website_url, e.support_url AS support_url, e.privacy_url AS privacy_url, e.terms_url AS terms_url, e.accent_color AS accent_color, e.default_language AS default_language, e.operated_by AS operated_by, e.proposed_at AS proposed_at, e.decided_at AS decided_at, e.decision_note AS decision_note FROM @module.Envelope e WHERE e.status = 'proposed' ORDER BY e.proposed_at ASC, e.id ASC LIMIT 200" }
    };
  }

}
