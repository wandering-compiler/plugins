syntax = "proto3";

// Grant plugin — models.
//
// Envelope: how an organization presents itself on the pages a person sees
// before trusting it — the OAuth consent page, an invitation, sign-in on a
// co-brand host. The organization proposes one; the backoffice approves or
// rejects it; only an approved one is ever shown, so nobody can wear another
// organization's name and logo. Every version stays: a newer approval
// supersedes the previous one, nothing is deleted.
//
// HostBinding: a co-brand host bound to the organization it presents
// (`acme.finance.example.com` → acme). The backoffice binds and unbinds;
// unbinding ends the row.
//
// Wire identity (`w17.contrib.grant`) derives from the manifest `name`;
// tables emit as `<registered_as>_<message_lower>`.

package w17.contrib.grant;

import "google/protobuf/timestamp.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

// Envelope — one version of an organization's presentation. status is
// `proposed`, `approved`, `rejected` or `superseded`; at most one is
// `approved` per organization at a time (ApproveEnvelope supersedes the
// previous one in the same transaction).
message Envelope {
  option (w17.db.table) = {
    indexes: [
      { fields: [{ name: "org_id" }, { name: "status" }] },
      // One approved version per organization: two approvals racing for one
      // organization cannot both commit.
      { unique: true, fields: [{ name: "org_id" }], where: "status = 'approved'" }
    ]
  };

  string id               = 1  [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string org_id           = 2  [(w17.field) = { type: UUID }];
  string status           = 3  [(w17.field) = { type: CHAR, max_len: 16 }];
  string display_name     = 4  [(w17.field) = { type: CHAR, max_len: 200 }];
  string logo_light_url   = 5  [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string logo_dark_url    = 6  [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string verified_host    = 7  [(w17.field) = { type: CHAR, max_len: 255, blank: true, default_string: "" }];
  string website_url      = 8  [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string support_url      = 9  [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string privacy_url      = 10 [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string terms_url        = 11 [(w17.field) = { type: CHAR, max_len: 2000, blank: true, default_string: "" }];
  string accent_color     = 12 [(w17.field) = { type: CHAR, max_len: 16, blank: true, default_string: "" }];
  string default_language = 13 [(w17.field) = { type: CHAR, max_len: 16, blank: true, default_string: "" }];
  string operated_by      = 14 [(w17.field) = { type: CHAR, max_len: 200, blank: true, default_string: "" }];
  string proposed_by      = 15 [(w17.field) = { type: UUID, null: true }];
  google.protobuf.Timestamp proposed_at = 16 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  string decided_by       = 17 [(w17.field) = { type: UUID, null: true }];
  google.protobuf.Timestamp decided_at  = 18 [(w17.field) = { type: DATETIME, null: true }];
  string decision_note    = 19 [(w17.field) = { type: TEXT, max_len: 2000, blank: true, default_string: "" }];
}

// HostBinding — a co-brand host and the organization it presents. One live
// binding per host.
message HostBinding {
  option (w17.db.table) = {
    indexes: [ { unique: true, fields: [{ name: "host" }, { name: "ended_key" }] } ]
  };

  string id         = 1 [(w17.field) = { type: UUID, pk: true, default_auto: UUID_V7 }];
  string host       = 2 [(w17.field) = { type: CHAR, max_len: 255 }];
  string org_id     = 3 [(w17.field) = { type: UUID }, (w17.db.column) = { index: true }];
  string created_by = 4 [(w17.field) = { type: UUID, null: true }];
  google.protobuf.Timestamp created_at = 5 [(w17.field) = { type: DATETIME, default_auto: NOW, immutable: true }];
  google.protobuf.Timestamp ended_at   = 6 [(w17.field) = { type: DATETIME, null: true }];
  string ended_by   = 7 [(w17.field) = { type: UUID, null: true }];
  // ended_key — '' while live, the row's own id once unbound.
  string ended_key  = 8 [(w17.field) = { type: CHAR, max_len: 36, blank: true, default_string: "" }];
}
