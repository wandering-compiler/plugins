name: cluster
version: 0.2.0-rc.10
requires_w17: ">=1.8"

# v3 — explicit Go module anchor. Staging text-rewrites every
# occurrence of this prefix in handlers/ + lib/ source to the
# per-activation pb path.
go_module: github.com/wandering-compiler/plugins/cluster

description: "Control plane for a pool of relays that place work on workers the control plane never talks to. Registers relays, picks one, and hands the caller an address and a single-use ticket. Deliberately knows NOTHING about what the workers do — activate it as `codegen` for compile workers, as `browser` for headless-browser workers, and the same plugin serves both."
license: "Apache-2.0"

# The plugin is activated ONCE PER POOL, under the name of that pool:
#
#   plugins: [ { source_name: "cluster", registered_as: "codegen" } ]
#
# `registered_as` drives the table prefix, the Go alias and the pb path, so a
# project needing two pools activates it twice with two names and gets
# `codegen.Relay` beside `browser.Relay`. That is why there is no `type` column
# anywhere in this plugin: the pool IS the activation. A type enum would have
# had to enumerate every consumer's workload in the plugin's own proto, which
# no consumer could extend without forking it.

env:
  - name: client_cert_path
    type: string
    description: "PEM client certificate this control plane presents to a relay. The control plane DIALS OUT to relays, so this is its identity — one identity for every relay, held on the machine, never in the database. Required: with no client identity a relay has nothing to authorise and must refuse."

  - name: client_key_path
    type: string
    description: "Path to the private key for client_cert_path. NOT marked secret: the path is not the secret, the file is. Putting a filename behind secret.String would protect nothing and cost every reader a Reveal(); protect the file with its permissions and keep the key itself out of the environment entirely."

  - name: dial_timeout_seconds
    type: int
    default: 5
    description: "Deadline for opening the management connection to one relay. Short on purpose: an unreachable relay must be skipped quickly enough that scheduling falls through to a healthy one rather than making the caller wait."

  - name: ticket_ttl_seconds
    type: int
    default: 30
    description: "How long a granted ticket stays claimable. This is TIME-TO-CLAIM, not time-to-run: it bounds the gap between 'the slot is yours' and the worker connection appearing, after which the relay takes the slot back. A job that has started is held by its connection and is not affected by this value."

# No features yet.
#
# A `task_ledger` feature was declared here and REMOVED before it shipped: its
# only gated source was a file that did not exist and there was no ledger table
# behind it, so enabling it would have staged nothing and silently done
# nothing. An advertised feature that is absent is worse than a missing one,
# because a project can switch it on and believe it.
# Dev-only sandbox: a relay next to the generated stack, so the pool can be
# tried by hand without standing one up somewhere. Wired into the project's
# tool-owned `compose.w17.yaml` and NOWHERE else — w17 never ships a sandbox to
# production, which is right here: in production a relay lives OUTSIDE the
# project's network, because it is what the workers reach.
#
# Build the image from the plugin directory (it shares the plugin's Go module,
# so the relay and the handlers carry one copy of the contract):
#   docker build -f cluster/sandboxes/relay/Dockerfile \
#     -t ${W17_WORKSPACE:-w17}-w17-cluster-relay:dev cluster   (from a clone of github.com/wandering-compiler/plugins)
#
# ⚠️ IT MINTS ITS OWN IDENTITY AND PRINTS THE FINGERPRINT AT STARTUP. Read it
# out of the container log and paste it into the relay's row — the same
# comparison an operator makes in production, deliberately not shortcut here.
# There is no dev-insecure mode and there will not be one: the convenient flag
# that skips verification is the flag that escapes into production.
#
# ⚠️ The identity — and the relay's worker CA beside it — lives in the
# container's own filesystem, because a sandbox cannot declare a volume (the
# sandbox manifest carries name/image/ports/env and nothing else). So it
# survives a `restart` and is LOST on `down`/`up`: a recreated relay comes back
# with a different fingerprint that has to be pasted again, and a different CA,
# so every worker enrolled with it needs a new registration code. Tolerable for
# a dev sandbox; the fix is volume support in the sandbox spec, not a fixed key
# baked into the image. In production both come from secrets (--cert/--key,
# --ca-cert/--ca-key).
sandboxes:
  # Single token, no hyphen: the name is a compose service, a DNS label and a
  # Go identifier all at once, and the manifest refuses anything else.
  - name: clusterrelay
    description: "Dev-only relay for the cluster pool — mints its own identity and prints the fingerprint to paste into its registry row."
    image: ${W17_WORKSPACE:-w17}-w17-cluster-relay:dev
    # FOUR listeners, and the split is not arbitrary — each has a different
    # audience and therefore a different rule about who may complete a
    # handshake:
    #   13444  management  — the control plane, whose certificate is PINNED
    #   13446  attach      — workers: enrolment (no certificate yet), renewal
    #                        and attach; a certificate, if presented, must be
    #                        the relay CA's
    #   13445  tunnels     — workers again, the raw sockets that carry work;
    #                        a relay-CA certificate is REQUIRED
    #   9000   callers     — TLS, and the caller pins this relay using the
    #                        fingerprint its grant carried
    ports:
      - "13444"
      - "13445"
      - "13446"
      - "9000"
    env:
      - name: RELAY_IDENTITY_DIR
        value: "/var/lib/relay"
        description: "Where the relay mints and keeps its key pair and the CA it issues worker certificates from. Container-local: survives a restart, not a recreate — and a new CA means every worker re-enrols."
      - name: RELAY_PROXY_ADDRESS
        value: "clusterrelay:9000"
        description: "What callers are told to send work to. The in-network name, because that is how a sibling service reaches this sandbox — a relay is TOLD its externally visible address, it cannot discover one."
      - name: RELAY_CAPACITY
        value: "0"
        description: "OPTIONAL ceiling on tasks running here at once; 0 (the default) means the relay carries whatever its attached workers add up to. A worker reports its own slot count when it attaches, because how many sessions a machine holds is a property of the machine. Set this only to cap a relay BELOW its fleet — a shared box, or a bandwidth limit. It used to be the capacity itself, which meant a relay with no workers cheerfully granted two tickets and both callers failed at the proxy."
      - name: RELAY_CONTROL_PLANE_FINGERPRINT
        value: ""
        description: "REQUIRED, and deliberately empty: the relay refuses to start without it. Set it to the fingerprint of the client certificate this project's control plane presents (OPS_CLUSTER_CLIENT_CERT_PATH). Nothing else may manage this relay."

# Production: what this plugin runs beside a project, and the ceremony a deploy
# performs for it. The building blocks only — the PROJECT decides whether an
# environment runs them and which image the worker is (a codegen worker is not a
# browser worker), in its lock's infra block. One machine, one internal
# network, and the encryption stays: every certificate is minted here, at
# deploy time, so nobody handles one by hand.
deploy:
  services:
    - name: relay
      description: "The pool's relay: places work on the workers attached to it."
      build: cmd/relay
      user: 10001
      state: /var/lib/relay
      ports:
        # The CALLER port is the only one published: a caller is told this
        # address in its grant and pins the relay by the fingerprint beside it.
        # Management, attach and tunnels stay on the internal network, where
        # the control plane and the workers of this machine reach them.
        - { name: callers, port: 9000, publish: 50052 }
        - { name: management, port: 13444 }
        - { name: tunnels, port: 13445 }
        - { name: attach, port: 13446 }
      env:
        - { name: RELAY_CERT, value: "{state}/relay.crt" }
        - { name: RELAY_KEY, value: "{state}/relay.key" }
        - { name: RELAY_CA_CERT, value: "{state}/ca.crt" }
        - { name: RELAY_CA_KEY, value: "{state}/ca.key" }
        - name: RELAY_PROXY_ADDRESS
          value: "{public:relay.callers}"
          description: "What callers are told to dial, as the internet reaches it."
        - name: RELAY_CONTROL_PLANE_FINGERPRINT
          value: "{fingerprint:control-plane}"
          description: "Only the control plane's client certificate may manage this relay."
    - name: worker
      description: "One worker of the pool, enrolled with this relay at deploy time. Its image is the project's: whatever the pool runs."
      adopter: true
      state: /var/lib/worker
      env:
        - { name: "W17_{ACTIVATION}_RELAY_ATTACH", value: "{address:relay.attach}" }
        - { name: "W17_{ACTIVATION}_RELAY_TUNNEL", value: "{address:relay.tunnels}" }
        - { name: "W17_{ACTIVATION}_RELAY_FINGERPRINT", value: "{fingerprint:relay}" }
        - { name: "W17_{ACTIVATION}_IDENTITY_DIR", value: "{state}" }
        - { name: "W17_{ACTIVATION}_WORKER_NAME", value: "{env}-worker-1" }
  identities:
    # Every command keeps an identity that exists: a new key would break every
    # pin on the old one, and a new CA every worker enrolled with it.
    - name: relay
      into: relay
      image_of: relay
      args: [mint, --dir, "{dir}", --name, relay, --ca]
      fingerprint: true
    - name: control-plane
      into: host
      image_of: relay
      args: [mint, --dir, "{dir}", --name, control-plane]
      fingerprint: true
      host_env:
        client_cert_path: "{dir}/control-plane.crt"
        client_key_path: "{dir}/control-plane.key"
    # Enrolled without a registration code: the deploy holds the relay's CA,
    # so it issues the worker's certificate directly.
    - name: worker
      into: worker
      image_of: relay
      reads: [relay]
      args: [issue-worker, --ca-cert, "{dir:relay}/ca.crt", --ca-key, "{dir:relay}/ca.key", --out, "{dir}", --name, "{env}-worker-1"]
  # The relay of this machine is the row `local`, addressed by its internal
  # name and pinned to the certificate minted above; a re-mint follows it.
  register:
    sql: >-
      INSERT INTO {activation}_relay (name, url, cert_fingerprint, enabled)
      VALUES ('local', '{address:relay.management}', '{fingerprint:relay}', true)
      ON CONFLICT (name) DO UPDATE SET url = EXCLUDED.url, cert_fingerprint = EXCLUDED.cert_fingerprint

presets:
  admin:
    # The backoffice this plugin exists to make possible. Both pages are
    # contributed to the project's admin surface with refs qualified by the
    # activation name, so a project that activates `cluster` as `codegen` gets
    # them without writing an admin.proto entry.
    pages:
      - name: Relays
        model: Relay
        list:
          source: RelayQuery.ListRelays
          columns: [name, url, enabled, last_seen_at, last_error]
          detail_link_column: name
        detail:
          read: RelayQuery.GetRelay
          # Registering a relay that runs on ANOTHER machine: the operator
          # pastes its management address and the fingerprint `relay mint`
          # printed. A relay deployed beside the control plane is registered
          # by its deployment instead and never needs this form.
          create: RelayMutation.CreateRelay
          update: RelayMutation.UpdateRelay
          delete: RelayMutation.DeleteRelay
          # cert_fingerprint IS editable — rotating a relay's certificate is an
          # edit here, and that edit is the audit trail a CA-issued swap would
          # not leave.
          fields: [name, url, cert_fingerprint, enabled]
          # Observed state, written by the control plane as a side effect of
          # trying to use the relay. Read-only because it is a CACHE: an
          # operator editing last_seen_at would be editing a measurement.
          readonly_fields: [id, created_at, last_seen_at, last_error]
        actions:
          # A new worker joins THIS relay with a one-time code the relay
          # mints and holds in memory (single use, short-lived). The worker
          # generates its own key and trades the code for a certificate the
          # relay's CA signs, so nothing secret passes through here but the
          # code — shown once, and replaced by pressing again if lost.
          #
          # The code is the action's RESPONSE, so the action declares a
          # SECRET result: the admin shows these fields once, with a copy
          # button, keeps them nowhere, and the handler answers no-store.
          # The fingerprint and expiry ride along because the worker tool
          # needs the fingerprint too, and the operator needs to know how
          # long the code lasts.
          - name: issue_registration_code
            source: ClusterService.IssueRegistrationCode
            label: "Issue a registration code"
            target: detail
            result:
              fields: [code, relay_fingerprint, expires_at, relay]
              secret: true
          # Maintenance without an outage: the relay takes no new work, sends
          # its queue elsewhere, and lets everything running finish. One-way —
          # a drained relay comes back by being restarted.
          - name: drain
            source: ClusterService.DrainRelay
            label: "Drain"
            confirm: "Drain the selected relays? They take no new work until they are restarted; running work finishes."
            target: both

      - name: Workers
        model: Worker
        list:
          source: WorkerQuery.ListWorkers
          # cert_fingerprint sits in the LIST, beside the name, because a ban
          # is taken against the fingerprint: name and device_id are claims
          # any worker can make, and banning by name bans whoever chose it.
          columns: [name, cert_fingerprint, state, relay_id, first_seen_at, decided_by]
          detail_link_column: name
        detail:
          read: WorkerQuery.GetWorker
          # No update and no delete. Nothing here is an operator's to edit:
          # the fingerprint is evidence, the claims are the machine's, and the
          # state belongs to the actions below. Deleting a row would only mean
          # the worker is recorded again on the next sweep — and would drop its
          # ban.
          readonly_fields: [id, cert_fingerprint, name, device_id, state, relay_id, first_seen_at, decided_at, decided_by]
        actions:
          # The sweep, as a PAGE action: there is nothing to select — the
          # workers it records do not exist as rows until it has run. It is
          # NOT how a worker gets in (its registration code did that) nor how a
          # ban reaches a relay (every call to a relay carries the ban set); it
          # lists the fleet so an operator can ban from it.
          - name: check
            source: ClusterService.CheckWorkers
            label: "Check for workers"
            target: page
          - name: ban
            source: ClusterService.BanWorkers
            label: "Ban"
            confirm: "Ban the selected workers? Their relays refuse them on the next placement, drop their connections, and refuse to renew their certificates."
            target: both
          - name: unban
            source: ClusterService.UnbanWorkers
            label: "Unban"
            confirm: "Lift the ban on the selected workers? A worker whose certificate expired meanwhile still needs a new registration code."
            target: both
