syntax = "proto3";

// The protocol between a RELAY and a WORKER.
//
// # Why this is not one of the plugin's protos
//
// Everything under `plugins/cluster/proto/` is materialised into the consuming
// project: tables, services the project serves, clients it calls. This
// conversation has neither end there. A relay is a separate process and a
// worker is somebody's laptop; the project never speaks it and would have to
// generate — and register — a facade for a service it has nothing to do with.
//
// So it is a plain gRPC contract with no w17 annotations, generated by buf into
// this package and compiled into the relay and the worker SDK, which are the
// only two programs that know it exists.
package w17.cluster.worker;

option go_package = "github.com/wandering-compiler/plugins/cluster/workerpb;workerpb";

// WorkerAttach is how a machine offers itself to a relay.
service WorkerAttach {
  // Attach announces a worker and stays open for as long as it is available.
  //
  // The connection IS the availability: a relay knows a worker is there
  // because the stream is open, and knows it is gone when the stream ends.
  // Nothing polls, nothing heartbeats, and there is no liveness table to
  // reconcile — the same reason a scheduling stream holds a queue place.
  //
  // The worker's IDENTITY is not in this conversation. It is the SPKI
  // fingerprint of the certificate it presented in the TLS handshake — a
  // certificate this relay's CA issued at enrolment — which is the one thing
  // here it proved rather than asserted; everything a worker SENDS is a
  // claim, carried for an operator to read and for scheduling to use.
  //
  // A worker without a valid certificate cannot open this stream at all (the
  // handshake refuses it); a BANNED one gets PermissionDenied with the
  // cluster.w17 reason WORKER_BANNED. Every other worker is admitted at once:
  // the certificate IS the admission, and a ban is the exception.
  //
  // BIDIRECTIONAL since 2026-09-25, and the reason is the difference between
  // "connected" and "able to work". A one-shot announcement could only be
  // contradicted by hanging up, so the sole way to stop receiving work was to
  // drop the tunnel — which kills the sessions still running on it. A browser
  // pool cannot be deployed that way, and a hung engine on a healthy socket
  // kept being handed work with nothing able to say otherwise (a consumer,
  // 2026-09-25).
  rpc Attach(stream WorkerMessage) returns (stream AttachEvent);
}

// WorkerEnrollment is how a worker gets — and keeps — its certificate.
//
// Served on the same listener as WorkerAttach, which asks for a client
// certificate but does not require one: Enroll is the call a worker makes
// BEFORE it has one. Every other call there checks for itself.
//
// The worker generates its key and never sends it; it sends a certificate
// request. What it receives is short-lived (weeks), so a worker renews before
// expiry — and a certificate that is banned, or already expired, cannot renew:
// that worker needs a new registration code.
service WorkerEnrollment {
  // Enroll trades a one-time registration code for a certificate.
  //
  // The code was minted by THIS relay at an operator's request and is held in
  // its memory: single use, short-lived, void after a relay restart. It is
  // spent only by a request that is otherwise valid, so a malformed request
  // does not cost the operator a code.
  //
  // Refusals carry cluster.w17 reasons: REGISTRATION_CODE_INVALID (unknown,
  // spent or expired), WORKER_BANNED (the request's key is banned),
  // WORKER_CLAIM_INVALID (a name or device id the control plane's registry
  // cannot record: over 128 characters, or a control character — the code is
  // not spent). Attach never refuses a claim: a worker that holds a
  // certificate is recorded under its claims shortened and sanitized.
  rpc Enroll(EnrollReq) returns (Certificate);

  // Renew reissues the caller's certificate for the SAME key, so the worker's
  // identity — the SPKI fingerprint — survives it.
  //
  // Authenticated by the certificate presented in the handshake, which must
  // be one this relay's CA issued and that has not expired, and whose key is
  // the one in the request. Refusals: CERTIFICATE_NOT_RENEWABLE, WORKER_BANNED.
  rpc Renew(RenewReq) returns (Certificate);
}

message EnrollReq {
  // The code, as the operator was shown it.
  string registration_code = 1;
  // DER PKCS#10 request for the worker's own key.
  bytes csr = 2;
  // Claims, as on AttachReq: for an operator to read, authorising nothing.
  string name = 3;
  string device_id = 4;
}

message RenewReq {
  // DER PKCS#10 request for the key of the certificate presented.
  bytes csr = 1;
}

message Certificate {
  // PEM certificate for the requested key.
  bytes certificate_pem = 1;
  // PEM of the relay's CA, for a worker that wants to keep it. The worker
  // still pins the relay's own certificate; the CA is what the RELAY trusts.
  bytes ca_pem = 2;
}

// WorkerMessage is anything a worker says about itself.
//
// The FIRST message on the stream must be `announce`; a stream that opens with
// anything else is refused, because until the worker has said what it is there
// is nothing for a status to be about. Every later message is a `status`.
message WorkerMessage {
  oneof msg {
    AttachReq announce = 1;
    WorkerStatus status = 2;
  }
}

message AttachReq {
  // What the machine calls itself, for the admin's worker list. A claim.
  string name = 1;
  // The machine's own stable id across restarts and renames. Also a claim,
  // and never used to authorise anything.
  string device_id = 2;

  // How many tasks this machine can run at once.
  //
  // A PROPERTY OF THE MACHINE, which is why it is reported here and not
  // configured on the relay. One headless browser holds a handful of sessions
  // before it degrades, and that number belongs to the box, not to whichever
  // relay it attached to. Expressing it as a relay-wide total only works until
  // one worker leaves, at which point the survivors silently inherit its share
  // and start thrashing.
  //
  // A relay's capacity is the SUM over the workers that are attached and
  // ready. Zero — or unset — means the machine takes no work, which is also
  // what makes an empty relay refuse to hand out slots instead of granting
  // against nobody.
  uint32 slots = 3;

  // Whether this worker wants work RIGHT NOW, as of the moment it announced.
  //
  // Carried in the announcement rather than left to the first status message,
  // because otherwise there is a window: the relay would credit a worker as
  // ready the instant it announced, and a machine that came up already
  // draining or already wedged would be handed work for as long as it took its
  // first status to arrive.
  WorkerStatus.Readiness readiness = 4;
}

// WorkerStatus is a worker changing its mind about taking work.
//
// Sent whenever the answer changes and at no fixed interval: this is not a
// heartbeat, and nothing on the relay expires it. Liveness is still the
// stream being open. This says whether a LIVE worker wants work.
message WorkerStatus {
  enum Readiness {
    // Take work. The zero value, so an empty status means ready.
    READY = 0;

    // Deliberate: finish what is running, start nothing new.
    //
    // This is the deploy case. Without it the only way to stop new work was
    // to drop the tunnel, which also killed the sessions already on it, so a
    // worker could not be replaced without losing work in flight.
    DRAINING = 1;

    // The worker's own check failed — the engine is wedged, disk is full,
    // whatever it measures about itself.
    //
    // Separate from DRAINING even though both mean "no new work", because an
    // operator reading a screen needs to tell a planned drain from a fault.
    // Collapsing them would make a broken fleet look like a deploy.
    UNHEALTHY = 2;
  }

  Readiness readiness = 1;

  // Free text for an operator. Never parsed.
  string note = 2;
}

// One state change. Exactly one field is set.
//
// There used to be a `waiting` event for a machine connected and not yet
// approved by an operator. Enrolment by registration code replaced approval:
// a worker that can complete the handshake was already let in by whoever gave
// it the code, so there is nothing left to wait for. Field 1 stays reserved so
// no later field reuses its number.
message AttachEvent {
  reserved 1;
  reserved "waiting";
  oneof event {
    Admitted admitted = 2;
  }
}

// Admitted — attached, and may be given work.
message Admitted {
  // The slot count the relay recorded for this worker.
  //
  // Echoed back rather than assumed, so a worker can see what it is actually
  // credited with instead of inferring it from how much work arrives.
  //
  // This field was declared once before and REMOVED before it shipped, because
  // nothing on the attach path collected a capacity and it would have reported
  // zero to every worker — a contract nobody fills is worse than a missing
  // one. AttachReq.slots is that collection, so the field is real now.
  uint32 slots = 1;
}

// Work delivery is NOT a service here, and it will not become one.
//
// A worker is behind whatever NAT its provider gives it, so the relay cannot
// dial it: work travels down a second connection the WORKER opens to the
// relay's tunnel listener, on which the worker then SERVES gRPC and the relay
// speaks as a client (lib/tunnel, workerconn.ServeTunnel, relayserver's
// ServeTunnels). What runs over it is whatever this pool's workers speak — the
// relay forwards raw frames to it without descriptors — so there is nothing
// for this file to declare: a contract here would be the one place the relay
// knew what the work is, which is what lets one relay binary carry compile
// jobs and page fetches alike.
