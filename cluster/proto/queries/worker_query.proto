syntax = "proto3";

// Cluster plugin — reading the worker registry.

package w17.contrib.cluster;

import "@self/types/models.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

message ListWorkersReq {
  // Narrow to one state. UNSPECIFIED means every state, which is what the
  // registry page wants — an operator auditing who has access needs the
  // denied ones in front of them too, not filtered out of history.
  WorkerState state = 1;
}

message ListWorkersResp {
  repeated Worker workers = 1;
}

// The fingerprints in one state for one relay. Parameterised by state rather
// than split into two RPCs because an exchange needs BOTH sets and they differ
// only in a number — two near-identical statements would be two places for the
// same filter to go wrong.
message FingerprintsByStateReq {
  string relay_id = 1 [(w17.field) = { type: UUID }];
  WorkerState state = 2;
}

message FingerprintsByStateResp {
  repeated string fingerprints = 1;
}

message GetWorkerReq {
  string id = 1 [(w17.field) = { type: UUID }];
}

message CountWorkersByStateReq {
  WorkerState state = 1;
}

message CountWorkersByStateResp {
  int64 total = 1;
}

service WorkerQuery {
  rpc ListWorkers(ListWorkersReq) returns (ListWorkersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT w.id AS id, "
          "       w.cert_fingerprint AS cert_fingerprint, "
          "       w.name AS name, "
          "       w.device_id AS device_id, "
          "       w.state AS state, "
          "       w.relay_id AS relay_id, "
          "       w.first_seen_at AS first_seen_at, "
          "       w.decided_at AS decided_at, "
          "       w.decided_by AS decided_by "
          "FROM @module.Worker w "
          "WHERE (:state = 0 OR w.state = :state) "
          "ORDER BY w.first_seen_at DESC"
      }
    };
  }

  rpc GetWorker(GetWorkerReq) returns (Worker) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT w.id AS id, "
          "       w.cert_fingerprint AS cert_fingerprint, "
          "       w.name AS name, "
          "       w.device_id AS device_id, "
          "       w.state AS state, "
          "       w.relay_id AS relay_id, "
          "       w.first_seen_at AS first_seen_at, "
          "       w.decided_at AS decided_at, "
          "       w.decided_by AS decided_by "
          "FROM @module.Worker w "
          "WHERE w.id = :id"
      }
    };
  }

  rpc FingerprintsByState(FingerprintsByStateReq) returns (FingerprintsByStateResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(w.cert_fingerprint) AS fingerprints "
          "FROM @module.Worker w "
          "WHERE w.relay_id = :relay_id AND w.state = :state"
      }
    };
  }

  // Counted in the database rather than by listing and measuring: the sweep
  // calls this twice around itself, and a list would grow with the registry
  // while the answer it wants is one number.
  rpc CountWorkersByState(CountWorkersByStateReq) returns (CountWorkersByStateResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT COUNT(w.id) AS total "
          "FROM @module.Worker w "
          "WHERE w.state = :state"
      }
    };
  }
}
