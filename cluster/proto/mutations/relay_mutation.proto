syntax = "proto3";

// Cluster plugin — writing the relay registry.
//
// Two audiences write here and they must not be confused. An OPERATOR writes
// configuration — url, fingerprint, enabled — through the backoffice. The
// CONTROL PLANE writes observation — last_seen_at, last_error — as a side
// effect of trying to use a relay. They are separate RPCs so that a rendered
// admin form can never overwrite an observation with a stale value it happened
// to have loaded, and so an observation can never silently re-enable a relay an
// operator turned off.

package w17.contrib.cluster;

import "google/protobuf/timestamp.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

message CreateRelayReq {
  string name = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string url = 2 [(w17.field) = {
    type: CHAR, max_len: 255,
    pattern: "^([A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?\\.?|\\[[0-9A-Fa-f:.]+\\]):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    validation_messages: [{ type: VALIDATION_REGEX, message: "a relay address is host:port with no scheme, e.g. relay.example.com:13444 or clusterrelay:13444" }]
  }];
  string cert_fingerprint = 3 [(w17.field) = {
    type: CHAR, max_len: 64,
    pattern: "^[0-9a-f]{64}$"
    validation_messages: [{ type: VALIDATION_REGEX, message: "a certificate fingerprint is 64 lowercase hex characters, as relay mint prints it" }]
  }];
}

// The new row's id, and nothing else.
//
// Returning the whole Relay would mean projecting every column back through a
// RETURNING clause, which invites the caller to treat a write's echo as the
// current state — it is not, the moment anything else writes. The id is what
// the caller cannot compute for itself; the rest is a GetRelay away.
message CreateRelayResp {
  string id = 1 [(w17.field) = { type: UUID }];
}

message UpdateRelayReq {
  string id = 1 [(w17.field) = { type: UUID }];
  string name = 2 [(w17.field) = { type: SLUG, max_len: 64 }];
  string url = 3 [(w17.field) = {
    type: CHAR, max_len: 255,
    pattern: "^([A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?\\.?|\\[[0-9A-Fa-f:.]+\\]):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    validation_messages: [{ type: VALIDATION_REGEX, message: "a relay address is host:port with no scheme, e.g. relay.example.com:13444 or clusterrelay:13444" }]
  }];
  string cert_fingerprint = 4 [(w17.field) = {
    type: CHAR, max_len: 64,
    pattern: "^[0-9a-f]{64}$"
    validation_messages: [{ type: VALIDATION_REGEX, message: "a certificate fingerprint is 64 lowercase hex characters, as relay mint prints it" }]
  }];
  bool enabled = 5;
}

// Empty, for the reason CreateRelayResp returns only an id: the caller already
// holds the id it just wrote to, and an echoed row would be a snapshot dressed
// up as state.
message UpdateRelayResp {}

// DeleteRelay ENDS the relay; the name is kept so callers and the admin
// page's delete stay as they were. See RelayMutation.DeleteRelay.
message DeleteRelayReq {
  string id = 1 [(w17.field) = { type: UUID }];
}

message DeleteRelayResp {}

// Two RPCs rather than one with a `reached` flag, because the two writes touch
// DIFFERENT columns and only one of them may move last_seen_at. A single
// statement would have to express that conditionally, and "when did this last
// work" is exactly the field a failure must not overwrite.
message RecordRelayReachedReq {
  string id = 1 [(w17.field) = { type: UUID }];
  google.protobuf.Timestamp at = 2;
}

message RecordRelayReachedResp {}

message RecordRelayFailedReq {
  string id = 1 [(w17.field) = { type: UUID }];
  string error = 2 [(w17.field) = { type: TEXT }];
}

message RecordRelayFailedResp {}

service RelayMutation {
  // A plain INSERT whose `name` must be free among LIVE relays (the unique
  // index over name and ended_key): registering a relay that was ended is a
  // new row with a new id, and the ended row stays as it was (see Relay).
  rpc CreateRelay(CreateRelayReq) returns (CreateRelayResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "INSERT INTO @module.Relay "
          "SET name = :name, url = :url, cert_fingerprint = :cert_fingerprint "
          "RETURNING id AS id"
      }
    };
  }

  // Edits a LIVE relay only. An ended relay is history and is not rewritten:
  // the write matches no row, as it matched none for a deleted one before.
  rpc UpdateRelay(UpdateRelayReq) returns (UpdateRelayResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Relay "
          "SET name = :name, url = :url, "
          "    cert_fingerprint = :cert_fingerprint, enabled = :enabled "
          "WHERE id = :id AND removed_at IS NULL"
      }
    };
  }

  // ENDS the relay; it deletes nothing. Rows are never deleted from this
  // plugin's tables: an ended relay stays as the record of what was
  // registered, and the Worker rows that name it keep resolving (their
  // relay_id is a foreign key). It stamps removed_at and moves ended_key to
  // the row's own id, which frees the name for a new registration (see Relay).
  //
  // From then on the relay is gone for every reader — ListRelays, GetRelay,
  // and through them placement, reservations (a handle naming it polls as
  // expired), registration codes, drain, the ban delivery and the worker
  // sweep — and RecordWorker refuses to file a worker under it. `enabled =
  // false` is still how a relay is taken out of service and KEPT; ending it
  // means the operator is done with it.
  //
  // Idempotent: ending an ended (or unknown) relay changes nothing and is not
  // an error, as deleting a missing row was not. The name is DeleteRelay, not
  // EndRelay, so every caller and the admin page's delete keep working.
  rpc DeleteRelay(DeleteRelayReq) returns (DeleteRelayResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Relay "
          "SET removed_at = NOW(), ended_key = id "
          "WHERE id = :id AND removed_at IS NULL"
      }
    };
  }

  // Both observations below write a LIVE relay only: an ended relay keeps the
  // observed state it ended with, and a write queued before the end lands on
  // nothing.
  //
  // Success also CLEARS last_error: a relay that answers is not still failing,
  // and a stale error beside a fresh last_seen_at sends an operator hunting a
  // problem that fixed itself.
  rpc RecordRelayReached(RecordRelayReachedReq) returns (RecordRelayReachedResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Relay "
          "SET last_seen_at = :at, last_error = '' "
          "WHERE id = :id AND removed_at IS NULL"
      }
    };
  }

  rpc RecordRelayFailed(RecordRelayFailedReq) returns (RecordRelayFailedResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Relay "
          "SET last_error = :error "
          "WHERE id = :id AND removed_at IS NULL"
      }
    };
  }
}
