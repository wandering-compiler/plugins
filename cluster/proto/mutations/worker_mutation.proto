syntax = "proto3";

// Cluster plugin — recording workers, and banning them.

package w17.contrib.cluster;

import "google/protobuf/timestamp.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

// RecordWorker is called once per worker a relay reports.
//
// IDEMPOTENT by fingerprint, because "check for workers" is a button a human
// presses and a relay keeps reporting every worker it has met. A second press
// must not create a second row, and — more importantly — must not reset a
// decision: a BANNED worker that is still reported would otherwise be quietly
// returned to ENROLLED on the next sweep, and a ban would mean nothing.
//
// The DECISION is idempotent; the LOCATION is not. `relay_id` is refreshed on
// every report, because it records where the worker is attached RIGHT NOW. (DO
// NOTHING would freeze the location along with the decision: a worker moved to
// another relay would keep being placed at the first one, with no admin action
// to clear it.)
//
// Nothing else is refreshed: `state`, `decided_at` and `decided_by` are the
// decision, and `name` / `device_id` are claims a banned machine must not be
// able to keep re-labelling.
//
// Filed only under a LIVE relay. A relay ended (DeleteRelay) between the
// sweep's relay list and this write is refused — InvalidArgument,
// RELAY_ENDED, on `relay_id` — so the sweep counts it as that relay failing,
// not as each of its workers being bad (see WorkerMutation.RecordWorker).
message RecordWorkerReq {
  string cert_fingerprint = 1 [(w17.field) = { type: CHAR, max_len: 64 }];
  string name = 2 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string device_id = 3 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  string relay_id = 4 [(w17.field) = { type: UUID }];
}

message RecordWorkerResp {}

// Bulk by construction. The admin's ban/unban arrive as a SELECTION — an
// operator responding to an incident acts on several machines at once — and a
// single-id method would have the page issue N calls and report N outcomes for
// one human action.
message DecideWorkersReq {
  repeated string ids = 1;
  // Whoever took the decision, in the consumer's own terms. Recorded because
  // the first question during an incident is who let the machine back in.
  string decided_by = 2 [(w17.field) = { type: CHAR, max_len: 128 }];
  google.protobuf.Timestamp at = 3;
}

message DecideWorkersResp {}

service WorkerMutation {
  // Two ops. The first locks the LIVE relay row for the rest of the
  // transaction — a no-op write rather than a read, so a DeleteRelay of the
  // same relay (which writes that row) runs either wholly before it, and this
  // finds no live relay and refuses, or wholly after it, and ends a relay
  // whose worker was recorded while it was live. A read would let the end
  // land between the check and the upsert and file a worker under an ended
  // relay. The foreign key on Worker.relay_id cannot say this: the ended
  // row still exists.
  rpc RecordWorker(RecordWorkerReq) returns (RecordWorkerResp) {
    option (w17.db.method) = {
      ops: {
        name: "relay"
        dql:
          "UPDATE @module.Relay SET id = id "
          "WHERE id = :relay_id AND removed_at IS NULL "
          "RETURNING id AS id"
        on_empty: {
          code:       ON_EMPTY_INVALID_ARGUMENT
          error_code: "RELAY_ENDED"
          field:      "relay_id"
          message:    "No live relay {relay_id} is registered: it was never registered, or it was deleted. Its workers are not recorded."
        }
      }
      ops: {
        name: "main"
        dql:
          "UPSERT INTO @module.Worker "
          "SET cert_fingerprint = :cert_fingerprint, name = :name, "
          "    device_id = :device_id, relay_id = :relay.id, state = 1 "
          "ON CONFLICT (cert_fingerprint) DO UPDATE SET relay_id = :relay.id"
      }
    };
  }

  // Ban and Unban are separate methods rather than one taking a target state.
  // They are opposite decisions, they will diverge (a ban will want a reason),
  // and an ACL that must distinguish them needs two names to gate.
  //
  // A ban takes effect at once: the handler delivers the new set to every
  // registered relay, enabled or not, and every later call to a relay carries
  // it too. A relay checks the ban on every piece of work, without waiting
  // for the machine to reconnect.
  rpc BanWorkers(DecideWorkersReq) returns (DecideWorkersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Worker "
          "SET state = 2, decided_at = :at, decided_by = :decided_by "
          "WHERE id IN (:ids)"
      }
    };
  }

  rpc UnbanWorkers(DecideWorkersReq) returns (DecideWorkersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "UPDATE @module.Worker "
          "SET state = 1, decided_at = :at, decided_by = :decided_by "
          "WHERE id IN (:ids)"
      }
    };
  }
}
