name: payment
version: 0.1.0-rc.5
requires_w17: ">=1.11"

# Explicit Go module anchor — staging text-rewrites this prefix in
# src/handlers/ + src/lib/ + plugin.go to the per-activation pb path.
# Also the package base w17ctl plugin gen-pb regenerates src/gen/pb under.
go_module: github.com/wandering-compiler/plugins/payment

description: "Provider-agnostic billing — customers, payments, refunds + webhook ingestion. Stripe driver. Slice 1 (core)."
license: "Apache-2.0"

channels:
  - events

# Plugin-author env-var contract. Becomes typed fields on the codegen
# EnvConfig; the bundle reads <DOMAIN>_<PLUGIN>_<NAME> at boot.
env:
  - name: payment_provider
    type: string
    default: stripe
    description: "Backend driver selecting the provider. v1 supports only 'stripe'; any other value fails loud at RegisterPlugin so a misconfigured bundle never boots half-wired."
  - name: provider_api_key
    type: string
    secret: true
    description: "Provider API secret key (Stripe sk_live_… / sk_test_…). secret:true → secret.String on EnvConfig: redacted in logs/traces, resolved via the env→age→plain chain, never baked as a default."
  - name: webhook_signing_secret
    type: string
    secret: true
    description: "Webhook signing secret (Stripe whsec_…) used to verify the Stripe-Signature HMAC on inbound webhooks. secret.String. Required when stripe_webhooks is active."
  - name: provider_api_base
    type: string
    description: "Root URL of a Stripe-compatible API to call instead of https://api.stripe.com — for a local stack or a test suite run against the stripemock sandbox (http://stripemock:12111). Empty = the real Stripe API. Never set in production."
  - name: default_currency
    type: string
    default: usd
    description: "ISO-4217 currency (lowercase) applied to a CreatePayment that omits one."

features:
  # Baseline (Customer / Payment / Refund + CreateCustomer / CreatePayment
  # / GetPayment) carries no feature tag — always emitted, like the auth
  # plugin's User/UserToken core. Only the webhook surface is toggleable.
  - name: stripe_webhooks
    default: true
    description: "Inbound Stripe webhook ingestion: the ProcessedWebhookEvent idempotency ledger, the MarkWebhookProcessed mutation, and PaymentService.IngestStripe (signature verify + dedup + dispatch to MarkPaymentSucceeded/MarkPaymentFailed). Disable for projects that reconcile payment status another way (polling, manual)."
    go_files:
      - handlers/webhook_stripe.go
  - name: prepaid
    default: false
    # No `requires`: the wallet itself (GrantCredit / SpendCredit / the
    # balance) is local. Only TopUpCredit needs the webhook, which grants the
    # credit when the provider confirms the payment, so it refuses to charge
    # when stripe_webhooks is off.
    description: "Prepaid credit wallet: append-only CreditLedger + materialized CreditBalance (non-negative CHECK), the atomic ApplyCredit mutation (ledger insert + balance increment in one tx), and PaymentService.GrantCredit/SpendCredit/GetBalance + the CreditApplied event. Off by default — opt in for credit/wallet billing."
    go_files:
      - handlers/prepaid.go
  - name: usage
    default: false
    description: "Metered / pay-as-you-go: append-only UsageRecord + materialized UsageMeter (per principal/meter/period), the atomic RecordUsage mutation (record insert + meter increment in one tx), and PaymentService.ReportUsage/GetUsage + the UsageRecorded event. Off by default — opt in for usage-based billing."
    go_files:
      - handlers/usage.go
  - name: subscriptions
    default: false
    # A subscription's status is reconciled only from the provider's
    # webhook; without the webhook surface it never leaves its first state.
    requires: [stripe_webhooks]
    description: "Recurring plans: locally-authoritative Plan catalogue (pushed to the provider) + Subscription records (provider-authoritative lifecycle). PaymentService.CreatePlan/Subscribe/GetSubscription, MarkSubscriptionStatus (webhook reconciliation), SubscriptionStarted/SubscriptionStatusChanged events. Off by default — opt in for subscription billing."
    go_files:
      - handlers/subscriptions.go

# Gateway preset surfaces injected at activation time. Refs are
# plugin-relative (<Service>.<Method>); codegen rewrites them to the
# activation's registered_as.
presets:
  rest:
    # The webhook needs the Stripe-Signature header threaded into backend
    # gRPC metadata (the handler reads it from there to verify the HMAC).
    # Gated stripe_webhooks.
    forward_headers:
      - { name: Stripe-Signature, feature: stripe_webhooks }
    groups:
      # Customer + payment management. Authenticated, and every endpoint
      # acts on the signed-in caller's own billing only: the writes refuse
      # another user_id, and the reads are PaymentService.GetMy* wrappers
      # that answer with the caller's rows and nothing else.
      - prefix: /billing
        description: "Billing surface served turnkey by the payment plugin — customer setup + charges."
        endpoints:
          - { ref: PaymentService.CreateCustomer, method: POST, path: /customers }
          - { ref: PaymentService.CreatePayment,  method: POST, path: /payments }
          - { ref: PaymentService.GetMyPayment, method: GET, path: "/payments/{id}" }
          # Read own prepaid balance (gated prepaid). Grant/Spend stay
          # internal (privileged + signed-amount + insufficient-balance).
          - { ref: PaymentService.GetMyCreditBalance, method: GET, path: /credit/balance, feature: prepaid }
          # Read own metered usage for a (meter, period). ReportUsage
          # stays internal (validation + idempotency).
          - { ref: PaymentService.GetMyUsageMeter, method: GET, path: "/usage/{meter}/{period}", feature: usage }
          # Subscribe acts for the caller; CreatePlan is NOT exposed
          # (privileged/admin).
          - { ref: PaymentService.Subscribe,    method: POST, path: /subscriptions,        feature: subscriptions }
          - { ref: PaymentService.GetMySubscription, method: GET, path: "/subscriptions/{id}", feature: subscriptions }
      # Inbound provider webhooks. Unauthenticated (the provider has no
      # bearer); authenticity is the HMAC signature, not a token. The
      # verbatim body lands in IngestStripeReq.raw_payload via
      # raw_body_field. Gated stripe_webhooks.
      - prefix: /webhooks
        description: "Inbound payment-provider webhooks (signature-verified, unauthenticated)."
        endpoints:
          # failed_only: a delivery answered 2xx (handled, duplicate, or an
          # event type that needs nothing) spends no per-address budget, so a
          # burst of them from the provider is not answered 429. Any failed
          # answer does spend it: a bad signature, but also a genuine delivery
          # whose processing failed (no local row yet, a storage error).
          - { ref: PaymentService.IngestStripe, method: POST, path: /stripe, exclude_auth: true, public_limit: failed_only, raw_body_field: raw_payload, feature: stripe_webhooks }

sandboxes:
  # Stripe's own API mock, for running a project against the payment plugin
  # without a Stripe account: it answers every Stripe endpoint with the shape
  # the real API returns (canned values, no state). Point the plugin at it
  # with provider_api_base = http://stripemock:12111 and any sk_test_… key.
  # Webhooks are not part of it — they are tested with a signed payload.
  - name: stripemock
    description: "Stripe API mock (dev-only)"
    image: stripe/stripe-mock:v0.205.0
