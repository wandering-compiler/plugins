syntax = "proto3";

// Payment plugin — PaymentQuery read primitives.
//
// Pure SELECTs via (w17.db.method).query; codegen emits the handler
// bodies generically. The business PaymentService handler composes
// them with the backend driver (e.g. resolve the local Customer before
// a charge; look up a Payment by provider id during webhook
// reconciliation).

package w17.contrib.payment;

import "google/protobuf/timestamp.proto";
import "@self/types/models.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

message GetCustomerByUserIdReq  { string user_id = 1 [(w17.field) = { type: UUID }]; }
message GetCustomerByUserIdResp { Customer customer = 1; }

// GetCustomerByProviderId — provider_customer_id is UNIQUE (models.proto).
message GetCustomerByProviderIdReq  { string provider_customer_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }]; }
message GetCustomerByProviderIdResp { Customer customer = 1; }

message GetPaymentReq  { string id = 1 [(w17.field) = { type: UUID }]; }
message GetPaymentResp { Payment payment = 1; }

// GetPaymentByProviderId — provider_payment_id is UNIQUE (models.proto),
// so this is a single-row read.
message GetPaymentByProviderIdReq  { string provider_payment_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }]; }
message GetPaymentByProviderIdResp { Payment payment = 1; }

// GetPaymentByIdempotencyKey — idempotency_key is UNIQUE (models.proto).
message GetPaymentByIdempotencyKeyReq  { string idempotency_key = 1 [(w17.field) = { type: CHAR, max_len: 255 }]; }
message GetPaymentByIdempotencyKeyResp { Payment payment = 1; }

// GetRefundByProviderId — provider_refund_id is UNIQUE (models.proto).
message GetRefundByProviderIdReq  { string provider_refund_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }]; }
message GetRefundByProviderIdResp { Refund refund = 1; }

message GetRefundByIdempotencyKeyReq  { string idempotency_key = 1 [(w17.field) = { type: CHAR, max_len: 255 }]; }
message GetRefundByIdempotencyKeyResp { Refund refund = 1; }

message SumRefundsForPaymentReq  { string payment_id = 1 [(w17.field) = { type: UUID }]; }
message SumRefundsForPaymentResp { string total = 1 [(w17.field) = { type: DECIMAL, precision: 20, scale: 4 }]; }

// LockPaymentForRefund — the payment's amount and status, read under a row
// lock (see the rpc).
message LockPaymentForRefundReq { string id = 1 [(w17.field) = { type: UUID }]; }
message LockPaymentForRefundResp {
  string id                = 1;
  string amount            = 2;
  int32  status            = 3;
  string received_amount   = 4;
  string received_currency = 5;
}

// GetDisputeByProviderId — provider_dispute_id is UNIQUE. Gated
// stripe_webhooks.
message GetDisputeByProviderIdReq {
  option (w17.contrib.plugin_feature) = "stripe_webhooks";
  string provider_dispute_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetDisputeByProviderIdResp {
  option (w17.contrib.plugin_feature) = "stripe_webhooks";
  Dispute dispute = 1;
}

// SumLostDisputesForPayment — the amount of a payment's LOST disputes. Gated
// stripe_webhooks.
message SumLostDisputesForPaymentReq {
  option (w17.contrib.plugin_feature) = "stripe_webhooks";
  string payment_id = 1 [(w17.field) = { type: UUID }];
}
message SumLostDisputesForPaymentResp {
  option (w17.contrib.plugin_feature) = "stripe_webhooks";
  string total = 1 [(w17.field) = { type: DECIMAL, precision: 20, scale: 4 }];
}

// SumTopupCredit — the credit a top-up holds in the ledger: the sum of the
// rows the plugin wrote for it. Reasons and refs are bound, not literal; the
// handler passes the top-up reasons (callers cannot use them) and both refs
// a top-up's rows have carried (the provider payment id on the grant, the
// local payment id on everything else). Gated prepaid.
message SumTopupCreditReq {
  option (w17.contrib.plugin_feature) = "prepaid";
  string user_id             = 1 [(w17.field) = { type: UUID }];
  string payment_id          = 2 [(w17.field) = { type: CHAR, max_len: 255 }];
  string provider_payment_id = 3 [(w17.field) = { type: CHAR, max_len: 255 }];
  string reason_grant        = 4 [(w17.field) = { type: SLUG, max_len: 64 }];
  string reason_refund       = 5 [(w17.field) = { type: SLUG, max_len: 64 }];
  string reason_refused      = 6 [(w17.field) = { type: SLUG, max_len: 64 }];
  string reason_reconcile    = 7 [(w17.field) = { type: SLUG, max_len: 64 }];
}
message SumTopupCreditResp {
  option (w17.contrib.plugin_feature) = "prepaid";
  string total = 1 [(w17.field) = { type: DECIMAL, precision: 20, scale: 4 }];
}

message GetCreditBalanceReq {
  option (w17.contrib.plugin_feature) = "prepaid";
  string user_id = 1 [(w17.field) = { type: UUID }];
}
message GetCreditBalanceResp {
  option (w17.contrib.plugin_feature) = "prepaid";
  CreditBalance balance = 1;
}

message GetCreditLedgerByKeyReq {
  option (w17.contrib.plugin_feature) = "prepaid";
  string idempotency_key = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetCreditLedgerByKeyResp {
  option (w17.contrib.plugin_feature) = "prepaid";
  CreditLedger entry = 1;
}

message GetCreditTopupByProviderIdReq {
  option (w17.contrib.plugin_feature) = "prepaid";
  string provider_payment_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetCreditTopupByProviderIdResp {
  option (w17.contrib.plugin_feature) = "prepaid";
  CreditTopup topup = 1;
}

message GetUsageMeterReq {
  option (w17.contrib.plugin_feature) = "usage";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string meter   = 2 [(w17.field) = { type: SLUG, max_len: 64 }];
  string period  = 3 [(w17.field) = { type: CHAR, max_len: 32 }];
}
message GetUsageMeterResp {
  option (w17.contrib.plugin_feature) = "usage";
  UsageMeter meter = 1;
}

message GetUsageRecordByKeyReq {
  option (w17.contrib.plugin_feature) = "usage";
  string idempotency_key = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetUsageRecordByKeyResp {
  option (w17.contrib.plugin_feature) = "usage";
  UsageRecord record = 1;
}

message GetPlanBySlugReq {
  option (w17.contrib.plugin_feature) = "subscriptions";
  string slug = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
}
message GetPlanBySlugResp {
  option (w17.contrib.plugin_feature) = "subscriptions";
  Plan plan = 1;
}

// GetPlanByProviderPriceId — the plan a provider price belongs to. Gated
// subscriptions.
message GetPlanByProviderPriceIdReq {
  option (w17.contrib.plugin_feature) = "subscriptions";
  string provider_price_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetPlanByProviderPriceIdResp {
  option (w17.contrib.plugin_feature) = "subscriptions";
  Plan plan = 1;
}

message GetSubscriptionReq {
  option (w17.contrib.plugin_feature) = "subscriptions";
  string id = 1 [(w17.field) = { type: UUID }];
}
message GetSubscriptionResp {
  option (w17.contrib.plugin_feature) = "subscriptions";
  Subscription subscription = 1;
}

// GetSubscriptionByProviderId — provider_subscription_id is UNIQUE.
message GetSubscriptionByProviderIdReq {
  option (w17.contrib.plugin_feature) = "subscriptions";
  string provider_subscription_id = 1 [(w17.field) = { type: CHAR, max_len: 255 }];
}
message GetSubscriptionByProviderIdResp {
  option (w17.contrib.plugin_feature) = "subscriptions";
  Subscription subscription = 1;
}

service PaymentQuery {
  // GetCustomerByUserId — resolve the provider-customer link for a
  // principal (empty result = not yet a customer; the handler creates
  // one on first charge).
  rpc GetCustomerByUserId(GetCustomerByUserIdReq) returns (GetCustomerByUserIdResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS customer.id, "
          "       c.user_id AS customer.user_id, "
          "       c.provider_customer_id AS customer.provider_customer_id, "
          "       c.email AS customer.email, "
          "       c.created_at AS customer.created_at "
          "FROM @module.Customer c WHERE c.user_id = :user_id"
      }
    };
  }

  // GetCustomerByProviderId — the local link of a provider customer. Read by
  // the provider reconciliation (ReconcileProvider), which holds only the
  // provider's ids.
  rpc GetCustomerByProviderId(GetCustomerByProviderIdReq) returns (GetCustomerByProviderIdResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT c.id AS customer.id, "
          "       c.user_id AS customer.user_id, "
          "       c.provider_customer_id AS customer.provider_customer_id, "
          "       c.email AS customer.email, "
          "       c.created_at AS customer.created_at "
          "FROM @module.Customer c WHERE c.provider_customer_id = :provider_customer_id"
      }
    };
  }

  // GetPayment — fetch one Payment by primary key (the REST GET
  // /payments/{id} surface).
  rpc GetPayment(GetPaymentReq) returns (GetPaymentResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS payment.id, "
          "       p.customer_id AS payment.customer_id, "
          "       p.provider_payment_id AS payment.provider_payment_id, "
          "       p.amount AS payment.amount, "
          "       p.currency AS payment.currency, "
          "       p.status AS payment.status, "
          "       p.idempotency_key AS payment.idempotency_key, "
          "       p.description AS payment.description, "
          "       p.created_at AS payment.created_at, "
          "       p.updated_at AS payment.updated_at, "
          "       p.received_amount AS payment.received_amount, "
          "       p.received_currency AS payment.received_currency "
          "FROM @module.Payment p WHERE p.id = :id"
      }
    };
  }

  // GetPaymentByProviderId — fetch one Payment by the provider's object id.
  // Two readers, both holding a provider id and no local id:
  //
  //   - the create paths (CreatePayment / TopUpCredit): a retry with the
  //     same idempotency key gets the SAME provider object replayed, and
  //     the local INSERT hits the unique key — the existing row is the
  //     answer, not an error;
  //   - webhook reconciliation, when a transition-guarded UPDATE matched no
  //     row: a row that exists was already in the target state (redelivery
  //     or out-of-order event — acknowledge), a row that does not exist is
  //     not here yet (fail, so the provider redelivers).
  rpc GetPaymentByProviderId(GetPaymentByProviderIdReq) returns (GetPaymentByProviderIdResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS payment.id, "
          "       p.customer_id AS payment.customer_id, "
          "       p.provider_payment_id AS payment.provider_payment_id, "
          "       p.amount AS payment.amount, "
          "       p.currency AS payment.currency, "
          "       p.status AS payment.status, "
          "       p.idempotency_key AS payment.idempotency_key, "
          "       p.description AS payment.description, "
          "       p.created_at AS payment.created_at, "
          "       p.updated_at AS payment.updated_at, "
          "       p.received_amount AS payment.received_amount, "
          "       p.received_currency AS payment.received_currency "
          "FROM @module.Payment p WHERE p.provider_payment_id = :provider_payment_id"
      }
    };
  }

  // GetPaymentByIdempotencyKey — the payment stored under a key. The create
  // paths read it for a key an earlier version stored as the caller sent it,
  // before keys were scoped by principal, so a retry of such a payment is
  // still answered with it.
  rpc GetPaymentByIdempotencyKey(GetPaymentByIdempotencyKeyReq) returns (GetPaymentByIdempotencyKeyResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS payment.id, "
          "       p.customer_id AS payment.customer_id, "
          "       p.provider_payment_id AS payment.provider_payment_id, "
          "       p.amount AS payment.amount, "
          "       p.currency AS payment.currency, "
          "       p.status AS payment.status, "
          "       p.idempotency_key AS payment.idempotency_key, "
          "       p.description AS payment.description, "
          "       p.created_at AS payment.created_at, "
          "       p.updated_at AS payment.updated_at, "
          "       p.received_amount AS payment.received_amount, "
          "       p.received_currency AS payment.received_currency "
          "FROM @module.Payment p WHERE p.idempotency_key = :idempotency_key"
      }
    };
  }

  // GetRefundByProviderId — fetch one Refund by the provider's refund id.
  // RefundPayment reads it when a retried refund (same idempotency key, so
  // the provider replays the same refund object) hits the unique key on
  // its local INSERT; the refund webhooks read it for every refund the
  // provider lists, to tell a known refund from one made at the provider.
  rpc GetRefundByProviderId(GetRefundByProviderIdReq) returns (GetRefundByProviderIdResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS refund.id, "
          "       r.payment_id AS refund.payment_id, "
          "       r.provider_refund_id AS refund.provider_refund_id, "
          "       r.amount AS refund.amount, "
          "       r.currency AS refund.currency, "
          "       r.created_at AS refund.created_at, "
          "       r.idempotency_key AS refund.idempotency_key, "
          "       r.status AS refund.status "
          "FROM @module.Refund r WHERE r.provider_refund_id = :provider_refund_id"
      }
    };
  }
  // LockPaymentForRefund — SELECT … FOR UPDATE on one Payment row, inside
  // RefundPayment's transaction. Refunds of one payment run one after the
  // other from here until the refund is recorded, so two refunds under
  // different keys cannot both pass the remaining-amount check and together
  // refund more than was paid. Outside a transaction it is a plain read.
  rpc LockPaymentForRefund(LockPaymentForRefundReq) returns (LockPaymentForRefundResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT p.id AS id, p.amount AS amount, p.status AS status, p.received_amount AS received_amount, p.received_currency AS received_currency FROM @module.Payment p WHERE p.id = :id"
      }
    };
    option (w17.db.lock) = {
      locks: [
        { resource: "Payment", kind: SELECT_FOR_UPDATE }
      ]
    };
  }

  // SumRefundsForPayment — what has been refunded of a payment so far: its
  // PENDING and SUCCEEDED refunds. A FAILED or CANCELED refund returned
  // nothing and does not count; a PENDING one does, because the provider
  // already counts it against the refundable amount (and reports the charge
  // fully refunded on it).
  rpc SumRefundsForPayment(SumRefundsForPaymentReq) returns (SumRefundsForPaymentResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT COALESCE(SUM(r.amount), 0) AS total FROM @module.Refund r WHERE r.payment_id = :payment_id AND r.status <> 3 AND r.status <> 4"
      }
    };
  }

  // GetRefundByIdempotencyKey — the refund a caller's key (stored hashed)
  // already produced, looked up before the provider is asked again.
  rpc GetRefundByIdempotencyKey(GetRefundByIdempotencyKeyReq) returns (GetRefundByIdempotencyKeyResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS refund.id, "
          "       r.payment_id AS refund.payment_id, "
          "       r.provider_refund_id AS refund.provider_refund_id, "
          "       r.amount AS refund.amount, "
          "       r.currency AS refund.currency, "
          "       r.created_at AS refund.created_at, "
          "       r.idempotency_key AS refund.idempotency_key, "
          "       r.status AS refund.status "
          "FROM @module.Refund r WHERE r.idempotency_key = :idempotency_key"
      }
    };
  }

  // GetDisputeByProviderId — one Dispute by the provider's dispute id. The
  // webhook reads it when MarkDisputeStatus matched no row: a row that exists
  // is already closed or newer (acknowledge), a missing one is created.
  rpc GetDisputeByProviderId(GetDisputeByProviderIdReq) returns (GetDisputeByProviderIdResp) {
    option (w17.contrib.plugin_feature_rpc) = "stripe_webhooks";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT d.id AS dispute.id, "
          "       d.payment_id AS dispute.payment_id, "
          "       d.provider_dispute_id AS dispute.provider_dispute_id, "
          "       d.amount AS dispute.amount, "
          "       d.currency AS dispute.currency, "
          "       d.status AS dispute.status, "
          "       d.provider_event_at AS dispute.provider_event_at, "
          "       d.created_at AS dispute.created_at, "
          "       d.updated_at AS dispute.updated_at "
          "FROM @module.Dispute d WHERE d.provider_dispute_id = :provider_dispute_id"
      }
    };
  }

  // SumLostDisputesForPayment — what a payment lost to disputes; part of a
  // top-up's reconciliation target. Gated stripe_webhooks.
  rpc SumLostDisputesForPayment(SumLostDisputesForPaymentReq) returns (SumLostDisputesForPaymentResp) {
    option (w17.contrib.plugin_feature_rpc) = "stripe_webhooks";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT COALESCE(SUM(d.amount), 0) AS total FROM @module.Dispute d WHERE d.payment_id = :payment_id AND d.status = 6"
      }
    };
  }

  // SumTopupCredit — the credit a top-up holds in the ledger (see the
  // message). Served by the user_id index. Gated prepaid.
  rpc SumTopupCredit(SumTopupCreditReq) returns (SumTopupCreditResp) {
    option (w17.contrib.plugin_feature_rpc) = "prepaid";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT COALESCE(SUM(l.delta), 0) AS total FROM @module.CreditLedger l "
          "WHERE l.user_id = :user_id "
          "AND (l.ref = :payment_id OR l.ref = :provider_payment_id) "
          "AND (l.reason = :reason_grant OR l.reason = :reason_refund OR l.reason = :reason_refused OR l.reason = :reason_reconcile)"
      }
    };
  }

  // GetCreditBalance — read the materialized prepaid balance for a
  // principal (empty result = no credits ever applied → treat as zero).
  // Gated prepaid.
  rpc GetCreditBalance(GetCreditBalanceReq) returns (GetCreditBalanceResp) {
    option (w17.contrib.plugin_feature_rpc) = "prepaid";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT b.user_id AS balance.user_id, "
          "       b.balance AS balance.balance, "
          "       b.updated_at AS balance.updated_at "
          "FROM @module.CreditBalance b WHERE b.user_id = :user_id"
      }
    };
  }

  // GetCreditLedgerByKey — one ledger entry by its stored idempotency key
  // (UNIQUE). GrantCredit / SpendCredit read it before applying under the
  // scoped key: rc.2 and earlier stored the caller's RAW key, so an apply
  // made by one of them and retried after the upgrade is found only under
  // that raw key. Gated prepaid.
  rpc GetCreditLedgerByKey(GetCreditLedgerByKeyReq) returns (GetCreditLedgerByKeyResp) {
    option (w17.contrib.plugin_feature_rpc) = "prepaid";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT l.id AS entry.id, "
          "       l.user_id AS entry.user_id, "
          "       l.delta AS entry.delta, "
          "       l.reason AS entry.reason, "
          "       l.ref AS entry.ref, "
          "       l.idempotency_key AS entry.idempotency_key, "
          "       l.created_at AS entry.created_at "
          "FROM @module.CreditLedger l WHERE l.idempotency_key = :idempotency_key"
      }
    };
  }

  // GetCreditTopupByProviderId — resolve a pending top-up from a
  // payment-succeeded webhook (maps the charge back to the credit grant).
  // Gated prepaid.
  rpc GetCreditTopupByProviderId(GetCreditTopupByProviderIdReq) returns (GetCreditTopupByProviderIdResp) {
    option (w17.contrib.plugin_feature_rpc) = "prepaid";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.id AS topup.id, "
          "       t.provider_payment_id AS topup.provider_payment_id, "
          "       t.user_id AS topup.user_id, "
          "       t.amount AS topup.amount, "
          "       t.granted_at AS topup.granted_at, "
          "       t.created_at AS topup.created_at, "
          "       t.credit_owed AS topup.credit_owed, "
          "       t.reconciled_step AS topup.reconciled_step "
          "FROM @module.CreditTopup t WHERE t.provider_payment_id = :provider_payment_id"
      }
    };
  }

  // GetUsageMeter — read the materialized usage total for a
  // (principal, meter, period). Empty result = no usage recorded yet.
  // Gated usage.
  rpc GetUsageMeter(GetUsageMeterReq) returns (GetUsageMeterResp) {
    option (w17.contrib.plugin_feature_rpc) = "usage";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT m.user_id AS meter.user_id, "
          "       m.meter AS meter.meter, "
          "       m.period AS meter.period, "
          "       m.total AS meter.total, "
          "       m.reported_total AS meter.reported_total, "
          "       m.updated_at AS meter.updated_at "
          "FROM @module.UsageMeter m "
          "WHERE m.user_id = :user_id AND m.meter = :meter AND m.period = :period"
      }
    };
  }

  // GetUsageRecordByKey — one usage record by its stored idempotency key
  // (UNIQUE). ReportUsage reads it before recording under the scoped key:
  // rc.2 and earlier stored the caller's RAW key, so a report made by one of
  // them and retried after the upgrade is found only under that raw key.
  // Gated usage.
  rpc GetUsageRecordByKey(GetUsageRecordByKeyReq) returns (GetUsageRecordByKeyResp) {
    option (w17.contrib.plugin_feature_rpc) = "usage";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT r.id AS record.id, "
          "       r.user_id AS record.user_id, "
          "       r.meter AS record.meter, "
          "       r.period AS record.period, "
          "       r.quantity AS record.quantity, "
          "       r.item_ref AS record.item_ref, "
          "       r.idempotency_key AS record.idempotency_key, "
          "       r.created_at AS record.created_at "
          "FROM @module.UsageRecord r WHERE r.idempotency_key = :idempotency_key"
      }
    };
  }

  // GetPlanBySlug — resolve a plan by its stable local slug (the
  // Subscribe handler reads plan_id + provider_price_id from it).
  // Gated subscriptions.
  rpc GetPlanBySlug(GetPlanBySlugReq) returns (GetPlanBySlugResp) {
    option (w17.contrib.plugin_feature_rpc) = "subscriptions";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS plan.id, "
          "       p.slug AS plan.slug, "
          "       p.name AS plan.name, "
          "       p.amount AS plan.amount, "
          "       p.currency AS plan.currency, "
          "       p.interval AS plan.interval, "
          "       p.provider_price_id AS plan.provider_price_id, "
          "       p.enabled AS plan.enabled, "
          "       p.created_at AS plan.created_at "
          "FROM @module.Plan p WHERE p.slug = :slug"
      }
    };
  }

  // GetPlanByProviderPriceId — the plan whose provider price a subscription
  // is on. Read by the provider reconciliation for a subscription whose local
  // row never landed. Not indexed: the plan catalogue is small, and the
  // reconciliation is no request path. Gated subscriptions.
  rpc GetPlanByProviderPriceId(GetPlanByProviderPriceIdReq) returns (GetPlanByProviderPriceIdResp) {
    option (w17.contrib.plugin_feature_rpc) = "subscriptions";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT p.id AS plan.id, "
          "       p.slug AS plan.slug, "
          "       p.name AS plan.name, "
          "       p.amount AS plan.amount, "
          "       p.currency AS plan.currency, "
          "       p.interval AS plan.interval, "
          "       p.provider_price_id AS plan.provider_price_id, "
          "       p.enabled AS plan.enabled, "
          "       p.created_at AS plan.created_at "
          "FROM @module.Plan p WHERE p.provider_price_id = :provider_price_id"
      }
    };
  }

  // GetSubscription — fetch one subscription by id. Gated subscriptions.
  rpc GetSubscription(GetSubscriptionReq) returns (GetSubscriptionResp) {
    option (w17.contrib.plugin_feature_rpc) = "subscriptions";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT s.id AS subscription.id, "
          "       s.customer_id AS subscription.customer_id, "
          "       s.plan_id AS subscription.plan_id, "
          "       s.provider_subscription_id AS subscription.provider_subscription_id, "
          "       s.status AS subscription.status, "
          "       s.current_period_end AS subscription.current_period_end, "
          "       s.created_at AS subscription.created_at, "
          "       s.updated_at AS subscription.updated_at "
          "FROM @module.Subscription s WHERE s.id = :id"
      }
    };
  }

  // GetSubscriptionByProviderId — fetch one subscription by the provider's
  // subscription id. Read by Subscribe when a retried subscribe (same
  // idempotency key, so the provider replays the same subscription) hits
  // the unique key, and by the subscription webhook when its guarded
  // UPDATE matched no row (exists → already CANCELED, acknowledge; absent
  // → not here yet, fail so the provider redelivers). Gated subscriptions.
  rpc GetSubscriptionByProviderId(GetSubscriptionByProviderIdReq) returns (GetSubscriptionByProviderIdResp) {
    option (w17.contrib.plugin_feature_rpc) = "subscriptions";
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT s.id AS subscription.id, "
          "       s.customer_id AS subscription.customer_id, "
          "       s.plan_id AS subscription.plan_id, "
          "       s.provider_subscription_id AS subscription.provider_subscription_id, "
          "       s.status AS subscription.status, "
          "       s.current_period_end AS subscription.current_period_end, "
          "       s.created_at AS subscription.created_at, "
          "       s.updated_at AS subscription.updated_at "
          "FROM @module.Subscription s WHERE s.provider_subscription_id = :provider_subscription_id"
      }
    };
  }
}
